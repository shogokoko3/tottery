  border-radius: 8px;
  background: rgba(8, 10, 22, 0.86);
  white-space: normal;
  pointer-events: none;
}

/* \u30DB\u30FC\u30E0\u306E\u300C\u304A\u77E5\u3089\u305B\u30FB\u30D5\u30EC\u30F3\u30C9\u300D(2026-09-24 \u672C\u4EBA\u306E\u6307\u793A\u3067\u6587\u8A00\u3092\u5909\u3048\u305F)\u30022\u884C\u3067\u91E6\u306B\u53CE\u3081\u308B */
.home-wrap .home-news > span {
  text-align: center;
  line-height: 1.25;
  letter-spacing: 0;
}
/* \u30D5\u30EC\u30F3\u30C9\u306E\u8AAC\u660E\u306F\u6587\u3054\u3068\u306B\u884C\u3092\u5206\u3051\u3001\u6570\u5B57\u306F\u9014\u4E2D\u3067\u5207\u3089\u306A\u3044(2026-09-24 \u672C\u4EBA\u306E\u6307\u6458) */
.friends-lead {
  display: flex;
  flex-direction: column;
  gap: 2px;
  text-wrap: pretty;
}
.friends-lead .nowrap {
  white-space: nowrap;
}
/* \u719F\u7DF4\u5EA6\u306E\u70B9\u306E\u5185\u8A33(\u7D42\u5C40\u306E\u30E1\u30FC\u30BF\u30FC\u30022026-09-24) */
.mastery-breakdown {
  grid-column: 1 / -1;
  font-size: 10px;
  color: var(--text-dim);
  line-height: 1.4;
}
/* \u30D5\u30EC\u30F3\u30C9\u7533\u8ACB\u306E\u53D7\u4ED8(\u5165\u53E3\u3054\u3068\u306E\u5207\u308A\u66FF\u3048\u30022026-09-24) */
.friends-accept-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: rgba(9, 20, 38, 0.6);
  cursor: pointer;
}
.friends-accept-row + .friends-accept-row {
  margin-top: 6px;
}
.friends-accept-row > span {
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.friends-accept-row b {
  font-size: 13px;
}
.friends-accept-row small {
  font-size: 11px;
  color: var(--text-dim);
}
.friends-accept-row input {
  width: 22px;
  height: 22px;
  flex: none;
  accent-color: var(--gold);
}
/* \u30E9\u30F3\u30AD\u30F3\u30B0\u306E\u540D\u524D\u306F\u62BC\u305B\u308B(\u540C\u3058\u5E55\u304C\u958B\u304F) */
.rank-name-btn {
  border: 0;
  background: none;
  color: inherit;
  font: inherit;
  text-align: left;
  padding: 0 0 0 4px;
  cursor: pointer;
  text-decoration: underline dotted rgba(240, 217, 165, 0.5);
  text-underline-offset: 3px;
}
/* \u7D42\u5C40\u306E\u300C\u76F8\u624B\u306B\u30D5\u30EC\u30F3\u30C9\u7533\u8ACB\u300D */
.foe-friend {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  margin: 8px 0 2px;
}
.foe-friend-msg {
  font-size: 11px;
  color: var(--gold-soft);
}
/* \u30DB\u30FC\u30E0\u306E\u5C4A\u304D\u7269\u306E\u77E5\u3089\u305B(\u904B\u55B6\u306E\u304A\u77E5\u3089\u305B\u3068\u30D5\u30EC\u30F3\u30C9\u306F\u5225\u306E\u884C\u30022026-09-24) */
.home-alerts {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin: 8px 0 0;
}
.home-alert {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  min-height: 38px;
  padding: 7px 12px;
  border-radius: 10px;
  border: 1px solid rgba(240, 217, 165, 0.5);
  background: linear-gradient(180deg, rgba(212, 175, 55, 0.18), rgba(212, 175, 55, 0.06));
  color: var(--gold-soft);
  font-family: inherit;
  font-size: 12.5px;
  text-align: left;
  cursor: pointer;
}
.home-alert > span {
  flex: 1;
  min-width: 0;
}
.home-alert > svg:last-child {
  opacity: 0.6;
}
.home-alert-news {
  border-color: rgba(143, 188, 232, 0.55);
  background: linear-gradient(180deg, rgba(143, 188, 232, 0.16), rgba(143, 188, 232, 0.05));
  color: #cfe3f7;
}
.home-alert-news > svg:first-child {
  color: #8fbce8;
}
.home-alert-friend > svg:first-child {
  color: var(--gold);
}
/* \u7D42\u5C40\u30E1\u30FC\u30BF\u30FC\u306E\u30B9\u30AD\u30F3\u540D(2026-09-24 \u30B9\u30AD\u30F3\u5236) */
.mastery-skin-name {
  grid-column: 1 / -1;
  font-size: 10px;
  color: var(--gold-soft);
}
/* \u30AB\u30FC\u30C9\u719F\u7DF4\u5EA6: \u30ED\u30C3\u30AF(\u672A\u6240\u6301\u30B9\u30AD\u30F3)\u30022026-09-24 \u30B9\u30AD\u30F3\u5236 */
.card-mastery-locked-all {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 10px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: rgba(9, 20, 38, 0.6);
  color: var(--text-dim);
  font-size: 12px;
}
.card-mastery-row.is-locked {
  opacity: 0.72;
}
.card-mastery-locked {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 10px 12px;
  text-align: left;
}
.card-mastery-lockart {
  position: relative;
  flex: none;
  filter: grayscale(0.85) brightness(0.7);
}
.card-mastery-chain {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--gold-soft);
  background: rgba(8, 10, 22, 0.5);
  border-radius: 6px;
}
.card-mastery-lockname {
  font-size: 12px;
  color: var(--text-dim);
}
/* \u30DB\u30FC\u30E0\u306E\u300C\u30AB\u30FC\u30C9\u300D\u30BF\u30A4\u30EB\u306E\u30ED\u30C3\u30AF(\u30B9\u30AD\u30F3\u672A\u6240\u6301\u30022026-09-24) */
.home-tile.is-locked {
  opacity: 0.82;
}
.home-tile-lock {
  position: absolute;
  top: 8px;
  right: 8px;
  color: var(--gold-soft);
  opacity: 0.8;
}

/* \u89B3\u6226(2026-09-24 \u672C\u4EBA\u306E\u6307\u793A)\u3002\u5BFE\u5C40\u3092\u8AAD\u3080\u3060\u3051\u306E\u753B\u9762 */
.spectate-screen {
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: center;
  width: 100%;
}
.spectate-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 4px 2px;
}
.spectate-title {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-weight: 700;
  color: var(--gold-soft);
}
.spectate-turn {
  margin-left: auto;
  font-size: 13px;
  color: var(--ink-soft, #cfd6e6);
}
.spectate-note {
  text-align: center;
  margin: 2px 0;
}
.spectate-seats {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  width: 100%;
}
.spectate-vs {
  font-weight: 700;
  color: var(--gold-soft);
  opacity: 0.8;
}
.spectate-seat {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid transparent;
  min-width: 0;
}
.spectate-seat-active {
  border-color: var(--gold-soft);
  background: rgba(212, 175, 90, 0.12);
}
.spectate-seat-body {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}
.spectate-seat-body b {
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.friend-spectate {
  white-space: nowrap;
}

/* \u90E8\u5C4B\u306E\u4E2D\u304B\u3089\u30D5\u30EC\u30F3\u30C9\u3092\u62DB\u304F\u5E55(2026-09-25 \u672C\u4EBA\u306E\u6307\u793A) */
.room-invite-panel {
  max-width: 340px;
  text-align: center;
}
.room-invite-panel h3 {
  margin: 0 0 6px;
}
.room-invite-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: min(46vh, 340px);
  overflow-y: auto;
  margin: 10px 0;
}
.room-invite-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 8px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.04);
}
.room-invite-name {
  flex: 1 1 auto;
  min-width: 0;
  text-align: left;
  font-size: 14px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.room-invite-row .btn {
  flex: none;
}

/* \u30D5\u30EC\u30F3\u30C9\u4E00\u89A7\u306E\u30AA\u30F3\u30E9\u30A4\u30F3/\u30AA\u30D5\u30E9\u30A4\u30F3\u8868\u793A(2026-09-25 \u672C\u4EBA\u306E\u6307\u793A\u3002\u524D\u306F\u300C\u25EF\u6642\u9593\u524D\u300D) */
.friend-tag-meta {
  display: inline-flex;
  align-items: center;
  flex-wrap: wrap;
}
.friend-status {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.friend-status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
}
.friend-status.is-online {
  color: #5cc98a;
}
.friend-status.is-offline {
  color: var(--text-dim);
}

/* \u30D5\u30EC\u30F3\u30C9\u4E00\u89A7\u306E\u898B\u51FA\u3057\u306B\u300C\u5168\u54E1\u306B\u8D08\u308B\u300D\u3092\u4E26\u3079\u308B(2026-09-25 \u672C\u4EBA\u306E\u6307\u793A) */
.friends-list-head-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.friends-gift-all {
  flex: none;
  white-space: nowrap;
}

/* \u30AA\u30F3\u30E9\u30A4\u30F3\u5BFE\u6226\u306E\u9023\u52DD\u8868\u793A(\u30DE\u30C3\u30C1\u30F3\u30B0\u753B\u9762\u30022026-09-25 \u672C\u4EBA\u306E\u6307\u793A) */
.match-streak {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  margin-bottom: 14px;
  padding: 8px 16px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.04);
}
.match-streak.is-hot {
  border-color: rgba(226, 137, 111, 0.7);
  background: linear-gradient(180deg, rgba(226, 137, 111, 0.18), rgba(226, 137, 111, 0.05));
}
.match-streak-count {
  font-size: 17px;
  color: var(--text);
}
.match-streak.is-hot .match-streak-count {
  color: #f0a98f;
}
.match-streak small {
  font-size: 11.5px;
  color: var(--text-dim);
}

/* \u8FD1\u304F\u306E\u7AEF\u672B\u3068\u5BFE\u6226\u3002\u898B\u3064\u304B\u3089\u306A\u3044\u3068\u304D\u306B\u3001\u78BA\u304B\u3081\u308B\u9806\u3092\u4E26\u3079\u308B(2026-09-28 \u672C\u4EBA\u306E\u5831\u544A) */
.nearby-empty {
  text-align: left;
  max-width: 420px;
  margin: 0 auto;
}
.nearby-steps {
  margin: 0;
  padding-left: 1.2em;
  line-height: 1.8;
}
.nearby-steps li {
  margin-bottom: 6px;
}
.nearby-steps b {
  color: var(--gold-soft);
}

/* \u79FB\u52D5\u306E\u78BA\u8A8D\u3002\u91E6\u306E\u5B57\u304C2\u884C\u306B\u6298\u308C\u306A\u3044\u3088\u3046\u306B(2026-09-28) */
.move-confirm .setup-actions .btn {
  white-space: nowrap;
}

/* \u307E\u3068\u3081\u53D6\u308A\u306E\u898B\u305B\u65B9(2026-09-28 \u672C\u4EBA\u306E\u6307\u793A\u300C\u8907\u6570\u679A\u53D6\u3063\u305F\u6F14\u51FA\u3092\u3064\u3051\u308B\u300D)\u3002
   \u679A\u6570\u304C\u5897\u3048\u308B\u307B\u3069\u5F37\u304F\u3059\u308B\u3002single=\u3044\u3064\u3082\u901A\u308A / multi=2\u301C3\u679A / grand=4\u679A\u4EE5\u4E0A */
.capture-count {
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 6px;
  margin: -4px 0 10px;
  color: var(--gold-soft);
  font-family: "Shippori Mincho", serif;
  letter-spacing: 0.04em;
}
.capture-count b {
  font-size: 30px;
  color: var(--gold);
  font-variant-numeric: tabular-nums;
  /* \u6570\u304C\u5897\u3048\u308B\u305F\u3073\u306B\u3001\u8EFD\u304F\u5F3E\u307E\u305B\u308B */
  animation: capture-count-pop 260ms ease-out;
}
.capture-count span {
  font-size: 13px;
  color: #9aa7b4;
}
@keyframes capture-count-pop {
  0% {
    transform: scale(0.7);
    opacity: 0.4;
  }
  60% {
    transform: scale(1.15);
    opacity: 1;
  }
  100% {
    transform: scale(1);
  }
}
/* 4\u679A\u4EE5\u4E0A\u306F\u672D\u306E\u67A0\u3082\u91D1\u306B\u706F\u3059 */
.capture-grand .capture-count b {
  text-shadow: 0 0 14px rgba(212, 175, 55, 0.75);
}
.capture-panel.capture-grand {
  box-shadow:
    0 0 0 1px rgba(212, 175, 55, 0.5),
    0 0 40px rgba(212, 175, 55, 0.28);
}
/* \u679A\u6570\u304C\u591A\u3044\u3068\u672D\u304C\u6A2A\u306B\u6EA2\u308C\u308B\u306E\u3067\u3001\u6298\u308A\u8FD4\u3057\u3066\u8A70\u3081\u308B */
.capture-cards-grand {
  flex-wrap: wrap;
  gap: 6px;
}
@media (prefers-reduced-motion: reduce) {
  .capture-count b {
    animation: none;
  }
}

/* \u52D5\u304D\u304B\u3089\u7D5E\u3063\u305F\u5019\u88DC(2026-09-28 \u672C\u4EBA\u306E\u6307\u793A)\u3002
   \u91D1\u306E\u6570\u5B57\u306F\u300C\u738B\u3067\u306A\u3044\u3068\u3067\u304D\u306A\u3044\u52D5\u304D\u300D\u3002\u76F8\u624B\u306E\u738B\u3092\u8AAD\u3080\u624B\u304C\u304B\u308A\u306B\u306A\u308B */
.private-notes-deduced {
  border: 1px solid rgba(212, 175, 55, 0.35);
  border-radius: 8px;
  padding: 8px 12px 12px;
  margin-bottom: 12px;
}
.private-notes-deduced legend {
  padding: 0 6px;
  color: var(--gold-soft);
  font-size: 12px;
}
.private-notes-deduced-list {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 6px 0 8px;
}
.deduced-rank {
  min-width: 34px;
  padding: 4px 8px;
  border: 1px solid rgba(154, 167, 180, 0.5);
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.04);
  color: #dfe6ee;
  font-size: 14px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
/* \u305D\u306E\u6570\u5B57\u306A\u3089\u738B\u3067\u78BA\u5B9A\u3001\u3068\u3044\u3046\u52D5\u304D */
.deduced-rank-king {
  border-color: var(--gold);
  background: rgba(212, 175, 55, 0.16);
  color: var(--gold);
  font-weight: 700;
}

/* \u8A18\u9332\u3092\u6D88\u3059\u3068\u304D\u306E\u3001\u6D88\u3048\u308B\u3082\u306E\u306E\u4E00\u89A7(2026-09-28 \u672C\u4EBA\u306E\u5831\u544A\u3067\u8DB3\u308A\u306A\u3044\u9805\u76EE\u304C\u5206\u304B\u3063\u305F) */
.delete-me-list {
  margin: 6px 0 10px;
  padding-left: 1.3em;
  color: #c8d2dd;
  font-size: 13px;
  line-height: 1.9;
  text-align: left;
}
.delete-me-list b {
  color: var(--gold-soft);
}

/* \u753B\u9762\u5358\u4F53\u306E\u30D7\u30EC\u30D3\u30E5\u30FC\u3067\u3082\u7D75\u306E\u4FDD\u5B58\u30E1\u30CB\u30E5\u30FC\u3092\u51FA\u3055\u306A\u3044\u3002
   \u30B2\u30FC\u30E0\u5168\u4F53\u306E\u6587\u5B57\u9078\u629E\u3068\u30E1\u30CB\u30E5\u30FC\u306E\u6291\u5236\u306F index.template.html \u3068
   src/ui/native-interactions.js\u3002\u5165\u529B\u6B04\u306F\u7DE8\u96C6\u30FB\u8CBC\u308A\u4ED8\u3051\u3092\u8A31\u53EF\u3059\u308B\u3002 */
.tottery-root {
  -webkit-touch-callout: none;
}
/* \u7D75\u306F\u3001\u6307\u3067\u3064\u307E\u3093\u3067\u6301\u3061\u4E0A\u3052\u308B(\u30C9\u30E9\u30C3\u30B0&\u30C9\u30ED\u30C3\u30D7)\u306E\u3082\u6B62\u3081\u308B\u3002
   \u76E4\u306E\u99D2\u306F\u81EA\u524D\u306E\u30C9\u30E9\u30C3\u30B0\u3067\u52D5\u304B\u3059\u306E\u3067\u3001\u30D6\u30E9\u30A6\u30B6\u5074\u306E\u6301\u3061\u4E0A\u3052\u3068\u4E8C\u91CD\u306B\u306A\u308B */
img,
video,
canvas,
svg {
  -webkit-user-drag: none;
  -webkit-user-select: none;
  user-select: none;
}

/* \u306F\u3058\u307E\u308A\u306E\u8A9E\u308A\u3068\u9580\u306E\u8A9E\u308A(2026-09-28 \u672C\u4EBA\u306E\u6307\u793A\u30022026-10-01 \u306B\u4F5C\u308A\u76F4\u3057)\u3002
   \u4E00\u8A00\u6E21\u3057\u3066\u5148\u3078\u9001\u308B\u4F5C\u308A\u3002\u80CC\u666F\u306B\u30BF\u30A4\u30C8\u30EB\u7D75\u306F\u6577\u304B\u306A\u3044(\u7D75\u306E\u300C\u76F8\u624B\u306E\u738B\u3092\u8A0E\u3066\u300D\u304C\u898B\u51FA\u3057\u3068\u4E26\u3093\u3067\u900F\u3051\u305F)\u3002
   \u6697\u3044\u5730\u306B\u3001\u898B\u51FA\u3057\u30FB\u7D75(\u5411\u304B\u3044\u5408\u3046\u4E8C\u5217/\u9580\u306E\u672D)\u30FB\u91E6\u3060\u3051 */
/* \u753B\u9762\u3044\u3063\u3071\u3044\u306B\u6577\u304F\u3002\u821E\u53F0\u306E\u4F59\u767D(20px)\u304C\u6B8B\u308B\u3068\u3001\u6697\u3044\u5730\u304C\u67A0\u306B\u898B\u3048\u3001\u4E0B\u3078 40px \u306F\u307F\u51FA\u3057\u3066\u3044\u305F\u3002
   \u821E\u53F0\u306E\u6700\u4F4E\u306E\u9AD8\u3055(520px)\u3082\u5916\u3059(\u80CC\u306E\u4F4E\u3044\u7AEF\u672B\u3067\u4E0B\u3078\u306F\u307F\u51FA\u3059) */
.stage:has(> .prologue) {
  min-height: 0;
  padding: 0;
}
.prologue {
  position: relative;
  width: 100%;
  min-height: calc(100dvh - var(--top-bar-h, 0px));
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
  padding: 72px 22px calc(28px + env(safe-area-inset-bottom));
  overflow: hidden;
  cursor: pointer;
  -webkit-user-select: none;
  user-select: none;
  background:
    radial-gradient(
      90% 46% at 50% 58%,
      rgba(52, 76, 116, 0.42) 0%,
      rgba(6, 12, 24, 0) 72%
    ),
    linear-gradient(180deg, #0b1628 0%, #060c18 100%);
}
/* \u4F0F\u305B\u672D\u3092\u53D6\u308B\u672D\u306F\u3001\u7D75\u306E\u5916\u3092\u62BC\u3057\u3066\u3082\u9032\u307E\u306A\u3044 */
.prologue.is-touch {
  cursor: default;
}
.prologue-skip {
  position: absolute;
  top: max(14px, env(safe-area-inset-top));
  right: 16px;
  z-index: 2;
  min-height: 40px;
  padding: 8px 14px;
  border: 1px solid rgba(201, 173, 118, 0.6);
  border-radius: 6px;
  background: rgba(7, 18, 29, 0.78);
  color: #e6dcc4;
  font: 600 12px/1.4 "Shippori Mincho", serif;
  letter-spacing: 0.06em;
  cursor: pointer;
}
/* \u898B\u51FA\u3057\u30FB\u7D75\u30FB\u4E00\u8A00\u306E\u7D44\u3092\u3001\u4E0A\u4E0B\u306E\u4F59\u767D\u3067\u771F\u3093\u4E2D\u5BC4\u308A\u306B\u7F6E\u304F(\u91E6\u306F\u4E0B\u7AEF) */
.prologue-text {
  position: relative;
  z-index: 1;
  margin-top: auto;
  text-align: center;
  max-width: 420px;
  animation: prologue-in 700ms ease-out both;
}
.prologue-title {
  margin: 0 0 10px;
  padding: 0;
  font-weight: 700;
  text-shadow: none;
}
/* \u898B\u51FA\u3057\u306F\u8AAD\u70B9\u3054\u3068\u306E\u884C\u3067\u6E21\u3059\u3002\u884C\u306E\u4E2D\u3067\u306F\u6298\u308A\u8FD4\u3055\u306A\u3044(\u300C\u738B\u304B/\u3082\u3057\u308C\u306A\u3044\u300D\u3068\u5272\u3089\u306A\u3044) */
.prologue-line {
  display: block;
  font-family: "Shippori Mincho", serif;
  font-size: clamp(24px, 7.4vw, 31px);
  line-height: 1.55;
  letter-spacing: 0.06em;
  color: #f7eace;
  text-shadow: 0 2px 18px rgba(0, 0, 0, 0.9);
  white-space: nowrap;
}
.prologue-note {
  margin: 0;
  font-family: "Shippori Mincho", serif;
  font-size: clamp(13px, 3.8vw, 15px);
  line-height: 1.9;
  letter-spacing: 0.04em;
  color: #c3b79f;
  text-shadow: 0 2px 14px rgba(0, 0, 0, 0.9);
  text-wrap: balance;
  animation: prologue-in 700ms 320ms ease-out both;
}
.prologue-foot {
  position: relative;
  z-index: 1;
  margin-top: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  width: 100%;
  max-width: 420px;
}
.prologue-dots {
  display: flex;
  gap: 7px;
}
.prologue-dots i {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: rgba(231, 218, 190, 0.28);
  transition: background 200ms ease;
}
.prologue-dots i.is-at {
  background: var(--gold);
  box-shadow: 0 0 8px rgba(212, 175, 55, 0.7);
}
.prologue-next {
  width: 100%;
}
/* \u7D75\u306E\u4E0B\u306E\u4E00\u8A00(\u300C1\u679A\u3001\u53D6\u3063\u3066\u307F\u3066\u3002\u300D\u2192\u300C\u5916\u308C\u3002\u738B\u306F\u3001\u6B8B\u308A\u306E4\u679A\u306E\u4E2D\u3002\u300D)\u3002
   \u53D6\u3063\u305F\u3042\u3068\u306E\u4E00\u8A00\u306F\u3001\u3081\u304F\u308C\u7D42\u308F\u308B\u3053\u308D\u306B\u51FA\u3059 */
.prologue-cue {
  position: relative;
  z-index: 1;
  margin: -6px 0 0;
  min-height: 1.8em;
  font-family: "Shippori Mincho", serif;
  font-size: clamp(13px, 3.8vw, 15px);
  font-weight: 600;
  line-height: 1.8;
  letter-spacing: 0.06em;
  color: var(--gold-soft);
  text-align: center;
  animation: prologue-in 500ms 900ms ease-out both;
}

/* \u5411\u304B\u3044\u5408\u3046\u4E8C\u5217\u3002\u5965\u306F\u76F8\u624B\u306E\u4F0F\u305B\u672D\u3001\u624B\u524D\u306F\u3042\u306A\u305F\u306E\u672D(\u76E4\u306E\u99D2\u3068\u540C\u3058 Piece)\u3002
   1\u5217\u306E\u4E0A\u306B\u3001\u53D6\u3063\u305F\u672D\u3092\u9000\u304B\u305B\u308B\u4F59\u767D(--lift)\u3092\u53D6\u308B */
.prologue-rows {
  --pc-w: 50px;
  --pc-h: 67px;
  --pc-gap: 10px;
  --lift: 58px;
  /* \u524D\u30781\u30DE\u30B9 = \u672D\u306E\u9AD8\u3055 + \u5217\u306E\u3042\u3044\u3060 */
  --step: calc(var(--pc-h) + var(--pc-gap));
  position: relative;
  z-index: 1;
  display: flex;
  justify-content: center;
  gap: 12px;
  perspective: 700px;
}
.prologue-col {
  position: relative;
  width: var(--pc-w);
  height: calc(var(--lift) + var(--step) + var(--pc-h));
}
.prologue-foe,
.prologue-mine,
.prologue-taken {
  position: absolute;
  left: 0;
}
.prologue-foe {
  top: var(--lift);
  padding: 0;
  border: 0;
  border-radius: 6px;
  background: none;
  color: inherit;
  font: inherit;
  cursor: default;
  -webkit-tap-highlight-color: transparent;
}
.prologue-foe:focus-visible {
  outline: 2px solid var(--gold-soft);
  outline-offset: 3px;
}
.prologue-mine {
  top: calc(var(--lift) + var(--step));
  z-index: 1;
}
/* \u4F0F\u305B\u672D\u306F\u6DE1\u304F\u8108\u6253\u3063\u3066\u300C\u62BC\u305B\u308B\u300D\u3092\u898B\u305B\u308B(1\u679A\u76EE\u3067\u3001\u307E\u3060\u53D6\u3063\u3066\u3044\u306A\u3044\u3042\u3044\u3060) */
.prologue-rows.is-inviting .prologue-foe {
  cursor: pointer;
  animation: prologue-beckon 2.4s ease-in-out infinite;
  animation-delay: calc(var(--i) * 160ms);
}
.prologue-rows.is-inviting .prologue-foe:active {
  transform: scale(0.95);
}
/* \u53D6\u308B: \u771F\u6B63\u9762\u306E\u99D2\u304C\u524D\u30781\u30DE\u30B9 \u2192 \u4F0F\u305B\u672D\u304C\u3081\u304F\u308C\u308B \u2192 \u53D6\u3063\u305F\u672D\u306F\u5217\u306E\u4E0A\u3078\u9000\u304F */
.prologue-col.is-struck .prologue-mine {
  transform: translateY(calc(-1 * var(--step)));
  animation: prologue-advance 380ms cubic-bezier(0.55, 0, 0.35, 1) both;
  animation-delay: var(--d, 0ms);
}
.prologue-col.is-struck .prologue-foe {
  opacity: 0;
  transform: rotateY(90deg);
  pointer-events: none;
  animation: prologue-flip-out 140ms ease-in both;
  animation-delay: calc(var(--d, 0ms) + 340ms);
}
.prologue-col.is-struck .prologue-taken {
  top: 0;
  z-index: 2;
  transform-origin: 50% 0;
  transform: scale(0.8);
  animation: prologue-taken 820ms ease-out both;
  animation-delay: calc(var(--d, 0ms) + 480ms);
}
/* \u738B\u3092\u53D6\u308B(2\u679A\u76EE)\u306F\u3001\u898B\u51FA\u3057\u304C\u5165\u3063\u3066\u304B\u3089\u52D5\u304F */
.prologue-col.is-king {
  --d: 700ms;
}
/* 2\u679A\u76EE\u306B\u5165\u3063\u305F\u3089\u30011\u679A\u76EE\u3067\u53D6\u3063\u305F\u5217\u306F\u52D5\u304B\u3055\u305A\u306B\u7F6E\u304F(\u3081\u304F\u308C\u305F 9\u2666 \u306F\u305D\u306E\u307E\u307E) */
.prologue-col.is-struck.is-settled .prologue-mine,
.prologue-col.is-struck.is-settled .prologue-foe,
.prologue-col.is-struck.is-settled .prologue-taken {
  animation: none;
}

/* \u9580\u306E\u8A9E\u308A\u306E\u7D75\u3002\u672D\u306E\u88CF\u304C\u4E00\u679A\u3001\u91D1\u306E\u5149\u306E\u4E2D\u306B\u6D6E\u304B\u3076 */
.prologue-gate-art {
  position: relative;
  z-index: 1;
  display: grid;
  place-items: center;
  width: 200px;
  height: 200px;
}
.prologue-gate-glow {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: radial-gradient(
    circle,
    rgba(240, 217, 138, 0.5) 0%,
    rgba(212, 175, 55, 0.18) 40%,
    rgba(212, 175, 55, 0) 70%
  );
  animation: prologue-glow 3.2s ease-in-out infinite;
}
.prologue-gate-card {
  position: relative;
  width: 96px;
  height: 128px;
  border-radius: 6px;
  box-shadow:
    0 0 0 1px rgba(240, 217, 138, 0.7),
    0 0 28px rgba(240, 217, 138, 0.5),
    0 14px 30px rgba(0, 0, 0, 0.6);
  animation: prologue-float 4s ease-in-out infinite;
}

@keyframes prologue-in {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes prologue-beckon {
  0%,
  100% {
    filter: none;
    transform: none;
  }
  50% {
    filter: brightness(1.15) drop-shadow(0 0 8px rgba(240, 217, 138, 0.55));
    transform: translateY(-2px);
  }
}
@keyframes prologue-advance {
  from {
    transform: none;
  }
}
@keyframes prologue-flip-out {
  from {
    opacity: 1;
    transform: none;
  }
  to {
    opacity: 1;
    transform: rotateY(90deg);
  }
}
@keyframes prologue-taken {
  0% {
    transform: translateY(var(--lift)) rotateY(-90deg);
  }
  30% {
    transform: translateY(var(--lift)) rotateY(0) scale(1.06);
    filter: brightness(1.4) drop-shadow(0 0 10px var(--gold));
  }
  58% {
    transform: translateY(var(--lift)) rotateY(0) scale(1);
    filter: none;
  }
  100% {
    transform: scale(0.8);
  }
}
@keyframes prologue-glow {
  0%,
  100% {
    opacity: 0.75;
    transform: scale(0.94);
  }
  50% {
    opacity: 1;
    transform: scale(1.04);
  }
}
@keyframes prologue-float {
  0%,
  100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-6px);
  }
}
/* \u5E45\u30FB\u9AD8\u3055\u306E\u72ED\u3044\u7AEF\u672B(320\xD7568 \u306A\u3069)\u3067\u3082\u3001\u4E8C\u5217\u306E\u7D75\u3068\u91E6\u304C1\u753B\u9762\u306B\u53CE\u307E\u308B\u3088\u3046\u306B\u8A70\u3081\u308B */
@media (max-width: 359px) {
  .prologue {
    padding-left: 12px;
    padding-right: 12px;
  }
  .prologue-rows {
    gap: 6px;
  }
}
@media (max-height: 620px) {
  .prologue {
    padding-top: 56px;
    padding-bottom: calc(14px + env(safe-area-inset-bottom));
    gap: 10px;
  }
}
/* \u52D5\u304D\u3092\u6E1B\u3089\u3059\u8A2D\u5B9A(\u7AEF\u672B\u306E\u8A2D\u5B9A\u30FB\u5BFE\u5C40\u4E2D\u306E\u6F14\u51FA\u30AA\u30D5)\u3067\u306F\u6B62\u3081\u7D75\u3002\u7D42\u308F\u308A\u306E\u5F62\u3060\u3051\u3092\u51FA\u3059 */
.prologue.is-still .prologue-text,
.prologue.is-still .prologue-note,
.prologue.is-still .prologue-cue,
.prologue.is-still .prologue-col .prologue-foe,
.prologue.is-still .prologue-col .prologue-mine,
.prologue.is-still .prologue-col .prologue-taken,
.prologue.is-still .prologue-gate-glow,
.prologue.is-still .prologue-gate-card {
  animation: none;
}
@media (prefers-reduced-motion: reduce) {
  .prologue .prologue-text,
  .prologue .prologue-note,
  .prologue .prologue-cue,
  .prologue .prologue-col .prologue-foe,
  .prologue .prologue-col .prologue-mine,
  .prologue .prologue-col .prologue-taken,
  .prologue .prologue-gate-glow,
  .prologue .prologue-gate-card {
    animation: none;
  }
}

/* \u306F\u3058\u3081\u3066\u306E\u624B\u5F15\u304D(2026-09-29 \u672C\u4EBA\u306E\u6307\u793A\u3002\u300C\u5BFF\u53F8\u5C06\u68CB\u300D\u306E\u5C0E\u5165\u306E\u5F62\u3092\u501F\u308A\u308B)\u3002
   1\u30DA\u30FC\u30B8=1\u3064\u306E\u3053\u3068\u3002\u7D751\u679A\u30681\u301C2\u884C\u3060\u3051\u3092\u3001\u9806\u306B\u6E21\u3059\u3002
   \u65E9\u898B\u8868(.rule-grid)\u304C13\u6BB5\u30921\u679A\u306B\u4E26\u3079\u308B**\u8ABF\u3079\u308B\u7528\u306E\u8868**\u306A\u306E\u306B\u5BFE\u3057\u3066\u3001
   \u3053\u3061\u3089\u306F**\u899A\u3048\u308B\u9806\u306B1\u679A\u305A\u3064**\u3002\u4E21\u65B9\u3092\u6B8B\u3059 */
.primer {
  display: flex;
  flex-direction: column;
  gap: 14px;
  max-width: 420px;
}
.primer-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
}
.primer-head h3 {
  margin: 0;
}
/* \u300C\u3042\u3068\u3067\u300D\u306F\u91E6\u3089\u3057\u304F\u898B\u305B\u3059\u304E\u306A\u3044\u3002\u9032\u3080\u65B9\u3092\u62BC\u3057\u3066\u307B\u3057\u3044 */
.primer-skip {
  flex: none;
  padding: 6px 8px;
  border: 0;
  background: none;
  color: var(--text-dim);
  font-size: 12px;
  cursor: pointer;
}
.primer-skip:hover {
  color: var(--text);
}
/* \u7D75\u3068\u6587\u3002\u9AD8\u3055\u3092\u6C7A\u3081\u3066\u304A\u304B\u306A\u3044\u3068\u3001\u672D\u3092\u9001\u308B\u305F\u3073\u306B\u91E6\u306E\u4F4D\u7F6E\u304C\u52D5\u304F */
.primer-body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  min-height: 190px;
  padding: 16px 8px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.03);
  animation: primer-in 260ms ease-out both;
}
@keyframes primer-in {
  from {
    opacity: 0;
    transform: translateY(4px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
.primer-text {
  display: flex;
  flex-direction: column;
  gap: 4px;
  text-align: center;
}
.primer-text p {
  margin: 0;
  font-size: 14px;
  line-height: 1.7;
}
/* \u76E4\u306E\u99D2\u3092\u305D\u306E\u307E\u307E\u4E26\u3079\u308B\u672D(\u3088\u3046\u3053\u305D\u30FB\u52DD\u3061\u65B9\u30FB\u4F0F\u305B\u672D\u30FB\u9663) */
.primer-chips {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.primer-chips-setup {
  gap: 4px;
}
.primer-arrow {
  color: var(--gold);
  font-size: 13px;
}
.primer-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
/* \u91E6\u306F\u4E2D\u8EAB\u306E\u3076\u3093\u3060\u3051\u3002\u72ED\u3044\u3068\u304D\u306F\u7E2E\u3080(\u306F\u307F\u51FA\u3055\u305B\u306A\u3044) */
.primer-foot .btn {
  flex: 0 1 auto;
  min-width: 0;
  min-height: 42px;
  white-space: nowrap;
}
.primer-back:disabled {
  opacity: 0.35;
}
.primer-dots {
  display: flex;
  justify-content: center;
  gap: 5px;
}
.primer-dots i {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--line);
}
.primer-dots i.is-at {
  background: var(--gold);
}
/* \u3053\u306E\u5148\u306B\u4F55\u304C\u3042\u308B\u304B\u3092\u898B\u305B\u308B\u6700\u5F8C\u306E\u672D\u3002\u672D\u306F\u5C11\u3057\u91CD\u306D\u3066\u5E45\u3092\u8A70\u3081\u308B */
.primer-chips-more {
  gap: 0;
}
.primer-chips-more > * + * {
  margin-left: -10px;
}
@media (prefers-reduced-motion: reduce) {
  .primer-body {
    animation: none;
  }
}

/* \u30D5\u30A7\u30FC\u30BA2\u30FB3 \u306E\u738B\u306E\u529B\u30FB\u30A8\u30EA\u30A2\u306E\u6587\u306F3\u301C4\u884C\u306E\u6BB5\u843D\u3002\u884C\u982D\u3092\u305D\u308D\u3048\u308B(2026-10-06 \u898B\u76F4\u3057)\u3002
   \u753B\u9762(.modal-panel)\u306E\u4E2D\u5BC4\u305B\u3092\u53D7\u3051\u3066\u3001\u884C\u3054\u3068\u306B\u4E2D\u5BC4\u305B\u306E\u6BB5\u843D\u306B\u306A\u308A\u3001\u884C\u982D\u304C\u305A\u308C\u3066\u8AAD\u307F\u306B\u304F\u304B\u3063\u305F */
.story-intro-items li > span {
  text-align: left;
}
.story-intro .hint {
  margin: 0;
}
/* \u4E00\u6587\u305A\u3064\u7A4D\u3080(2026-10-01\u3002\u9577\u30441\u884C\u3060\u3068\u8A9E\u306E\u9014\u4E2D\u3067\u5272\u308C\u3066\u3044\u305F)\u3002\u884C\u306E\u4E2D\u306F\u53E5\u306E\u584A(2026-10-06 \u898B\u76F4\u3057\u3002
   \u300C\u3042\u306A\u305F\u306E\u738B\u3082\u3001\u305D\u306E\u6570\u5B57\u306E\u30D5\u30A9\u30A4\u30EB/\u3092\u88C5\u5099\u3057\u3066\u2026\u300D\u3068\u5272\u308C\u3066\u3044\u305F)\u306A\u306E\u3067\u3001\u76F4\u4E0B\u306E\u884C\u3060\u3051\u3092 block \u306B\u3059\u308B */
.story-intro-note > span {
  display: block;
  word-break: auto-phrase;
}
/* \u4E00\u89A7\u306E\u898B\u51FA\u3057\u306E\u4E0B\u306E\u300C\u6B21\u306F\u3001\u56DB\u3068\u4E94\u306E\u738B\u3002\u300D(2026-10-01 \u672C\u4EBA\u306E\u6307\u793A)\u3002\u6B21\u306E\u4E00\u6B69\u30921\u3064\u3060\u3051 */
.story-next {
  margin: 6px 0 12px;
  text-align: center;
  color: var(--gold);
  font-size: 14px;
  letter-spacing: 0.04em;
}
/* \u30B9\u30C8\u30FC\u30EA\u30FC2\u3064\u76EE\u306E\u624B\u5F53\u3066\u306E\u4E00\u8A00(2026-10-01 \u672C\u4EBA\u306E\u6307\u793A)\u3002\u30B5\u30A4\u30B3\u30ED\u3068\u5F15\u304D\u76F4\u3057\u306F\u898B\u51FA\u3057\u306E\u4E0B\u306B\u30011\u65871\u884C\u3067\u3002
   \u91D1\u306E\u7E01\u3067\u300C\u6848\u5185\u300D\u3068\u5206\u304B\u308B\u3088\u3046\u306B\u3002\u884C\u306F1\u6587\u305A\u3064\u6E21\u3059(\u8AAD\u70B9\u306E\u9014\u4E2D\u3067\u5272\u3089\u306A\u3044) */
.story-coach {
  margin: 2px auto 8px;
  padding: 6px 12px;
  max-width: 360px;
  border: 1px solid rgba(212, 175, 55, 0.45);
  border-radius: 10px;
  background: rgba(8, 17, 32, 0.72);
  color: var(--gold-soft);
  font-size: 14px;
  line-height: 1.5;
  letter-spacing: 0.04em;
  text-align: center;
}
.story-coach span {
  display: block;
  word-break: auto-phrase;
}
/* \u9663\u3067\u306F\u898B\u51FA\u3057\u306E\u4EE3\u308F\u308A\u306B\u5E2F(\u8CBC\u308A\u4ED8\u304F .setup-head)\u306E\u4E2D\u3078\u3002\u76E4\u3068\u624B\u672D\u3068\u91E6\u30921\u753B\u9762\u306B\u53CE\u3081\u308B\u305F\u3081\u5C0F\u3055\u3081\u306B */
.setup-wrap-compact .setup-head .story-coach {
  margin: 0 auto 4px;
  padding: 4px 10px;
  font-size: 13px;
  line-height: 1.45;
}
/* \u4E00\u8A00\u306E\u3076\u3093\u3001\u80CC\u306E\u4F4E\u3044\u7AEF\u672B\u3067\u306F\u76E4\u3092\u5C11\u3057\u8A70\u3081\u308B(375\xD7667 \u3067\u300C\u738B\u3092\u9078\u3076\u300D\u307E\u30671\u753B\u9762) */
.setup-wrap-compact:has(.story-coach) .mini-board {
  width: min(78vw, 320px, calc(100dvh - 440px));
}
@media (max-width: 340px) {
  .story-coach {
    font-size: 13px;
    letter-spacing: 0.02em;
  }
  .setup-wrap-compact .setup-head .story-coach {
    font-size: 12px;
  }
}

/* \u8AAD\u307F\u4E0A\u3052\u306B\u3060\u3051\u6E21\u3059\u6587\u5B57(\u898B\u305F\u76EE\u306B\u306F\u51FA\u3055\u306A\u3044) */
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* \u30B9\u30C8\u30FC\u30EA\u30FC\u306E\u30D5\u30A7\u30FC\u30BA1: \u30B9\u30C6\u30FC\u30B8\u306E\u524D\u306B\u3001\u76F8\u624B\u306E\u738B\u306B\u306A\u308B\u99D2\u306E\u52D5\u304D\u3092\u76E4\u306E\u56F3\u3067(2026-09-30) */
.story-intro-moves {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.story-intro-moves li {
  display: grid;
  grid-template-columns: auto 1fr;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.03);
}
.story-move-art {
  display: flex;
  align-items: center;
  gap: 8px;
}
.story-intro-moves .move-diagram {
  width: 108px;
}
.story-intro-moves p {
  margin: 0;
  font-size: 13px;
  line-height: 1.6;
}
/* \u300C\u904A\u3073\u65B9\u300D\u306F\u898B\u51FA\u3057\u306E\u53F3\u306B\u5C0F\u3055\u304F */
.story-head {
  position: relative;
}
.story-guide {
  position: absolute;
  top: 0;
  right: 0;
  min-height: 34px;
  padding: 4px 12px;
  font-size: 12px;
}

/* \u5C0E\u5165\u306E\u300C\u53D6\u308C\u306A\u304F\u306A\u3063\u305F\u3089\u300D: \u672D\u306E\u7D44\u30922\u3064\u4E26\u3079\u3001\u5408\u8A08\u306E\u5C0F\u3055\u3044\u307B\u3046\u3092\u5149\u3089\u305B\u308B */
.primer-judge {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  gap: 18px;
}
.primer-judge-side {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  opacity: 0.6;
}
.primer-judge-side.is-win {
  opacity: 1;
}
.primer-judge-cards {
  display: flex;
  gap: 2px;
}
.primer-judge-side small {
  font-size: 12px;
  color: var(--text-dim);
}
.primer-judge-side.is-win small {
  color: var(--gold);
}
/* \u72ED\u3044\u5E45(320 \u306A\u3069)\u3067\u306F\u3001\u6A2A\u4E26\u3073\u306E\u307E\u307E\u56F3\u3092\u5C0F\u3055\u304F\u3057\u3066\u6587\u306E\u5217\u3092\u7A7A\u3051\u308B(\u7E26\u306B\u7A4D\u3080\u3068\u300C\u306F\u3058\u3081\u308B\u300D\u304C\u753B\u9762\u306E\u5916\u306B\u51FA\u305F) */
@media (max-width: 360px) {
  .story-intro-moves li {
    gap: 8px;
    padding: 8px 10px;
  }
  .story-move-art {
    gap: 6px;
  }
  .story-intro-moves .move-diagram {
    width: 76px;
  }
}

/* =========================================================================
   \u306F\u3058\u3081\u306E\u4E00\u5C40(\u5C0E\u5165\u306E\u53F0\u672C\u306E\u4E00\u5C40\u30022026-10-01 \u672C\u4EBA\u306E\u6307\u793A)
   ========================================================================= */
/* \u672D\u306E\u6587\u306F\u884C\u306E\u914D\u5217\u3067\u6301\u3061\u3001\u8AAD\u70B9\u306E\u4F4D\u7F6E\u3067\u884C\u3092\u5207\u308B\u30021\u884C\u305A\u3064\u7A4D\u3080 */
.tutorial-line-row {
  display: block;
}
/* \u6B62\u3081\u305F\u3068\u304D\u306E\u4E00\u8A00\u304C2\u884C\u306E\u3068\u304D\u3002\u624B\u306E\u5370\u306E\u6A2A\u306B\u884C\u3092\u7A4D\u3080 */
.tutorial-wait-lines {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}
/* \u5F85\u3064\u672D\u306E\u5149\u306E\u7B4B(\u306D\u3089\u3046\u99D2\u304B\u3089\u4E8C\u679A\u3078)\u3002\u25BC \u306F\u4ED8\u3051\u305A\u3001\u6D41\u308C\u308B\u7DDA\u3067\u300C\u306D\u3089\u3063\u3066\u3044\u308B\u300D\u3092\u898B\u305B\u308B */
.tutorial-threat {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 6;
  overflow: visible;
}
.tutorial-threat-line {
  stroke: #f0d98a;
  stroke-width: 0.1;
  stroke-linecap: round;
  stroke-dasharray: 0.16 0.1;
  filter: drop-shadow(0 0 0.08px #f0d98a);
  animation: tutorial-threat-flow 0.9s linear infinite;
}
.tutorial-threat-head {
  fill: #f0d98a;
  filter: drop-shadow(0 0 0.08px #f0d98a);
}
@keyframes tutorial-threat-flow {
  to {
    stroke-dashoffset: -0.26;
  }
}
@media (prefers-reduced-motion: reduce) {
  .tutorial-threat-line {
    animation: none;
  }
}
/* \u738B\u3092\u9078\u3076\u753B\u9762\u306B\u3001\u78BA\u5B9A\u6E08\u307F\u306E\u76F8\u624B\u306E\u4E26\u3073\u3092\u4F0F\u305B\u672D\u3067\u8584\u304F */
.mini-piece-foe {
  opacity: 0.5;
  pointer-events: none;
}
/* \u7D50\u679C: \u76F8\u624B\u306E\u738B\u3068\u3042\u306A\u305F\u306E\u738B\u3092\u4E26\u3079\u308B */
.tutorial-reveal-pair {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: 14px;
  margin: 6px 0 4px;
}
.tutorial-reveal-pair .tutorial-reveal {
  flex: 1 1 0;
  max-width: 150px;
  margin: 0;
}
.tutorial-reveal-pair .tutorial-reveal p {
  font-size: 13px;
  line-height: 1.5;
  word-break: auto-phrase;
  text-wrap: balance;
}
.tutorial-reveal-pair .tutorial-reveal b {
  font-size: 16px;
}
.tutorial-end-lines {
  margin: 10px 0 0;
  line-height: 1.7;
}
/* \u300C\u9580\u3078\u9032\u3080\u300D\u3002\u52DD\u3063\u305F\u8912\u7F8E\u306E\u5148\u306A\u306E\u3067\u3001\u91D1\u3067\u8108\u6253\u305F\u305B\u308B */
.result-gate {
  animation: result-gate-glow 1.6s ease-in-out infinite;
}
@keyframes result-gate-glow {
  0%,
  100% {
    box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.5);
  }
  55% {
    box-shadow: 0 0 18px 4px rgba(212, 175, 55, 0.45);
  }
}
@media (prefers-reduced-motion: reduce) {
  .result-gate {
    animation: none;
  }
}
/* \u30D2\u30F3\u30C8\u306E\u52D5\u304D\u306E\u56F3(2\u30FB3\u30FB5)\u306F\u6A2A\u4E00\u5217\u30022\u5217\u3060\u3068\u5E2F\u304C\u80CC\u9AD8\u306B\u306A\u308A\u3001\u7B54\u3048\u306E\u99D2\u304C\u5E2F\u306E\u4E0B\u306B\u96A0\u308C\u305F */
.tutorial-hint-guide .move-hint {
  margin: 6px 0 2px;
}
.tutorial-hint-guide .move-hint-rows {
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 4px;
}
/* \u6587\u306E\u5217\u306F 375 \u5E45\u3067 62px(\u53E5\u306E\u300C2\u30DE\u30B9\u307E\u3067\u3002\u300D\u304C 56px\u30022026-10-05 \u898B\u76F4\u3057\u3067\u67A0\u306E\u5185\u5074\u306E\u4F59\u767D\u3092\u8A70\u3081\u305F) */
.tutorial-hint-guide .move-guide .move-hint-row {
  grid-template-columns: 30px minmax(0, 1fr);
  gap: 4px;
  padding: 4px 3px;
}
/* 320 \u5E45\u3067\u306F\u6A2A\u306B\u4E26\u3079\u308B\u3068\u6587\u306E\u5217\u304C 44px \u3057\u304B\u306A\u3044\u3002\u56F3\u306E\u4E0B\u306B\u6587\u3092\u7F6E\u304F(\u53E5\u304C1\u884C\u306B\u53CE\u307E\u308B) */
@media (max-width: 360px) {
  .tutorial-hint-guide .move-guide .move-hint-row {
    grid-template-columns: minmax(0, 1fr);
    justify-items: center;
    text-align: center;
  }
}
.tutorial-hint-guide .move-hint-row .move-diagram {
  width: 30px;
}
.tutorial-hint-guide .move-hint-label b {
  font-size: 13px;
}
.tutorial-hint-guide .move-hint-label small {
  font-size: 10px;
  line-height: 1.35;
}
/* \u7DE0\u3081\u306E\u4E00\u884C\u306F\u6587\u3054\u3068\u306B\u6298\u308A\u8FD4\u3059(\u8A9E\u306E\u9014\u4E2D\u3067\u5272\u3089\u306A\u3044) */
.tutorial-tagline-part {
  display: inline-block;
}
/* \u53E5\u3054\u3068\u306B\u6298\u308A\u8FD4\u3059\u6587(2026-10-05 \u898B\u76F4\u3057)\u3002\u53E5(\u8A9E\u306E\u307E\u3068\u307E\u308A)\u30921\u3064\u306E\u584A\u306B\u3057\u3001\u584A\u306E\u9593\u3067\u3060\u3051\u6298\u308A\u8FD4\u3059\u3002
   iPhone \u306E WebKit \u306F word-break: auto-phrase \u3092\u77E5\u3089\u305A\u3001\u300C\u7E26\u6A2A1\u30DE/\u30B9\u3002\u300D\u300C\u305D\u306E\u99D2\u3092\u53D6\u308C\u307E/\u3059\u3002\u300D\u3068\u5272\u308C\u305F\u3002
   \u30D2\u30F3\u30C8\u306E\u52D5\u304D\u306E\u56F3\u30FB\u30B9\u30C8\u30FC\u30EA\u30FC\u306E\u5BFE\u5C40\u8AAC\u660E(\u30D5\u30A7\u30FC\u30BA1)\u30FB\u624B\u5F15\u304D\u3002\u53E5\u306F MOVE_PHRASES \u3068 primer.jsx \u304C\u6301\u3064 */
.text-phrase {
  display: inline-block;
}
/* \u306F\u3058\u3081\u306E\u4E00\u5C40\u306E\u7D50\u679C\u306E\u4E0A\u306B\u91CD\u306D\u308B\u3001\u52DD\u3063\u305F\u3042\u3068\u306E\u540D\u524D(\u300C\u623B\u308B\u300D\u3067\u7D50\u679C\u3078\u30022026-10-05 \u898B\u76F4\u3057)\u3002
   \u4E0B\u306E\u7D50\u679C\u304C\u900F\u3051\u3066\u8AAD\u307F\u306B\u304F\u304F\u306A\u3089\u306A\u3044\u3088\u3046\u3001\u672D\u306B\u91CD\u306D\u305F\u753B\u9762\u3068\u540C\u3058\u5730\u3092\u6577\u304F */
.intro-name-cover .name-stage {
  padding: 0;
}
.intro-name-cover .name-card {
  background: linear-gradient(170deg, #132844, #0b1729);
  border: 2px solid var(--gold);
  max-height: 100%;
  overflow-y: auto;
}
/* \u300C\u9580\u3078\u9032\u3080\u300D\u306F\u9001\u308B\u4E2D\u8EAB\u306E\u5916\u30022\xD72 \u306E\u91E6\u306E\u4E0A\u306B\u3044\u3064\u3082\u898B\u3048\u308B */
.gameover-panel > .gameover-gate {
  flex: none;
  margin-top: 10px;
}
/* \u80CC\u306E\u4F4E\u3044\u753B\u9762(375\xD7667 \u306A\u3069)\u3067\u306F\u3001\u306F\u3058\u3081\u306E\u4E00\u5C40\u306E\u7D50\u679C(\u9580\u3078\u9032\u3080\u304C\u3042\u308B\u7D50\u679C)\u3060\u3051\u3092\u8A70\u3081\u3001\u7DE0\u3081\u306E\u4E00\u884C\u307E\u3067
   \u9001\u3089\u305A\u306B\u898B\u305B\u308B(2026-10-05 \u898B\u76F4\u3057\u3002\u7DE0\u3081\u304C\u9001\u308B\u4E2D\u8EAB\u306E\u4E0B\u306B\u96A0\u308C\u3001\u5B57\u306E\u982D\u3060\u3051\u304C\u898B\u3048\u3066\u3044\u305F\u3002\u7D0451px \u8DB3\u308A\u306A\u3044)\u3002
   \u98FE\u308A\u306E\u51A0\u3092\u5916\u3057(34px)\u3001\u898B\u51FA\u3057\u30FB\u30B9\u30C6\u30FC\u30B8\u306E\u540D\u30FB\u7D50\u3073\u306E\u884C\u306E\u4F59\u767D\u3092\u8A70\u3081\u308B\u3002\u7DE0\u3081\u3092\u9580\u306E\u584A\u3078\u79FB\u3059\u3068\u3001
   \u9580\u306E\u584A\u304C\u9AD8\u304F\u306A\u3063\u3066\u7D50\u3073\u306E\u884C\u304C\u96A0\u308C\u308B\u306E\u3067\u3001\u8A70\u3081\u308B\u307B\u3046\u306B\u3057\u305F */
@media (max-height: 700px) {
  .gameover-panel:has(.gameover-gate) .gameover-body > svg:first-child {
    display: none;
  }
  .gameover-panel:has(.gameover-gate) h2 {
    margin: 2px 0;
  }
  .gameover-panel:has(.gameover-gate) .gameover-sub {
    margin: 2px 0 6px;
  }
  .gameover-panel:has(.gameover-gate) .tutorial-end-lines {
    margin-top: 6px;
    line-height: 1.5;
  }
  .gameover-panel:has(.gameover-gate) .tutorial-tagline {
    margin: 4px 0 0;
  }
}
/* \u3082\u3063\u3068\u80CC\u306E\u4F4E\u3044\u753B\u9762(320\xD7568\u3002SE \u7B2C1\u4E16\u4EE3\u30FB\u62E1\u5927\u8868\u793A\u306E SE2/SE3/8)\u3067\u306F\u3001\u4E0A\u306E\u8A70\u3081\u65B9\u3067\u3082\u7DE0\u3081\u306E\u4E00\u884C\u304C\u5165\u3089\u306A\u304B\u3063\u305F

   \u738B\u3092\u8A0E\u3066\u308B\u552F\u4E00\u306E\u99D2 4\u2666(e1\u3002356\u301C411pt)\u304C\u5E2F\u306E\u4E0B\u306B\u5165\u3063\u305F\u3002\u30D2\u30F3\u30C8\u3092\u958B\u304F\u3068\u5E2F\u304C\u3055\u3089\u306B\u80CC\u9AD8\u306B\u306A\u3063\u305F\u3002
   \u5185\u5074\u306E\u4F59\u767D\u3068\u884C\u306E\u9AD8\u3055\u3092\u8A70\u3081\u3001\u30D2\u30F3\u30C8\u306E\u56F3\u306F\u5C0F\u3055\u306A\u76E4\u3092\u5916\u3057\u3066\u6570\u5B57\u3068\u53E5\u3060\u3051\u306B\u3059\u308B(\u76E4\u3092\u898B\u308C\u3070\u52D5\u304D\u306F\u5206\u304B\u308B)\u3002

/* 9\xD79\u3067\u3082\u8868\u88CF\u30FB\u30B9\u30AD\u30F3\u306B\u3088\u3089\u305A\u9663\u55B6\u3092\u793A\u3059\u3002\u8272\u306B\u52A0\u3048\u3066\u81EA\uFF0F\u6575\u3092\u4F75\u8A18\u3002 */
.faction-0 { --faction-edge: #ef967e; --faction-ink: #722e25; }
.faction-1 { --faction-edge: #81d7e2; --faction-ink: #155665; }
.piece-faction { isolation: isolate; border-radius: 4px; }
.piece-faction::after {
  content: ""; position: absolute; inset: -1px;
  border: 2px solid var(--faction-edge); border-radius: 4px;
  box-shadow: 0 0 0 1px #08121e; pointer-events: none; z-index: 3;
}
.piece-faction.piece-selected::after {
  border-color: #fff3ba;
  box-shadow: 0 0 0 2px #a77925;
}
.piece-faction-mark {
  position: absolute; top: 0; right: 0; z-index: 4;
  min-width: 15px; height: 16px; padding: 1px 2px;
  display: grid; place-items: center;
  color: #fff; background: var(--faction-ink);
  border: 1px solid var(--faction-edge); border-radius: 0 3px 0 5px;
  font: 800 11px/1 system-ui, sans-serif;
  pointer-events: none;
}
.piece-enemy .piece-faction-mark { border-radius: 0 3px 0 0; }
.piece-faction[data-size="xs"] .piece-faction-mark {
  min-width: 11px; height: 12px; padding: 0; font-size: 9px;
}
.cell .piece-faction[data-size="xs"] {
  width: 26px; height: 35px;
  max-width: calc(100% - 6px); max-height: calc(100% - 6px);
}
.cell .piece-faction > .card-face,
.cell .piece-faction > .card-back { max-width: none; max-height: none; }
.cell .piece-faction[data-size="xs"] > .card-face,
.cell .piece-faction[data-size="xs"] > .card-back { width: 100% !important; height: 100% !important; }
.piece-faction > .revealed-badge,
.piece-faction > .known-badge,
.piece-faction > .mark-badge,
.piece-faction > .king-badge,
.piece-faction > .frozen-badge { z-index: 5; }
.piece-faction > .revealed-badge { background: var(--faction-ink); color: #fff; white-space: nowrap; }
.piece-faction-legend {
  display: flex; justify-content: center; gap: 20px;
  margin: 0 0 7px; color: #e0e6ed; font: 11px/1.4 system-ui, sans-serif;
}
.piece-faction-legend > span { display: flex; align-items: center; gap: 5px; }
.piece-faction-legend b {
  padding: 1px 3px; border: 1px solid var(--faction-edge);
  border-radius: 3px; background: var(--faction-ink); color: #fff;
}
/* \u76F8\u624B\u304C\u540D\u4E57\u308A\u3092\u4E0A\u3052\u3066\u3082\u3001\u3053\u3061\u3089\u306E\u640D\u5931\u3092\u91D1\u8272\u306E\u8F1D\u304D\u3067\u795D\u308F\u306A\u3044\u3002 */
.piece-enemy.piece-unveiled { animation-name: piece-unveil-enemy; }
@keyframes piece-unveil-enemy {
  from { transform: rotateY(90deg); }
  to { transform: rotateY(0); }
}
/* \u8A18\u9332\u518D\u751F\u306E\u640D\u5931\u3082\u3001\u5149\u306E\u8F2A\u3067\u306F\u306A\u304F\u5207\u308C\u76EE\u3068\u843D\u4E0B\u3067\u793A\u3059\u3002 */
.fx-defeat-mine {
  background: #491e26aa; border-radius: 3px; inset: 10%;
  animation-name: fx-loss-fall;
}
.fx-defeat-mine::before {
  inset: 15% 45%; background: #df8277; box-shadow: none;
  border-radius: 0; transform: rotate(38deg); animation: none;
}
.fx-defeat-mine::after { display: none; }
@keyframes fx-loss-fall {
  0% { opacity: 0; transform: translateY(0); }
  20% { opacity: 1; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(18px); }
}

.board-outer:has(> .piece-faction-legend) { flex-direction: column; align-items: center; }
.board-outer:has(> .piece-faction-legend) > .area-notice-slot { top: 29px; }
.piece-faction[data-size="xs"] .piece-faction-mark { right: -2px; }
.piece-faction[data-size="xs"] > .card-skinned.card-captain { border-width: 1px; }

/* \u72B6\u614B\u306E\u672D\u306F\u53F3\u4E0B\u3078\u3002\u6570\u5B57\u30FB\u30B9\u30FC\u30C8\u304C\u4E26\u3076\u5DE6\u7AEF\u3092\u7A7A\u3051\u308B\u3002 */
.piece-faction[data-size="xs"] > .revealed-badge,

  left: auto; right: -2px; bottom: -2px; transform: none;

  font: 700 8px/1 system-ui, sans-serif; border-radius: 2px; text-align: center;
}

.cell .piece-faction[data-size="md"] {
  width: 50px; height: 67px;

}
.cell .piece-faction[data-size="md"] > .card-face,
.cell .piece-faction[data-size="md"] > .card-back { width: 100% !important; height: 100% !important; }

/* \u76E4\u9762\u3067\u306F\u6570\u5B57\u30FB\u30B9\u30FC\u30C8\u30FB\u9663\u55B6\u3092\u5DE6\u306E\u60C5\u5831\u5E2F\u3078\u3002\u30A4\u30E9\u30B9\u30C8\u306B\u306F\u91CD\u306D\u306A\u3044\u3002 */
.cell .piece-faction {

  --piece-tag-height: 8px;
  --piece-rank-font: 11px;
  --piece-suit-font: 8px;
  width: 40px;
  height: 48px;
  max-width: calc(100% - 3px);
  max-height: calc(100% - 3px);
}
.cell .piece-faction[data-size="md"] {
  width: 66px;
  height: 78px;
  max-width: calc(100% - 6px);
  max-height: calc(100% - 6px);
}
.cell .piece-faction > .card-face,
.cell .piece-faction > .card-back {
  width: 100% !important;
  height: 100% !important;
  max-width: none;
  max-height: none;
  border: 0;

  padding-left: var(--piece-rail);
  background: linear-gradient(to right, #f6efdf 0 var(--piece-rail), #111b28 var(--piece-rail));
  box-shadow: none;

.cell .piece-faction > .card-face > img,
.cell .piece-faction > .card-face > .foil-artwork,
.cell .piece-faction > .card-back > img {
  width: 100%;

  border-radius: 0 3px 3px 0;
}
.cell .piece-faction .foil-artwork > img { object-fit: contain; }
.cell .piece-faction .card-index {
  left: 0;
  top: 0;
  width: var(--piece-rail);
  min-width: 0;
  padding: 0;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
  font-size: var(--piece-rank-font);
  line-height: 1;
  letter-spacing: -.06em;
  gap: 0;

.cell .piece-faction .card-index small { font-size: var(--piece-suit-font); }
.cell .piece-faction .card-suit-promoted { width: 1em; height: 1em; }
.cell .piece-faction .skin-king-mark { display: none; }
.cell .piece-faction::after {
  inset: -1px;
  border-width: 1px;
  border-radius: 4px;
  box-shadow: none;
}
.cell .piece-faction.piece-selected::after {
  border-color: #fff3ba;
  box-shadow: 0 0 0 1px #a77925;
}
.cell .piece-faction > .piece-faction-mark {
  top: auto;
  bottom: -1px;
  left: 0;
  right: auto;
  width: var(--piece-rail);
  min-width: 0;
  height: var(--piece-tag-height);
  padding: 0;
  border: 0;
  border-radius: 0 0 0 3px;
  font-size: 10px;
  line-height: 1;
}
.cell .piece-faction[data-size="xs"] > .piece-faction-mark { font-size: 8px; }
.cell .piece-faction[data-size="xs"] > .revealed-badge,
.cell .piece-faction[data-size="xs"] > .known-badge,
.cell .piece-faction[data-size="xs"] > .mark-badge {
  width: 10px;
  min-width: 0;
  height: 9px;
  right: -1px;
  bottom: -1px;
  border-width: .5px;
  font-size: 8px;
}
.cell .piece-faction .card-captain-fallback::after {
  left: var(--piece-rail);
  --captain-rim: 1px;
}

.cell .piece-faction > .card-back {
  background: linear-gradient(to right, var(--faction-ink) 0 var(--piece-rail), #111b28 var(--piece-rail));

  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.admin-tools {
  display: flex;
  gap: 8px;
  margin: 10px 0;
  flex-wrap: wrap;
}
.admin-input {
  flex: 1;
  min-width: 160px;
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: rgba(4, 10, 20, 0.6);
  color: var(--text);
  font-size: 14px;
}
.admin-error {
  margin: 8px 0;
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px solid rgba(176, 32, 47, 0.6);
  background: rgba(176, 32, 47, 0.15);
  color: #ffd2d6;
  font-size: 13px;
}

/* --- \u540D\u524D\u306E\u4E00\u89A7\u3002\u62BC\u3059\u3068\u8A73\u7D30\u304C\u51FA\u308B --- */
.admin-rows {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 10px;
}
.admin-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  width: 100%;
  min-height: 56px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: rgba(4, 10, 20, 0.45);
  color: var(--text);
  text-align: left;
  cursor: pointer;
}
.admin-row:hover {
  border-color: var(--gold-deep);
}
.admin-row.is-dim {
  opacity: 0.55;
}
.admin-row-main {
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.admin-row-main b {
  font-size: 15px;
  overflow-wrap: anywhere;
}
.admin-row-main small {
  font-size: 11px;
  color: var(--text-dim);
}
.admin-row-side {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: none;
  color: var(--text-dim);
}
.admin-row-side em {
  font-style: normal;
  font-size: 11px;
  color: var(--card-red);
  border: 1px solid var(--card-red);
  border-radius: 999px;
  padding: 2px 8px;
}

/* --- \u8A73\u7D30\u3002\u30B9\u30DE\u30DB\u3067\u306F\u4E0B\u304B\u3089\u3001\u5E83\u3044\u753B\u9762\u3067\u306F\u771F\u3093\u4E2D\u306B --- */
.admin-sheet {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  background: rgba(4, 10, 20, 0.72);
  padding: 0;
}
.admin-panel {
  width: 100%;
  max-width: 520px;
  max-height: 86dvh;
  overflow-y: auto;
  padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
  border-radius: 14px 14px 0 0;
  border: 1px solid var(--line);
  background: linear-gradient(180deg, #16294a 0%, #0e1c33 100%);
}
.admin-panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 10px;
  position: sticky;
  top: -16px;
  background: #16294a;
  padding: 10px 0;
  z-index: 1;
}
.admin-panel-head b {
  font-family: "Shippori Mincho", serif;
  font-size: 19px;
  overflow-wrap: anywhere;
}
.admin-line {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 0;
  border-bottom: 1px solid rgba(212, 175, 55, 0.14);
  font-size: 13px;
}
.admin-line > span {
  flex: none;
  color: var(--text-dim);
  font-size: 12px;
}
.admin-line > b {
  text-align: right;
  overflow-wrap: anywhere;
}
.admin-panel-actions {
  display: flex;
  gap: 8px;
  margin-top: 14px;
}
.admin-panel-actions .btn {
  flex: 1;
  min-height: 44px;
}
@media (min-width: 640px) {
  .admin-sheet {
    align-items: center;
    padding: 20px;
  }
  .admin-panel {
    border-radius: 14px;
  }
}

/* --- \u624B\u7D19\u3092\u66F8\u304F\u6B04 --- */
.letter-form {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin: 12px 0 16px;
}
.letter-field {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.letter-field > span {
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--text-dim);
}
.letter-field textarea.admin-input {
  resize: vertical;
  font-family: inherit;
  line-height: 1.7;
}
.letter-gifts-edit {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.letter-gift-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.letter-gift-row .admin-input {
  flex: 1;
  min-width: 110px;
}
.letter-sent {
  cursor: default;
}
.letter-sent:hover {
  border-color: var(--line);
}

/* \u904B\u55B6\u3068\u3057\u3066\u306E uid\u3002\u30EB\u30FC\u30EB\u306B\u8CBC\u308B\u306E\u3067\u3001\u9078\u3073\u3084\u3059\u304F\u7B49\u5E45\u3067\u51FA\u3059 */
.admin-uid code {
  font-family: "IBM Plex Mono", monospace;
  font-size: 12px;
  color: var(--gold-soft);
  background: rgba(212, 175, 55, 0.1);
  padding: 2px 6px;
  border-radius: 4px;
  user-select: all;
}

/* \u30B5\u30A4\u30F3\u30A4\u30F3\u753B\u9762\u306E\u300C\u30D1\u30B9\u30EF\u30FC\u30C9\u3092\u5FD8\u308C\u305F\u300D\u3002\u30D5\u30A9\u30FC\u30E0\u306E\u4E0B\u306B\u63A7\u3048\u3081\u306B */
.admin-reset-link {
  display: block;
  margin: 12px auto 0;
}
