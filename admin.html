  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.tutorial-back-wait {
  padding: 6px 14px;
  font-size: 12px;
}

@media (prefers-reduced-motion: reduce) {
  .guide-target,
  .guide-target::before,
  .focus-button .btn-primary:not(.tutorial-next):not(:disabled),
  .focus-button .btn-danger:not(:disabled) {
    animation: none;
  }
}

/* =========================================================================
   \u99D2\u306E\u52D5\u304D\u3068\u3001\u53D6\u3063\u305F/\u53D6\u3089\u308C\u305F\u306E\u6F14\u51FA
   ========================================================================= */

/* \u99D2\u306E\u5165\u308C\u7269\u3092\u30DE\u30B9\u5168\u4F53\u306B\u5E83\u3052\u308B\u3002
   \u3053\u3046\u3059\u308B\u3068\u300C1\u30DE\u30B9\u3076\u3093\u300D\u3092 translate(100%) \u3067\u8868\u305B\u308B */
.piece-slot {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* \u51FA\u767A\u70B9\u304B\u3089\u30011\u30DE\u30B9\u305A\u3064\u8DF3\u3093\u3067\u5230\u7740\u70B9\u307E\u3067\u9032\u3080\u3002
   steps(..., jump-none) \u3067\u3001\u9014\u4E2D\u306E\u30DE\u30B9\u306B\u3082\u5FC5\u305A\u4E00\u5EA6\u7ACB\u3064 */
.piece-stepping {
  animation: piece-step var(--ms) steps(var(--stops), jump-none) both;
  z-index: 4;
}
@keyframes piece-step {
  from {
    transform: translate(calc(var(--sx) * 100%), calc(var(--sy) * 100%));
  }
  to {
    transform: translate(0, 0);
  }
}

/* \u4F55\u4F53\u3082\u307E\u3068\u3081\u3066\u53D6\u308B\u3068\u304D\u306F\u3001\u624B\u524D\u304B\u3089\u9806\u306B1\u4F53\u305A\u3064\u5149\u3089\u305B\u308B */
.fx-defeat {
  animation-delay: calc(260ms + var(--i, 0) * 440ms);
}
.fx-defeat::before {
  animation-delay: calc(260ms + var(--i, 0) * 440ms);
}

/* \u53D6\u3063\u305F/\u53D6\u3089\u308C\u305F\u3092\u3001\u8272\u3068\u5E83\u304C\u308A\u65B9\u3067\u898B\u5206\u3051\u3089\u308C\u308B\u3088\u3046\u306B\u3059\u308B */
.fx-defeat::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 3px solid currentColor;
  opacity: 0;
  animation: fx-ring 1100ms ease-out both;
  animation-delay: calc(260ms + var(--i, 0) * 440ms);
}
.fx-defeat-foe {
  color: #f0d98a;
}
.fx-defeat-mine {
  color: #ef8a76;
}
.fx-defeat-surround {
  color: #cbb6ff;
}
@keyframes fx-ring {
  0% {
    transform: scale(0.3);
    opacity: 0.95;
  }
  100% {
    transform: scale(2.1);
    opacity: 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  .piece-stepping,
  .fx-defeat::after {
    animation: none;
  }
}

/* \u53D6\u3063\u305F\u99D2\u304C\u738B\u3060\u3063\u305F\u3068\u5206\u304B\u308B\u77AC\u9593 */
.capture-eyebrow-king {
  animation: king-reveal 500ms ease-out both;
}
.capture-card-king {
  position: relative;
  animation: king-reveal 500ms ease-out both;
  filter: drop-shadow(0 0 12px rgba(240, 217, 138, 0.9));
}
.capture-crown {
  position: absolute;
  top: -12px;
  left: 50%;
  transform: translateX(-50%);
  color: var(--gold-soft);
  filter: drop-shadow(0 0 6px rgba(212, 175, 55, 0.9));
}
@keyframes king-reveal {
  0% {
    transform: scale(0.86);
    opacity: 0.2;
  }
  60% {
    transform: scale(1.06);
    opacity: 1;
  }
  100% {
    transform: scale(1);
    opacity: 1;
  }
}
@media (prefers-reduced-motion: reduce) {
  .capture-eyebrow-king,
  .capture-card-king {
    animation: none;
  }
}

/* \u5BFE\u5C40\u306E\u8A18\u9332\u3002\u8AB0\u304C\u4F55\u3092\u3057\u305F\u306E\u304B\u3001\u8272\u3067\u8FFD\u3048\u308B\u3088\u3046\u306B\u3059\u308B */
.log-list {
  padding-left: 0;
  list-style: none;
}
.log-row {
  position: relative;
  padding: 5px 8px 5px 12px;
  border-left: 3px solid var(--who, transparent);
  border-radius: 0 5px 5px 0;
  background: rgba(255, 255, 255, 0.03);
  margin-bottom: 4px;
}
.log-row:nth-child(even) {
  background: rgba(255, 255, 255, 0.06);
}
.log-who {
  font-weight: 700;
}

/* \u6557\u5317\u306E\u753B\u9762\u3002\u52DD\u5229\u3068\u306F\u5225\u306E\u898B\u3048\u65B9\u306B\u3059\u308B */
.defeat-panel {
  border-color: rgba(208, 72, 58, 0.45);
  box-shadow: 0 0 34px rgba(120, 30, 24, 0.4);
}
.defeat-mark {
  color: #c9544a;
  filter: drop-shadow(0 0 8px rgba(208, 72, 58, 0.5));
}
.defeat-title {
  color: #e08b7a;
  letter-spacing: 0.16em;
}
.defeat-lead {
  margin: -4px 0 0;
  font-size: 13px;
  color: var(--text-dim);
}
/* \u738B\u306E\u7D75\u306F\u3001\u52DD\u3063\u305F\u3068\u304D\u306F\u8F1D\u304D\u3001\u8CA0\u3051\u305F\u3068\u304D\u306F\u8272\u3092\u5931\u3046 */
.lose-card img {
  filter: grayscale(0.85) brightness(0.5) contrast(0.9);
}
.lose-card {
  animation: lose-fade 900ms ease-out both;
}
@keyframes lose-fade {
  from {
    opacity: 0;
    transform: scale(1.04);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}
@media (prefers-reduced-motion: reduce) {
  .lose-card {
    animation: none;
  }
}

/* \u4F0F\u305B\u305F\u672D\u3092\u3081\u304F\u308B\u3002\u6700\u5F8C\u306E1\u679A\u3067\u738B\u304B\u3069\u3046\u304B\u304C\u5206\u304B\u308B */
.capture-card-open {
  animation: card-flip 380ms ease-out both;
}
@keyframes card-flip {
  0% {
    transform: rotateY(90deg) scale(0.9);
    opacity: 0.3;
  }
  60% {
    transform: rotateY(-8deg) scale(1.04);
    opacity: 1;
  }
  100% {
    transform: rotateY(0) scale(1);
    opacity: 1;
  }
}

/* \u8A18\u9332\u306E\u884C\u3092\u62BC\u3059\u3068\u3001\u305D\u306E\u6642\u70B9\u306E\u76E4\u9762\u304C\u898B\u3089\u308C\u308B */
.log-row-tap {
  cursor: pointer;
  padding-right: 46px;
}
.log-row-tap:hover {
  background: rgba(255, 255, 255, 0.1);
}
.log-row-active {
  background: rgba(212, 175, 55, 0.16);
  box-shadow: inset 0 0 0 1px rgba(212, 175, 55, 0.4);
}
.log-peek {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 10px;
  letter-spacing: 0.06em;
  color: var(--gold-soft);
  border: 1px solid rgba(212, 175, 55, 0.4);
  border-radius: 3px;
  padding: 1px 5px;
  opacity: 0.75;
}
.log-row-active .log-peek {
  opacity: 1;
  background: rgba(212, 175, 55, 0.2);
}

/* =========================================================================
   \u5BFE\u5C40\u306E\u8A18\u9332\u304B\u3089\u76E4\u9762\u3092\u898B\u308B\u3068\u304D
   ========================================================================= */

/* \u3069\u3061\u3089\u306E\u8ECD\u306E\u99D2\u304B\u3092\u3001\u67A0\u306E\u8272\u3067\u898B\u5206\u3051\u3089\u308C\u308B\u3088\u3046\u306B\u3059\u308B */
.side-ring::before {
  content: "";
  position: absolute;
  inset: -2px;
  border: 2px solid var(--who);
  border-radius: 7px;
  box-shadow: 0 0 7px color-mix(in srgb, var(--who) 55%, transparent);
  pointer-events: none;
}
/* \u5BFE\u5C40\u4E2D\u3001\u76F8\u624B\u306E\u8868\u5411\u304D\u306E\u99D2(\u516C\u958B\u30FB\u898B\u629C\u304D)\u3002\u67A0\u306F\u76F8\u624B\u306E\u8272\u3001\u300C\u516C\u958B\u300D\u306E\u672D\u3082\u76F8\u624B\u306E\u8272\u306B\u3057\u3066
   \u81EA\u5206\u306E\u99D2\u3068\u898B\u5206\u3051\u3089\u308C\u308B\u3088\u3046\u306B\u3059\u308B(\u672C\u4EBA\u306E\u6307\u6458 2026-09-15) */
.piece-foe-face .revealed-badge {
  background: var(--who);
  color: #fff;
}
.side-legend {
  display: flex;
  gap: 14px;
  justify-content: center;
  margin-bottom: 10px;
  font-size: 12px;
}
.side-key {
  color: var(--who);
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.side-key::before {
  content: "";
  width: 11px;
  height: 11px;
  border-radius: 3px;
  border: 2px solid var(--who);
  box-shadow: 0 0 6px color-mix(in srgb, var(--who) 55%, transparent);
}

/* \u305D\u306E\u624B\u3067\u99D2\u304C\u3069\u3053\u304B\u3089\u3069\u3053\u3078\u52D5\u304D\u3001\u3069\u3053\u304C\u5012\u308C\u305F\u304B\u3002
   \u99D2\u3068\u30DE\u30B9\u306F\u307B\u307C\u540C\u3058\u5927\u304D\u3055\u306A\u306E\u3067\u3001\u67A0\u3067\u793A\u3059\u3068\u6301\u3061\u4E3B\u306E\u8272\u67A0\u3068\u91CD\u306A\u3063\u3066\u6FC1\u308B\u3002
   \u51FA\u767A\u70B9(\u7A7A\u304D\u30DE\u30B9)\u3060\u3051\u67A0\u3067\u793A\u3057\u3001\u99D2\u304C\u3044\u308B\u30DE\u30B9\u306F\u89D2\u306E\u3057\u308B\u3057\u3067\u793A\u3059 */
.cell.trace-from::after {
  content: "";
  position: absolute;
  inset: 1px;
  border-radius: 5px;
  border: 2px dashed var(--gold-soft);
  background: rgba(212, 175, 55, 0.16);
  pointer-events: none;
  z-index: 1;
}
.cell.trace-to {
  background: rgba(212, 175, 55, 0.22);
}
.cell.trace-taken {
  background: rgba(214, 60, 70, 0.4);
}
/* \u8DE1\u306E\u67A0\u306F\u99D2\u306E\u4E0B\u306B\u6577\u304F\u3002\u99D2\u306E\u6301\u3061\u4E3B\u3092\u793A\u3059\u8272\u67A0\u3092\u96A0\u3055\u306A\u3044\u305F\u3081 */
.review-panel .piece-wrap {
  z-index: 2;
}
.trace-pin {
  position: absolute;
  top: 1px;
  min-width: 16px;
  height: 16px;
  padding: 0 3px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  line-height: 16px;
  text-align: center;
  z-index: 4;
  pointer-events: none;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
}
.trace-pin-to {
  left: 1px;
  background: var(--gold);
  color: #1b1405;
}
.trace-pin-taken {
  right: 1px;
  background: #d63c46;
  color: #fff;
}
.trace-legend {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  margin-bottom: 10px;
  font-size: 11px;
}
.trace-key {
  padding: 3px 8px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.trace-key-from {
  border: 1px dashed var(--gold-soft);
  color: var(--gold-soft);
  background: rgba(212, 175, 55, 0.16);
}
.trace-key-to {
  border: 1px solid transparent;
  color: var(--gold);
  background: rgba(212, 175, 55, 0.22);
}
.trace-key-to::before {
  content: "\u7740";
  background: var(--gold);
  color: #1b1405;
  border-radius: 999px;
  padding: 0 4px;
  font-weight: 700;
}
.trace-key-taken {
  border: 1px solid transparent;
  background: rgba(214, 60, 70, 0.4);
  color: #ffc2c5;
}
.trace-key-taken::before {
  content: "\\00d7";
  background: #d63c46;
  color: #fff;
  border-radius: 999px;
  padding: 0 5px;
  font-weight: 700;
}

/* =========================================================================
   \u5E03\u9663\u30DC\u30FC\u30CA\u30B9
   ========================================================================= */

.bonus-panel {
  text-align: center;
  max-width: 380px;
}
.bonus-eyebrow {
  color: var(--gold);
  letter-spacing: 0.18em;
  font-size: 12px;
  margin: 0 0 12px;
}
.bonus-list {
  list-style: none;
  padding: 0;
  margin: 0 0 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.bonus-row {
  display: flex;
  align-items: center;
  gap: 9px;
  justify-content: center;
  font-size: 13px;
}
.bonus-tag {
  border: 1px solid var(--who);
  color: var(--who);
  border-radius: 999px;
  padding: 2px 10px;
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
}
.bonus-note {
  font-size: 13px;
  color: var(--gold-soft);
  margin: 0 0 12px;
  line-height: 1.6;
}
.bonus-cards {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.bonus-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.bonus-card-who {
  font-size: 11px;
}

/* \u516C\u958B\u3055\u308C\u3066\u3057\u307E\u3063\u305F\u99D2\u306E\u76EE\u5370 */
.revealed-badge {
  position: absolute;
  bottom: -4px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--gold);
  color: #1b1405;
  font-size: 9px;
  font-weight: 700;
  line-height: 1;
  padding: 2px 5px;
  border-radius: 999px;
  pointer-events: none;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
}

/* \u8A18\u9332\u304B\u3089\u52D5\u304D\u3092\u898B\u308B\u3068\u304D\u306E\u64CD\u4F5C */
.review-controls {
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 10px;
}
/* \u52D5\u3044\u3066\u3044\u308B\u99D2\u3088\u308A\u3001\u3057\u308B\u3057\u3092\u4E0A\u306B\u51FA\u3059 */
.trace-pin {
  z-index: 6;
}

/* =========================================================================
   \u30D7\u30EC\u30A4\u30E4\u30FC\u306E\u540D\u524D
   ========================================================================= */

/* \u672D\u306F\u821E\u53F0\u306E\u5E45\u3044\u3063\u3071\u3044(360px \u307E\u3067)\u306B\u3002\u4E2D\u8EAB\u306E\u5E45\u3067\u7E2E\u3080\u3068\u3001\u984D\u88C5\u306E\u5730(royal-theme.css)\u306E
   \u7AEF\u306B\u6587\u5B57\u304C\u89E6\u308C\u3001\u5C0F\u898B\u51FA\u3057\u304C\u4E0A\u306E\u7E01\u306B\u91CD\u306A\u3063\u3066\u3044\u305F(2026-10-01 \u672C\u4EBA\u306E\u6307\u793A\u3067\u6587\u8A00\u3092\u76F4\u3057\u305F\u3068\u304D\u306B\u898B\u76F4\u3057) */
.name-stage {
  width: 100%;
  max-width: 392px;
  padding: 20px 16px;
}
.name-card {
  width: 100%;
  max-width: 360px;
  margin: 0 auto;
  padding: 22px 20px 24px;
  border: 1px solid rgba(198, 164, 93, 0.55);
  border-radius: 12px;
  text-align: center;
}
.name-eyebrow {
  color: var(--gold);
  letter-spacing: 0.18em;
  font-size: 12px;
  margin: 0 0 6px;
}
.name-input {
  width: 100%;
  /* input \u306F\u30D5\u30A9\u30F3\u30C8\u3092\u7D99\u627F\u3057\u306A\u3044\u3002\u6307\u5B9A\u3057\u306A\u3044\u3068 WebKit \u306E\u65E2\u5B9A\u304C\u5F53\u305F\u308A\u3001
     iOS \u306E WebView \u3067\u65E5\u672C\u8A9E\u306E\u540D\u524D\u304C\u8C46\u8150(\u25A1)\u306B\u306A\u308B\u3002\u30D6\u30E9\u30A6\u30B6\u3067\u306F\u518D\u73FE\u3057\u306A\u3044 */
  font-family: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  margin: 16px 0 6px;
  padding: 14px 12px;
  font-size: 18px;
  text-align: center;
  color: var(--ink);
  background: rgba(9, 20, 38, 0.9);
  border: 2px solid var(--gold);
  border-radius: 10px;
  /* 16px \u672A\u6E80\u3060\u3068 iOS \u304C\u52DD\u624B\u306B\u62E1\u5927\u3059\u308B */
  -webkit-appearance: none;
}
.name-input:focus {
  outline: none;
  box-shadow: 0 0 12px rgba(212, 175, 55, 0.5);
}
.name-input-bad {
  border-color: #d63c46;
}
.name-note {
  font-size: 12px;
  color: var(--gold-soft);
  margin: 0 0 16px;
}
.name-note-bad {
  color: #ffb3b7;
}
/* \u672C\u6587\u306F1\u65871\u884C\u3067\u7A4D\u3080\u3002\u6587\u306E\u9014\u4E2D\u3067\u6298\u308A\u8FD4\u3059\u306A\u3089\u53E5\u306E\u5207\u308C\u76EE\u3067(\u300C\u51FA\u307E/\u3059\u300D\u3068\u5272\u3089\u306A\u3044)\u3002
   \u884C\u306E\u4E2D\u306E\u53E5\u306F .text-phrase \u306E\u584A(iPhone \u306E WebKit \u306F auto-phrase \u3092\u77E5\u3089\u306A\u3044\u30022026-10-06) */
.name-lines > span {
  display: block;
  word-break: auto-phrase;
}
/* \u540D\u524D\u306E\u58C1(\u540D\u524D\u306E\u7121\u3044\u4EBA\u304C\u30E9\u30F3\u30AD\u30F3\u30B0\u3084\u5BFE\u6226\u3078\u884C\u304F\u3068\u304D)\u3067\u3001\u3044\u307E\u805E\u304F\u308F\u3051\u3002
   \u8B66\u544A(.name-notice \u306E\u8D64)\u3067\u306F\u306A\u304F\u3001\u898B\u51FA\u3057\u306B\u6DFB\u3048\u308B\u91D1\u306E\u4E00\u884C */
.name-reason {
  margin: 4px 0 10px;
  color: var(--gold-soft);
  font-size: 13px;
  word-break: auto-phrase;
}
.name-cancel {
  margin-top: 10px;
}

/* =========================================================================
   \u8A2D\u5B9A\u753B\u9762
   ========================================================================= */

.settings-panel {
  text-align: left;
  padding-top: 14px;
  /* \u30BF\u30D6\u3092\u5207\u308A\u66FF\u3048\u3066\u3082\u9AD8\u3055\u304C\u5909\u308F\u3089\u306A\u3044\u3088\u3046\u3001\u4E00\u5B9A\u306E\u9AD8\u3055\u306B\u3059\u308B\u3002\u4E2D\u8EAB\u306F settings-body \u304C
     \u53D7\u3051\u3066\u9001\u308B(2026-09-21 \u672C\u4EBA\u306E\u6307\u793A\u300C\u9AD8\u3055\u304C\u30D0\u30E9\u30D0\u30E9\u300D)\u3002\u7AEF\u672B\u3054\u3068\u306B 88vh \u3092\u4E0A\u9650\u306B\u56FA\u5B9A */
  height: min(88vh, 640px);
  /* \u898B\u51FA\u3057\u30FB\u30BF\u30D6\u30FB\u9589\u3058\u308B\u306F\u52D5\u304B\u3055\u305A\u3001\u4E2D\u8EAB\u3060\u3051\u3092\u9001\u308B(2026-09-18) */
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
/* \u898B\u51FA\u3057\u306F\u8CBC\u308A\u4ED8\u3051\u306A\u3044(\u4E2D\u8EAB\u3060\u3051\u304C\u52D5\u304F\u306E\u3067\u8981\u3089\u306A\u3044)\u3002\u8CBC\u308A\u4ED8\u3051\u305F\u80CC\u666F\u306E\u8272\u304C
   \u4E0A\u306B\u7A7A\u304D\u306E\u5E2F\u304C\u3042\u308B\u3088\u3046\u306B\u898B\u3048\u3066\u3044\u305F(2026-09-18 \u672C\u4EBA\u306E\u6307\u6458) */
.settings-panel > .modal-head {
  position: static;
  background: none;
  /* \u984C\u3068\u9589\u3058\u308B\u3060\u3051\u306E\u884C\u306A\u306E\u3067\u3001\u4E0A\u4E0B\u306F\u8A70\u3081\u308B\u3002\u533A\u5207\u308A\u306F\u30BF\u30D6\u304C\u62C5\u3046 */
  padding: 0 0 8px;
  border-bottom: 0;
  margin-bottom: 10px;
}
.settings-panel > .modal-head .icon-btn {
  padding: 4px;
}
/* \u8A2D\u5B9A\u306E\u7A2E\u985E(\u30D7\u30EC\u30A4\u30E4\u30FC\u30FB\u97F3\u3068\u6F14\u51FA\u30FB\u5B89\u5FC3\u30FB\u30A2\u30D7\u30EA)\u30021\u753B\u9762\u305A\u3064\u51FA\u3057\u3066\u8FF7\u308F\u305B\u306A\u3044 */
/* 4\u3064\u3092\u540C\u3058\u5E45\u3067\u4E26\u3079\u308B\u3002flex \u3060\u3068\u6587\u5B57\u6570\u3067\u5E45\u304C\u3070\u3089\u3064\u304D\u3001\u4E26\u3073\u304C\u4E71\u308C\u3066\u898B\u3048\u305F
   (2026-09-18 \u672C\u4EBA\u306E\u6307\u6458\u300C\u4E0A\u306E\u90E8\u5206\u306B\u9055\u548C\u611F\u300D) */
.settings-tabs {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
  margin: 0 0 12px;
  flex: none;
}
.settings-tabs .btn {
  min-width: 0;
  min-height: 40px;
  padding: 8px 2px;
  font-size: 11.5px;
  letter-spacing: 0;
  white-space: nowrap;
}
/* \u3044\u307E\u958B\u3044\u3066\u3044\u308B\u7A2E\u985E\u3092\u4E00\u76EE\u3067\u5206\u304B\u308B\u3088\u3046\u306B\u3002\u672A\u9078\u629E\u306F\u6C88\u3081\u3001\u9078\u629E\u306F\u91D1\u8272\u3067\u5F37\u8ABF(2026-09-21 \u672C\u4EBA\u306E\u6307\u793A) */
.settings-tabs [aria-selected="false"] {
  opacity: 0.45;
  filter: saturate(0.6);
}
.settings-tabs [aria-selected="true"] {
  background: linear-gradient(#f1dfaa, #cbb274);
  color: #262016;
  border-color: #f1d184;
  font-weight: 700;
  box-shadow:
    0 0 0 2px rgba(241, 209, 132, 0.4),
    0 3px 10px rgba(0, 0, 0, 0.3);
}
.settings-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  margin-bottom: 12px;
  /* \u6700\u5F8C\u306E\u884C\u304C\u300C\u9589\u3058\u308B\u300D\u306E\u624B\u524D\u3067\u3076\u3064\u5207\u308A\u306B\u898B\u3048\u306A\u3044\u3088\u3046\u3001\u4E0B\u306B\u4F59\u767D\u3092\u7F6E\u304F */
  padding-bottom: 6px;
}
.settings-body > :first-child {
  margin-top: 0;
}
.settings-note {
  margin: 0 0 6px;
  font-size: 11px;
  line-height: 1.7;
  color: var(--text-dim);
}
.settings-error {
  color: var(--danger, #e07a7a);
}
.settings-head {
  margin: 18px 0 8px;
  font-size: 11px;
  letter-spacing: 0.16em;
  color: var(--gold);
}
.settings-head:first-of-type {
  margin-top: 4px;
}
.settings-note {
  margin: 16px 0 14px;
  font-size: 12px;
  line-height: 1.7;
  color: var(--text-dim);
}

/* \u30A2\u30AB\u30A6\u30F3\u30C8\u306E\u672D */
.account-card {
  background: rgba(9, 20, 38, 0.66);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 14px;
}
.account-head {
  display: flex;
  align-items: center;
  gap: 12px;
}
/* \u540D\u524D\u306E1\u6587\u5B57\u76EE\u3092\u5370\u306B\u3059\u308B */
.account-mark {
  width: 44px;
  height: 44px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 50%;
  border: 2px solid var(--gold);
  background: linear-gradient(160deg, #1b3559, #0d1c33);
  color: var(--gold-soft);
  font-size: 20px;
  font-weight: 700;
}
.account-id {
  flex: 1;
  min-width: 0;
}
.account-name {
  display: block;
  font-size: 17px;
  color: var(--ink);
  /* \u9577\u3044\u540D\u524D\u3067\u3082\u672D\u3092\u58CA\u3055\u306A\u3044 */
  overflow-wrap: anywhere;
}
.account-sub {
  font-size: 12px;
  color: var(--gold-soft);
}
.btn-small {
  flex: none;
  padding: 7px 10px;
  font-size: 11px;
  min-height: 0;
}

/* \u6B21\u306E\u30EC\u30D9\u30EB\u307E\u3067\u306E\u9032\u307F\u5177\u5408 */
.level-bar {
  height: 6px;
  margin: 14px 0 6px;
  border-radius: 999px;
  background: rgba(212, 175, 55, 0.16);
  overflow: hidden;
}
.level-fill {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--gold-soft), var(--gold));
}
.level-note {
  margin: 0 0 14px;
  font-size: 11px;
  color: var(--text-dim);
}

/* \u5BFE\u5C40\u6570\u30FB\u52DD\u3061\u30FB\u5F15\u304D\u5206\u3051\u30FB\u52DD\u7387 */
.stat-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  border-top: 1px solid var(--line);
  padding-top: 12px;
}
.stat {
  text-align: center;
}
.stat b {
  display: block;
  font-size: 20px;
  color: var(--gold-soft);
  font-variant-numeric: tabular-nums;
}
.stat span {
  font-size: 11px;
  color: var(--text-dim);
}

/* =========================================================================
   \u30D7\u30EC\u30A4\u30E4\u30FC\u306E\u30A2\u30A4\u30B3\u30F3
   ========================================================================= */

.player-icon {
  display: inline-grid;
  place-items: center;
  flex: none;
  border-radius: 50%;
  border: 2px solid var(--who, var(--gold));
  background: linear-gradient(160deg, #1b3559, #0d1c33);
  color: var(--who, var(--gold-soft));
  line-height: 1;
  font-weight: 700;
}
.player-icon-sm {
  width: 20px;
  height: 20px;
  font-size: 11px;
}
.player-icon-md {
  width: 34px;
  height: 34px;
  font-size: 16px;
}
.player-icon-lg {
  width: 44px;
  height: 44px;
  font-size: 20px;
}

/* \u8A2D\u5B9A\u306E\u672D\u306E\u30A2\u30A4\u30B3\u30F3\u3002\u62BC\u3059\u3068\u9078\u3073\u76F4\u305B\u308B */
.account-mark {
  position: relative;
  padding: 0;
  border: 0;
  background: none;
  cursor: pointer;
}
.account-mark-edit {
  position: absolute;
  left: 50%;
  bottom: -7px;
  transform: translateX(-50%);
  background: var(--gold);
  color: #1b1405;
  font-size: 9px;
  font-weight: 700;
  line-height: 1;
  padding: 2px 5px;
  border-radius: 999px;
  white-space: nowrap;
}

/* \u30A2\u30A4\u30B3\u30F3\u3092\u9078\u3076\u753B\u9762 */
.icon-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin: 14px 0;
}
.icon-choice {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 10px 4px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: rgba(9, 20, 38, 0.6);
  color: var(--text-dim);
  cursor: pointer;
}
/* \u9078\u629E\u4E2D\u3092\u4E00\u76EE\u3067\u5206\u304B\u308B\u3088\u3046\u306B\u3001\u91D1\u306E\u30EA\u30F3\u30B0\u3068\u2713\u30D0\u30C3\u30B8\u3092\u4ED8\u3051\u308B(2026-09-21 \u672C\u4EBA\u306E\u6307\u793A) */
.icon-choice-on {
  border-color: var(--gold);
  background: rgba(212, 175, 55, 0.24);
  color: var(--gold-soft);
  box-shadow:
    0 0 0 2px var(--gold),
    0 4px 14px rgba(0, 0, 0, 0.35);
}
.icon-choice-on::after {
  content: "\u2713";
  position: absolute;
  top: 3px;
  right: 5px;
  width: 16px;
  height: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: var(--gold);
  color: #201a10;
  font-size: 11px;
  font-weight: 700;
  line-height: 1;
}
.icon-choice-locked {
  opacity: 0.38;
  cursor: default;
}
.icon-label {
  font-size: 10px;
  text-align: center;
  line-height: 1.3;
}

/* \u6642\u8A08\u306E\u6B04\u3002\u30A2\u30A4\u30B3\u30F3\u3068\u540D\u524D\u3092\u4E26\u3079\u308B\u3002
   \u5BFE\u5C40\u4E2D\u306E\u30B9\u30BF\u30F3\u30D7\u306F\u3001\u3053\u306E\u6B04\u3092\u8D77\u70B9\u306B\u51FA\u3059\u4E88\u5B9A\u306A\u306E\u3067\u4F4D\u7F6E\u3092\u6C7A\u3081\u3066\u304A\u304F */
.clock-cell {
  position: relative;
}
.clock-who {
  display: flex;
  align-items: center;
  gap: 5px;
  min-width: 0;
}

/* \u5BFE\u5C40\u5F8C\u306E\u30EC\u30FC\u30C6\u30A3\u30F3\u30B0\u306E\u5897\u6E1B */
.rating-change {
  margin: 14px 0 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.rating-label {
  font-size: 11px;
  letter-spacing: 0.16em;
  color: var(--gold);
}
.rating-nums {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-size: 17px;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
}
.rating-nums b {
  font-size: 24px;
  color: var(--ink);
}
.rating-arrow {
  color: var(--gold-soft);
}
.rating-delta {
  font-size: 15px;
  font-weight: 700;
}
.rating-delta.up {
  color: #7fd6a0;
}
.rating-delta.down {
  color: #e2896f;
}

/* =========================================================================
   \u30E9\u30F3\u30AD\u30F3\u30B0
   ========================================================================= */

.rank-wrap {
  width: 100%;
  max-width: 460px;
  margin: 0 auto;
  padding: 8px 4px 24px;
  text-align: center;
}
.rank-me {
  display: flex;
  align-items: center;
  gap: 12px;
  text-align: left;
  margin: 14px 0 18px;
  padding: 12px 14px;
  border-radius: 10px;
  border: 1px solid var(--gold);
  background: rgba(212, 175, 55, 0.1);
}
.rank-me-id {
  flex: 1;
  min-width: 0;
}
.rank-me-id b {
  display: block;
  color: var(--ink);
  overflow-wrap: anywhere;
}
.rank-me-sub {
  font-size: 11px;
  color: var(--text-dim);
}
.rank-me-score {
  text-align: right;
  flex: none;
}
.rank-me-score b {
  display: block;
  font-size: 22px;
  color: var(--gold-soft);
  font-variant-numeric: tabular-nums;
}
.rank-me-score span {
  font-size: 11px;
  color: var(--text-dim);
}
.rank-list {
  list-style: none;
  margin: 0 0 16px;
  padding: 0;
  text-align: left;
}
.rank-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 8px;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
}
.rank-row-me {
  background: rgba(212, 175, 55, 0.12);
  border-radius: 8px;
}
.rank-place {
  width: 26px;
  flex: none;
  text-align: right;
  color: var(--gold-soft);
  font-variant-numeric: tabular-nums;
}
.rank-name {
  flex: 1;
  min-width: 0;
  color: var(--ink);
  overflow-wrap: anywhere;
  /* \u540D\u524D\u306E\u4E0B\u306B\u79F0\u53F7\u306E\u984D\u7E01\u3092\u7F6E\u304F(2026-09-23 \u672C\u4EBA\u306E\u6307\u793A) */
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
}
.rank-name-text {
  line-height: 1.3;
  font-size: 13px;
  padding-left: 4px;
}
/* \u984D\u7E01\u306F\u4E00\u5F8B\u306E\u5E45(\u6587\u5B57\u306B\u5408\u308F\u305B\u306A\u3044)\u3002\u4E0A\u306B\u79F0\u53F7\u3001\u4E0B\u306B\u540D\u524D(2026-09-23 \u672C\u4EBA\u306E\u6307\u793A) */
.rank-name .rank-title {
  /* \u81EA\u5206\u306E\u884C(\u22EF\u304C\u7121\u3044)\u3067\u3082\u4ED6\u306E\u884C\u3067\u3082\u540C\u3058\u5E45\u306B\u306A\u308B\u3088\u3046\u3001\u5272\u5408\u3067\u306F\u306A\u304F\u6C7A\u3081\u6253\u3061 */
  width: 160px;
  max-width: 100%;
  margin: 0 0 1px -4px;
}
.rank-title {
  flex: none;
  font-size: 11px;
  color: var(--text-dim);
}
.rank-score {
  flex: none;
  width: 46px;
  text-align: right;
  color: var(--gold-soft);
  font-variant-numeric: tabular-nums;
}
.rank-note {
  margin-top: 18px;
  font-size: 11px;
  line-height: 1.7;
}

/* =========================================================================
   \u8AAD\u3093\u3067\u304B\u3089\u6C7A\u3081\u308B\u56DE\u306E\u6848\u5185
   ========================================================================= */

/* \u76E4\u306E\u624B\u524D\u306B\u51FA\u3057\u3066\u3001\u8AAD\u307F\u7D42\u308F\u308B\u307E\u3067\u64CD\u4F5C\u3092\u6B62\u3081\u308B\u3002
   \u5E55\u306F\u8584\u304F\u3059\u308B\u3002\u8AAC\u660E\u304C\u6307\u3057\u3066\u3044\u308B\u3082\u306E(\u6368\u3066\u672D\u306A\u3069)\u304C\u5F8C\u308D\u3067\u898B\u3048\u306A\u304F\u306A\u308B\u3068\u3001
   \u304B\u3048\u3063\u3066\u5206\u304B\u3089\u306A\u304F\u306A\u308B\u305F\u3081 */
.tutorial-sheet-front {
  /* \u4E0A\u306E\u5E2F\u306F\u96A0\u3055\u306A\u3044(\u3069\u306E\u753B\u9762\u3067\u3082\u898B\u3048\u308B\u3088\u3046\u306B\u3059\u308B\u6C7A\u307E\u308A) */
  top: var(--top-bar-h, 0px);
  /* \u6483\u7834\u306E\u672D\u306A\u3069\u306E\u30E2\u30FC\u30C0\u30EB(z-index: 50)\u3088\u308A\u4E0B\u3002\u8986\u3046\u3068\u9589\u3058\u3089\u308C\u306A\u304F\u306A\u308B */
  z-index: 40;
  display: flex;
  /* \u76E4\u306E\u4E0A\u306B\u91CD\u306D\u308B\u3002\u4E0B\u306B\u5BC4\u305B\u308B\u3068\u76E4\u3092\u898B\u3066\u3044\u3066\u6C17\u3065\u304B\u306A\u3044 */
  align-items: center;
  justify-content: center;
  padding-bottom: calc(24px + env(safe-area-inset-bottom));
  background: rgba(4, 10, 20, 0.38);
  /* \u3053\u3053\u3067\u6307\u3092\u53D7\u3051\u6B62\u3081\u3066\u3001\u5F8C\u308D\u306E\u76E4\u3092\u89E6\u3089\u305B\u306A\u3044 */
  pointer-events: auto;
}
/* \u99D2\u3084\u30DE\u30B9\u3092\u5149\u3089\u305B\u3066\u3044\u308B\u672D\u306F\u4E0B\u5BC4\u305B\u3002\u771F\u3093\u4E2D\u306B\u7F6E\u304F\u3068\u3001\u305D\u306E\u99D2\u3092\u81EA\u5206\u3067\u96A0\u3059 */
.tutorial-sheet-front.tutorial-sheet-low {
  align-items: flex-end;
}
.tutorial-sheet-front .tutorial-sheet-inner {
  /* \u4E00\u89A7\u304C\u9577\u3044\u3068\u304D\u306F\u672D\u306E\u4E2D\u3067\u30B9\u30AF\u30ED\u30FC\u30EB\u3002\u753B\u9762\u304B\u3089\u306F\u307F\u51FA\u3055\u305B\u306A\u3044 */
  max-height: calc(100vh - 32px - env(safe-area-inset-bottom));
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  border-radius: 14px;
  border-bottom-color: var(--gold);
  border-color: var(--gold);
  padding: 18px 20px 16px;
  box-shadow: 0 10px 34px rgba(0, 0, 0, 0.7);
  animation: sheet-pop 220ms ease-out;
}
@keyframes sheet-pop {
  from {
    transform: translateY(10px) scale(0.97);
    opacity: 0;
  }
}
/* \u524D\u9762\u306E\u3068\u304D\u306F\u6587\u5B57\u3092\u5927\u304D\u304F\u3057\u3066\u3001\u5148\u306B\u76EE\u304C\u884C\u304F\u3088\u3046\u306B\u3059\u308B */
.tutorial-sheet-front .tutorial-line {
  font-size: 15px;
  line-height: 1.85;
}
.tutorial-sheet-front .tutorial-next {
  width: 100%;
  margin-top: 12px;
}
/* \u76E4\u3092\u96A0\u3055\u306A\u3044\u7F6E\u304D\u65B9(src/ui/tutorial-dock.js \u304C\u5834\u6240\u3092\u6E2C\u308B)\u3002
   \u76E4\u306E\u53F3\u304B\u4E0B\u306B\u672D\u3092\u56FA\u5B9A\u3057\u3001\u80CC\u666F\u306F\u6697\u304F\u3057\u306A\u3044\u3002\u76E4\u306E\u99D2\u306E\u52D5\u304D\u3092\u898B\u306A\u304C\u3089\u8AAD\u3081\u308B\u3002
   \u6307\u306F\u5F15\u304D\u7D9A\u304D\u3053\u3053\u3067\u53D7\u3051\u6B62\u3081\u308B(\u8AAD\u3093\u3067\u3044\u308B\u9593\u306F\u76E4\u3092\u89E6\u3089\u305B\u306A\u3044) */
.tutorial-sheet-front.tutorial-sheet-dock {
  display: block;
  background: transparent;
  padding: 0;
}
.tutorial-sheet-front.tutorial-sheet-dock .tutorial-sheet-inner {
  position: fixed;
  margin: 0;
  max-width: none;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  box-sizing: border-box;
  /* \u76E4\u306E\u4E2D\u8EAB\u3088\u308A\u5C11\u3057\u660E\u308B\u304F\u3001\u5883\u304C\u306F\u3063\u304D\u308A\u5206\u304B\u308B\u3088\u3046\u306B */
  background: linear-gradient(180deg, #1a3157 0%, #0f1f3a 100%);
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.75);
}
.tutorial-sheet-front.tutorial-sheet-dock-below .tutorial-sheet-inner {
  border-radius: 14px 14px 0 0;
  padding: 12px 14px calc(28px + env(safe-area-inset-bottom));
}
/* \u76E4\u306E\u4E0B\u306F\u9AD8\u3055\u304C\u9650\u3089\u308C\u308B\u3002\u6587\u3068\u4E00\u89A7\u3092\u5C11\u3057\u8A70\u3081\u3001\u4E0B\u7AEF\u306B\u300C\u7D9A\u304D\u304C\u3042\u308B\u300D\u5F71\u3092\u7F6E\u304F */
.tutorial-sheet-front.tutorial-sheet-dock-below .tutorial-line {
  font-size: 14px;
  line-height: 1.6;
}
.tutorial-sheet-dock-below .move-hint-row {
  padding: 4px 8px;
  gap: 6px;
}
.tutorial-sheet-dock-below .move-hint-verdict {
  font-size: 13px;
  margin-top: 6px;
}
.tutorial-sheet-front.tutorial-sheet-dock-below .tutorial-next {
  margin-top: 8px;
}
.tutorial-sheet-front.tutorial-sheet-dock-below .tutorial-sheet-inner::after {
  content: "";
  display: block;
  position: sticky;
  bottom: calc(-28px - env(safe-area-inset-bottom));
  height: 26px;
  margin: -26px -14px 0;
  background: linear-gradient(rgba(15, 31, 58, 0), #0f1f3a);
  pointer-events: none;
}

/* ===== \u901A\u5831\u30FB\u30D6\u30ED\u30C3\u30AF\u30FB\u8A18\u9332\u306E\u524A\u9664 =====
   App Store \u306E\u30AC\u30A4\u30C9\u30E9\u30A4\u30F3 1.2(\u5229\u7528\u8005\u304C\u4F5C\u3063\u305F\u6587\u7AE0)\u3068 5.1.1(v)(\u8A18\u9332\u306E\u524A\u9664)
   \u306E\u305F\u3081\u306B\u8DB3\u3057\u305F\u753B\u9762\u3002src/ui/report.jsx \u3068 overlays.jsx \u304B\u3089\u4F7F\u3046 */

/* \u30E9\u30F3\u30AD\u30F3\u30B0\u306E\u884C\u304B\u3089\u300C\u22EF\u300D\u3067\u958B\u304F\u3002\u6307\u304C\u5C4A\u304F\u3088\u3046 44px \u56DB\u65B9\u3092\u78BA\u4FDD\u3059\u308B */
.rank-more {
  flex: none;
  width: 44px;
  height: 44px;
  margin: -8px -6px -8px 0;
  padding: 0;
  border: none;
  background: none;
  color: var(--text-dim);
  font-size: 20px;
  line-height: 1;
  cursor: pointer;
  border-radius: 8px;
}
.rank-more:hover {
  color: var(--gold);
  background: rgba(212, 175, 55, 0.1);
}
.rank-more:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: -2px;
}

.report-panel {
  max-width: 420px;
}
.report-body {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
/* \u9078\u629E\u80A2\u306F\u300C\u898B\u51FA\u3057 + \u88DC\u8DB3\u300D\u306E2\u6BB5\u3002\u62BC\u305B\u308B\u9AD8\u3055\u3092\u5341\u5206\u306B\u53D6\u308B */
.report-choice {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  min-height: 56px;
  padding: 12px 14px;
  text-align: left;
  white-space: normal;
}
.report-choice b {
  color: var(--ink);
  font-size: 15px;
}
.report-choice span {
  color: var(--text-dim);
  font-size: 12px;
  line-height: 1.5;
}
.report-back {
  align-self: center;
  min-height: 44px;
}
.report-done {
  margin: 0;
  color: var(--gold-soft);
  font-size: 16px;
}

/* \u8A2D\u5B9A\u306B\u8DB3\u3057\u305F\u884C */
.settings-link {
  color: var(--gold);
  text-decoration: underline;
  /* \u6307\u304C\u5C4A\u304F\u9AD8\u3055\u306B\u3059\u308B */
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  overflow-wrap: anywhere;
}
.settings-todo {
  color: #d63c46;
}
.settings-actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 14px;
}
/* \u5143\u306B\u623B\u305B\u306A\u3044\u64CD\u4F5C\u3002\u62BC\u3057\u9593\u9055\u3044\u3092\u6E1B\u3089\u3059\u305F\u3081\u8272\u3067\u5206\u3051\u308B */
.btn-danger {
  color: #e0707a;
  border-color: rgba(224, 112, 122, 0.5);
}
.btn-danger:hover {
  color: #ff8a93;
  border-color: rgba(224, 112, 122, 0.8);
}

/* ===== iPad \u3068\u3001\u6A2A\u306B\u5E83\u3044\u753B\u9762 =====
   \u3053\u3053\u307E\u3067\u306E\u6307\u5B9A\u306F\u5E45\u3057\u304B\u898B\u3066\u304A\u3089\u305A(.board-frame \u306F min(94vw,500px))\u3001
   iPad \u3067\u306F\u76E4\u304C\u4F38\u3073\u305A\u306B\u5DE6\u53F3\u304C\u4F59\u308A\u3001\u6A2A\u5411\u304D\u3067\u306F\u7E26\u306B\u306F\u307F\u51FA\u3057\u3066
   \u300C\u964D\u53C2\u3059\u308B\u300D\u304C\u753B\u9762\u5916\u3078\u843D\u3061\u3066\u3044\u305F\u3002\u5E45\u3068\u9AD8\u3055\u306E\u4E21\u65B9\u304B\u3089\u6C7A\u3081\u76F4\u3059\u3002

   \u533A\u5207\u308A\u306F 768px(iPad \u306E\u77ED\u8FBA)\u3068\u3001\u6A2A\u5411\u304D\u306E 900px\u3002
   iPhone \u306E\u6A2A\u5411\u304D(\u6700\u5927 956px)\u306B\u3082\u639B\u304B\u308B\u304C\u3001iPhone \u306F\u7E26\u56FA\u5B9A\u306A\u306E\u3067\u5C4A\u304B\u306A\u3044\u3002 */

/* --- \u30B9\u30DE\u30DB\u3067\u306F\u76E4\u3092\u753B\u9762\u306E\u4F59\u767D\u307E\u3067\u5E83\u3052\u308B(9\xD79 \u306E1\u30DE\u30B9\u3092\u7A3C\u3050\u30022026-09-11 \u672C\u4EBA\u306E\u6307\u6458) --- */
@media (max-width: 767px) {
  .play-wrap > .board-outer {
    margin-left: -12px;
    margin-right: -12px;
  }
  .board-frame {
    width: min(98vw, 500px);
  }
  .rank-labels {
    padding: 6px 2px;
  }
}

/* --- \u76E4\u306E\u5927\u304D\u3055\u3002\u5E45\u3068\u9AD8\u3055\u306E\u3046\u3061\u5C0F\u3055\u3044\u65B9\u3067\u6C7A\u3081\u308B --- */
@media (min-width: 768px) {
  .board-frame {
    /* 68vh \u306F\u3001\u4E0A\u306E\u5E2F\u30FB\u624B\u756A\u30FB\u624B\u672D\u30FB\u64CD\u4F5C\u5217\u3092\u6B8B\u3057\u305F\u9AD8\u3055\u306E\u76EE\u5B89 */
    width: min(88vw, 68vh, 660px);
  }
  .play-wrap {
    max-width: 720px;
  }
  .stage {
    padding: 28px 24px;
  }
  /* \u30C1\u30E5\u30FC\u30C8\u30EA\u30A2\u30EB\u306E\u5E2F\u3002\u753B\u9762\u306E\u4E0B\u7AEF\u306B\u8CBC\u308B\u3068\u76E4\u304B\u3089\u9060\u304F\u96E2\u308C\u308B\u306E\u3067\u3001
     \u771F\u3093\u4E2D\u306B\u3042\u308B\u76E4\u306E\u5C11\u3057\u4E0B\u3067\u6B62\u3081\u308B */
  .tutorial-sheet {
    bottom: max(12px, calc(50vh - 380px));
  }
  .tutorial-sheet-inner {
    max-width: 560px;
  }
}

/* --- \u6A2A\u5411\u304D\u306E2\u30AB\u30E9\u30E0\u3002\u76E4\u3092\u5DE6\u3001\u305D\u308C\u4EE5\u5916\u3092\u53F3\u3078 --- */
@media (orientation: landscape) and (min-width: 900px) {
  .play-wrap {
    display: grid;
    /* \u76E4\u306E\u5E45\u306F\u4E2D\u8EAB\u306B\u4EFB\u305B\u3001\u53F3\u306E\u5217\u306F\u8AAD\u3081\u308B\u5E45\u3067\u56FA\u5B9A\u3059\u308B */
    grid-template-columns: auto minmax(300px, 380px);
    align-items: start;
    gap: 24px;
    max-width: none;
    width: auto;
  }
  /* \u65E2\u5B9A\u306F\u53F3\u306E\u5217\u3002DOM \u306E\u4E26\u3073\u3092\u5909\u3048\u305A\u306B\u632F\u308A\u5206\u3051\u308B */
  .play-wrap > * {
    grid-column: 2;
    min-width: 0;
  }
  /* \u76E4\u3060\u3051\u5DE6\u306E\u5217\u306B\u7F6E\u304D\u3001\u7E26\u306B\u8CAB\u3044\u3066\u4E2D\u592E\u306B\u636E\u3048\u308B */
  .play-wrap > .board-outer {
    grid-column: 1;
    grid-row: 1 / -1;
    align-self: center;
  }
  .board-frame {
    /* \u6A2A\u5411\u304D\u306F\u9AD8\u3055\u304C\u8DB3\u308A\u306A\u3044\u3002\u9AD8\u3055\u3092\u4E3B\u306B\u3057\u3066\u6C7A\u3081\u308B */
    width: min(52vw, 76vh, 620px);
  }
  .stage {
    /* 2\u30AB\u30E9\u30E0\u306F\u4E0A\u304B\u3089\u7A4D\u3080\u3002\u4E2D\u592E\u5BC4\u305B\u3060\u3068\u53F3\u306E\u5217\u304C\u4E0A\u4E0B\u306B\u6CF3\u3050 */
    justify-content: flex-start;
    padding-top: 20px;
  }
  /* \u6A2A\u5411\u304D\u3067\u306F\u5E2F\u3092\u76E4\u306E\u5916(\u53F3\u4E0B)\u306B\u51FA\u3055\u305A\u3001\u753B\u9762\u4E0B\u7AEF\u306E\u307E\u307E\u3067\u3088\u3044\u3002
     \u7E26\u306E\u4F59\u767D\u304C\u5C11\u306A\u3044\u306E\u3067\u96E2\u308C\u306A\u3044 */
  .tutorial-sheet {
    bottom: 0;
  }
}

/* ===== \u30D5\u30A9\u30FC\u30E0\u306E\u90E8\u54C1\u306B\u66F8\u4F53\u3092\u7D99\u304C\u305B\u308B =====
   button\u30FBinput\u30FBselect\u30FBtextarea \u306F font-family \u3092\u7D99\u627F\u3057\u306A\u3044\u3002
   \u6307\u5B9A\u304C\u7121\u3044\u3068 WebKit \u306E\u65E2\u5B9A(Arial \u7CFB)\u304C\u5F53\u305F\u308A\u3001iOS \u306E WebView \u3067\u306F
   **\u65E5\u672C\u8A9E\u304C\u8C46\u8150(\u25A1)\u306B\u306A\u308B**\u3002\u30C7\u30B9\u30AF\u30C8\u30C3\u30D7\u306E\u30D6\u30E9\u30A6\u30B6\u306B\u306F\u65E5\u672C\u8A9E\u66F8\u4F53\u304C
   \u3042\u308B\u305F\u3081\u518D\u73FE\u305B\u305A\u3001\u5B9F\u6A5F\u3067\u521D\u3081\u3066\u51FA\u308B\u3002

   \u5B9F\u969B\u306B .account-mark(\u30A2\u30A4\u30B3\u30F3)\u3068 .title-tag(\u79F0\u53F7)\u304C\u3053\u308C\u3067\u58CA\u308C\u3066\u3044\u3066\u3001
   \u300C\u5909\u3048\u308B\u300D\u304C \u25A1\u25A1\u25A1 \u306B\u3001\u982D\u6587\u5B57\u304C \u25A1 \u306B\u306A\u3063\u3066\u3044\u305F\u3002
   .btn \u306B\u306F\u6307\u5B9A\u304C\u3042\u308B\u306E\u3067\u7121\u4E8B\u3060\u3063\u305F\u304C\u3001.btn \u3092\u6301\u305F\u306A\u3044\u30DC\u30BF\u30F3\u306F\u5168\u6EC5\u3057\u3066\u3044\u305F\u3002

   \u7D99\u627F\u306B\u3057\u3066\u304A\u3051\u3070\u3001.tottery-root \u306E
   "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif
   \u304C\u305D\u306E\u307E\u307E\u5C4A\u304F\u3002.btn \u306E\u6307\u5B9A\u306B\u306F Hiragino \u304C\u7121\u3044\u306E\u3067\u3001
   \u3053\u3053\u3067\u4E0A\u66F8\u304D\u3059\u308B\u3053\u3068\u3067\u570F\u5916(Google Fonts \u304C\u6765\u306A\u3044)\u3067\u3082\u65E5\u672C\u8A9E\u304C\u51FA\u308B\u3002 */
.tottery-root button,
.tottery-root input,
.tottery-root select,
.tottery-root textarea {
  font-family: inherit;
}

/* \u79F0\u53F7\u3068\u300C\u30EC\u30D9\u30EB10(\u6700\u9AD8)\u300D\u304C\u540C\u3058\u884C\u306B\u6D41\u308C\u3066\u6298\u308A\u8FD4\u3057\u3001
   \u79F0\u53F7\u306E\u672D\u306B\u6587\u8A00\u304C\u91CD\u306A\u3063\u3066\u3044\u305F\u3002\u7E26\u306B\u7A4D\u3093\u3067\u91CD\u306A\u308A\u3092\u89E3\u304F */
.account-id {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 4px;
  min-width: 0;
}

/* \u540D\u524D\u3092\u6C7A\u3081\u76F4\u3059\u753B\u9762\u306B\u51FA\u3059\u3001\u904B\u55B6\u304B\u3089\u306E\u4E00\u8A00 */
.name-notice {
  margin: 0 0 12px;
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px solid rgba(176, 32, 47, 0.6);
  background: rgba(176, 32, 47, 0.15);
  color: #ffd2d6;
  font-size: 13px;
}

/* --- \u30DF\u30C3\u30B7\u30E7\u30F3 --- */
.tottery-root:has(.missions-screen) {
  height: 100vh;
  height: 100dvh;
  min-height: 0;
  display: flex;
  flex-direction: column;
}
.tottery-root:has(.missions-screen) > .top-bar,
.tottery-root:has(.missions-screen) > .test-badge {
  flex-shrink: 0;
}
.tottery-root:has(.missions-screen) > .build-tag {
  display: none;
}
/* \u30BF\u30D6\u753B\u9762(quests.jsx)\u306E\u4E2D\u306B\u3044\u308B\u3068\u304D\u3082\u540C\u3058(2026-09-22) */
.stage:has(> .missions-screen),
.stage:has(> .quests-screen.is-missions) {
  flex: 1;
  min-height: 0;
  padding: 12px max(12px, env(safe-area-inset-right))
    max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
  overflow: hidden;
}
.missions-screen {
  height: 100%;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border: 1px solid var(--btn-edge);
  border-radius: 14px;
  background: linear-gradient(180deg, #162940, #0b172a);
}
.missions-heading {
  padding: 12px 12px 8px;
  flex-shrink: 0;
}
.missions-heading h2 {
  margin: 0 0 6px;
  font-size: 24px;
}
.missions-heading .level-badge {
  margin: 0;
  font-size: 12px;
}
.missions-heading .level-badge small {
  display: none;
}
.missions-tabs {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  flex-shrink: 0;
  margin: 0 10px 10px;
}
.missions-tabs button {
  min-width: 0;
  min-height: 48px;
  padding: 8px 2px;
  border: 1px solid var(--btn-edge);
  background: #0d1c30;
  color: var(--text-dim);
  font-size: 12px;
  font-weight: 700;
  line-height: 1.5;
  font-family: inherit;
  cursor: pointer;
  position: relative;
}
.missions-tabs button:first-child {
  border-radius: 8px 0 0 8px;
}
.missions-tabs button:last-child {
  border-radius: 0 8px 8px 0;
}
.missions-tabs button + button {
  border-left: 0;
}
.missions-tabs button[aria-selected="true"] {
  background: linear-gradient(180deg, #f1da98, #c2a25f);
  color: #211b13;
}
.missions-tabs button:focus-visible {
  outline: 2px solid var(--gold-soft);
  outline-offset: -4px;
}
.missions-tab-count {
  position: absolute;
  right: 2px;
  top: -6px;
  background: #a72f29;
  color: #fff;
  border-radius: 12px;
  min-width: 18px;
  padding: 0 4px;
  font: 700 10px/18px sans-serif;
}
.missions-scroll {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 0 12px;
  scrollbar-width: thin;
}
.missions-scroll .mission-list {
  margin: 0 0 12px;
}
.missions-scroll .mission {
  text-align: left;
}
.missions-empty {
  min-height: 100%;
  display: grid;
  place-items: center;
  padding: 24px;
  color: var(--text-dim);
  font-size: 14px;
}
.missions-footer {
  flex-shrink: 0;
  padding: 8px 12px 12px;
  border-top: 1px solid var(--line);
  background: #102038;
}
.missions-footer .mission-message:empty {
  display: none;
}
.missions-footer .mission-message {
  max-height: 3.2em;
  overflow-y: auto;
  margin-bottom: 8px;
}
.missions-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.missions-actions .btn {
  min-width: 0;
  min-height: 48px;
  padding: 10px 6px;
  font-size: 12px;
  touch-action: manipulation;
}
@media (max-height: 500px) {
  .missions-heading {
    padding: 4px 12px;
  }
  .missions-heading h2 {
    font-size: 18px;
    margin: 0;
  }
  .missions-heading .level-badge {
    display: none;
  }
  .missions-tabs {
    margin-bottom: 6px;
  }
}
.mission-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin: 14px 0;
}
.missions-reset {
  margin: 6px 0 0;
  color: var(--text-dim);
  font: 11px/1.5 sans-serif;
}
.mission-segments {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 5px;
  margin: 10px 0;
}
.mission-segments span {
  height: 12px;
  border: 1px solid var(--line);
  border-radius: 3px;
  background: #071323;
}
.mission-segments .is-filled {
  background: linear-gradient(180deg, var(--gold-soft), var(--gold-deep));
  border-color: var(--gold);
}
.mission {
  border: 1px solid var(--line);
  border-radius: 10px;
  background: rgba(9, 20, 38, 0.6);
  padding: 12px 14px;
}
/* \u53D7\u3051\u53D6\u308C\u308B\u3082\u306E\u306F\u91D1\u306E\u7E01\u3067\u76EE\u3092\u5F15\u304F\u3002\u53D7\u3051\u53D6\u308A\u6E08\u307F\u306F\u6C88\u3081\u308B */
.mission.is-ready {
  border-color: var(--gold);
  background: rgba(212, 175, 55, 0.1);
}
.mission.is-claimed {
  opacity: 0.55;
}
.mission-head {
  display: flex;
  align-items: baseline;
  gap: 8px;
  flex-wrap: wrap;
}
.mission-kind {
  font-size: 10px;
  letter-spacing: 0.1em;
  color: var(--text-dim);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 2px 8px;
}
.mission-head b {
  font-family: "Shippori Mincho", serif;
  font-size: 14px;
}
.mission-bar {
  height: 6px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.08);
  overflow: hidden;
  margin: 9px 0 7px;
}
.mission-bar span {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--gold-deep), var(--gold));
}
.mission-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}
.mission-foot small {
  font-size: 11px;
  color: var(--text-dim);
}
.mission-done {
  font-size: 11px;
  color: var(--gold-soft);
}
.mission-message {
  min-height: 1.6em;
  margin: 0;
  font-size: 12px;
  color: var(--gold-soft);
  text-align: center;
}
/* \u53D7\u3051\u53D6\u308C\u308B\u6570\u306E\u5370 */
.menu-badge {
  position: absolute;
  top: 10px;
  right: 12px;
  min-width: 20px;
  height: 20px;
  border-radius: 999px;
  background: var(--card-red);
  color: #fff;
  font: 700 11px/20px sans-serif;
  text-align: center;
}
.btn-choice {
  position: relative;
}

/* --- \u30D0\u30C8\u30EB\u30D1\u30B9 --- */
.pass-reward {
  margin: 14px 0;
  color: var(--gold-soft);
  text-align: center;
  font-size: 12px;
  line-height: 1.8;
}
.pass-reward svg {
  vertical-align: middle;
}
.pass-reward strong {
  display: block;
  font-size: 15px;
}
.pass-counts {
  display: flex;
  justify-content: center;
  gap: 18px;
  margin: 10px 0;
  font-size: 12px;
  color: var(--text-dim);
}
.pass-counts b {
  color: var(--gold-soft);
  font-size: 15px;
}
/* \u30B7\u30EA\u30FC\u30BA\u3092\u9078\u3076\u672D\u3068\u30B7\u30FC\u30C8(2026-10-15 \u672C\u4EBA\u306E\u6C7A\u3081\u300C1\u300D)\u3002\u3075\u3060\u3093\u306F\u672D1\u679A\u3001\u62BC\u3059\u3068\u4E0B\u304B\u3089\u7E26\u4E00\u89A7\u306E\u30B7\u30FC\u30C8\u3002
   \u30B7\u30EA\u30FC\u30BA\u304C\u4F55\u5341\u500B\u306B\u5897\u3048\u3066\u3082\u5834\u6240\u3092\u53D6\u3089\u306A\u3044\u3002\u6240\u6301\u30FB\u932C\u6210\u30FB\u52A0\u5DE5\u30FB\u30D0\u30C8\u30EB\u30D1\u30B9\u3067\u540C\u3058\u90E8\u54C1(src/ui/series-select.jsx) */
.series-select {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  width: 100%;
  margin: 12px 0 14px;
  padding: 10px 14px;
  border: 1px solid #bca57480;
  border-radius: 6px;
  background: linear-gradient(180deg, #16263c, #0b1627);
  color: #f5e5be;
  font-family: "Shippori Mincho", serif;
  text-align: left;
  cursor: pointer;
}
.series-select:disabled {
  opacity: 0.5;
  cursor: default;
}
.series-select:focus-visible,
.series-select-row:focus-visible {
  outline: 2px solid #f1da98;
  outline-offset: 2px;
}
.series-select-current,
.series-select-text {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}
.series-select-name {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.1em;
}
.series-select-note {
  font-size: 11px;
  font-weight: 400;
  letter-spacing: 0.06em;
  color: #acb9c7;
}
.series-select-open {
  flex: 0 0 auto;
  font-size: 12px;
  color: #e3c57a;
  white-space: nowrap;
}
.skin-overlay.series-select-overlay {
  align-items: flex-end;
  padding: 0;
}
.skin-overlay.series-select-overlay .skin-dialog {
  width: min(680px, 100%);
  max-height: min(72dvh, 640px);
  border-radius: 14px 14px 0 0;
  padding: 18px 16px calc(16px + env(safe-area-inset-bottom));
}
.skin-overlay.series-select-overlay .skin-dialog h2 {
  font-size: 18px;
}
.series-select-list {
  display: grid;
  gap: 6px;
}
.series-select-row {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 8px 10px;
  border: 1px solid #bca57455;
  border-radius: 6px;
  background: #0f1b2c;
  color: #f5e5be;
  font-family: inherit;
  text-align: left;
  cursor: pointer;
}
.series-select-row.is-active {
  border-color: #f1da98;
  background: #2b2a1d;
  box-shadow: 0 0 12px #d5b57644;
}
.series-select-row.is-active .series-select-note {
  color: #d9c392;
}
.series-select-art {
  width: 38px;
  height: 38px;
  flex: 0 0 auto;
  border-radius: 4px;
  object-fit: cover;
  object-position: center top;
  background: #1d2d44;
}
.series-select-art.is-blank {
  display: block;
}
.series-select-mark {
  margin-left: auto;
  color: #e3c57a;
  font-size: 11px;
  text-shadow: 0 0 6px #d5b576;
}
.pass-seasons {
  margin-top: 0;
}
.pass-active-note {
  margin: 0 0 8px;
  text-align: center;
  font-size: 12px;
  color: var(--gold-soft);
}
.pass-active-note svg {
  vertical-align: middle;
}
.pass-active-switch {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  margin: 0 0 10px;
}
.pass-active-switch .hint {
  margin: 0;
}
.quests-screen.is-pass > .setup-wrap > .pass-seasons:first-child {
  margin-top: 0;
}
.shop-pass-season + .shop-pass-season {
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid var(--btn-edge);
}
.shop-pass-season h4 {
  margin: 0 0 6px;
  font-size: 14px;
  color: var(--gold-soft);
}
/* \u30D5\u30A9\u30A4\u30EB\u306E\u6B04\u306F\u30B7\u30EA\u30FC\u30BA\u3054\u3068\u306E\u91E6(2026-10-15)\u3002\u62BC\u3059\u3068\u305D\u306E\u4E0B\u306B\u5546\u54C1\u304C\u4E26\u3076\u300272\u6642\u9593\u306E\u5916\u3067\u3082\u91E6\u306F\u7F6E\u304F */
.shop-foil-series {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.shop-foil-series-btn {
  padding: 12px 14px;
  gap: 12px;
}
.shop-foil-series-btn .choice-label {
  font-size: 15px;
}
.shop-foil-series-btn.is-closed {
  opacity: 0.8;
}
.shop-foil-series-body {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 0 2px 4px;
}
.foil-offer.is-locked {
  cursor: default;
}
.foil-offer-series {
  margin: 0 0 6px;
  color: var(--gold-soft);
}
.pass-grid {
  display: grid;
  grid-template-columns: repeat(var(--n, 5), minmax(0, 1fr));
  gap: 4px;
  max-width: 420px;
  margin: 0 auto 14px;
}
.pass-cell {
  position: relative;
  aspect-ratio: 3 / 4;
  border: 0;
  padding: 0;
  background: none;
  perspective: 700px;
  cursor: default;
  -webkit-tap-highlight-color: transparent;
}
/* \u8868\u3068\u88CF\u3092\u8CBC\u308A\u5408\u308F\u305B\u305F\u677F\u3002\u62BC\u3059\u3068\u3053\u308C\u304C\u56DE\u308B */
.pass-inner {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
  transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.25, 1);
}
.pass-cell.is-flipped .pass-inner {
  transform: rotateY(180deg);
}
.pass-front,
.pass-back {
  position: absolute;
  inset: 0;
  border-radius: 5px;
  overflow: hidden;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border: 1px solid var(--line);
  background: rgba(9, 20, 38, 0.7);
}
.pass-front {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  padding: 3px;
  color: var(--text-dim);
  font-size: 8.5px;
  line-height: 1.25;
  text-align: center;
}
/* \u88CF\u306F\u7D75\u67C4\u306E\u4E00\u7247\u3002\u56DE\u308A\u304D\u3063\u305F\u5411\u304D\u3067\u8CBC\u308B */
.pass-back {
  transform: rotateY(180deg);
  background-repeat: no-repeat;
  border-color: var(--gold);
}
/* \u307E\u3060\u958B\u3044\u3066\u3044\u306A\u3044\u30DE\u30B9\u306F\u6C88\u3081\u308B */
.pass-cell.is-locked {
  opacity: 0.35;
}
/* \u3044\u307E\u6311\u6226\u3067\u304D\u308B\u30DE\u30B9 */
.pass-cell.is-open .pass-front {
  border-color: var(--gold-deep);
  color: var(--text);
}
/* \u30AF\u30EA\u30A2\u6E08\u307F\u3002\u62BC\u3059\u3068\u3081\u304F\u308C\u308B\u3002\u3082\u3046\u4E00\u5EA6\u62BC\u3059\u3068\u6761\u4EF6\u306B\u623B\u308B */
.pass-cell.is-cleared {
  cursor: pointer;
}
.pass-cell.is-cleared .pass-front {
  border-color: var(--gold);
  background: rgba(212, 175, 55, 0.14);
  color: var(--gold-soft);
}
.pass-name {
  overflow-wrap: anywhere;
}
.pass-num {
  font-variant-numeric: tabular-nums;
  font-weight: 700;
}
.pass-turn {
  font-size: 8px;
  border: 1px solid var(--gold);
  border-radius: 3px;
  padding: 1px 4px;
}
/* \u9032\u307F\u5177\u5408\u3002\u30DE\u30B9\u306E\u4E0B\u8FBA\u306B\u7D30\u304F */
.pass-bar {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 3px;
  background: rgba(255, 255, 255, 0.08);
}
.pass-bar::after {
  content: "";
  display: block;
  height: 100%;
  width: var(--p, 0%);
  background: var(--gold);
}
/* \u4E00\u62EC\u3067\u3081\u304F\u308B\u91E6 */
.pass-actions {
  display: flex;
  justify-content: center;
  margin: 0 0 10px;
}
.pass-complete-art {
  max-width: 420px;
  margin: 0 auto 14px;
  border: 2px solid var(--gold-soft);
  border-radius: 6px;
  overflow: hidden;
  box-shadow: 0 0 22px rgba(230, 198, 129, 0.18);
}
.pass-complete-art img {
  display: block;
  width: 100%;
  aspect-ratio: 3 / 4;
  object-fit: cover;
}
.pass-earned {
  text-align: center;
  color: var(--gold-soft);
  font-size: 17px;
  letter-spacing: 0.08em;
  text-shadow: 0 0 18px rgba(238, 211, 138, 0.3);
}
.pass-earned svg {
  vertical-align: middle;
}
.pass-earned strong {
  display: block;
  margin-top: 8px;
  font-size: 14px;
}
.pass-cell:disabled {
  cursor: default;
}
@media (max-width: 400px) {
  .pass-cell {
    font-size: 8px;
  }
  .pass-turn {
    display: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  .pass-inner {
    transition: none;
  }
}

/* --- \u904B\u55B6\u304B\u3089\u306E\u304A\u77E5\u3089\u305B ---
 * \u8986\u3044\u306E\u898B\u305F\u76EE\u306F\u7BA1\u7406\u753B\u9762\u5074\u306E CSS \u306B\u3057\u304B\u7121\u304F\u3001\u30D7\u30EC\u30A4\u30E4\u30FC\u306E\u753B\u9762\u3067\u306F
 * \u7D20\u306E\u6587\u5B57\u304C\u4E00\u89A7\u306E\u4E0B\u306B\u4F38\u3073\u3066\u3044\u305F\u3002\u3053\u3053\u306B\u72EC\u7ACB\u3057\u3066\u7F6E\u304D\u76F4\u3059\u3002 */
.notice-wrap {
  text-align: left;
}
.notice-wrap h2,
.notice-wrap .mission-message {
  text-align: center;
}
/* \u307E\u3068\u3081\u3066\u53D7\u3051\u53D6\u308B\u3002\u6587\u8A00\u304C\u6298\u308A\u8FD4\u3059\u3068\u8AAD\u307F\u306B\u304F\u3044\u306E\u30671\u884C\u306B\u53CE\u3081\u308B */
.notice-all {
  font-size: 15px;
  padding: 13px 16px;
}

.notice-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin: 12px 0;
}

/* \u304A\u77E5\u3089\u305B1\u4EF6\u3002\u4EF6\u540D\u30FB\u65E5\u4ED8\u30FB\u672C\u6587\u306E\u982D\u30FB\u6DFB\u4ED8\u3092\u3053\u306E\u9806\u306B\u7A4D\u3080\u3002
 * \u4EF6\u540D\u3060\u3051\u3060\u3068\u4E2D\u8EAB\u304C\u60F3\u50CF\u3067\u304D\u305A\u3001\u3044\u3061\u3044\u3061\u958B\u304F\u3053\u3068\u306B\u306A\u308B */
.notice {
  display: flex;
  flex-direction: column;
  gap: 5px;
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-left: 3px solid transparent;
  border-radius: 10px;
  background: rgba(4, 10, 20, 0.45);
  color: var(--text);
  text-align: left;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.notice:active {
  transform: translateY(1px);
}
/* \u672A\u8AAD\u306F\u5DE6\u306E\u7E01\u3068\u70B9\u3067\u793A\u3059\u3002\u5168\u4F53\u3092\u91D1\u3067\u5857\u308B\u3068\u3001\u4E26\u3093\u3060\u3068\u304D\u76EE\u304C\u4F11\u307E\u3089\u306A\u3044 */
.notice.is-new {
  border-left-color: var(--gold);
}
.notice.is-read {
  opacity: 0.55;
}

.notice-head {
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.notice-mark {
  flex: none;
  width: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--gold-soft);
  align-self: center;
}
.notice-mark i {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--gold);
}
.notice-head b {
  flex: 1;
  min-width: 0;
  font-family: "Shippori Mincho", serif;
  font-size: 14.5px;
  line-height: 1.45;
  overflow-wrap: anywhere;
}
.notice-when {
  flex: none;
  font-size: 11px;
  color: var(--text-dim);
  white-space: nowrap;
}
/* \u672C\u6587\u306E\u982D\u30021\u884C\u3060\u3051\u898B\u305B\u3066\u3001\u7D9A\u304D\u306F\u958B\u3044\u3066\u3082\u3089\u3046 */
.notice-peek {
  margin-left: 20px;
  font-size: 11.5px;
  line-height: 1.5;
  color: var(--text-dim);
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 1;
  -webkit-box-orient: vertical;
  overflow-wrap: anywhere;
}
/* \u6DFB\u4ED8\u306F\u5C0F\u3055\u306A\u672D\u306B\u3057\u3066\u3001\u958B\u304B\u306A\u304F\u3066\u3082\u4E2D\u8EAB\u304C\u5206\u304B\u308B\u3088\u3046\u306B\u3059\u308B */
.notice-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-left: 20px;
}
.notice-chip {
  padding: 3px 9px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(212, 175, 55, 0.1);
  color: var(--gold-soft);
  font-size: 11px;
  white-space: nowrap;
}

/* \u958B\u3044\u305F\u3068\u304D\u306E\u8986\u3044\u3002\u753B\u9762\u3044\u3063\u3071\u3044\u3092\u8986\u3063\u3066\u3001\u5916\u3092\u62BC\u3059\u3068\u9589\u3058\u308B */
.notice-sheet {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  background: rgba(4, 8, 18, 0.78);
  padding: 16px;
  overscroll-behavior: contain;
  touch-action: none;
  padding-bottom: calc(16px + env(safe-area-inset-bottom));
}
@media (min-height: 620px) {
  .notice-sheet {
    align-items: center;
  }
}
.notice-panel {
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: 440px;
  max-height: 82vh;
  border: 1px solid var(--gold);
  border-radius: 14px;
  background: linear-gradient(170deg, #142a48, #0b1729);
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
  text-align: left;
}
.notice-panel-head {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 14px 14px 10px 16px;
  border-bottom: 1px solid var(--line);
}
.notice-panel-head b {
  flex: 1;
  font-family: "Shippori Mincho", serif;
  font-size: 16px;
  line-height: 1.5;
  color: var(--gold-soft);
  overflow-wrap: anywhere;
}
/* \u9589\u3058\u308B\u306F\u6307\u3067\u62BC\u305B\u308B\u5927\u304D\u3055\u306B */
.notice-close {
  flex: none;
  width: 44px;
  height: 44px;
  margin: -8px -6px 0 0;
  display: grid;
  place-items: center;
}
/* \u672C\u6587\u304C\u9577\u304F\u3066\u3082\u3053\u3053\u3060\u3051\u304C\u52D5\u304F\u3002\u984C\u3068\u53D7\u3051\u53D6\u308B\u91E6\u306F\u52D5\u304B\u306A\u3044 */
.notice-panel-scroll {
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 12px 16px 4px;
}
.notice-date {
  margin: 0 0 10px;
  font-size: 11px;
  color: var(--text-dim);
}
.notice-body {
  margin: 0 0 14px;
  font-size: 14px;
  line-height: 1.9;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.notice-gifts {
  margin-bottom: 4px;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  background: rgba(212, 175, 55, 0.08);
}
.notice-gifts-label {
  font-size: 11px;
  color: var(--text-dim);
}
.notice-gifts ul {
  margin: 6px 0 0;
  padding-left: 18px;
  font-size: 13.5px;
  line-height: 1.8;
  color: var(--gold-soft);
}
/* \u7D9A\u304D\u304C\u3042\u308B\u3053\u3068\u304C\u5206\u304B\u308B\u3088\u3046\u3001\u4E0B\u7AEF\u3092\u3075\u308F\u308A\u3068\u8584\u304F\u3059\u308B */
.notice-actions {
  position: relative;
  padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
}
.notice-actions::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: -22px;
  height: 22px;
  pointer-events: none;
  background: linear-gradient(rgba(11, 23, 41, 0), #0b1729);
}

/* --- \u30DB\u30FC\u30E0 ---
 * \u7247\u624B\u3067\u6301\u3063\u305F\u96FB\u8A71\u3067\u898B\u308B\u3068\u3053\u308D\u30027\u3064\u306E\u5165\u308A\u53E3\u3092\u540C\u3058\u5E2F\u3067\u4E26\u3079\u308B\u3068\u3001
 * \u3069\u308C\u3082\u540C\u3058\u91CD\u3055\u306B\u898B\u3048\u3066\u9078\u3079\u306A\u304F\u306A\u308B\u306E\u3067\u3001\u5927\u304D\u3055\u3068\u8272\u3067\u8EFD\u91CD\u3092\u3064\u3051\u305F\u3002
 * \u89E6\u308B\u3068\u3053\u308D\u306F\u3069\u308C\u3082 44px \u4EE5\u4E0A\u306B\u3057\u3066\u3042\u308B\u3002 */
.home-wrap {
  width: 100%;
  max-width: 420px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  /* \u753B\u9762\u306E\u9AD8\u3055\u304C\u4F59\u3063\u305F\u3076\u3093\u306F\u4E0A\u4E0B\u306B\u5206\u3051\u308B\u3002\u4E0B\u3060\u3051\u306B\u4F59\u767D\u304C\u6E9C\u307E\u3089\u306A\u3044\u3088\u3046\u306B */
  margin-block: auto;
}
/* \u30DB\u30FC\u30E0\u306E\u3068\u304D\u3060\u3051\u3001\u7F6E\u304D\u5834\u3092\u753B\u9762\u306E\u9AD8\u3055\u3044\u3063\u3071\u3044\u306B\u5E83\u3052\u308B */
.stage:has(> .home-wrap) {
  min-height: calc(100vh - 60px);
  min-height: calc(100dvh - 60px);
  justify-content: flex-start;
}

/* \u81EA\u5206\u306E\u672D\u3002\u540D\u524D\u30FB\u79F0\u53F7\u30FB\u30EC\u30D9\u30EB\u30FB\u30C1\u30B1\u30C3\u30C8 */
.home-self {
  position: relative;
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 10px;
  padding: 10px 14px 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: linear-gradient(180deg, var(--panel-2), var(--panel));
  color: var(--text);
  font-family: inherit;
  text-align: left;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.home-self:active {
  transform: scale(0.99);
}
.home-self-id {
  display: flex;
  flex-direction: column;
  min-width: 0;
  gap: 2px;
}
.home-self-id b {
  font-size: 15px;
  letter-spacing: 0.04em;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.home-self-id small {
  font-size: 11px;
  color: var(--gold-soft);
  opacity: 0.85;
}
.home-self-right {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--text-dim);
}
/* \u62BC\u305B\u308B\u3053\u3068\u304C\u5206\u304B\u308B\u3088\u3046\u306B\u3001\u53F3\u7AEF\u306B\u5C0F\u3055\u306A\u77E2\u5370\u3092\u6DFB\u3048\u308B */
.home-self-more {
  opacity: 0.4;
  flex: none;
}
.home-lv b {
  font-size: 16px;
  color: var(--gold-soft);
  margin-left: 2px;
}
.home-tickets {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: rgba(212, 175, 55, 0.08);
  color: var(--gold-soft);
  font-size: 12px;
  font-weight: 700;
}
/* \u79F0\u53F7\u306F\u540D\u524D\u306E\u8107\u3067\u306F\u306A\u304F\u3001\u5E45\u3044\u3063\u3071\u3044\u306E\u4E00\u6BB5\u3092\u4F7F\u3046(2026-09-22 \u672C\u4EBA\u306E\u6307\u793A)\u3002
   \u5C0F\u3055\u304F\u6DFB\u3048\u308B\u3068\u5F6B\u308A\u3082\u5B9D\u77F3\u3082\u6F70\u308C\u3066\u898B\u3048\u306A\u3044\u3002
   \u305F\u3060\u3057\u30DB\u30FC\u30E0\u306F\u5165\u308A\u53E3\u3092\u4E26\u3079\u308B\u5834\u6240\u306A\u306E\u3067\u3001\u672D\u306E\u4E08\u306F\u5C0F(compact)\u306E\u307E\u307E\u3002

   \u6A2A\u5E45\u3060\u3051\u306F\u5E83\u3052\u308B(2026-09-22 \u672C\u4EBA\u306E\u6307\u6458\u300C\u6A2A\u5E45\u304C\u6F70\u3055\u308C\u3066\u898B\u3048\u308B\u300D)\u3002
   compact \u306F\u5E45\u3092\u6587\u5B57\u306A\u308A\u306B\u3059\u308B\u306E\u3067\u30013\u6587\u5B57\u306E\u79F0\u53F7\u3067\u306F\u672D\u304C 69px \u3057\u304B\u306A\u304F\u3001
   \u3055\u3089\u306B\u98FE\u308A\u306E\u5143\u7D75(44\xD764)\u3092 17px \u306E\u67A0\u306B\u5165\u308C\u308B\u305F\u3081\u7E26\u9577\u306B\u5207\u308A\u8A70\u3081\u3089\u308C\u3066\u3044\u305F\u3002
   \u672D\u306B\u6C7A\u307E\u3063\u305F\u5E45\u3092\u4E0E\u3048\u3001\u98FE\u308A\u306E\u67A0\u3092\u5143\u7D75\u306E\u6BD4\u7387\u306B\u8FD1\u3065\u3051\u308B\u3002

   .title-frame--compact \u3068\u540C\u3058\u5F37\u3055\u3067\u306F\u6253\u3061\u6D88\u305B\u306A\u3044(title-frame.css \u304C\u5F8C\u306B
   \u8AAD\u307E\u308C\u308B)\u306E\u3067\u3001.title-frame \u3092\u91CD\u306D\u30661\u6BB5\u5F37\u304F\u3057\u3066\u3044\u308B */
.title-frame.home-self-title {
  grid-column: 1 / -1;
  justify-self: center;
  margin: 1px 0 0;
  width: min(100%, 196px);
  grid-template-columns: 25px minmax(0, 1fr) 25px;
}
.title-frame.home-self-title .title-frame-name {
  font-size: 12px;
  letter-spacing: 0.06em;
}
.title-frame.home-self-title .title-frame-body {
  padding-inline: 7px;
}
/* \u30EC\u30D9\u30EB\u306E\u5E2F\u306F\u672D\u306E\u4E0B\u8FBA\u306B\u6CBF\u308F\u305B\u308B\u3002\u6570\u5B57\u3060\u3051\u3088\u308A\u9032\u307F\u5177\u5408\u304C\u4F1D\u308F\u308B */
.home-self-bar {
  grid-column: 1 / -1;
  height: 3px;
  border-radius: 999px;
  background: rgba(212, 175, 55, 0.14);
  overflow: hidden;
}
.home-self-bar span {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--gold-soft), var(--gold));
}

/* \u4E00\u756A\u3084\u3063\u3066\u307B\u3057\u3044\u3068\u3053\u308D\u3002\u3053\u3053\u3060\u3051\u91D1\u306B\u3059\u308B */
.home-hero {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 18px 16px;
  border: none;
  border-radius: 14px;
  background: linear-gradient(160deg, #f0d98a, #d4af37 60%, #b8942b);
  color: #22160a;
  font-family: inherit;
  text-align: left;
  cursor: pointer;
  box-shadow:
    0 6px 0 #7a5f18,
    0 10px 24px rgba(0, 0, 0, 0.4);
  -webkit-tap-highlight-color: transparent;
}
.home-hero:active {
  transform: translateY(4px);
  box-shadow:
    0 2px 0 #7a5f18,
    0 4px 10px rgba(0, 0, 0, 0.4);
}
.home-hero-icon {
  display: grid;
  place-items: center;
  width: 52px;
  height: 52px;
  flex: none;
  border-radius: 50%;
  background: rgba(34, 22, 10, 0.14);
}
.home-hero-label {
  display: flex;
  flex-direction: column;
  flex: 1;
  gap: 3px;
}
.home-hero-label b {
  font-size: 21px;
  letter-spacing: 0.08em;
}
.home-hero-label small {
  font-size: 12px;
  opacity: 0.75;
}
.home-hero-arrow {
  opacity: 0.5;
  flex: none;
}

/* \u30C1\u30E5\u30FC\u30C8\u30EA\u30A2\u30EB\u3002\u91D1\u306E\u6B21\u306B\u7F6E\u304F\u4E00\u6BB5 */
.home-wide {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 16px;
  border: 1px solid rgba(143, 111, 214, 0.45);
  border-radius: 12px;
  background: linear-gradient(150deg, #2c2450, #1b1836);
  color: var(--text);
  font-family: inherit;
  text-align: left;
  cursor: pointer;
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.35);
  -webkit-tap-highlight-color: transparent;
}
.home-wide:active {
  transform: translateY(3px);
  box-shadow: none;
}
.home-wide-icon {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  flex: none;
  border-radius: 10px;
  background: rgba(203, 182, 255, 0.14);
  color: var(--swap-soft);
}
.home-wide-label {
  display: flex;
  flex-direction: column;
  flex: 1;
  gap: 2px;
}
.home-wide-label b {
  font-size: 15px;
  letter-spacing: 0.06em;
}
.home-wide-label small {
  font-size: 11px;
  color: var(--text-dim);
}
/* \u307E\u30601\u8A71\u3082\u7D42\u3048\u3066\u3044\u306A\u3044\u4EBA\u306B\u3060\u3051\u6DFB\u3048\u308B\u5C0F\u3055\u306A\u5370 */
.home-wide-pill {
  display: inline-block;
  margin-left: 8px;
  padding: 1px 7px;
  border-radius: 999px;
  border: 1px solid var(--gold);
  color: var(--gold-soft);
  font-size: 10px;
  font-weight: 600;
  vertical-align: middle;
}
.tutorial-offer {
  text-align: center;
}
/* \u30C1\u30E5\u30FC\u30C8\u30EA\u30A2\u30EB\u3092\u98DB\u3070\u3059\u3002\u6848\u5185\u306E\u672D\u3067\u306F\u4E00\u756A\u4E0B\u306B\u5C0F\u3055\u304F\u3001\u4E00\u89A7\u3067\u306F\u4E00\u756A\u4E0B\u306B */
/* \u8AAC\u660E\u30D1\u30CD\u30EB\u4E0B\u90E8\u306E\u300C\u4E2D\u65AD\u3057\u3066\u3084\u3081\u308B\u300D\u300C\u3053\u306E\u8A71\u3092\u98DB\u3070\u3059\u300D\u3092\u6A2A\u306B\u4E26\u3079\u308B(2026-09-21) */
.tutorial-sheet-foot {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 4px 16px;
  margin-top: 2px;
}
.tutorial-sheet-foot .tutorial-skip {
  margin: 0;
}
.tutorial-skip {
  display: block;
  margin: 4px auto 0;
  background: none;
  border: 0;
  /* \u6307\u3067\u62BC\u305B\u308B\u9AD8\u3055(44px)\u3092\u78BA\u4FDD\u3059\u308B\u3002\u6587\u5B57\u306F\u5C0F\u3055\u3044\u307E\u307E\u3067\u3088\u3044 */
  min-height: 44px;
  padding: 10px 16px;
  color: var(--text-dim);
  font-size: 12px;
  text-decoration: underline;
  cursor: pointer;
  pointer-events: auto;
}
/* \u98DB\u3070\u3059\u306E\u78BA\u8A8D\u306F\u672D\u306E\u5916(body \u76F4\u4E0B)\u306B\u51FA\u3059\u3002\u6483\u7834\u306E\u672D\u306A\u3069\u3068\u540C\u3058\u5C64 */
.tutorial-skip-confirm {
  z-index: 60;
  pointer-events: auto;
}
/* \u5BFE\u5C40\u753B\u9762\u306E\u53F3\u4E0A\u306E\u300C\u98DB\u3070\u3059\u300D\u3002\u30C1\u30E5\u30FC\u30C8\u30EA\u30A2\u30EB\u4E2D\u306F\u3044\u3064\u3067\u3082\u62BC\u305B\u308B */
.top-right .tutorial-skip-top {
  width: auto;
  min-width: 44px;
  min-height: 36px;
  display: inline-flex;
  align-items: center;
  padding: 0 10px;
  font-size: 12px;
  white-space: nowrap;
  text-decoration: underline;
}
.tutorial-skip-options {
  display: grid;
  gap: 10px;
  margin-top: 12px;
}
/* \u300C\u4E2D\u65AD\u3057\u3066\u3084\u3081\u308B\u300D\u306E\u88DC\u8DB3\u3092\u91E6\u306E\u4E2D\u30672\u6BB5\u306B(2026-09-21) */
.tutorial-skip-options .btn {
  flex-direction: column;
  gap: 2px;
}
.tutorial-skip-options .btn small {
  font-size: 10px;
  font-weight: 400;
  opacity: 0.85;
}
.tutorial-skip-all {
  margin-top: 6px;
  color: var(--text-dim);
}
.home-wide-arrow {
  color: var(--text-dim);
  opacity: 0.6;
  flex: none;
}

/* \u30B7\u30E7\u30C3\u30D7\u3002\u5165\u308A\u53E3\u3092\u307E\u3068\u3081\u305F\u753B\u9762 */
.shop-screen .nav-stack {
  width: 100%;
  max-width: 420px;
  margin: 0 auto;
}
/* \u91CD\u306D\u305F\u753B\u9762\u3092\u958B\u3044\u3066\u3044\u308B\u3042\u3044\u3060\u306F\u3001\u4E0A\u306E\u5E2F\u306F\u898B\u3048\u308B\u3060\u3051\u306B\u3059\u308B\u3002
   \u4E0B\u306E\u753B\u9762\u306E\u300C\u623B\u308B\u300D\u3092\u62BC\u3057\u3066\u30BF\u30A4\u30C8\u30EB\u3078\u98DB\u3093\u3067\u3057\u307E\u3046\u306E\u3092\u9632\u3050
   (2026-09-18 \u672C\u4EBA\u306E\u5831\u544A)\u3002\u9589\u3058\u308C\u3070\u5143\u3069\u304A\u308A\u89E6\u308C\u308B */
.tottery-root:has(.modal-overlay) .top-bar {
  pointer-events: none;
  opacity: 0.72;
}

/* \u30B7\u30FC\u30BA\u30F3\u5831\u916C\u306E\u898B\u672C(\u53D7\u3051\u53D6\u308B\u524D\u306B\u5B9F\u7269\u3092\u898B\u305B\u308B\u30022026-09-18) */
.season-reward-mark,
.season-reward-name {
  background: none;
  border: 0;
  padding: 0;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.season-reward-name {
  display: flex;
  flex-direction: column;
  gap: 1px;
  min-width: 0;
}
.season-reward-see {
  font-size: 10px;
  color: var(--text-dim);
  text-decoration: underline;
}
.season-preview-stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding: 14px 0 6px;
  text-align: center;
}
.season-preview-title {
  font-size: 14px;
  padding: 4px 14px;
}
.season-preview-tickets {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--gold-soft);
  font-size: 22px;
  font-weight: 700;
}

/* \u30D5\u30A9\u30A4\u30EB\u306E\u6B04\u306E\u6B8B\u308A\u6642\u9593(72\u6642\u9593\u306E\u9650\u308A) */
.shop-foil-left {
  color: var(--gold-soft);
}
.shop-balance {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 14px;
  margin: 0 0 14px;
  color: var(--text);
  font-size: 13px;
}
.shop-balance-tickets {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: var(--gold-soft);
}
/* \u30B7\u30E7\u30C3\u30D7\u306E\u6B04\u3092\u958B\u3044\u305F\u3068\u304D\u306E\u7BB1(2026-09-17 \u672C\u4EBA\u306E\u6307\u793A\u3002\u305D\u306E\u5834\u3067\u5546\u54C1\u304C\u4E26\u3076) */
.shop-panel {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px;
  background: rgba(255, 255, 255, 0.03);
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.shop-panel .gem-shop-scroll {
  max-height: none;
  overflow: visible;
  padding: 0;
}
.shop-panel .foil-offer-list {
  max-height: none;
}
.shop-panel .pass-purchase {
  margin: 0;
}
.shop-panel > .btn-small {
  align-self: center;
}
.shop-choice-icon {
  display: grid;
  place-items: center;
  width: 30px;
  flex: none;
}

/* \u56DB\u89D2\u3044\u5165\u308A\u53E3\u30022\u3064\u305A\u3064\u4E26\u3079\u308B */
.home-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.home-tile {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  min-height: 96px;
  padding: 12px 8px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: linear-gradient(180deg, var(--panel-2), var(--panel));
  color: var(--text);
  font-family: inherit;
  cursor: pointer;
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.35);
  -webkit-tap-highlight-color: transparent;
}
.home-tile:active {
  transform: translateY(3px);
  box-shadow: none;
}
.home-tile b {
  font-size: 13.5px;
  letter-spacing: 0.04em;
}
.home-tile small {
  font-size: 11px;
  color: var(--text-dim);
}
.home-tile-icon {
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border-radius: 10px;
}
/* \u5165\u308A\u53E3\u3054\u3068\u306B\u7D75\u67C4\u306E\u8272\u3092\u5909\u3048\u308B\u3002\u540C\u3058\u7D75\u67C4\u30FB\u540C\u3058\u8272\u3060\u3068\u62BC\u3057\u9593\u9055\u3048\u308B */
.home-tile-skins .home-tile-icon {
  color: var(--swap-soft);
  background: rgba(143, 111, 214, 0.16);
}
.home-tile-pass .home-tile-icon {
  color: #7fd3c4;
  background: rgba(127, 211, 196, 0.14);
}
/* \u91D1\u306F\u91D1\u306E\u91E6(\u5BFE\u6226\u3059\u308B)\u306B\u53D6\u3063\u3066\u3042\u308B\u306E\u3067\u3001\u3053\u3053\u306F\u7425\u73C0\u306B\u3057\u3066\u5206\u3051\u308B */
.home-tile-missions .home-tile-icon {
  color: #f5c26b;
  background: rgba(245, 194, 107, 0.22);
}
.home-tile-tutorial .home-tile-icon {
  color: #cbb6ff;
  background: rgba(143, 111, 214, 0.2);
}
/* \u30B7\u30E7\u30C3\u30D7\u3002\u8CB7\u3044\u7269\u306E\u5165\u308A\u53E3\u3060\u3051\u7DD1\u306B\u3057\u3066\u3001\u307B\u304B\u3068\u62BC\u3057\u9593\u9055\u3048\u306A\u3044\u3088\u3046\u306B\u3059\u308B */
.home-tile-shop .home-tile-icon {
  color: #8fd8a4;
  background: rgba(143, 216, 164, 0.16);
}
/* \u30DF\u30C3\u30B7\u30E7\u30F3\u30FB\u30D0\u30C8\u30EB\u30D1\u30B9(\u5DE6\u4E0B)\u3002\u30DF\u30C3\u30B7\u30E7\u30F3\u306E\u7425\u73C0\u3092\u5F15\u304D\u7D99\u3050 */
.home-tile-quests .home-tile-icon {
  color: #f5c26b;
  background: rgba(245, 194, 107, 0.22);
}
/* 2\u3064\u306E\u540D\u306F\u300C\u30FB\u300D\u30672\u884C\u306B\u5206\u3051\u308B\u30021\u884C\u306B\u8A70\u3081\u308B\u3068\u300C\u30D0\u30C8\u30EB\uFF0F\u30D1\u30B9\u300D\u3067\u6298\u308C\u3066\u8AAD\u307F\u306B\u304F\u3044 */
.home-tile-quests b {
  text-align: center;
  line-height: 1.3;
}
/* \u30AB\u30FC\u30C9(\u53F3\u4E0A)\u3002\u672D\u306E\u8D64\u3067\u3001\u307B\u304B\u306E\u5165\u308A\u53E3\u3068\u898B\u5206\u3051\u308B */
.home-tile-cards .home-tile-icon {
  color: #f08a8a;
  background: rgba(240, 138, 138, 0.16);
}
.home-tile-letters .home-tile-icon {
  color: #8fbce8;
  background: rgba(143, 188, 232, 0.14);
}
.home-tile .menu-badge {
  top: 8px;
  right: 8px;
}

/* \u30E9\u30F3\u30AD\u30F3\u30B0(\u300C\u5BFE\u6226\u3059\u308B\u300D\u306E\u4E2D)\u3002\u6BCE\u65E5\u62BC\u3059\u3082\u306E\u3067\u306F\u306A\u3044\u306E\u3067\u63A7\u3048\u3081\u306B */
.home-quiet {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 10px;
  border: none;
  background: none;
  color: var(--text-dim);
  font-family: inherit;
  font-size: 13px;
  letter-spacing: 0.04em;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.home-quiet:active {
  color: var(--gold-soft);
}
/* \u300C\u5BFE\u6226\u3059\u308B\u300D\u306E\u4E2D\u306B\u7F6E\u3044\u305F\u3076\u3093\u3002\u91E6\u306E\u5217\u306E\u4E0B\u3067\u4E2D\u592E\u306B\u5BC4\u305B\u308B */
.center-stage .home-quiet {
  margin: 2px auto 6px;
}

/* \u80CC\u306E\u4F4E\u3044\u96FB\u8A71\u3002\u8A70\u3081\u30661\u753B\u9762\u306B\u53CE\u3081\u308B\u3002
 * \u304A\u77E5\u3089\u305B\u306E\u5E2F\u3092\u8DB3\u3057\u305F\u3076\u3093\u3001\u56DB\u89D2\u306E\u5165\u308A\u53E3\u3082\u8584\u304F\u3059\u308B */
@media (max-height: 700px) {
  .home-wrap {
    gap: 9px;
  }
  .home-hero {
    padding: 12px 16px;
  }
  .home-hero-icon {
    width: 44px;
    height: 44px;
  }
  .home-hero-label b {
    font-size: 19px;
  }
  .home-wide {
    padding: 10px 16px;
  }
  .home-tile {
    min-height: 0;
    padding: 9px 8px;
    gap: 3px;
  }
  .home-tile-icon {
    width: 34px;
    height: 34px;
  }
  .home-self {
    padding: 8px 14px 10px;
  }
}

/* --- \u30ED\u30B0\u30A4\u30F3\u30DC\u30FC\u30CA\u30B9 --- */
/* \u53D7\u3051\u53D6\u308B\u307E\u3067\u9589\u3058\u306A\u3044\u672D\u3002\u5916\u3092\u62BC\u3057\u3066\u3082\u6D88\u3048\u306A\u3044 */
.bonus-panel {
  max-width: 400px;
}
.bonus-title {
  margin: 0;
  font-size: 19px;
  color: var(--gold-soft);
  letter-spacing: 0.08em;
}
.bonus-sub {
  margin: 4px 0 16px;
  font-size: 12px;
  color: var(--text-dim);
}
/* 7\u65E5\u3076\u3093\u3092\u6A2A\u306B\u4E26\u3079\u308B\u3002\u72ED\u3044\u753B\u9762\u3067\u3082\u6298\u308A\u8FD4\u3055\u305A\u30011\u30DE\u30B9\u305A\u3064\u7D30\u304F\u3059\u308B\u3002
   (\u4EE5\u524D\u306F .bonus-row \u3067\u3001\u5E03\u9663\u30DC\u30FC\u30CA\u30B9\u306E\u77E5\u3089\u305B(overlays.jsx \u306E .bonus-row)\u3092 7 \u5217\u306E\u683C\u5B50\u306B\u3057\u3066\u3057\u307E\u3044\u3001
    \u6587\u304C 1 \u6587\u5B57\u305A\u3064\u7E26\u306B\u4E26\u3093\u3067\u3044\u305F\u30022026-09-17 \u306B\u540D\u524D\u3092\u5206\u3051\u305F) */
.bonus-week {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 4px;
  margin-bottom: 16px;
}
.bonus-cell {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 8px 2px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.03);
}
.bonus-cell small {
  font-size: 9px;
  color: var(--text-dim);
  white-space: nowrap;
}
.bonus-cell b {
  display: flex;
  align-items: center;
  gap: 2px;
  font-size: 13px;
  color: var(--text);
}
/* \u4ECA\u65E5\u306E\u30DE\u30B9\u3002\u3053\u3053\u3060\u3051\u91D1\u3067\u5149\u3089\u305B\u308B */
.bonus-cell.is-today {
  border-color: var(--gold);
  background: rgba(212, 175, 55, 0.16);
  box-shadow: 0 0 12px rgba(212, 175, 55, 0.3);
}
.bonus-cell.is-today b {
  color: var(--gold-soft);
}
/* \u53D7\u3051\u53D6\u308A\u6E08\u307F\u3002\u6C88\u3081\u3066\u3001\u6E08\u307F\u306E\u5370\u3092\u91CD\u306D\u308B */
.bonus-cell.is-taken {
  opacity: 0.45;
}
.bonus-check {
  color: var(--gold-soft);
}
/* \u5E45\u306E\u72ED\u3044\u96FB\u8A71\u30027\u30DE\u30B9\u304C\u6F70\u308C\u306A\u3044\u3088\u3046\u3001\u672D\u306E\u4F59\u767D\u3092\u8A70\u3081\u308B */
@media (max-width: 380px) {
  .bonus-panel {
    padding: 20px 12px;
  }
  .bonus-cell {
    padding: 8px 1px;
  }
}
.bonus-gain {
  margin: 0 0 16px;
  font-size: 13px;
  color: var(--text);
}
.bonus-gain b {
  color: var(--gold-soft);
  font-size: 17px;
}

/* \u300C\u30DB\u30FC\u30E0\u306B\u623B\u308B\u300D\u3002\u3069\u306E\u753B\u9762\u3067\u3082\u540C\u3058\u7F6E\u304D\u65B9\u306B\u3059\u308B\u3002
