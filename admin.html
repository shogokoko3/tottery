.tottery-root {
  /* \u6DF1\u3044\u7D3A\u3068\u91D1\u3092\u57FA\u8ABF\u306B\u3057\u305F\u3001\u91CD\u539A\u306A\u610F\u5320 */
  --bg: #081120;
  --panel: #10203a;
  --panel-2: #16294a;
  --line: rgba(212, 175, 55, 0.22);
  --gold: #d4af37;
  --gold-soft: #f0d98a;
  --gold-deep: #8a6d1f;
  --card-face: #f7f3e8;
  --card-ink: #1a1a1a;
  --card-red: #b0202f;
  --text: #f2ead9;
  --text-dim: #a9b4cc;
  --p0: #c0392b;
  --p1: #2a6f9e;
  /* \u5165\u308C\u66FF\u3048(A)\u5C02\u7528\u306E\u8272\u3002\u53D6\u308C\u308B\u99D2\u306E\u8D64\u3068\u6DF7\u3056\u3089\u306A\u3044\u3088\u3046\u7D2B\u306B\u3057\u3066\u3042\u308B */
  --swap: #8f6fd6;
  --swap-soft: #cbb6ff;
  --btn-face: #1b3050;
  --btn-face-hi: #24406a;
  --btn-edge: rgba(212, 175, 55, 0.45);
  background: radial-gradient(
    120% 90% at 50% 0%,
    #16294a 0%,
    #0c1a30 55%,
    #071120 100%
  );
  color: var(--text);
  min-height: 100%;
  font-family: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  overflow: hidden;
  position: relative;
  min-height: 100vh;
}
.tottery-root * {
  box-sizing: border-box;
}
.title-font {
  font-family: "Shippori Mincho", serif;
  font-weight: 800;
}

.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(
    180deg,
    rgba(8, 17, 32, 0.9),
    rgba(8, 17, 32, 0.4)
  );
}
.brand {
  font-family: "Shippori Mincho", serif;
  font-weight: 700;
  letter-spacing: 0.18em;
  color: var(--gold-soft);
  font-size: 17px;
  text-shadow: 0 0 12px rgba(212, 175, 55, 0.35);
}
.brand::before,
.brand::after {
  content: "\u25C6";
  font-size: 8px;
  color: var(--gold);
  vertical-align: middle;
  margin: 0 10px;
  opacity: 0.8;
}
.icon-btn {
  background: var(--btn-face);
  border: 1px solid var(--btn-edge);
  color: var(--gold-soft);
  border-radius: 8px;
  padding: 6px;
  cursor: pointer;
}
.icon-btn:hover {
  color: var(--gold-soft);
  border-color: var(--gold);
  background: var(--btn-face-hi);
}
.icon-btn:active {
  transform: translateY(1px);
}
.stage {
  padding: 20px;
  min-height: 520px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}

/* \u898B\u51FA\u3057\u306F\u4E2D\u592E\u306B\u98FE\u308A\u7F6B\u3092\u6DFB\u3048\u308B */
h2 {
  font-family: "Shippori Mincho", serif;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--gold-soft);
  text-shadow: 0 0 14px rgba(212, 175, 55, 0.25);
}
h3 {
  font-family: "Shippori Mincho", serif;
  font-weight: 700;
  letter-spacing: 0.06em;
}
.setup-wrap h2,
.center-stage h2 {
  position: relative;
  padding-bottom: 14px;
  margin-bottom: 10px;
}
.setup-wrap h2::after,
.center-stage h2::after {
  content: "\u2756";
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  font-size: 10px;
  color: var(--gold);
  opacity: 0.85;
}

.intro {
  text-align: center;
  max-width: 420px;
}
.intro-emblem {
  font-family: "Shippori Mincho", serif;
  font-size: 34px;
  color: var(--gold);
  border: 2px solid var(--gold);
  border-radius: 50%;
  width: 84px;
  height: 84px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 20px;
  background: radial-gradient(
    circle,
    rgba(212, 175, 55, 0.14),
    transparent 70%
  );
  box-shadow:
    0 0 26px rgba(212, 175, 55, 0.3),
    inset 0 0 20px rgba(212, 175, 55, 0.12);
}
.king-card {
  margin: 6px auto 26px;
  width: min(52vw, 210px);
  position: relative;
}
.king-card img {
  width: 100%;
  display: block;
  border-radius: 8px;
  box-shadow:
    0 0 34px rgba(212, 175, 55, 0.45),
    0 14px 30px rgba(0, 0, 0, 0.6);
}
.king-card::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -16px;
  transform: translateX(-50%);
  width: 70%;
  height: 16px;
  border-radius: 50%;
  background: radial-gradient(
    ellipse,
    rgba(212, 175, 55, 0.35),
    transparent 70%
  );
}
.intro-start {
  width: min(72vw, 300px);
  justify-content: center;
}
.win-card {
  width: min(40vw, 140px);
  margin: 10px auto 4px;
}
.gameover-panel .setup-actions {
  flex-direction: column;
  align-items: stretch;
}
.intro h1 {
  font-size: 42px;
  margin: 0 0 10px;
  letter-spacing: 0.16em;
  font-weight: 800;
  color: var(--gold-soft);
  text-shadow:
    0 0 24px rgba(212, 175, 55, 0.45),
    0 2px 4px rgba(0, 0, 0, 0.6);
}
.subtitle {
  color: var(--gold);
  margin-bottom: 30px;
  font-size: 15px;
  letter-spacing: 0.14em;
}
.intro-choice-label {
  font-size: 12px;
  letter-spacing: 0.12em;
  color: var(--gold-soft);
  text-transform: uppercase;
  margin-bottom: 10px;
}
.intro-boards {
  display: flex;
  gap: 16px;
  justify-content: center;
}
.board-choice {
  background: linear-gradient(170deg, #152b49, #0d1c33);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  color: var(--text);
}
.board-choice.active {
  border-color: var(--gold);
  border-width: 2px;
  box-shadow: 0 0 18px rgba(212, 175, 55, 0.25);
}
.board-choice:hover {
  border-color: var(--gold);
}
.board-choice-grid {
  display: grid;
  gap: 2px;
  width: 70px;
  height: 70px;
}
.board-choice-grid span {
  background: var(--card-face);
  opacity: 0.75;
  border-radius: 0;
  box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.3);
}

.center-stage {
  text-align: center;
}
.dim-icon {
  color: var(--text-dim);
  margin-bottom: 10px;
}
.dice-row {
  display: flex;
  gap: 14px;
  justify-content: center;
  margin: 18px 0;
}
.dice-item {
  border: 1px solid;
  border-radius: 10px;
  padding: 10px 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  background: var(--panel);
}
.dice-item strong {
  font-size: 26px;
  font-family: "Shippori Mincho", serif;
}

.btn {
  font-family: "Shippori Mincho", serif;
  font-weight: 700;
  border-radius: 6px;
  padding: 12px 20px;
  cursor: pointer;
  letter-spacing: 0.06em;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: 1px solid transparent;
  font-size: 15px;
  position: relative;
}
.btn-primary {
  background: linear-gradient(180deg, #f0d98a 0%, #d4af37 45%, #a8842a 100%);
  color: #2a1e05;
  border-color: #f0d98a;
  box-shadow:
    0 3px 0 rgba(0, 0, 0, 0.4),
    inset 0 1px 0 rgba(255, 255, 255, 0.5);
}
.btn-primary:hover {
  filter: brightness(1.07);
}
.btn-primary:active {
  transform: translateY(3px);
  box-shadow: none;
}
.btn-primary:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  box-shadow: none;
  transform: none;
}
.btn-ghost {
  background: linear-gradient(180deg, var(--btn-face-hi), var(--btn-face));
  border: 1px solid var(--btn-edge);
  color: var(--gold-soft);
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.35);
}
.btn-ghost:hover {
  border-color: var(--gold);
  background: var(--btn-face-hi);
}
.btn-ghost:active {
  transform: translateY(3px);
  box-shadow: none;
}
.btn-ghost:disabled {
  opacity: 0.35;
  cursor: not-allowed;
  box-shadow: none;
}
.btn-large {
  padding: 15px 30px;
  font-size: 17px;
}
/* \u5BFE\u6226\u76F8\u624B\u306E\u9078\u629E\u30022\u3064\u3092\u5BFE\u7B49\u306A\u9078\u629E\u80A2\u3068\u3057\u3066\u3001\u8272\u3067\u5F79\u5272\u3092\u5206\u3051\u308B */
.btn-friend {
  background: linear-gradient(180deg, #2e6f8e, #1a4661);
  color: #e8f4fb;
  border-color: rgba(212, 175, 55, 0.35);
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.35);
}
.btn-friend:hover {
  filter: brightness(1.08);
}
.btn-friend:active {
  transform: translateY(3px);
  box-shadow: none;
}
.btn-choice {
  padding: 16px 20px;
  justify-content: flex-start;
  gap: 14px;
  text-align: left;
}
.choice-label {
  display: flex;
  flex-direction: column;
  line-height: 1.4;
}
.choice-label small {
  font-size: 11px;
  font-weight: 500;
  opacity: 0.8;
  margin-top: 3px;
  font-family: "Shippori Mincho", serif;
}
.nav-stack {
  display: flex;
  flex-direction: column;
  gap: 14px;
  align-items: stretch;
  min-width: 250px;
  margin-top: 6px;
}
.spin-icon {
  animation: tottery-spin 1.1s linear infinite;
}
@keyframes tottery-spin {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}
.room-code {
  font-family: "Shippori Mincho", serif;
  font-size: 44px;
  letter-spacing: 0.2em;
  color: var(--gold-soft);
  border: 2px solid var(--gold);
  border-radius: 8px;
  padding: 16px 30px;
  margin: 16px 0;
  background: rgba(212, 175, 55, 0.07);
  text-shadow: 0 0 18px rgba(212, 175, 55, 0.4);
}
.room-join-row {
  display: flex;
  gap: 10px;
}
.room-input {
  flex: 1;
  background: var(--card-face);
  border: 1px solid var(--gold);
  border-radius: 6px;
  color: #1a1a1a;
  padding: 12px;
  font-size: 20px;
  font-family: "Shippori Mincho", serif;
  letter-spacing: 0.25em;
  text-align: center;
  text-transform: uppercase;
  min-width: 0;
  font-weight: 700;
}
.room-input:focus {
  outline: none;
  box-shadow: 0 0 0 2px var(--gold-soft);
}
.diag-line {
  font-size: 12px;
  margin-bottom: 16px;
}
.diag-checking {
  color: var(--text-dim);
}
.diag-ok {
  color: #7fd4a8;
}
.diag-fail {
  color: #e08b7a;
}

.interstitial {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
}
.interstitial-card {
  text-align: center;
  background: linear-gradient(170deg, #132844, #0b1729);
  border: 2px solid var(--gold);
  border-radius: 10px;
  padding: 36px 30px;
  position: relative;
  box-shadow:
    0 0 0 1px rgba(0, 0, 0, 0.6),
    0 10px 34px rgba(0, 0, 0, 0.5);
}
.interstitial-card::before {
  content: "";
  position: absolute;
  inset: 6px;
  border: 1px solid rgba(212, 175, 55, 0.35);
  border-radius: 6px;
  pointer-events: none;
}
.interstitial-eyebrow {
  font-size: 12px;
  letter-spacing: 0.22em;
  color: var(--gold);
  margin-bottom: 14px;
  border: 1px solid var(--line);
  display: inline-block;
  padding: 6px 16px;
  border-radius: 4px;
}
.interstitial-card h2 {
  font-family: "Shippori Mincho", serif;
  margin: 0 0 14px;
  font-size: 30px;
  letter-spacing: 0.1em;
}
.interstitial-card p {
  color: var(--text-dim);
  font-size: 13px;
  margin-bottom: 20px;
  max-width: 300px;
}

.setup-wrap {
  width: 100%;
  max-width: 620px;
  text-align: center;
}
.setup-wrap h2 {
  font-family: "Shippori Mincho", serif;
  margin-bottom: 6px;
}
.hint {
  color: var(--text-dim);
  font-size: 13px;
  margin-bottom: 16px;
}
.hand-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin-bottom: 18px;
}
.hand-split {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 18px;
}
.hand-split .hand-row {
  margin-bottom: 0;
}
/* \u72ED\u3044\u7AEF\u672B\u5411\u3051\u3002\u30AB\u30FC\u30C9\u3092\u8A70\u3081\u3066\u6298\u308A\u8FD4\u3057\u3001\u306F\u307F\u51FA\u3055\u306A\u3044\u3088\u3046\u306B\u3059\u308B */
.hand-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 6px;
  justify-items: center;
  margin-bottom: 18px;
}
@media (max-width: 330px) {
  .hand-grid {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}
.hand-card {
  cursor: pointer;
  border-radius: 8px;
  padding: 2px;
  border: 2px solid transparent;
  transition: transform 0.1s;
  position: relative;
}
.hand-card:hover {
  transform: translateY(-3px);
}
.hand-card-selected {
  border-color: var(--gold);
  transform: translateY(3px);
  opacity: 0.75;
}
.discard-badge {
  position: absolute;
  top: -6px;
  right: -6px;
  background: #d0483a;
  color: #fff;
  border-radius: 50%;
  width: 18px;
  height: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
}
.card-face {
  position: relative;
  border-radius: 4px;
  overflow: hidden;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
}
.card-face img {
  width: 100%;
  height: 100%;
  object-fit: fill;
  display: block;
}
/* \u738B(\u968A\u9577)\u306F\u7E01\u3092\u91D1\u8272\u306B\u5149\u3089\u305B\u308B */
.card-captain {
  box-shadow: 0 0 10px rgba(212, 175, 55, 0.7);
}
/* \u7D75\u67C4\u306F\u5171\u901A\u306A\u306E\u3067\u3001\u8D64\u30B9\u30FC\u30C8\u3060\u3051\u8272\u5473\u3092\u91CD\u306D\u3066\u533A\u5225\u3059\u308B */
.card-tint {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: rgba(176, 32, 47, 0.13);
  mix-blend-mode: multiply;
}
.card-back {
  position: relative;
  border-radius: 4px;
  overflow: hidden;
  box-shadow:
    0 2px 6px rgba(0, 0, 0, 0.5),
    inset 0 0 0 1px var(--pc);
}
.card-back img {
  width: 100%;
  height: 100%;
  object-fit: fill;
  display: block;
}

.arrange-layout {
  display: flex;
  justify-content: center;
  margin-bottom: 14px;
}
.mini-board {
  display: grid;
  gap: 0;
  width: min(78vw, 320px);
  aspect-ratio: 1;
  background: linear-gradient(160deg, #0d1c33, #091426);
  padding: 5px;
  border-radius: 8px;
  border: 2px solid var(--gold);
  grid-auto-rows: minmax(0, 1fr);
}
.mini-cell {
  background: transparent;
  position: relative;
  border: 1px solid rgba(212, 175, 55, 0.28);
}
.mini-cell-zone {
  background: rgba(45, 105, 165, 0.5);
  cursor: pointer;
}
.mini-cell-open {
  background: rgba(80, 200, 140, 0.18);
}
.mini-piece {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.mini-piece-disabled {
  opacity: 0.3;
  filter: grayscale(0.6);
}
.tray {
  margin-bottom: 14px;
}
.tray-label {
  font-size: 12px;
  color: var(--text-dim);
  margin-bottom: 6px;
}
.tray-row {
  display: flex;
  gap: 6px;
  justify-content: center;
  flex-wrap: wrap;
}
.setup-actions {
  display: flex;
  gap: 10px;
  justify-content: center;
}

.play-wrap {
  width: 100%;
  max-width: 560px;
}
.turn-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
  font-size: 13px;
}
.turn-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
}
.turn-log {
  color: var(--text-dim);
  margin-left: auto;
  font-family: "IBM Plex Mono", monospace;
  font-size: 11px;
}
.board-outer {
  display: flex;
  justify-content: center;
}
/* \u76E4\u306E\u5DE6\u3068\u4E0B\u306B\u5EA7\u6A19\u306E\u76EE\u76DB\u308A\u3092\u7F6E\u304F\u3002\u76E4\u3092\u53CD\u8EE2\u3057\u3066\u3082\u6B63\u3057\u3044\u5EA7\u6A19\u304C\u4E26\u3076 */
.board-frame {
  display: grid;
  grid-template-columns: auto 1fr;
  grid-template-rows: 1fr auto;
  gap: 4px;
  width: min(94vw, 500px);
}
.rank-labels {
  display: grid;
  grid-template-rows: repeat(var(--n), 1fr);
  align-items: center;
  font-size: 13px;
  color: var(--gold-soft);
  font-family: "Shippori Mincho", serif;
  padding: 6px 5px;
  text-align: center;
  font-weight: 600;
}
.file-labels {
  display: grid;
  grid-template-columns: repeat(var(--n), 1fr);
  justify-items: center;
  grid-column: 2;
  font-size: 13px;
  color: var(--gold-soft);
  font-family: "Shippori Mincho", serif;
  padding: 4px 6px 0;
  font-weight: 600;
}
.board-frame .board-grid {
  width: 100%;
}
.board-grid {
  display: grid;
  gap: 0;
  width: min(90vw, 480px);
  aspect-ratio: 1;
  background: linear-gradient(160deg, #0d1c33, #091426);
  padding: 5px;
  border-radius: 8px;
  border: 2px solid var(--gold);
  box-shadow:
    0 0 0 1px rgba(0, 0, 0, 0.6),
    0 6px 20px rgba(0, 0, 0, 0.5);
  grid-auto-rows: minmax(0, 1fr);
}
/* \u30BB\u30EB\u5185\u306E\u99D2\u306F\u30DE\u30B9\u76EE\u306B\u53CE\u3081\u308B\u3002\u306F\u307F\u51FA\u3057\u3066\u96A3\u306E\u30DE\u30B9\u306B\u91CD\u306A\u308B\u306E\u3092\u9632\u3050 */
.cell > div {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
}
/* \u30DE\u30B9\u76EE\u304B\u3089\u306F\u307F\u51FA\u3055\u306A\u3044\u3088\u3046\u3001\u30AB\u30FC\u30C9\u306E\u8868\u793A\u30B5\u30A4\u30BA\u3092\u5185\u5074\u306B\u53CE\u3081\u308B */
.cell .card-face,
.cell .card-back {
  max-width: 86%;
  max-height: 86%;
}
.cell .card-face img,
.cell .card-back img {
  width: 100%;
  height: 100%;
}
.cell {
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  position: relative;
  min-width: 0;
  min-height: 0;
  border: 1px solid rgba(212, 175, 55, 0.28);
}
.cell.zone-0 {
  background: rgba(160, 45, 38, 0.42);
}
.cell.zone-1 {
  background: rgba(45, 105, 165, 0.5);
}
.cell-move::after {
  content: "";
  position: absolute;
  width: 26%;
  height: 26%;
  border-radius: 50%;
  background: var(--gold-soft);
  opacity: 0.85;
  box-shadow: 0 0 8px var(--gold);
}
.cell-capture {
  box-shadow:
    inset 0 0 0 3px #d0483a,
    0 0 12px rgba(208, 72, 58, 0.5);
}
/* \u76F4\u524D\u306E\u624B\u3002\u79FB\u52D5\u5143\u306F\u63A7\u3048\u3081\u306B\u3001\u79FB\u52D5\u5148\u306F\u306F\u3063\u304D\u308A\u793A\u3059 */
.cell-from {
  box-shadow: inset 0 0 0 2px var(--lm);
  opacity: 0.95;
}
.cell-from::after {
  content: "";
  position: absolute;
  inset: 22%;
  border-radius: 50%;
  border: 2px dashed var(--lm);
  opacity: 0.55;
}
.cell-to {
  box-shadow: inset 0 0 0 3px var(--lm);
}
.cell-to::before {
  content: "";
  position: absolute;
  inset: 0;
  background: var(--lm);
  opacity: 0.16;
  pointer-events: none;
}
/* \u5165\u308C\u66FF\u3048\u304C\u8D77\u304D\u305F\u30DE\u30B9\u3002\u8D64\u306E\u67A0\u306F\u300C\u53D6\u308C\u308B\u99D2\u300D\u3068\u7D1B\u3089\u308F\u3057\u3044\u306E\u3067\u7D2B\u3067\u793A\u3059 */
.cell-swap {
  box-shadow:
    inset 0 0 0 2px var(--swap),
    0 0 10px rgba(155, 126, 222, 0.35);
}
.cell-swap::after {
  content: "\u21C4";
  position: absolute;
  top: 0;
  right: 2px;
  font-size: 12px;
  font-weight: 700;
  color: var(--swap-soft);
  text-shadow: 0 0 6px rgba(155, 126, 222, 0.9);
}
.piece-wrap {
  position: relative;
}
.piece-selected {
  outline: 2px solid var(--gold-soft);
  border-radius: 4px;
  box-shadow: 0 0 14px rgba(212, 175, 55, 0.6);
}
.piece-pickable {
  filter: drop-shadow(0 0 5px var(--gold-soft));
}
.king-badge {
  position: absolute;
  top: -9px;
  left: 50%;
  transform: translateX(-50%);
  background: radial-gradient(circle, #1a2b4a 60%, transparent 70%);
  border-radius: 50%;
}

.action-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  justify-content: center;
  margin-top: 12px;
  font-size: 13px;
  color: var(--text-dim);
  flex-wrap: wrap;
}
.captured-row {
  display: flex;
  gap: 16px;
  margin-top: 16px;
  justify-content: center;
  flex-wrap: wrap;
}
.captured-col {
  text-align: center;
}
.captured-label {
  font-size: 11px;
  margin-bottom: 6px;
}
.captured-cards {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  max-width: 220px;
  justify-content: center;
}
.captured-card {
  cursor: pointer;
}
.discard-panel {
  margin: 14px 0;
}
.discard-label {
  font-size: 12px;
  margin-bottom: 6px;
}
.discard-row {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  justify-content: center;
}
.discard-card {
  opacity: 0.85;
}
.discard-toggle-wrap {
  margin-top: 14px;
  text-align: center;
}
.resign-row {
  margin-top: 18px;
  text-align: center;
}
.btn-resign {
  font-size: 13px;
  padding: 9px 18px;
  opacity: 0.8;
}
.btn-resign:hover {
  opacity: 1;
  border-color: #e08b7a;
  color: #e8a08f;
}
.discard-both {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-top: 6px;
}
.log-list {
  text-align: left;
  padding-left: 20px;
  font-size: 13px;
  color: var(--text-dim);
  line-height: 1.8;
  margin: 0;
}
.log-list li {
  margin-bottom: 2px;
}

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(8, 10, 22, 0.72);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 50;
  padding: 20px;
}
.modal-panel {
  background: linear-gradient(170deg, #132844, #0b1729);
  border: 2px solid var(--gold);
  border-radius: 10px;
  padding: 24px;
  max-width: 480px;
  width: 100%;
  max-height: 80vh;
  overflow: auto;
  text-align: center;
}
.modal-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
  text-align: left;
}
.gameover-panel {
  text-align: center;
}
.review-panel {
  max-width: 520px;
  text-align: center;
}
.review-panel .board-grid {
  width: min(78vw, 380px);
}
.review-lost {
  display: flex;
  gap: 16px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 14px;
}
.review-log {
  margin-top: 16px;
  text-align: left;
  max-height: 190px;
  overflow: auto;
  border-top: 1px solid var(--line);
  padding-top: 10px;
}
.waiting-head {
  display: flex;
  align-items: center;
  gap: 10px;
  justify-content: center;
  margin-bottom: 16px;
}
.rule-grid {
  display: flex;
  flex-direction: column;
  gap: 10px;
  text-align: left;
}
.rule-row {
  display: flex;
  gap: 12px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 10px;
  align-items: flex-start;
}
.rule-rank {
  font-family: "Shippori Mincho", serif;
  font-weight: 700;
  color: var(--gold-soft);
  font-size: 15px;
  text-align: center;
}
.rule-diagram {
  flex-shrink: 0;
  width: 76px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
}
.rule-toggle {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin-bottom: 12px;
}
.rule-section {
  margin-bottom: 20px;
}
.rule-section-label {
  font-size: 11px;
  letter-spacing: 0.14em;
  color: var(--gold-soft);
  text-transform: uppercase;
  margin-bottom: 9px;
  text-align: left;
}
.size-choices {
  display: flex;
  gap: 12px;
  justify-content: center;
}
.size-choices .board-choice {
  flex: 1;
  max-width: 150px;
}
.size-choices .board-choice small {
  font-size: 10px;
  color: var(--text-dim);
}
.rule-toggle .btn {
  padding: 7px 14px;
  font-size: 13px;
}

/* --- \u52D5\u304D\u306E\u56F3\u89E3 --- */
.move-diagram {
  display: grid;
  gap: 1px;
  width: 70px;
  aspect-ratio: 1;
  background: rgba(255, 255, 255, 0.07);
  padding: 1px;
  border-radius: 4px;
}
.md-cell {
  background: rgba(12, 15, 30, 0.85);
  border-radius: 1px;
}
.md-reach {
  background: var(--gold);
  opacity: 0.85;
}
.md-me {
  background: var(--text);
  box-shadow: 0 0 0 1px var(--gold-soft);
}
.card-guide {
  margin: 12px 0;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.03);
}
.card-guide-compact {
  margin: 8px 0 12px;
  padding: 10px;
}
.cg-head {
  display: flex;
  gap: 14px;
  align-items: center;
  justify-content: center;
  margin-bottom: 10px;
}
.cg-rank {
  font-family: "Shippori Mincho", serif;
  font-weight: 700;
  font-size: 22px;
  color: var(--gold-soft);
}
.cg-text {
  font-size: 12.5px;
  color: var(--text-dim);
  line-height: 1.6;
  margin: 0;
  text-align: left;
}
.cg-king {
  font-size: 11px;
  color: var(--gold-soft);
  margin: 6px 0 0;
  text-align: left;
}
.rule-desc {
  font-size: 12.5px;
  color: var(--text-dim);
  line-height: 1.5;
}
.net-tag {
  color: rgba(126, 201, 154, 0.75);
}
/* \u30D8\u30C3\u30C0\u30FC\u30923\u5206\u5272\u306B\u3057\u3066\u3001\u623B\u308B\u30FB\u984C\u540D\u30FB\u8A2D\u5B9A\u3092\u914D\u7F6E\u3059\u308B */
.top-left,
.top-right {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 72px;
}
.top-right {
  justify-content: flex-end;
}
.icon-btn.plain {
  background: transparent;
  border-color: transparent;
  color: var(--gold);
}
.icon-btn.plain:hover {
  background: transparent;
  border-color: transparent;
}
.settings-list {
  text-align: left;
}
.settings-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: baseline;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
}
.settings-row span {
  color: var(--text-dim);
}
.settings-row b {
  color: var(--gold-soft);
  font-weight: 600;
  font-size: 12px;
  text-align: right;
}
/* \u97F3\u91CF\u3002\u6307\u3067\u63B4\u3081\u308B\u3088\u3046\u3001\u3064\u307E\u307F\u306F\u5927\u304D\u3081\u306B\u3068\u308B */
.settings-slider {
  flex: 1;
  min-width: 0;
  max-width: 180px;
  accent-color: var(--gold-soft);
  height: 24px;
}
.settings-slider:disabled {
  opacity: 0.35;
}
.settings-row b {
  min-width: 2.2em;
}

/* \u30D5\u30EC\u30F3\u30C9\u5BFE\u6226 */
.friend-wrap {
  max-width: 420px;
}
.friend-head {
  margin-bottom: 18px;
}
.conn-badge {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 9px 20px;
  border-radius: 999px;
  font-size: 13px;
  margin-bottom: 20px;
  background: rgba(45, 105, 165, 0.18);
  border: 1px solid rgba(45, 105, 165, 0.4);
}
.conn-badge .conn-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--text-dim);
}
.conn-ok {
  color: #6fd6ae;
}
.conn-ok .conn-dot {
  background: #6fd6ae;
  box-shadow: 0 0 8px #6fd6ae;
}
.conn-checking {
  color: var(--text-dim);
}
.conn-fail {
  color: #e08b7a;
  border-color: rgba(224, 139, 122, 0.4);
  background: rgba(224, 139, 122, 0.12);
}
.conn-fail .conn-dot {
  background: #e08b7a;
}
.btn-wide {
  width: 100%;
  justify-content: center;
  font-size: 17px;
  padding: 16px;
}
.btn-teal {
  background: linear-gradient(180deg, #1c5b56, #123f3c);
  color: #a9ead9;
  border: 1px solid rgba(111, 214, 174, 0.4);
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.35);
}
.btn-teal:hover {
  filter: brightness(1.1);
}
.btn-teal:active {
  transform: translateY(3px);
  box-shadow: none;
}
.code-row {
  display: flex;
  gap: 10px;
  align-items: stretch;
  margin: 16px 0 8px;
}
.code-boxes {
  display: flex;
  gap: 8px;
  flex: 1;
  position: relative;
  cursor: text;
}
.code-box {
  flex: 1;
  aspect-ratio: 0.85;
  background: var(--card-face);
  border: 1px solid var(--gold);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  font-weight: 700;
  color: #1a1a1a;
  font-family: "Shippori Mincho", serif;
}
.code-box-active {
  box-shadow: 0 0 0 2px var(--gold-soft);
}
.code-placeholder {
  color: #b3ada0;
  font-size: 20px;
}
.code-hidden {
  position: absolute;
  inset: 0;
  opacity: 0;
  border: 0;
  padding: 0;
  font-size: 16px;
  cursor: text;
}
.code-join {
  white-space: nowrap;
  padding: 12px 16px;
}
.code-note {
  display: flex;
  align-items: center;
  gap: 7px;
  justify-content: center;
  font-size: 12px;
  color: #6fd6ae;
  margin: 0 0 20px;
}

.build-tag {
  position: absolute;
  bottom: 4px;
  right: 8px;
  font-size: 9px;
  color: rgba(154, 162, 200, 0.35);
  font-family: "IBM Plex Mono", monospace;
  pointer-events: none;
}

/* --- \u30B5\u30A4\u30B3\u30ED --- */
.die3d {
  width: 150px;
  height: 150px;
}
.die3d img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
  filter: drop-shadow(0 12px 26px rgba(0, 0, 0, 0.6));
}
.title-hero {
  position: relative;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
}
.title-bg {
  width: 100%;
  max-width: 430px;
  display: block;
  border-radius: 10px;
}
.title-hero .intro-start {
  position: absolute;
  bottom: 6%;
  left: 50%;
  transform: translateX(-50%);
  width: min(66%, 290px);
}
.die-stage {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 150px;
  margin: 10px 0 6px;
  perspective: 700px;
}
.die {
  width: 96px;
  height: 96px;
  border-radius: 18px;
  padding: 12px;
  background: linear-gradient(145deg, #fffdf7 0%, #f2ece0 45%, #ddd3bd 100%);
  box-shadow:
    0 10px 24px rgba(0, 0, 0, 0.55),
    inset 0 -5px 10px rgba(0, 0, 0, 0.16),
    inset 0 3px 5px rgba(255, 255, 255, 0.95);
  border: 1px solid rgba(0, 0, 0, 0.18);
}
.die-grid {
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);
  gap: 3px;
}
.pip {
  border-radius: 50%;
}
.pip-on {
  background: radial-gradient(circle at 35% 30%, #3a3228, #131009 70%);
  box-shadow:
    inset 0 1px 2px rgba(255, 255, 255, 0.3),
    0 1px 1px rgba(255, 255, 255, 0.15);
}
.die-rolling {
  animation: die-tumble 0.5s linear infinite;
}
@keyframes die-tumble {
  0% {
    transform: rotateX(0deg) rotateY(0deg) translateY(0);
  }
  25% {
    transform: rotateX(180deg) rotateY(90deg) translateY(-22px);
  }
  50% {
    transform: rotateX(360deg) rotateY(180deg) translateY(0);
  }
  75% {
    transform: rotateX(180deg) rotateY(270deg) translateY(-14px);
  }
  100% {
    transform: rotateX(0deg) rotateY(360deg) translateY(0);
  }
}
/* --- \u8EE2\u304C\u308B\u7ACB\u4F53\u306E\u30B5\u30A4\u30B3\u30ED --- */
.die-cube-wrap {
  position: relative;
  width: 104px;
  height: 104px;
}
.die-cube {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
  will-change: transform;
}
.is-rolling .die-cube {
  animation: die-roll 0.62s linear infinite;
}
/* \u6B62\u307E\u308B\u3068\u304D\u306E\u56DE\u308A\u65B9\u3002\u901F\u304F\u56DE\u3063\u3066\u3001\u6E1B\u901F\u3057\u306A\u304C\u3089\u51FA\u76EE\u3067\u6B62\u307E\u308B\u3002
   \u884C\u304D\u5148\u306F\u8981\u7D20\u3054\u3068\u306E --to-x / --to-y\u3002\u540C\u3058\u95A2\u6570\u5217(rotateX rotateY)\u3067
   \u88DC\u9593\u3055\u305B\u308B\u3053\u3068\u3067\u3001\u4F59\u5206\u306A2\u56DE\u8EE2\u304C\u305D\u306E\u307E\u307E\u56DE\u308B */
.is-settled .die-cube {
  animation: die-settle 1.15s cubic-bezier(0.12, 0.85, 0.18, 1) both;
}
@keyframes die-settle {
  from {
    transform: rotateX(0deg) rotateY(0deg);
  }
  to {
    transform: rotateX(var(--to-x, 720deg)) rotateY(var(--to-y, 720deg));
  }
}
.die-face {
  position: absolute;
  inset: 0;
  border-radius: 18px;
  padding: 12px;
  background: linear-gradient(145deg, #fffdf7 0%, #f2ece0 45%, #ddd3bd 100%);
  box-shadow:
    inset 0 -5px 10px rgba(0, 0, 0, 0.16),
    inset 0 3px 5px rgba(255, 255, 255, 0.95);
  border: 1px solid rgba(0, 0, 0, 0.18);
  backface-visibility: hidden;
}
.die-face-front {
  transform: rotateY(0deg) translateZ(52px);
}
.die-face-back {
  transform: rotateY(180deg) translateZ(52px);
}
.die-face-right {
  transform: rotateY(90deg) translateZ(52px);
}
.die-face-left {
  transform: rotateY(-90deg) translateZ(52px);
}
.die-face-top {
  transform: rotateX(90deg) translateZ(52px);
}
.die-face-bottom {
  transform: rotateX(-90deg) translateZ(52px);
}
/* \u5730\u9762\u306E\u5F71\u3002\u8DF3\u306D\u308B\u3068\u5C0F\u3055\u304F\u8584\u304F\u3001\u7740\u5730\u3067\u5927\u304D\u304F\u6FC3\u304F */
.die-shadow {
  position: absolute;
  left: 8%;
  right: 8%;
  bottom: -30px;
  height: 18px;
  border-radius: 50%;
  background: radial-gradient(
    ellipse at center,
    rgba(0, 0, 0, 0.6),
    rgba(0, 0, 0, 0) 70%
  );
  transform-origin: center;
  pointer-events: none;
}
.is-rolling .die-shadow {
  animation: die-shadow-roll 0.62s linear infinite;
}
/* \u7740\u5730\u306E\u8DF3\u306D\u8FD4\u308A\u3002\u6B62\u307E\u308A\u306F\u3058\u3081\u306B\u4E00\u5EA6\u3060\u3051 */
.is-settled {
  animation: die-land 1.15s cubic-bezier(0.2, 0.8, 0.3, 1) both;
}
.is-settled .die-shadow {
  animation: die-shadow-land 1.15s cubic-bezier(0.2, 0.8, 0.3, 1) both;
}
@keyframes die-roll {
  0% {
    transform: translateY(0) rotateX(0deg) rotateY(0deg) rotateZ(0deg);
  }
  25% {
    transform: translateY(-36px) rotateX(200deg) rotateY(110deg) rotateZ(18deg);
  }
  50% {
    transform: translateY(0) rotateX(400deg) rotateY(200deg) rotateZ(0deg);
  }
  75% {
    transform: translateY(-22px) rotateX(560deg) rotateY(290deg) rotateZ(-14deg);
  }
  100% {
    transform: translateY(0) rotateX(720deg) rotateY(360deg) rotateZ(0deg);
  }
}
@keyframes die-shadow-roll {
  0%,
  50%,
  100% {
    transform: scale(1);
    opacity: 1;
  }
  25% {
    transform: scale(0.72);
    opacity: 0.55;
  }
  75% {
    transform: scale(0.82);
    opacity: 0.7;
  }
}
@keyframes die-land {
  0% {
    transform: translateY(-30px);
  }
  38% {
    transform: translateY(0);
  }
  58% {
    transform: translateY(-9px);
  }
  76% {
    transform: translateY(0);
  }
  88% {
    transform: translateY(-3px);
  }
  100% {
    transform: translateY(0);
  }
}
@keyframes die-shadow-land {
  0% {
    transform: scale(0.75);
    opacity: 0.55;
  }
  38% {
    transform: scale(1.06);
    opacity: 1;
  }
  58% {
    transform: scale(0.92);
    opacity: 0.85;
  }
  76%,
  100% {
    transform: scale(1);
    opacity: 1;
  }
}
@media (prefers-reduced-motion: reduce) {
  .is-rolling .die-cube,
  .is-rolling .die-shadow,
  .is-settled,
  .is-settled .die-cube,
  .is-settled .die-shadow {
    animation: none;
  }
}

.die-result {
  font-family: "Shippori Mincho", serif;
  font-size: 22px;
  font-weight: 700;
  margin: 4px 0 18px;
  text-shadow: 0 0 14px currentColor;
}
.dice-result-row {
  display: flex;
  gap: 22px;
  justify-content: center;
  margin: 16px 0 10px;
}
.dice-result-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 9px;
  font-size: 12px;
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid transparent;
}
.dice-winner {
  border-color: var(--gold);
  background: rgba(201, 162, 39, 0.1);
}
.capture-eyebrow {
  font-size: 11px;
  letter-spacing: 0.18em;
  color: #e0715c;
  margin-bottom: 8px;
  font-weight: 700;
}
.capture-cards {
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
}
.capture-card {
  animation: capture-pop 0.28s ease-out both;
}
.capture-card:nth-child(2) {
  animation-delay: 0.08s;
}
.capture-card:nth-child(3) {
  animation-delay: 0.16s;
}
.capture-card:nth-child(4) {
  animation-delay: 0.24s;
}
@keyframes capture-pop {
  from {
    transform: scale(0.6);
    opacity: 0;
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}
.cell-heir {
  box-shadow: inset 0 0 0 2px var(--gold-soft);
  cursor: pointer;
}
.piece-dim {
  opacity: 0.35;
}

/* =========================================================================
   \u4FEE\u6B633: \u5E03\u9663\u306E\u5236\u9650\u6642\u9593\u30FB\u30C9\u30E9\u30C3\u30B0\u914D\u7F6E\u30FB\u6301\u3061\u6642\u9593\u30FB\u53D6\u5F97\u78BA\u8A8D\u30FB\u6483\u7834\u6F14\u51FA
   ========================================================================= */

/* --- \u6B8B\u308A\u6642\u9593\u306E\u5E2F --- */
.setup-timer {
  width: 100%;
  max-width: 420px;
  margin: 0 auto 12px;
}
.setup-timer-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-size: 12px;
  color: var(--dim);
  margin-bottom: 4px;
}
.setup-timer-head strong {
  font-size: 18px;
  font-variant-numeric: tabular-nums;
  color: var(--gold-soft);
}
.setup-timer-track {
  height: 6px;
  border-radius: 3px;
  background: rgba(255, 255, 255, 0.09);
  overflow: hidden;
}
.setup-timer-fill {
  height: 100%;
  background: linear-gradient(90deg, #d4af37, #f0d98a);
  transition: width 0.2s linear;
}
.setup-timer-urgent .setup-timer-head strong {
  color: #ef8a76;
}
.setup-timer-urgent .setup-timer-fill {
  background: linear-gradient(90deg, #a8362a, #ef8a76);
}

/* --- \u5E03\u9663\u306E\u30C9\u30E9\u30C3\u30B0\u914D\u7F6E --- */
.mini-board {
  touch-action: none;
}
.mini-cell-hover {
  box-shadow:
    inset 0 0 0 2px var(--gold-soft),
    0 0 10px rgba(212, 175, 55, 0.45);
}
/* \u9078\u3093\u3060\u30AB\u30FC\u30C9\u304C\u52D5\u3051\u308B\u5148 */
.mini-cell-reach::after {
  content: "";
  position: absolute;
  width: 30%;
  height: 30%;
  border-radius: 50%;
  background: var(--gold-soft);
  opacity: 0.7;
  box-shadow: 0 0 8px var(--gold);
  pointer-events: none;
}
.mini-piece-lifted,
.hand-card-lifted {
  opacity: 0.35;
}
.drag-ghost {
  position: fixed;
  z-index: 60;
  transform: translate(-50%, -60%) scale(1.25);
  pointer-events: none;
  filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.6));
}
.legend-dot {
  display: inline-block;
  width: 9px;
  height: 9px;
  margin: 0 3px;
  border-radius: 50%;
  background: var(--gold-soft);
  box-shadow: 0 0 6px var(--gold);
  vertical-align: middle;
}

/* --- \u6301\u3061\u6642\u9593 --- */
.clock-bar {
  display: flex;
  gap: 8px;
  width: 100%;
  margin-bottom: 6px;
}
.clock-cell {
  flex: 1;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  padding: 5px 10px;
  border-radius: 6px;
  border: 1px solid rgba(212, 175, 55, 0.22);
  background: rgba(255, 255, 255, 0.03);
}
.clock-who {
  font-size: 11px;
  color: var(--pc);
}
.clock-time {
  font-size: 17px;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.5px;
}
.clock-active {
  border-color: var(--pc);
  box-shadow: 0 0 10px rgba(212, 175, 55, 0.25);
  background: rgba(255, 255, 255, 0.07);
}
.clock-low .clock-time {
  color: #ef8a76;
}
.clock-active.clock-low {
  animation: clock-pulse 1s ease-in-out infinite;
}
@keyframes clock-pulse {
  50% {
    box-shadow: 0 0 14px rgba(208, 72, 58, 0.55);
  }
}

/* --- \u53D6\u308B\u624B\u306E\u78BA\u8A8D --- */
.capture-confirm {
  max-width: 320px;
  text-align: center;
}
.capture-confirm h3 {
  margin: 0 0 8px;
}
.btn-danger {
  background: linear-gradient(180deg, #d9705c 0%, #b5402f 55%, #7d2a1e 100%);
  color: #fff3ef;
  border-color: #e2896f;
  box-shadow:
    0 3px 0 rgba(0, 0, 0, 0.4),
    inset 0 1px 0 rgba(255, 255, 255, 0.25);
}
.btn-danger:hover {
  filter: brightness(1.08);
}
.btn-danger:active {
  transform: translateY(3px);
  box-shadow: none;
}

/* --- \u53D6\u308C\u308B\u99D2\u306F\u300C\u7167\u6E96\u300D\u3001\u5165\u308C\u66FF\u3048\u306F\u300C\u21C4\u300D\u3002\u5F79\u5272\u3067\u5F62\u3092\u5206\u3051\u308B --- */
.cell-capture::after {
  content: "";
  position: absolute;
  inset: 12%;
  border: 2px solid rgba(255, 138, 118, 0.95);
  border-radius: 50%;
  box-shadow: 0 0 8px rgba(208, 72, 58, 0.8);
  pointer-events: none;
  animation: capture-aim 1.1s ease-in-out infinite;
}
@keyframes capture-aim {
  50% {
    transform: scale(0.86);
    opacity: 0.7;
  }
}

/* --- \u6483\u7834\u306E\u6F14\u51FA --- */
.fx-defeat {
  position: absolute;
  inset: -6%;
  border-radius: 50%;
  pointer-events: none;
  z-index: 3;
  animation: fx-burst 1100ms ease-out forwards;
}
.fx-defeat::before {
  content: "";
  position: absolute;
  inset: 26%;
  border-radius: 50%;
  animation: fx-core 1100ms ease-out forwards;
}
/* \u76F8\u624B\u3092\u5012\u3057\u305F */
.fx-defeat-foe {
  background: radial-gradient(
    circle,
    rgba(255, 226, 160, 0.9) 0%,
    rgba(212, 175, 55, 0.45) 45%,
    transparent 70%
  );
}
.fx-defeat-foe::before {
  background: #fff6dc;
  box-shadow: 0 0 22px 8px rgba(240, 217, 138, 0.85);
}
/* \u5473\u65B9\u304C\u5012\u3055\u308C\u305F */
.fx-defeat-mine {
  background: radial-gradient(
    circle,
    rgba(255, 150, 130, 0.85) 0%,
    rgba(176, 40, 47, 0.45) 45%,
    transparent 70%
  );
}
.fx-defeat-mine::before {
  background: #ffd6cd;
  box-shadow: 0 0 22px 8px rgba(208, 72, 58, 0.8);
}
/* A\u306E\u5305\u56F2\u3067\u53D6\u3063\u305F */
.fx-defeat-surround {
  background: radial-gradient(
    circle,
    rgba(203, 182, 255, 0.9) 0%,
    rgba(143, 111, 214, 0.5) 45%,
    transparent 72%
  );
  animation: fx-close 1200ms ease-out forwards;
}
.fx-defeat-surround::before {
  background: #efe6ff;
  box-shadow: 0 0 24px 9px rgba(155, 126, 222, 0.9);
}
/* \u738B\u304C\u5012\u308C\u305F\u3068\u304D\u306F\u9577\u3081\u306B\u3001\u5F37\u304F\u5149\u3089\u305B\u308B */
.fx-defeat-king {
  animation-duration: 1700ms;
}
.fx-defeat-king::before {
  animation-duration: 1700ms;
}
@keyframes fx-burst {
  0% {
    transform: scale(0.35);
    opacity: 0;
  }
  25% {
    transform: scale(1.05);
    opacity: 1;
  }
  100% {
    transform: scale(1.5);
    opacity: 0;
  }
}
@keyframes fx-close {
  0% {
    transform: scale(1.7);
    opacity: 0;
  }
  35% {
    transform: scale(0.9);
    opacity: 1;
  }
  100% {
    transform: scale(0.5);
    opacity: 0;
  }
}
@keyframes fx-core {
  0% {
    transform: scale(0.2);
    opacity: 1;
  }
  60% {
    transform: scale(1);
    opacity: 0.9;
  }
  100% {
    transform: scale(1.4);
    opacity: 0;
  }
}
@media (prefers-reduced-motion: reduce) {
  .fx-defeat,
  .fx-defeat::before,
  .cell-capture::after,
  .clock-active.clock-low {
    animation: none;
  }
}

/* =========================================================================
   \u30B9\u30DE\u30FC\u30C8\u30D5\u30A9\u30F3\u3067\u306E\u64CD\u4F5C\u3092\u524D\u63D0\u306B\u3057\u305F\u8ABF\u6574
   ========================================================================= */

/* \u63B4\u3093\u3060\u6307\u304C\u30DA\u30FC\u30B8\u306E\u30B9\u30AF\u30ED\u30FC\u30EB\u306B\u53D6\u3089\u308C\u306A\u3044\u3088\u3046\u306B\u3059\u308B */
.hand-card,
.mini-piece,
.mini-cell,
.drag-ghost {
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
/* \u5E03\u9663\u306E\u624B\u672D\u306F\u3001\u76E4\u3068\u4E26\u3079\u3066\u30821\u753B\u9762\u306B\u53CE\u307E\u308B\u5927\u304D\u3055\u306B\u3059\u308B */
.setup-wrap .tray-row {
  gap: 4px;
}
.hint-count {
  margin-left: 6px;
  color: var(--gold-soft);
  font-variant-numeric: tabular-nums;
}
/* \u6307\u3067\u62BC\u305B\u308B\u5927\u304D\u3055\u3092\u78BA\u4FDD\u3059\u308B */
.btn {
  min-height: 46px;
  justify-content: center;
}
.setup-actions .btn {
  flex: 1;
  min-width: 0;
}
.capture-confirm .btn {
  flex: 1;
}
/* \u30CE\u30C3\u30C1\u3068\u30DB\u30FC\u30E0\u30A4\u30F3\u30B8\u30B1\u30FC\u30BF\u3092\u907F\u3051\u308B */
.tottery-root {
  padding-bottom: env(safe-area-inset-bottom);
}
.top-bar {
  padding-top: max(6px, env(safe-area-inset-top));
}
@media (max-width: 390px) {
  .setup-wrap h2 {
    font-size: 17px;
  }
  .clock-time {
    font-size: 15px;
  }
}

/* =========================================================================
   \u30C1\u30E5\u30FC\u30C8\u30EA\u30A2\u30EB\u3068\u30D7\u30EC\u30A4\u30E4\u30FC\u30EC\u30D9\u30EB
   ========================================================================= */

.level-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  margin-bottom: 10px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: rgba(212, 175, 55, 0.08);
  color: var(--gold-soft);
  font-weight: 700;
}
.level-badge small {
  color: var(--text-dim);
  font-weight: 400;
}
.level-up {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 8px;
  color: var(--gold-soft);
}

.menu-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 100%;
  max-width: 420px;
  margin: 12px auto;
}
.menu-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  width: 100%;
  min-height: 62px;
  padding: 12px 16px;
  text-align: left;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--btn-face);
  color: var(--text);
  font-family: "Shippori Mincho", serif;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}
.menu-item:active {
  background: var(--btn-face-hi);
}
.menu-item-main {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}
.menu-item-main small {
  font-weight: 400;
  font-size: 12px;
  color: var(--text-dim);
}
.menu-item-side {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  flex: none;
  font-size: 12px;
  color: var(--gold-soft);
  white-space: nowrap;
}
.menu-item-locked {
  opacity: 0.45;
  cursor: not-allowed;
}
.menu-item-locked .menu-item-side {
  color: var(--text-dim);
}

/* \u8AAC\u660E\u306E\u5E2F\u3002\u76E4\u3092\u96A0\u3055\u306A\u3044\u3088\u3046\u4E0B\u304B\u3089\u51FA\u3059 */
.tutorial-sheet {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 50;
  padding: 0 10px calc(10px + env(safe-area-inset-bottom));
  pointer-events: none;
}
.tutorial-sheet-inner {
  pointer-events: auto;
  max-width: 460px;
  margin: 0 auto;
  padding: 14px 16px 12px;
  border-radius: 14px 14px 10px 10px;
  border: 1px solid var(--line);
  border-bottom-color: transparent;
  background: linear-gradient(180deg, #16294a 0%, #0e1c33 100%);
  box-shadow: 0 -8px 26px rgba(0, 0, 0, 0.55);
  animation: sheet-rise 220ms ease-out;
}
@keyframes sheet-rise {
  from {
    transform: translateY(18px);
    opacity: 0;
  }
}
.tutorial-sheet-inner h3 {
  margin: 8px 0 8px;
  color: var(--gold-soft);
  font-size: 17px;
}
.tutorial-sheet-inner p {
  margin: 0 0 8px;
  font-size: 13.5px;
  line-height: 1.75;
  color: var(--text);
}
.tutorial-next {
  width: 100%;
  margin-top: 4px;
}
.tutorial-progress {
  display: flex;
  gap: 4px;
}
.tutorial-progress span {
  flex: 1;
  height: 3px;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.14);
}
.tutorial-progress span.on {
  background: var(--gold);
}
@media (prefers-reduced-motion: reduce) {
  .tutorial-sheet-inner {
    animation: none;
  }
}

/* \u8AAC\u660E\u306E\u5E2F\u304C\u51FA\u3066\u3044\u308B\u3042\u3044\u3060\u306F\u3001\u305D\u306E\u5206\u3060\u3051\u4E0B\u306B\u4F59\u767D\u3092\u8DB3\u3057\u3066\u96A0\u308C\u306A\u3044\u3088\u3046\u306B\u3059\u308B */
.stage-with-sheet {
  padding-bottom: 240px;
}

/* \u30C1\u30E5\u30FC\u30C8\u30EA\u30A2\u30EB\u306E\u5165\u308A\u53E3\u3002\u4ED6\u306E3\u3064\u3068\u4E26\u3079\u3066\u3082\u6D6E\u304B\u306A\u3044\u8272\u306B\u3059\u308B */
.btn-scroll {
  background: linear-gradient(180deg, #4a3a72, #2c2148);
  color: #e2d6ff;
  border: 1px solid rgba(203, 182, 255, 0.38);
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.35);
}
.btn-scroll:hover {
  filter: brightness(1.1);
}
.btn-scroll:active {
  transform: translateY(3px);
  box-shadow: none;
}

/* \u30C6\u30B9\u30C8\u30D7\u30EC\u30A4\u4E2D\u3067\u3042\u308B\u3053\u3068\u3092\u3001\u3069\u306E\u753B\u9762\u3067\u3082\u898B\u5931\u308F\u306A\u3044\u3088\u3046\u306B\u3059\u308B */
.test-badge {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  top: calc(4px + env(safe-area-inset-top));
  z-index: 70;
  padding: 3px 12px;
  border-radius: 999px;
  border: 1px solid rgba(240, 217, 138, 0.5);
  background: rgba(10, 19, 34, 0.9);
  color: var(--gold-soft);
  font-size: 11px;
  letter-spacing: 0.08em;
  pointer-events: none;
}

/* =========================================================================
   \u30C1\u30E5\u30FC\u30C8\u30EA\u30A2\u30EB: \u6B21\u306B\u64CD\u4F5C\u3059\u308B\u5834\u6240\u3092\u5149\u3089\u305B\u308B
   ========================================================================= */

.guide-target {
  position: relative;
  outline: 2px solid var(--gold-soft);
  outline-offset: 1px;
  border-radius: 4px;
  animation: guide-pulse 1.4s ease-in-out infinite;
  z-index: 2;
}
/* \u30C1\u30E5\u30FC\u30C8\u30EA\u30A2\u30EB\u4E2D\u306F\u3001\u62BC\u3057\u3066\u307B\u3057\u3044\u30DC\u30BF\u30F3\u3092\u5FC5\u305A\u5149\u3089\u305B\u308B */
.focus-button .btn-primary:not(.tutorial-next):not(:disabled),
.focus-button .btn-danger:not(:disabled) {
  animation: guide-pulse 1.4s ease-in-out infinite;
  outline: 2px solid var(--gold-soft);
  outline-offset: 2px;
}
@keyframes guide-pulse {
  0%,
  100% {
    box-shadow: 0 0 0 0 rgba(240, 217, 138, 0.55);
  }
  55% {
    box-shadow: 0 0 12px 5px rgba(240, 217, 138, 0);
  }
}

/* \u8AAC\u660E\u306F1\u301C2\u884C\u306B\u53CE\u3081\u308B\u3002\u8AAD\u307E\u305B\u308B\u3088\u308A\u3001\u52D5\u304B\u3057\u3066\u3082\u3089\u3046 */
.tutorial-line {
  margin: 10px 0 12px;
  font-size: 15px;
  line-height: 1.7;
  color: var(--text);
}
/* \u4E0A\u306E\u30D0\u30FC\u306E\u300C\u30C8\u30C3\u30BF\u30EA\u30FC\u300D\u3002\u62BC\u305B\u308B\u304C\u3001\u898B\u305F\u76EE\u306F\u6587\u5B57\u306E\u307E\u307E */
.brand-link {
  background: none;
  border: 0;
  padding: 0;
  margin: 0;
  cursor: pointer;
}
.brand-link:active {
  opacity: 0.75;
}

/* --- \u79F0\u53F7 --- */
.title-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin: 3px 0 2px;
  padding: 2px 9px;
  border-radius: 999px;
  border: 1px solid var(--gold);
  background: rgba(212, 175, 55, 0.12);
  color: var(--gold-soft);
  font-size: 11px;
  font-family: "Shippori Mincho", serif;
  font-weight: 700;
  cursor: pointer;
}
.title-tag-edit {
  font-family: inherit;
  font-weight: 400;
  font-size: 10px;
  color: var(--text-dim);
}
.title-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin: 14px 0;
  max-height: 46vh;
  overflow-y: auto;
}
.title-choice {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: rgba(9, 20, 38, 0.6);
  color: var(--text);
  text-align: left;
  cursor: pointer;
}
.title-choice b {
  font-family: "Shippori Mincho", serif;
}
.title-choice small {
  font-size: 11px;
  color: var(--text-dim);
  flex: none;
}
.title-choice-on {
  border-color: var(--gold);
  background: rgba(212, 175, 55, 0.16);
  color: var(--gold-soft);
}
.title-choice-locked {
  opacity: 0.45;
  cursor: default;
}
/* \u6642\u8A08\u306E\u6B04: \u540D\u524D\u306E\u4E0B\u306B\u79F0\u53F7 */
.clock-name {
  display: flex;
  flex-direction: column;
  line-height: 1.15;
  min-width: 0;
}
/* \u540D\u524D\u306B\u6DFB\u3048\u308B\u79F0\u53F7(\u6642\u8A08\u306E\u6B04\u30FB\u9854\u3076\u308C) */
.seat-title {
  display: block;
  font-style: normal;
  font-size: 10px;
  line-height: 1.2;
  color: var(--gold-soft);
  opacity: 0.9;
}
/* \u5BFE\u6226\u306E\u9854\u3076\u308C\u3002\u30B5\u30A4\u30B3\u30ED\u306E\u5834\u9762\u306E\u4E0A\u306B\u51FA\u3059 */
.matchup {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  margin: 4px auto 10px;
  padding: 8px 14px;
  max-width: 440px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: rgba(9, 20, 38, 0.55);
}
.matchup-side {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}
.matchup-who {
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.matchup-who b {
  font-size: 13px;
  overflow-wrap: anywhere;
}
.matchup-vs {
  color: var(--gold);
  font-family: "Shippori Mincho", serif;
  font-weight: 700;
  font-size: 13px;
}

.tutorial-wait {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  margin: 0;
  padding: 10px 0 4px;
  color: var(--gold-soft);
  font-size: 13px;
}

/* \u53F0\u672C\u306B\u306A\u3044\u624B\u3092\u6307\u3057\u305F\u3068\u304D\u306E\u8FD4\u4E8B\u3002\u3044\u3064\u3082\u306E\u6848\u5185\u3068\u898B\u5206\u3051\u304C\u3064\u304F\u3088\u3046\u306B */
.tutorial-wait.tutorial-nudge {
  color: var(--card-red);
}

@media (prefers-reduced-motion: reduce) {
  .guide-target,
  .focus-button .btn-primary:not(.tutorial-next):not(:disabled),
  .focus-button .btn-danger:not(:disabled) {
    animation: none;
  }
}

/* =========================================================================
   \u99D2\u306E\u52D5\u304D\u3068\u3001\u53D6\u3063\u305F/\u53D6\u3089\u308C\u305F\u306E\u6F14\u51FA
   ========================================================================= */

/* \u99D2\u306E\u5165\u308C\u7269\u3092\u30DE\u30B9\u5168\u4F53\u306B\u5E83\u3052\u308B\u3002
   \u3053\u3046\u3059\u308B\u3068\u300C1\u30DE\u30B9\u3076\u3093\u300D\u3092 translate(100%) \u3067\u8868\u305B\u308B */
.piece-slot {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* \u51FA\u767A\u70B9\u304B\u3089\u30011\u30DE\u30B9\u305A\u3064\u8DF3\u3093\u3067\u5230\u7740\u70B9\u307E\u3067\u9032\u3080\u3002
   steps(..., jump-none) \u3067\u3001\u9014\u4E2D\u306E\u30DE\u30B9\u306B\u3082\u5FC5\u305A\u4E00\u5EA6\u7ACB\u3064 */
.piece-stepping {
  animation: piece-step var(--ms) steps(var(--stops), jump-none) both;
  z-index: 4;
}
@keyframes piece-step {
  from {
    transform: translate(calc(var(--sx) * 100%), calc(var(--sy) * 100%));
  }
  to {
    transform: translate(0, 0);
  }
}

/* \u4F55\u4F53\u3082\u307E\u3068\u3081\u3066\u53D6\u308B\u3068\u304D\u306F\u3001\u624B\u524D\u304B\u3089\u9806\u306B1\u4F53\u305A\u3064\u5149\u3089\u305B\u308B */
.fx-defeat {
  animation-delay: calc(260ms + var(--i, 0) * 440ms);
}
.fx-defeat::before {
  animation-delay: calc(260ms + var(--i, 0) * 440ms);
}

/* \u53D6\u3063\u305F/\u53D6\u3089\u308C\u305F\u3092\u3001\u8272\u3068\u5E83\u304C\u308A\u65B9\u3067\u898B\u5206\u3051\u3089\u308C\u308B\u3088\u3046\u306B\u3059\u308B */
.fx-defeat::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 3px solid currentColor;
  opacity: 0;
  animation: fx-ring 1100ms ease-out both;
  animation-delay: calc(260ms + var(--i, 0) * 440ms);
}
.fx-defeat-foe {
  color: #f0d98a;
}
.fx-defeat-mine {
  color: #ef8a76;
}
.fx-defeat-surround {
  color: #cbb6ff;
}
@keyframes fx-ring {
  0% {
    transform: scale(0.3);
    opacity: 0.95;
  }
  100% {
    transform: scale(2.1);
    opacity: 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  .piece-stepping,
  .fx-defeat::after {
    animation: none;
  }
}

/* \u53D6\u3063\u305F\u99D2\u304C\u738B\u3060\u3063\u305F\u3068\u5206\u304B\u308B\u77AC\u9593 */
.capture-eyebrow-king {
  animation: king-reveal 500ms ease-out both;
}
.capture-card-king {
  position: relative;
  animation: king-reveal 500ms ease-out both;
  filter: drop-shadow(0 0 12px rgba(240, 217, 138, 0.9));
}
.capture-crown {
  position: absolute;
  top: -12px;
  left: 50%;
  transform: translateX(-50%);
  color: var(--gold-soft);
  filter: drop-shadow(0 0 6px rgba(212, 175, 55, 0.9));
}
@keyframes king-reveal {
  0% {
    transform: scale(0.86);
    opacity: 0.2;
  }
  60% {
    transform: scale(1.06);
    opacity: 1;
  }
  100% {
    transform: scale(1);
    opacity: 1;
  }
}
@media (prefers-reduced-motion: reduce) {
  .capture-eyebrow-king,
  .capture-card-king {
    animation: none;
  }
}

/* \u5BFE\u5C40\u306E\u8A18\u9332\u3002\u8AB0\u304C\u4F55\u3092\u3057\u305F\u306E\u304B\u3001\u8272\u3067\u8FFD\u3048\u308B\u3088\u3046\u306B\u3059\u308B */
.log-list {
  padding-left: 0;
  list-style: none;
}
.log-row {
  position: relative;
  padding: 5px 8px 5px 12px;
  border-left: 3px solid var(--who, transparent);
  border-radius: 0 5px 5px 0;
  background: rgba(255, 255, 255, 0.03);
  margin-bottom: 4px;
}
.log-row:nth-child(even) {
  background: rgba(255, 255, 255, 0.06);
}
.log-who {
  font-weight: 700;
}

/* \u6557\u5317\u306E\u753B\u9762\u3002\u52DD\u5229\u3068\u306F\u5225\u306E\u898B\u3048\u65B9\u306B\u3059\u308B */
.defeat-panel {
  border-color: rgba(208, 72, 58, 0.45);
  box-shadow: 0 0 34px rgba(120, 30, 24, 0.4);
}
.defeat-mark {
  color: #c9544a;
  filter: drop-shadow(0 0 8px rgba(208, 72, 58, 0.5));
}
.defeat-title {
  color: #e08b7a;
  letter-spacing: 0.16em;
}
.defeat-lead {
  margin: -4px 0 0;
  font-size: 13px;
  color: var(--text-dim);
}
/* \u738B\u306E\u7D75\u306F\u3001\u52DD\u3063\u305F\u3068\u304D\u306F\u8F1D\u304D\u3001\u8CA0\u3051\u305F\u3068\u304D\u306F\u8272\u3092\u5931\u3046 */
.lose-card img {
  filter: grayscale(0.85) brightness(0.5) contrast(0.9);
}
.lose-card {
  animation: lose-fade 900ms ease-out both;
}
@keyframes lose-fade {
  from {
    opacity: 0;
    transform: scale(1.04);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}
@media (prefers-reduced-motion: reduce) {
  .lose-card {
    animation: none;
  }
}

/* \u4F0F\u305B\u305F\u672D\u3092\u3081\u304F\u308B\u3002\u6700\u5F8C\u306E1\u679A\u3067\u738B\u304B\u3069\u3046\u304B\u304C\u5206\u304B\u308B */
.capture-card-open {
  animation: card-flip 380ms ease-out both;
}
@keyframes card-flip {
  0% {
    transform: rotateY(90deg) scale(0.9);
    opacity: 0.3;
  }
  60% {
    transform: rotateY(-8deg) scale(1.04);
    opacity: 1;
  }
  100% {
    transform: rotateY(0) scale(1);
    opacity: 1;
  }
}

/* \u8A18\u9332\u306E\u884C\u3092\u62BC\u3059\u3068\u3001\u305D\u306E\u6642\u70B9\u306E\u76E4\u9762\u304C\u898B\u3089\u308C\u308B */
.log-row-tap {
  cursor: pointer;
  padding-right: 46px;
}
.log-row-tap:hover {
  background: rgba(255, 255, 255, 0.1);
}
.log-row-active {
  background: rgba(212, 175, 55, 0.16);
  box-shadow: inset 0 0 0 1px rgba(212, 175, 55, 0.4);
}
.log-peek {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 10px;
  letter-spacing: 0.06em;
  color: var(--gold-soft);
  border: 1px solid rgba(212, 175, 55, 0.4);
  border-radius: 3px;
  padding: 1px 5px;
  opacity: 0.75;
}
.log-row-active .log-peek {
  opacity: 1;
  background: rgba(212, 175, 55, 0.2);
}

/* =========================================================================
   \u5BFE\u5C40\u306E\u8A18\u9332\u304B\u3089\u76E4\u9762\u3092\u898B\u308B\u3068\u304D
   ========================================================================= */

/* \u3069\u3061\u3089\u306E\u8ECD\u306E\u99D2\u304B\u3092\u3001\u67A0\u306E\u8272\u3067\u898B\u5206\u3051\u3089\u308C\u308B\u3088\u3046\u306B\u3059\u308B */
.side-ring::before {
  content: "";
  position: absolute;
  inset: -2px;
  border: 2px solid var(--who);
  border-radius: 7px;
  box-shadow: 0 0 7px color-mix(in srgb, var(--who) 55%, transparent);
  pointer-events: none;
}
.side-legend {
  display: flex;
  gap: 14px;
  justify-content: center;
  margin-bottom: 10px;
  font-size: 12px;
}
.side-key {
  color: var(--who);
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.side-key::before {
  content: "";
  width: 11px;
  height: 11px;
  border-radius: 3px;
  border: 2px solid var(--who);
  box-shadow: 0 0 6px color-mix(in srgb, var(--who) 55%, transparent);
}

/* \u305D\u306E\u624B\u3067\u99D2\u304C\u3069\u3053\u304B\u3089\u3069\u3053\u3078\u52D5\u304D\u3001\u3069\u3053\u304C\u5012\u308C\u305F\u304B\u3002
   \u99D2\u3068\u30DE\u30B9\u306F\u307B\u307C\u540C\u3058\u5927\u304D\u3055\u306A\u306E\u3067\u3001\u67A0\u3067\u793A\u3059\u3068\u6301\u3061\u4E3B\u306E\u8272\u67A0\u3068\u91CD\u306A\u3063\u3066\u6FC1\u308B\u3002
   \u51FA\u767A\u70B9(\u7A7A\u304D\u30DE\u30B9)\u3060\u3051\u67A0\u3067\u793A\u3057\u3001\u99D2\u304C\u3044\u308B\u30DE\u30B9\u306F\u89D2\u306E\u3057\u308B\u3057\u3067\u793A\u3059 */
.cell.trace-from::after {
  content: "";
  position: absolute;
  inset: 1px;
  border-radius: 5px;
  border: 2px dashed var(--gold-soft);
  background: rgba(212, 175, 55, 0.16);
  pointer-events: none;
  z-index: 1;
}
.cell.trace-to {
  background: rgba(212, 175, 55, 0.22);
}
.cell.trace-taken {
  background: rgba(214, 60, 70, 0.4);
}
/* \u8DE1\u306E\u67A0\u306F\u99D2\u306E\u4E0B\u306B\u6577\u304F\u3002\u99D2\u306E\u6301\u3061\u4E3B\u3092\u793A\u3059\u8272\u67A0\u3092\u96A0\u3055\u306A\u3044\u305F\u3081 */
.review-panel .piece-wrap {
  z-index: 2;
}
.trace-pin {
  position: absolute;
  top: 1px;
  min-width: 16px;
  height: 16px;
  padding: 0 3px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  line-height: 16px;
  text-align: center;
  z-index: 4;
  pointer-events: none;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
}
.trace-pin-to {
  left: 1px;
  background: var(--gold);
  color: #1b1405;
}
.trace-pin-taken {
  right: 1px;
  background: #d63c46;
  color: #fff;
}
.trace-legend {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  margin-bottom: 10px;
  font-size: 11px;
}
.trace-key {
  padding: 3px 8px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.trace-key-from {
  border: 1px dashed var(--gold-soft);
  color: var(--gold-soft);
  background: rgba(212, 175, 55, 0.16);
}
.trace-key-to {
  border: 1px solid transparent;
  color: var(--gold);
  background: rgba(212, 175, 55, 0.22);
}
.trace-key-to::before {
  content: "\u7740";
  background: var(--gold);
  color: #1b1405;
  border-radius: 999px;
  padding: 0 4px;
  font-weight: 700;
}
.trace-key-taken {
  border: 1px solid transparent;
  background: rgba(214, 60, 70, 0.4);
  color: #ffc2c5;
}
.trace-key-taken::before {
  content: "\\00d7";
  background: #d63c46;
  color: #fff;
  border-radius: 999px;
  padding: 0 5px;
  font-weight: 700;
}

/* =========================================================================
   \u5E03\u9663\u30DC\u30FC\u30CA\u30B9
   ========================================================================= */

.bonus-panel {
  text-align: center;
  max-width: 380px;
}
.bonus-eyebrow {
  color: var(--gold);
  letter-spacing: 0.18em;
  font-size: 12px;
  margin: 0 0 12px;
}
.bonus-list {
  list-style: none;
  padding: 0;
  margin: 0 0 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.bonus-row {
  display: flex;
  align-items: center;
  gap: 9px;
  justify-content: center;
  font-size: 13px;
}
.bonus-tag {
  border: 1px solid var(--who);
  color: var(--who);
  border-radius: 999px;
  padding: 2px 10px;
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
}
.bonus-note {
  font-size: 13px;
  color: var(--gold-soft);
  margin: 0 0 12px;
  line-height: 1.6;
}
.bonus-cards {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.bonus-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.bonus-card-who {
  font-size: 11px;
}

/* \u516C\u958B\u3055\u308C\u3066\u3057\u307E\u3063\u305F\u99D2\u306E\u76EE\u5370 */
.revealed-badge {
  position: absolute;
  bottom: -4px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--gold);
  color: #1b1405;
  font-size: 9px;
  font-weight: 700;
  line-height: 1;
  padding: 2px 5px;
  border-radius: 999px;
  pointer-events: none;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
}

/* \u8A18\u9332\u304B\u3089\u52D5\u304D\u3092\u898B\u308B\u3068\u304D\u306E\u64CD\u4F5C */
.review-controls {
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 10px;
}
/* \u52D5\u3044\u3066\u3044\u308B\u99D2\u3088\u308A\u3001\u3057\u308B\u3057\u3092\u4E0A\u306B\u51FA\u3059 */
.trace-pin {
  z-index: 6;
}

/* =========================================================================
   \u30D7\u30EC\u30A4\u30E4\u30FC\u306E\u540D\u524D
   ========================================================================= */

.name-stage {
  padding: 20px 16px;
}
.name-card {
  width: 100%;
  max-width: 360px;
  text-align: center;
}
.name-eyebrow {
  color: var(--gold);
  letter-spacing: 0.18em;
  font-size: 12px;
  margin: 0 0 6px;
}
.name-input {
  width: 100%;
  margin: 16px 0 6px;
  padding: 14px 12px;
  font-size: 18px;
  text-align: center;
  color: var(--ink);
  background: rgba(9, 20, 38, 0.9);
  border: 2px solid var(--gold);
  border-radius: 10px;
  /* 16px \u672A\u6E80\u3060\u3068 iOS \u304C\u52DD\u624B\u306B\u62E1\u5927\u3059\u308B */
  -webkit-appearance: none;
}
.name-input:focus {
  outline: none;
  box-shadow: 0 0 12px rgba(212, 175, 55, 0.5);
}
.name-input-bad {
  border-color: #d63c46;
}
.name-note {
  font-size: 12px;
  color: var(--gold-soft);
  margin: 0 0 16px;
}
.name-note-bad {
  color: #ffb3b7;
}

/* =========================================================================
   \u8A2D\u5B9A\u753B\u9762
   ========================================================================= */

.settings-panel {
  text-align: left;
  /* \u4E2D\u8EAB\u304C\u7E26\u306B\u9577\u3044\u306E\u3067\u3001\u753B\u9762\u3092\u3082\u3046\u5C11\u3057\u4F7F\u3046 */
  max-height: 88vh;
}
.settings-head {
  margin: 18px 0 8px;
  font-size: 11px;
  letter-spacing: 0.16em;
  color: var(--gold);
}
.settings-head:first-of-type {
  margin-top: 4px;
}
.settings-note {
  margin: 16px 0 14px;
  font-size: 12px;
  line-height: 1.7;
  color: var(--text-dim);
}

/* \u30A2\u30AB\u30A6\u30F3\u30C8\u306E\u672D */
.account-card {
  background: rgba(9, 20, 38, 0.66);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 14px;
}
.account-head {
  display: flex;
  align-items: center;
  gap: 12px;
}
/* \u540D\u524D\u306E1\u6587\u5B57\u76EE\u3092\u5370\u306B\u3059\u308B */
.account-mark {
  width: 44px;
  height: 44px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 50%;
  border: 2px solid var(--gold);
  background: linear-gradient(160deg, #1b3559, #0d1c33);
  color: var(--gold-soft);
  font-size: 20px;
  font-weight: 700;
}
.account-id {
  flex: 1;
  min-width: 0;
}
.account-name {
  display: block;
  font-size: 17px;
  color: var(--ink);
  /* \u9577\u3044\u540D\u524D\u3067\u3082\u672D\u3092\u58CA\u3055\u306A\u3044 */
  overflow-wrap: anywhere;
}
.account-sub {
  font-size: 12px;
  color: var(--gold-soft);
}
.btn-small {
  flex: none;
  padding: 7px 10px;
  font-size: 11px;
  min-height: 0;
}

/* \u6B21\u306E\u30EC\u30D9\u30EB\u307E\u3067\u306E\u9032\u307F\u5177\u5408 */
.level-bar {
  height: 6px;
  margin: 14px 0 6px;
  border-radius: 999px;
  background: rgba(212, 175, 55, 0.16);
  overflow: hidden;
}
.level-fill {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--gold-soft), var(--gold));
}
.level-note {
  margin: 0 0 14px;
  font-size: 11px;
  color: var(--text-dim);
}

/* \u5BFE\u5C40\u6570\u30FB\u52DD\u3061\u30FB\u52DD\u7387 */
.stat-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  border-top: 1px solid var(--line);
  padding-top: 12px;
}
.stat {
  text-align: center;
}
.stat b {
  display: block;
  font-size: 20px;
  color: var(--gold-soft);
  font-variant-numeric: tabular-nums;
}
.stat span {
  font-size: 11px;
  color: var(--text-dim);
}

/* =========================================================================
   \u30D7\u30EC\u30A4\u30E4\u30FC\u306E\u30A2\u30A4\u30B3\u30F3
   ========================================================================= */

.player-icon {
  display: inline-grid;
  place-items: center;
  flex: none;
  border-radius: 50%;
  border: 2px solid var(--who, var(--gold));
  background: linear-gradient(160deg, #1b3559, #0d1c33);
  color: var(--who, var(--gold-soft));
  line-height: 1;
  font-weight: 700;
}
.player-icon-sm {
  width: 20px;
  height: 20px;
  font-size: 11px;
}
.player-icon-md {
  width: 34px;
  height: 34px;
  font-size: 16px;
}
.player-icon-lg {
  width: 44px;
  height: 44px;
  font-size: 20px;
}

/* \u8A2D\u5B9A\u306E\u672D\u306E\u30A2\u30A4\u30B3\u30F3\u3002\u62BC\u3059\u3068\u9078\u3073\u76F4\u305B\u308B */
.account-mark {
  position: relative;
  padding: 0;
  border: 0;
  background: none;
  cursor: pointer;
}
.account-mark-edit {
  position: absolute;
  left: 50%;
  bottom: -7px;
  transform: translateX(-50%);
  background: var(--gold);
  color: #1b1405;
  font-size: 9px;
  font-weight: 700;
  line-height: 1;
  padding: 2px 5px;
  border-radius: 999px;
  white-space: nowrap;
}

/* \u30A2\u30A4\u30B3\u30F3\u3092\u9078\u3076\u753B\u9762 */
.icon-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin: 14px 0;
}
.icon-choice {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 10px 4px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: rgba(9, 20, 38, 0.6);
  color: var(--text-dim);
  cursor: pointer;
}
.icon-choice-on {
  border-color: var(--gold);
  background: rgba(212, 175, 55, 0.16);
  color: var(--gold-soft);
}
.icon-choice-locked {
  opacity: 0.38;
  cursor: default;
}
.icon-label {
  font-size: 10px;
  text-align: center;
  line-height: 1.3;
}

/* \u6642\u8A08\u306E\u6B04\u3002\u30A2\u30A4\u30B3\u30F3\u3068\u540D\u524D\u3092\u4E26\u3079\u308B\u3002
   \u5BFE\u5C40\u4E2D\u306E\u30B9\u30BF\u30F3\u30D7\u306F\u3001\u3053\u306E\u6B04\u3092\u8D77\u70B9\u306B\u51FA\u3059\u4E88\u5B9A\u306A\u306E\u3067\u4F4D\u7F6E\u3092\u6C7A\u3081\u3066\u304A\u304F */
.clock-cell {
  position: relative;
}
.clock-who {
  display: flex;
  align-items: center;
  gap: 5px;
  min-width: 0;
}

/* \u5BFE\u5C40\u5F8C\u306E\u30EC\u30FC\u30C6\u30A3\u30F3\u30B0\u306E\u5897\u6E1B */
.rating-change {
  margin: 14px 0 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.rating-label {
  font-size: 11px;
  letter-spacing: 0.16em;
  color: var(--gold);
}
.rating-nums {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-size: 17px;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
}
.rating-nums b {
  font-size: 24px;
  color: var(--ink);
}
.rating-arrow {
  color: var(--gold-soft);
}
.rating-delta {
  font-size: 15px;
  font-weight: 700;
}
.rating-delta.up {
  color: #7fd6a0;
}
.rating-delta.down {
  color: #e2896f;
}

/* =========================================================================
   \u30E9\u30F3\u30AD\u30F3\u30B0
   ========================================================================= */

.rank-wrap {
  width: 100%;
  max-width: 460px;
  margin: 0 auto;
  padding: 8px 4px 24px;
  text-align: center;
}
.rank-me {
  display: flex;
  align-items: center;
  gap: 12px;
  text-align: left;
  margin: 14px 0 18px;
  padding: 12px 14px;
  border-radius: 10px;
  border: 1px solid var(--gold);
  background: rgba(212, 175, 55, 0.1);
}
.rank-me-id {
  flex: 1;
  min-width: 0;
}
.rank-me-id b {
  display: block;
  color: var(--ink);
  overflow-wrap: anywhere;
}
.rank-me-sub {
  font-size: 11px;
  color: var(--text-dim);
}
.rank-me-score {
  text-align: right;
  flex: none;
}
.rank-me-score b {
  display: block;
  font-size: 22px;
  color: var(--gold-soft);
  font-variant-numeric: tabular-nums;
}
.rank-me-score span {
  font-size: 11px;
  color: var(--text-dim);
}
.rank-list {
  list-style: none;
  margin: 0 0 16px;
  padding: 0;
  text-align: left;
}
.rank-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 8px;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
}
.rank-row-me {
  background: rgba(212, 175, 55, 0.12);
  border-radius: 8px;
}
.rank-place {
  width: 26px;
  flex: none;
  text-align: right;
  color: var(--gold-soft);
  font-variant-numeric: tabular-nums;
}
.rank-name {
  flex: 1;
  min-width: 0;
  color: var(--ink);
  overflow-wrap: anywhere;
}
.rank-title {
  flex: none;
  font-size: 11px;
  color: var(--text-dim);
}
.rank-score {
  flex: none;
  width: 46px;
  text-align: right;
  color: var(--gold-soft);
  font-variant-numeric: tabular-nums;
}
.rank-note {
  margin-top: 18px;
  font-size: 11px;
  line-height: 1.7;
}

/* =========================================================================
   \u8AAD\u3093\u3067\u304B\u3089\u6C7A\u3081\u308B\u56DE\u306E\u6848\u5185
   ========================================================================= */

/* \u76E4\u306E\u624B\u524D\u306B\u51FA\u3057\u3066\u3001\u8AAD\u307F\u7D42\u308F\u308B\u307E\u3067\u64CD\u4F5C\u3092\u6B62\u3081\u308B\u3002
   \u5E55\u306F\u8584\u304F\u3059\u308B\u3002\u8AAC\u660E\u304C\u6307\u3057\u3066\u3044\u308B\u3082\u306E(\u6368\u3066\u672D\u306A\u3069)\u304C\u5F8C\u308D\u3067\u898B\u3048\u306A\u304F\u306A\u308B\u3068\u3001
   \u304B\u3048\u3063\u3066\u5206\u304B\u3089\u306A\u304F\u306A\u308B\u305F\u3081 */
.tutorial-sheet-front {
  top: 0;
  /* \u6483\u7834\u306E\u672D\u306A\u3069\u306E\u30E2\u30FC\u30C0\u30EB(z-index: 50)\u3088\u308A\u4E0B\u3002\u8986\u3046\u3068\u9589\u3058\u3089\u308C\u306A\u304F\u306A\u308B */
  z-index: 40;
  display: flex;
  /* \u76E4\u306E\u4E0A\u306B\u91CD\u306D\u308B\u3002\u4E0B\u306B\u5BC4\u305B\u308B\u3068\u76E4\u3092\u898B\u3066\u3044\u3066\u6C17\u3065\u304B\u306A\u3044 */
  align-items: center;
  justify-content: center;
  padding-bottom: calc(24px + env(safe-area-inset-bottom));
  background: rgba(4, 10, 20, 0.38);
  /* \u3053\u3053\u3067\u6307\u3092\u53D7\u3051\u6B62\u3081\u3066\u3001\u5F8C\u308D\u306E\u76E4\u3092\u89E6\u3089\u305B\u306A\u3044 */
  pointer-events: auto;
}
/* \u99D2\u3084\u30DE\u30B9\u3092\u5149\u3089\u305B\u3066\u3044\u308B\u672D\u306F\u4E0B\u5BC4\u305B\u3002\u771F\u3093\u4E2D\u306B\u7F6E\u304F\u3068\u3001\u305D\u306E\u99D2\u3092\u81EA\u5206\u3067\u96A0\u3059 */
.tutorial-sheet-front.tutorial-sheet-low {
  align-items: flex-end;
}
.tutorial-sheet-front .tutorial-sheet-inner {
  border-radius: 14px;
  border-bottom-color: var(--gold);
  border-color: var(--gold);
  padding: 18px 20px 16px;
  box-shadow: 0 10px 34px rgba(0, 0, 0, 0.7);
  animation: sheet-pop 220ms ease-out;
}
@keyframes sheet-pop {
  from {
    transform: translateY(10px) scale(0.97);
    opacity: 0;
  }
}
/* \u524D\u9762\u306E\u3068\u304D\u306F\u6587\u5B57\u3092\u5927\u304D\u304F\u3057\u3066\u3001\u5148\u306B\u76EE\u304C\u884C\u304F\u3088\u3046\u306B\u3059\u308B */
.tutorial-sheet-front .tutorial-line {
  font-size: 15px;
  line-height: 1.85;
}
.tutorial-sheet-front .tutorial-next {
  width: 100%;
  margin-top: 12px;
}

.admin-json {

  font-size: 11px;

}
.admin-json {
  white-space: normal;
  max-width: 520px;
}
.admin-foot {
  text-align: center;
  font-size: 11px;
