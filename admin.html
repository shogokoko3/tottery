  .play-wrap > .board-outer {
    grid-column: 1;
    grid-row: 1 / -1;
    align-self: center;
  }
  .board-frame {
    /* \u6A2A\u5411\u304D\u306F\u9AD8\u3055\u304C\u8DB3\u308A\u306A\u3044\u3002\u9AD8\u3055\u3092\u4E3B\u306B\u3057\u3066\u6C7A\u3081\u308B */
    width: min(52vw, 76vh, 620px);
  }
  .stage {
    /* 2\u30AB\u30E9\u30E0\u306F\u4E0A\u304B\u3089\u7A4D\u3080\u3002\u4E2D\u592E\u5BC4\u305B\u3060\u3068\u53F3\u306E\u5217\u304C\u4E0A\u4E0B\u306B\u6CF3\u3050 */
    justify-content: flex-start;
    padding-top: 20px;
  }
  /* \u6A2A\u5411\u304D\u3067\u306F\u5E2F\u3092\u76E4\u306E\u5916(\u53F3\u4E0B)\u306B\u51FA\u3055\u305A\u3001\u753B\u9762\u4E0B\u7AEF\u306E\u307E\u307E\u3067\u3088\u3044\u3002
     \u7E26\u306E\u4F59\u767D\u304C\u5C11\u306A\u3044\u306E\u3067\u96E2\u308C\u306A\u3044 */
  .tutorial-sheet {
    bottom: 0;
  }
}

/* ===== \u30D5\u30A9\u30FC\u30E0\u306E\u90E8\u54C1\u306B\u66F8\u4F53\u3092\u7D99\u304C\u305B\u308B =====
   button\u30FBinput\u30FBselect\u30FBtextarea \u306F font-family \u3092\u7D99\u627F\u3057\u306A\u3044\u3002
   \u6307\u5B9A\u304C\u7121\u3044\u3068 WebKit \u306E\u65E2\u5B9A(Arial \u7CFB)\u304C\u5F53\u305F\u308A\u3001iOS \u306E WebView \u3067\u306F
   **\u65E5\u672C\u8A9E\u304C\u8C46\u8150(\u25A1)\u306B\u306A\u308B**\u3002\u30C7\u30B9\u30AF\u30C8\u30C3\u30D7\u306E\u30D6\u30E9\u30A6\u30B6\u306B\u306F\u65E5\u672C\u8A9E\u66F8\u4F53\u304C
   \u3042\u308B\u305F\u3081\u518D\u73FE\u305B\u305A\u3001\u5B9F\u6A5F\u3067\u521D\u3081\u3066\u51FA\u308B\u3002

   \u5B9F\u969B\u306B .account-mark(\u30A2\u30A4\u30B3\u30F3)\u3068 .title-tag(\u79F0\u53F7)\u304C\u3053\u308C\u3067\u58CA\u308C\u3066\u3044\u3066\u3001
   \u300C\u5909\u3048\u308B\u300D\u304C \u25A1\u25A1\u25A1 \u306B\u3001\u982D\u6587\u5B57\u304C \u25A1 \u306B\u306A\u3063\u3066\u3044\u305F\u3002
   .btn \u306B\u306F\u6307\u5B9A\u304C\u3042\u308B\u306E\u3067\u7121\u4E8B\u3060\u3063\u305F\u304C\u3001.btn \u3092\u6301\u305F\u306A\u3044\u30DC\u30BF\u30F3\u306F\u5168\u6EC5\u3057\u3066\u3044\u305F\u3002

   \u7D99\u627F\u306B\u3057\u3066\u304A\u3051\u3070\u3001.tottery-root \u306E
   "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif
   \u304C\u305D\u306E\u307E\u307E\u5C4A\u304F\u3002.btn \u306E\u6307\u5B9A\u306B\u306F Hiragino \u304C\u7121\u3044\u306E\u3067\u3001
   \u3053\u3053\u3067\u4E0A\u66F8\u304D\u3059\u308B\u3053\u3068\u3067\u570F\u5916(Google Fonts \u304C\u6765\u306A\u3044)\u3067\u3082\u65E5\u672C\u8A9E\u304C\u51FA\u308B\u3002 */
.tottery-root button,
.tottery-root input,
.tottery-root select,
.tottery-root textarea {
  font-family: inherit;
}

/* \u79F0\u53F7\u3068\u300C\u30EC\u30D9\u30EB10(\u6700\u9AD8)\u300D\u304C\u540C\u3058\u884C\u306B\u6D41\u308C\u3066\u6298\u308A\u8FD4\u3057\u3001
   \u79F0\u53F7\u306E\u672D\u306B\u6587\u8A00\u304C\u91CD\u306A\u3063\u3066\u3044\u305F\u3002\u7E26\u306B\u7A4D\u3093\u3067\u91CD\u306A\u308A\u3092\u89E3\u304F */
.account-id {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 4px;
  min-width: 0;
}

/* \u540D\u524D\u3092\u6C7A\u3081\u76F4\u3059\u753B\u9762\u306B\u51FA\u3059\u3001\u904B\u55B6\u304B\u3089\u306E\u4E00\u8A00 */
.name-notice {
  margin: 0 0 12px;
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px solid rgba(176, 32, 47, 0.6);
  background: rgba(176, 32, 47, 0.15);
  color: #ffd2d6;
  font-size: 13px;
}

/* --- \u30DF\u30C3\u30B7\u30E7\u30F3 --- */
.tottery-root:has(.missions-screen) {
  height: 100vh;
  height: 100dvh;
  min-height: 0;
  display: flex;
  flex-direction: column;
}
.tottery-root:has(.missions-screen) > .top-bar,
.tottery-root:has(.missions-screen) > .test-badge {
  flex-shrink: 0;
}
.tottery-root:has(.missions-screen) > .build-tag {
  display: none;
}
.stage:has(> .missions-screen) {
  flex: 1;
  min-height: 0;
  padding: 12px max(12px, env(safe-area-inset-right))
    max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
  overflow: hidden;
}
.missions-screen {
  height: 100%;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border: 1px solid var(--btn-edge);
  border-radius: 14px;
  background: linear-gradient(180deg, #162940, #0b172a);
}
.missions-heading {
  padding: 12px 12px 8px;
  flex-shrink: 0;
}
.missions-heading h2 {
  margin: 0 0 6px;
  font-size: 24px;
}
.missions-heading .level-badge {
  margin: 0;
  font-size: 12px;
}
.missions-heading .level-badge small {
  display: none;
}
.missions-tabs {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  flex-shrink: 0;
  margin: 0 10px 10px;
}
.missions-tabs button {
  min-width: 0;
  min-height: 48px;
  padding: 8px 2px;
  border: 1px solid var(--btn-edge);
  background: #0d1c30;
  color: var(--text-dim);
  font-size: 12px;
  font-weight: 700;
  line-height: 1.5;
  font-family: inherit;
  cursor: pointer;
  position: relative;
}
.missions-tabs button:first-child {
  border-radius: 8px 0 0 8px;
}
.missions-tabs button:last-child {
  border-radius: 0 8px 8px 0;
}
.missions-tabs button + button {
  border-left: 0;
}
.missions-tabs button[aria-selected="true"] {
  background: linear-gradient(180deg, #f1da98, #c2a25f);
  color: #211b13;
}
.missions-tabs button:focus-visible {
  outline: 2px solid var(--gold-soft);
  outline-offset: -4px;
}
.missions-tab-count {
  position: absolute;
  right: 2px;
  top: -6px;
  background: #a72f29;
  color: #fff;
  border-radius: 12px;
  min-width: 18px;
  padding: 0 4px;
  font: 700 10px/18px sans-serif;
}
.missions-scroll {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 0 12px;
  scrollbar-width: thin;
}
.missions-scroll .mission-list {
  margin: 0 0 12px;
}
.missions-scroll .mission {
  text-align: left;
}
.missions-empty {
  min-height: 100%;
  display: grid;
  place-items: center;
  padding: 24px;
  color: var(--text-dim);
  font-size: 14px;
}
.missions-footer {
  flex-shrink: 0;
  padding: 8px 12px 12px;
  border-top: 1px solid var(--line);
  background: #102038;
}
.missions-footer .mission-message:empty {
  display: none;
}
.missions-footer .mission-message {
  max-height: 3.2em;
  overflow-y: auto;
  margin-bottom: 8px;
}
.missions-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.missions-actions .btn {
  min-width: 0;
  min-height: 48px;
  padding: 10px 6px;
  font-size: 12px;
  touch-action: manipulation;
}
@media (max-height: 500px) {
  .missions-heading {
    padding: 4px 12px;
  }
  .missions-heading h2 {
    font-size: 18px;
    margin: 0;
  }
  .missions-heading .level-badge {
    display: none;
  }
  .missions-tabs {
    margin-bottom: 6px;
  }
}
.mission-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin: 14px 0;
}
.missions-reset {
  margin: 6px 0 0;
  color: var(--text-dim);
  font: 11px/1.5 sans-serif;
}
.mission-segments {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 5px;
  margin: 10px 0;
}
.mission-segments span {
  height: 12px;
  border: 1px solid var(--line);
  border-radius: 3px;
  background: #071323;
}
.mission-segments .is-filled {
  background: linear-gradient(180deg, var(--gold-soft), var(--gold-deep));
  border-color: var(--gold);
}
.mission {
  border: 1px solid var(--line);
  border-radius: 10px;
  background: rgba(9, 20, 38, 0.6);
  padding: 12px 14px;
}
/* \u53D7\u3051\u53D6\u308C\u308B\u3082\u306E\u306F\u91D1\u306E\u7E01\u3067\u76EE\u3092\u5F15\u304F\u3002\u53D7\u3051\u53D6\u308A\u6E08\u307F\u306F\u6C88\u3081\u308B */
.mission.is-ready {
  border-color: var(--gold);
  background: rgba(212, 175, 55, 0.1);
}
.mission.is-claimed {
  opacity: 0.55;
}
.mission-head {
  display: flex;
  align-items: baseline;
  gap: 8px;
  flex-wrap: wrap;
}
.mission-kind {
  font-size: 10px;
  letter-spacing: 0.1em;
  color: var(--text-dim);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 2px 8px;
}
.mission-head b {
  font-family: "Shippori Mincho", serif;
  font-size: 14px;
}
.mission-bar {
  height: 6px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.08);
  overflow: hidden;
  margin: 9px 0 7px;
}
.mission-bar span {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--gold-deep), var(--gold));
}
.mission-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}
.mission-foot small {
  font-size: 11px;
  color: var(--text-dim);
}
.mission-done {
  font-size: 11px;
  color: var(--gold-soft);
}
.mission-message {
  min-height: 1.6em;
  margin: 0;
  font-size: 12px;
  color: var(--gold-soft);
  text-align: center;
}
/* \u53D7\u3051\u53D6\u308C\u308B\u6570\u306E\u5370 */
.menu-badge {
  position: absolute;
  top: 10px;
  right: 12px;
  min-width: 20px;
  height: 20px;
  border-radius: 999px;
  background: var(--card-red);
  color: #fff;
  font: 700 11px/20px sans-serif;
  text-align: center;
}
.btn-choice {
  position: relative;
}

/* --- \u30D0\u30C8\u30EB\u30D1\u30B9 --- */
.pass-reward {
  margin: 14px 0;
  color: var(--gold-soft);
  text-align: center;
  font-size: 12px;
  line-height: 1.8;
}
.pass-reward svg {
  vertical-align: middle;
}
.pass-reward strong {
  display: block;
  font-size: 15px;
}
.pass-counts {
  display: flex;
  justify-content: center;
  gap: 18px;
  margin: 10px 0;
  font-size: 12px;
  color: var(--text-dim);
}
.pass-counts b {
  color: var(--gold-soft);
  font-size: 15px;
}
.pass-grid {
  display: grid;
  grid-template-columns: repeat(var(--n, 5), minmax(0, 1fr));
  gap: 4px;
  max-width: 420px;
  margin: 0 auto 14px;
}
.pass-cell {
  position: relative;
  aspect-ratio: 3 / 4;
  border: 0;
  padding: 0;
  background: none;
  perspective: 700px;
  cursor: default;
  -webkit-tap-highlight-color: transparent;
}
/* \u8868\u3068\u88CF\u3092\u8CBC\u308A\u5408\u308F\u305B\u305F\u677F\u3002\u62BC\u3059\u3068\u3053\u308C\u304C\u56DE\u308B */
.pass-inner {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
  transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.25, 1);
}
.pass-cell.is-flipped .pass-inner {
  transform: rotateY(180deg);
}
.pass-front,
.pass-back {
  position: absolute;
  inset: 0;
  border-radius: 5px;
  overflow: hidden;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border: 1px solid var(--line);
  background: rgba(9, 20, 38, 0.7);
}
.pass-front {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  padding: 3px;
  color: var(--text-dim);
  font-size: 8.5px;
  line-height: 1.25;
  text-align: center;
}
/* \u88CF\u306F\u7D75\u67C4\u306E\u4E00\u7247\u3002\u56DE\u308A\u304D\u3063\u305F\u5411\u304D\u3067\u8CBC\u308B */
.pass-back {
  transform: rotateY(180deg);
  background-repeat: no-repeat;
  border-color: var(--gold);
}
/* \u307E\u3060\u958B\u3044\u3066\u3044\u306A\u3044\u30DE\u30B9\u306F\u6C88\u3081\u308B */
.pass-cell.is-locked {
  opacity: 0.35;
}
/* \u3044\u307E\u6311\u6226\u3067\u304D\u308B\u30DE\u30B9 */
.pass-cell.is-open .pass-front {
  border-color: var(--gold-deep);
  color: var(--text);
}
/* \u30AF\u30EA\u30A2\u6E08\u307F\u3002\u62BC\u3059\u3068\u3081\u304F\u308C\u308B\u3002\u3082\u3046\u4E00\u5EA6\u62BC\u3059\u3068\u6761\u4EF6\u306B\u623B\u308B */
.pass-cell.is-cleared {
  cursor: pointer;
}
.pass-cell.is-cleared .pass-front {
  border-color: var(--gold);
  background: rgba(212, 175, 55, 0.14);
  color: var(--gold-soft);
}
.pass-name {
  overflow-wrap: anywhere;
}
.pass-num {
  font-variant-numeric: tabular-nums;
  font-weight: 700;
}
.pass-turn {
  font-size: 8px;
  border: 1px solid var(--gold);
  border-radius: 3px;
  padding: 1px 4px;
}
/* \u9032\u307F\u5177\u5408\u3002\u30DE\u30B9\u306E\u4E0B\u8FBA\u306B\u7D30\u304F */
.pass-bar {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 3px;
  background: rgba(255, 255, 255, 0.08);
}
.pass-bar::after {
  content: "";
  display: block;
  height: 100%;
  width: var(--p, 0%);
  background: var(--gold);
}
/* \u4E00\u62EC\u3067\u3081\u304F\u308B\u91E6 */
.pass-actions {
  display: flex;
  justify-content: center;
  margin: 0 0 10px;
}
.pass-complete-art {
  max-width: 420px;
  margin: 0 auto 14px;
  border: 2px solid var(--gold-soft);
  border-radius: 6px;
  overflow: hidden;
  box-shadow: 0 0 22px rgba(230, 198, 129, 0.18);
}
.pass-complete-art img {
  display: block;
  width: 100%;
  aspect-ratio: 3 / 4;
  object-fit: cover;
}
.pass-earned {
  text-align: center;
  color: var(--gold-soft);
  font-size: 17px;
  letter-spacing: 0.08em;
  text-shadow: 0 0 18px rgba(238, 211, 138, 0.3);
}
.pass-earned svg {
  vertical-align: middle;
}
.pass-earned strong {
  display: block;
  margin-top: 8px;
  font-size: 14px;
}
.pass-cell:disabled {
  cursor: default;
}
@media (max-width: 400px) {
  .pass-cell {
    font-size: 8px;
  }
  .pass-turn {
    display: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  .pass-inner {
    transition: none;
  }
}

/* --- \u904B\u55B6\u304B\u3089\u306E\u304A\u77E5\u3089\u305B ---
 * \u8986\u3044\u306E\u898B\u305F\u76EE\u306F\u7BA1\u7406\u753B\u9762\u5074\u306E CSS \u306B\u3057\u304B\u7121\u304F\u3001\u30D7\u30EC\u30A4\u30E4\u30FC\u306E\u753B\u9762\u3067\u306F
 * \u7D20\u306E\u6587\u5B57\u304C\u4E00\u89A7\u306E\u4E0B\u306B\u4F38\u3073\u3066\u3044\u305F\u3002\u3053\u3053\u306B\u72EC\u7ACB\u3057\u3066\u7F6E\u304D\u76F4\u3059\u3002 */
.notice-wrap {
  text-align: left;
}
.notice-wrap h2,
.notice-wrap .mission-message {
  text-align: center;
}
/* \u307E\u3068\u3081\u3066\u53D7\u3051\u53D6\u308B\u3002\u6587\u8A00\u304C\u6298\u308A\u8FD4\u3059\u3068\u8AAD\u307F\u306B\u304F\u3044\u306E\u30671\u884C\u306B\u53CE\u3081\u308B */
.notice-all {
  font-size: 15px;
  padding: 13px 16px;
}

.notice-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin: 12px 0;
}

/* \u304A\u77E5\u3089\u305B1\u4EF6\u3002\u4EF6\u540D\u30FB\u65E5\u4ED8\u30FB\u672C\u6587\u306E\u982D\u30FB\u6DFB\u4ED8\u3092\u3053\u306E\u9806\u306B\u7A4D\u3080\u3002
 * \u4EF6\u540D\u3060\u3051\u3060\u3068\u4E2D\u8EAB\u304C\u60F3\u50CF\u3067\u304D\u305A\u3001\u3044\u3061\u3044\u3061\u958B\u304F\u3053\u3068\u306B\u306A\u308B */
.notice {
  display: flex;
  flex-direction: column;
  gap: 5px;
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-left: 3px solid transparent;
  border-radius: 10px;
  background: rgba(4, 10, 20, 0.45);
  color: var(--text);
  text-align: left;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.notice:active {
  transform: translateY(1px);
}
/* \u672A\u8AAD\u306F\u5DE6\u306E\u7E01\u3068\u70B9\u3067\u793A\u3059\u3002\u5168\u4F53\u3092\u91D1\u3067\u5857\u308B\u3068\u3001\u4E26\u3093\u3060\u3068\u304D\u76EE\u304C\u4F11\u307E\u3089\u306A\u3044 */
.notice.is-new {
  border-left-color: var(--gold);
}
.notice.is-read {
  opacity: 0.55;
}

.notice-head {
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.notice-mark {
  flex: none;
  width: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--gold-soft);
  align-self: center;
}
.notice-mark i {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--gold);
}
.notice-head b {
  flex: 1;
  min-width: 0;
  font-family: "Shippori Mincho", serif;
  font-size: 14.5px;
  line-height: 1.45;
  overflow-wrap: anywhere;
}
.notice-when {
  flex: none;
  font-size: 11px;
  color: var(--text-dim);
  white-space: nowrap;
}
/* \u672C\u6587\u306E\u982D\u30021\u884C\u3060\u3051\u898B\u305B\u3066\u3001\u7D9A\u304D\u306F\u958B\u3044\u3066\u3082\u3089\u3046 */
.notice-peek {
  margin-left: 20px;
  font-size: 11.5px;
  line-height: 1.5;
  color: var(--text-dim);
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 1;
  -webkit-box-orient: vertical;
  overflow-wrap: anywhere;
}
/* \u6DFB\u4ED8\u306F\u5C0F\u3055\u306A\u672D\u306B\u3057\u3066\u3001\u958B\u304B\u306A\u304F\u3066\u3082\u4E2D\u8EAB\u304C\u5206\u304B\u308B\u3088\u3046\u306B\u3059\u308B */
.notice-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-left: 20px;
}
.notice-chip {
  padding: 3px 9px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(212, 175, 55, 0.1);
  color: var(--gold-soft);
  font-size: 11px;
  white-space: nowrap;
}

/* \u958B\u3044\u305F\u3068\u304D\u306E\u8986\u3044\u3002\u753B\u9762\u3044\u3063\u3071\u3044\u3092\u8986\u3063\u3066\u3001\u5916\u3092\u62BC\u3059\u3068\u9589\u3058\u308B */
.notice-sheet {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  background: rgba(4, 8, 18, 0.78);
  padding: 16px;
  overscroll-behavior: contain;
  touch-action: none;
  padding-bottom: calc(16px + env(safe-area-inset-bottom));
}
@media (min-height: 620px) {
  .notice-sheet {
    align-items: center;
  }
}
.notice-panel {
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: 440px;
  max-height: 82vh;
  border: 1px solid var(--gold);
  border-radius: 14px;
  background: linear-gradient(170deg, #142a48, #0b1729);
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
  text-align: left;
}
.notice-panel-head {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 14px 14px 10px 16px;
  border-bottom: 1px solid var(--line);
}
.notice-panel-head b {
  flex: 1;
  font-family: "Shippori Mincho", serif;
  font-size: 16px;
  line-height: 1.5;
  color: var(--gold-soft);
  overflow-wrap: anywhere;
}
/* \u9589\u3058\u308B\u306F\u6307\u3067\u62BC\u305B\u308B\u5927\u304D\u3055\u306B */
.notice-close {
  flex: none;
  width: 44px;
  height: 44px;
  margin: -8px -6px 0 0;
  display: grid;
  place-items: center;
}
/* \u672C\u6587\u304C\u9577\u304F\u3066\u3082\u3053\u3053\u3060\u3051\u304C\u52D5\u304F\u3002\u984C\u3068\u53D7\u3051\u53D6\u308B\u91E6\u306F\u52D5\u304B\u306A\u3044 */
.notice-panel-scroll {
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 12px 16px 4px;
}
.notice-date {
  margin: 0 0 10px;
  font-size: 11px;
  color: var(--text-dim);
}
.notice-body {
  margin: 0 0 14px;
  font-size: 14px;
  line-height: 1.9;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.notice-gifts {
  margin-bottom: 4px;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  background: rgba(212, 175, 55, 0.08);
}
.notice-gifts-label {
  font-size: 11px;
  color: var(--text-dim);
}
.notice-gifts ul {
  margin: 6px 0 0;
  padding-left: 18px;
  font-size: 13.5px;
  line-height: 1.8;
  color: var(--gold-soft);
}
/* \u7D9A\u304D\u304C\u3042\u308B\u3053\u3068\u304C\u5206\u304B\u308B\u3088\u3046\u3001\u4E0B\u7AEF\u3092\u3075\u308F\u308A\u3068\u8584\u304F\u3059\u308B */
.notice-actions {
  position: relative;
  padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
}
.notice-actions::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: -22px;
  height: 22px;
  pointer-events: none;
  background: linear-gradient(rgba(11, 23, 41, 0), #0b1729);
}

/* --- \u30DB\u30FC\u30E0 ---
 * \u7247\u624B\u3067\u6301\u3063\u305F\u96FB\u8A71\u3067\u898B\u308B\u3068\u3053\u308D\u30027\u3064\u306E\u5165\u308A\u53E3\u3092\u540C\u3058\u5E2F\u3067\u4E26\u3079\u308B\u3068\u3001
 * \u3069\u308C\u3082\u540C\u3058\u91CD\u3055\u306B\u898B\u3048\u3066\u9078\u3079\u306A\u304F\u306A\u308B\u306E\u3067\u3001\u5927\u304D\u3055\u3068\u8272\u3067\u8EFD\u91CD\u3092\u3064\u3051\u305F\u3002
 * \u89E6\u308B\u3068\u3053\u308D\u306F\u3069\u308C\u3082 44px \u4EE5\u4E0A\u306B\u3057\u3066\u3042\u308B\u3002 */
.home-wrap {
  width: 100%;
  max-width: 420px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  /* \u753B\u9762\u306E\u9AD8\u3055\u304C\u4F59\u3063\u305F\u3076\u3093\u306F\u4E0A\u4E0B\u306B\u5206\u3051\u308B\u3002\u4E0B\u3060\u3051\u306B\u4F59\u767D\u304C\u6E9C\u307E\u3089\u306A\u3044\u3088\u3046\u306B */
  margin-block: auto;
}
/* \u30DB\u30FC\u30E0\u306E\u3068\u304D\u3060\u3051\u3001\u7F6E\u304D\u5834\u3092\u753B\u9762\u306E\u9AD8\u3055\u3044\u3063\u3071\u3044\u306B\u5E83\u3052\u308B */
.stage:has(> .home-wrap) {
  min-height: calc(100vh - 60px);
  min-height: calc(100dvh - 60px);
  justify-content: flex-start;
}

/* \u81EA\u5206\u306E\u672D\u3002\u540D\u524D\u30FB\u79F0\u53F7\u30FB\u30EC\u30D9\u30EB\u30FB\u30C1\u30B1\u30C3\u30C8 */
.home-self {
  position: relative;
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 10px;
  padding: 10px 14px 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: linear-gradient(180deg, var(--panel-2), var(--panel));
  color: var(--text);
  font-family: inherit;
  text-align: left;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.home-self:active {
  transform: scale(0.99);
}
.home-self-id {
  display: flex;
  flex-direction: column;
  min-width: 0;
  gap: 2px;
}
.home-self-id b {
  font-size: 15px;
  letter-spacing: 0.04em;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.home-self-id small {
  font-size: 11px;
  color: var(--gold-soft);
  opacity: 0.85;
}
.home-self-right {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--text-dim);
}
/* \u62BC\u305B\u308B\u3053\u3068\u304C\u5206\u304B\u308B\u3088\u3046\u306B\u3001\u53F3\u7AEF\u306B\u5C0F\u3055\u306A\u77E2\u5370\u3092\u6DFB\u3048\u308B */
.home-self-more {
  opacity: 0.4;
  flex: none;
}
.home-lv b {
  font-size: 16px;
  color: var(--gold-soft);
  margin-left: 2px;
}
.home-tickets {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: rgba(212, 175, 55, 0.08);
  color: var(--gold-soft);
  font-size: 12px;
  font-weight: 700;
}
/* \u30EC\u30D9\u30EB\u306E\u5E2F\u306F\u672D\u306E\u4E0B\u8FBA\u306B\u6CBF\u308F\u305B\u308B\u3002\u6570\u5B57\u3060\u3051\u3088\u308A\u9032\u307F\u5177\u5408\u304C\u4F1D\u308F\u308B */
.home-self-bar {
  grid-column: 1 / -1;
  height: 3px;
  border-radius: 999px;
  background: rgba(212, 175, 55, 0.14);
  overflow: hidden;
}
.home-self-bar span {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--gold-soft), var(--gold));
}

/* \u4E00\u756A\u3084\u3063\u3066\u307B\u3057\u3044\u3068\u3053\u308D\u3002\u3053\u3053\u3060\u3051\u91D1\u306B\u3059\u308B */
.home-hero {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 18px 16px;
  border: none;
  border-radius: 14px;
  background: linear-gradient(160deg, #f0d98a, #d4af37 60%, #b8942b);
  color: #22160a;
  font-family: inherit;
  text-align: left;
  cursor: pointer;
  box-shadow:
    0 6px 0 #7a5f18,
    0 10px 24px rgba(0, 0, 0, 0.4);
  -webkit-tap-highlight-color: transparent;
}
.home-hero:active {
  transform: translateY(4px);
  box-shadow:
    0 2px 0 #7a5f18,
    0 4px 10px rgba(0, 0, 0, 0.4);
}
.home-hero-icon {
  display: grid;
  place-items: center;
  width: 52px;
  height: 52px;
  flex: none;
  border-radius: 50%;
  background: rgba(34, 22, 10, 0.14);
}
.home-hero-label {
  display: flex;
  flex-direction: column;
  flex: 1;
  gap: 3px;
}
.home-hero-label b {
  font-size: 21px;
  letter-spacing: 0.08em;
}
.home-hero-label small {
  font-size: 12px;
  opacity: 0.75;
}
.home-hero-arrow {
  opacity: 0.5;
  flex: none;
}

/* \u30C1\u30E5\u30FC\u30C8\u30EA\u30A2\u30EB\u3002\u91D1\u306E\u6B21\u306B\u7F6E\u304F\u4E00\u6BB5 */
.home-wide {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 16px;
  border: 1px solid rgba(143, 111, 214, 0.45);
  border-radius: 12px;
  background: linear-gradient(150deg, #2c2450, #1b1836);
  color: var(--text);
  font-family: inherit;
  text-align: left;
  cursor: pointer;
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.35);
  -webkit-tap-highlight-color: transparent;
}
.home-wide:active {
  transform: translateY(3px);
  box-shadow: none;
}
.home-wide-icon {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  flex: none;
  border-radius: 10px;
  background: rgba(203, 182, 255, 0.14);
  color: var(--swap-soft);
}
.home-wide-label {
  display: flex;
  flex-direction: column;
  flex: 1;
  gap: 2px;
}
.home-wide-label b {
  font-size: 15px;
  letter-spacing: 0.06em;
}
.home-wide-label small {
  font-size: 11px;
  color: var(--text-dim);
}
/* \u307E\u30601\u8A71\u3082\u7D42\u3048\u3066\u3044\u306A\u3044\u4EBA\u306B\u3060\u3051\u6DFB\u3048\u308B\u5C0F\u3055\u306A\u5370 */
.home-wide-pill {
  display: inline-block;
  margin-left: 8px;
  padding: 1px 7px;
  border-radius: 999px;
  border: 1px solid var(--gold);
  color: var(--gold-soft);
  font-size: 10px;
  font-weight: 600;
  vertical-align: middle;
}
.tutorial-offer {
  text-align: center;
}
/* \u30C1\u30E5\u30FC\u30C8\u30EA\u30A2\u30EB\u3092\u98DB\u3070\u3059\u3002\u6848\u5185\u306E\u672D\u3067\u306F\u4E00\u756A\u4E0B\u306B\u5C0F\u3055\u304F\u3001\u4E00\u89A7\u3067\u306F\u4E00\u756A\u4E0B\u306B */
.tutorial-skip {
  display: block;
  margin: 4px auto 0;
  background: none;
  border: 0;
  /* \u6307\u3067\u62BC\u305B\u308B\u9AD8\u3055(44px)\u3092\u78BA\u4FDD\u3059\u308B\u3002\u6587\u5B57\u306F\u5C0F\u3055\u3044\u307E\u307E\u3067\u3088\u3044 */
  min-height: 44px;
  padding: 10px 16px;
  color: var(--text-dim);
  font-size: 12px;
  text-decoration: underline;
  cursor: pointer;
  pointer-events: auto;
}
/* \u98DB\u3070\u3059\u306E\u78BA\u8A8D\u306F\u672D\u306E\u5916(body \u76F4\u4E0B)\u306B\u51FA\u3059\u3002\u6483\u7834\u306E\u672D\u306A\u3069\u3068\u540C\u3058\u5C64 */
.tutorial-skip-confirm {
  z-index: 60;
  pointer-events: auto;
}
/* \u5BFE\u5C40\u753B\u9762\u306E\u53F3\u4E0A\u306E\u300C\u98DB\u3070\u3059\u300D\u3002\u30C1\u30E5\u30FC\u30C8\u30EA\u30A2\u30EB\u4E2D\u306F\u3044\u3064\u3067\u3082\u62BC\u305B\u308B */
.top-right .tutorial-skip-top {
  width: auto;
  min-width: 44px;
  min-height: 36px;
  display: inline-flex;
  align-items: center;
  padding: 0 10px;
  font-size: 12px;
  white-space: nowrap;
  text-decoration: underline;
}
.tutorial-skip-options {
  display: grid;
  gap: 10px;
  margin-top: 12px;
}
.tutorial-skip-all {
  margin-top: 6px;
  color: var(--text-dim);
}
.home-wide-arrow {
  color: var(--text-dim);
  opacity: 0.6;
  flex: none;
}

/* \u56DB\u89D2\u3044\u5165\u308A\u53E3\u30022\u3064\u305A\u3064\u4E26\u3079\u308B */
.home-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.home-tile {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  min-height: 96px;
  padding: 12px 8px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: linear-gradient(180deg, var(--panel-2), var(--panel));
  color: var(--text);
  font-family: inherit;
  cursor: pointer;
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.35);
  -webkit-tap-highlight-color: transparent;
}
.home-tile:active {
  transform: translateY(3px);
  box-shadow: none;
}
.home-tile b {
  font-size: 13.5px;
  letter-spacing: 0.04em;
}
.home-tile small {
  font-size: 11px;
  color: var(--text-dim);
}
.home-tile-icon {
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border-radius: 10px;
}
/* \u5165\u308A\u53E3\u3054\u3068\u306B\u7D75\u67C4\u306E\u8272\u3092\u5909\u3048\u308B\u3002\u540C\u3058\u7D75\u67C4\u30FB\u540C\u3058\u8272\u3060\u3068\u62BC\u3057\u9593\u9055\u3048\u308B */
.home-tile-skins .home-tile-icon {
  color: var(--swap-soft);
  background: rgba(143, 111, 214, 0.16);
}
.home-tile-pass .home-tile-icon {
  color: #7fd3c4;
  background: rgba(127, 211, 196, 0.14);
}
/* \u91D1\u306F\u91D1\u306E\u91E6(\u5BFE\u6226\u3059\u308B)\u306B\u53D6\u3063\u3066\u3042\u308B\u306E\u3067\u3001\u3053\u3053\u306F\u7425\u73C0\u306B\u3057\u3066\u5206\u3051\u308B */
.home-tile-missions .home-tile-icon {
  color: #f5c26b;
  background: rgba(245, 194, 107, 0.22);
}
.home-tile-letters .home-tile-icon {
  color: #8fbce8;
  background: rgba(143, 188, 232, 0.14);
}
.home-tile .menu-badge {
  top: 8px;
  right: 8px;
}

/* \u30E9\u30F3\u30AD\u30F3\u30B0\u3002\u6BCE\u65E5\u62BC\u3059\u3082\u306E\u3067\u306F\u306A\u3044\u306E\u3067\u63A7\u3048\u3081\u306B */
.home-quiet {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 10px;
  border: none;
  background: none;
  color: var(--text-dim);
  font-family: inherit;
  font-size: 13px;
  letter-spacing: 0.04em;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.home-quiet:active {
  color: var(--gold-soft);
}

/* \u80CC\u306E\u4F4E\u3044\u96FB\u8A71\u3002\u8A70\u3081\u30661\u753B\u9762\u306B\u53CE\u3081\u308B\u3002
 * \u304A\u77E5\u3089\u305B\u306E\u5E2F\u3092\u8DB3\u3057\u305F\u3076\u3093\u3001\u56DB\u89D2\u306E\u5165\u308A\u53E3\u3082\u8584\u304F\u3059\u308B */
@media (max-height: 700px) {
  .home-wrap {
    gap: 9px;
  }
  .home-hero {
    padding: 12px 16px;
  }
  .home-hero-icon {
    width: 44px;
    height: 44px;
  }
  .home-hero-label b {
    font-size: 19px;
  }
  .home-wide {
    padding: 10px 16px;
  }
  .home-tile {
    min-height: 0;
    padding: 9px 8px;
    gap: 3px;
  }
  .home-tile-icon {
    width: 34px;
    height: 34px;
  }
  .home-self {
    padding: 8px 14px 10px;
  }
}

/* --- \u30ED\u30B0\u30A4\u30F3\u30DC\u30FC\u30CA\u30B9 --- */
/* \u53D7\u3051\u53D6\u308B\u307E\u3067\u9589\u3058\u306A\u3044\u672D\u3002\u5916\u3092\u62BC\u3057\u3066\u3082\u6D88\u3048\u306A\u3044 */
.bonus-panel {
  max-width: 400px;
}
.bonus-title {
  margin: 0;
  font-size: 19px;
  color: var(--gold-soft);
  letter-spacing: 0.08em;
}
.bonus-sub {
  margin: 4px 0 16px;
  font-size: 12px;
  color: var(--text-dim);
}
/* 7\u65E5\u3076\u3093\u3092\u6A2A\u306B\u4E26\u3079\u308B\u3002\u72ED\u3044\u753B\u9762\u3067\u3082\u6298\u308A\u8FD4\u3055\u305A\u30011\u30DE\u30B9\u305A\u3064\u7D30\u304F\u3059\u308B */
.bonus-row {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 4px;
  margin-bottom: 16px;
}
.bonus-cell {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 8px 2px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.03);
}
.bonus-cell small {
  font-size: 9px;
  color: var(--text-dim);
  white-space: nowrap;
}
.bonus-cell b {
  display: flex;
  align-items: center;
  gap: 2px;
  font-size: 13px;
  color: var(--text);
}
/* \u4ECA\u65E5\u306E\u30DE\u30B9\u3002\u3053\u3053\u3060\u3051\u91D1\u3067\u5149\u3089\u305B\u308B */
.bonus-cell.is-today {
  border-color: var(--gold);
  background: rgba(212, 175, 55, 0.16);
  box-shadow: 0 0 12px rgba(212, 175, 55, 0.3);
}
.bonus-cell.is-today b {
  color: var(--gold-soft);
}
/* \u53D7\u3051\u53D6\u308A\u6E08\u307F\u3002\u6C88\u3081\u3066\u3001\u6E08\u307F\u306E\u5370\u3092\u91CD\u306D\u308B */
.bonus-cell.is-taken {
  opacity: 0.45;
}
.bonus-check {
  color: var(--gold-soft);
}
/* \u5E45\u306E\u72ED\u3044\u96FB\u8A71\u30027\u30DE\u30B9\u304C\u6F70\u308C\u306A\u3044\u3088\u3046\u3001\u672D\u306E\u4F59\u767D\u3092\u8A70\u3081\u308B */
@media (max-width: 380px) {
  .bonus-panel {
    padding: 20px 12px;
  }
  .bonus-cell {
    padding: 8px 1px;
  }
}
.bonus-gain {
  margin: 0 0 16px;
  font-size: 13px;
  color: var(--text);
}
.bonus-gain b {
  color: var(--gold-soft);
  font-size: 17px;
}

/* \u300C\u30DB\u30FC\u30E0\u306B\u623B\u308B\u300D\u3002\u3069\u306E\u753B\u9762\u3067\u3082\u540C\u3058\u7F6E\u304D\u65B9\u306B\u3059\u308B\u3002
 * \u3059\u3050\u4E0A\u306E\u91E6\u306B\u304F\u3063\u3064\u3044\u3066\u3044\u308B\u3068\u62BC\u3057\u9593\u9055\u3048\u308B\u306E\u3067\u3001\u9593\u3092\u7A7A\u3051\u3066\u5358\u4F53\u3067\u7ACB\u305F\u305B\u308B\u3002
 * \u4E3B\u5F79\u3067\u306F\u306A\u3044\u306E\u3067\u5E45\u306F\u63A7\u3048\u3081\u306B\u3002\u305F\u3060\u3057\u6307\u3067\u62BC\u305B\u308B\u9AD8\u3055\u306F\u78BA\u4FDD\u3059\u308B\u3002 */
.btn-home {
  display: block;
  margin: 26px auto 0;
  min-width: 200px;
  min-height: 48px;
}

/* \u738B\u3092\u8A0E\u3063\u305F\u99D2\u304C\u540D\u4E57\u308A\u3092\u4E0A\u3052\u308B\u3002\u76E4\u306E\u4E0A\u3067\u304F\u308B\u308A\u3068\u8868\u306B\u306A\u308B\u3002
 * \u53D6\u3089\u308C\u305F\u5074\u306B\u3082\u300C\u3069\u306E\u99D2\u306B\u8A0E\u305F\u308C\u305F\u304B\u300D\u304C\u898B\u3048\u308B\u3088\u3046\u306B\u3001\u3081\u304F\u3063\u305F\u3042\u3068
 * \u91D1\u306E\u5149\u3092\u3072\u3068\u547C\u5438\u3060\u3051\u6DFB\u3048\u308B */
.piece-unveiled {
  animation: piece-unveil 620ms ease-out both;
}
@keyframes piece-unveil {
  0% {
    transform: rotateY(90deg) scale(0.9);
    filter: brightness(1.6);
  }
  55% {
    transform: rotateY(-10deg) scale(1.08);
    filter: brightness(1.35) drop-shadow(0 0 10px var(--gold));
  }
  100% {
    transform: rotateY(0) scale(1);
    filter: none;
  }
}
@media (prefers-reduced-motion: reduce) {
  .piece-unveiled {
    animation: none;
  }
}

/* \u65E9\u898B\u8868\u306E\u8DB3\u5143\u306B\u6DFB\u3048\u308B\u4E00\u8A00 */
.rule-foot {
  margin: 14px 0 0;
  padding-top: 12px;
  border-top: 1px solid var(--line);
  text-align: left;
  line-height: 1.7;
}
.rule-foot b {
  color: var(--gold-soft);
}

/* \u904B\u55B6\u304B\u3089\u306E\u304A\u77E5\u3089\u305B\u3002\u8AAD\u307F\u7269\u306A\u306E\u3067\u3001\u81EA\u5206\u306E\u672D\u306E\u4E0A\u306B\u7D30\u304F\u7F6E\u304F\u3002
 * \u6BCE\u65E5\u62BC\u3059\u3082\u306E\u3067\u306F\u306A\u3044\u304C\u3001\u5C4A\u3044\u305F\u3053\u3068\u306B\u306F\u6C17\u3065\u3044\u3066\u307B\u3057\u3044\u306E\u3067\u3001
 * \u6570\u304C\u3042\u308B\u6642\u3060\u3051\u8D64\u3044\u5370\u3092\u51FA\u3059 */
.home-news {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  min-height: 44px;
  padding: 11px 16px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(143, 188, 232, 0.08);
  color: var(--text-dim);
  font-family: inherit;
  font-size: 12.5px;
  letter-spacing: 0.04em;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.home-news:active {
  transform: translateY(1px);
}
.home-news svg {
  color: #8fbce8;
  flex: none;
}
.home-news-count {
  min-width: 18px;
  height: 18px;
  margin-left: auto;
  border-radius: 999px;
  background: var(--card-red);
  color: #fff;
  font: 700 11px/18px sans-serif;
  text-align: center;
}
/* \u5370\u304C\u7121\u3044\u3068\u304D\u3082\u77E2\u5370\u306F\u53F3\u7AEF\u306B\u5BC4\u305B\u308B */
.home-news-arrow {
  margin-left: auto;
  opacity: 0.5;
}
.home-news-count ~ .home-news-arrow {
  margin-left: 6px;
}

/* \u6B21\u306B\u5897\u3084\u3059\u3082\u306E\u306E\u5E2D\u3002\u56DB\u89D2\u306E\u4E26\u3073\u3092\u5D29\u3055\u306A\u3044\u305F\u3081\u306E\u7A7A\u304D */
.home-slot {
  border: 1px dashed var(--line);
  border-radius: 12px;
  opacity: 0.35;
}

/* \u4E88\u5099\u672D\u304C2\u679A\u3081\u304F\u308C\u305F\u3068\u304D\u306E\u9078\u629E */
.reserve-picks {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin: 10px 0;
}
.reserve-pick {
  background: none;
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 4px;
  cursor: pointer;
  opacity: 0.55;
  transition:
    opacity 0.15s,
    border-color 0.15s;
}
.reserve-pick-on {
  border-color: var(--gold);
  opacity: 1;
}
/* \u4E88\u5099\u672D\u306E\u4EEE\u7F6E\u304D\u3002\u7F6E\u304D\u5834\u6240\u3092\u6C7A\u3081\u3066\u304B\u3089\u300C\u3053\u3053\u306B\u7F6E\u304F\u300D\u3067\u78BA\u5B9A\u3059\u308B */
/* \u8AAC\u660E\u306E\u672D(\u76E4\u306E\u5916)\u3002\u89E6\u3063\u3066\u3082\u753B\u9762\u9001\u308A\u3060\u3051\u3067\u3001\u3064\u304B\u3081\u306A\u3044(2026-09-15 \u672C\u4EBA\u306E\u6307\u6458) */
.reserve-source {
  display: flex;
  justify-content: center;
  touch-action: pan-y;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
.reserve-pick {
  touch-action: pan-y;
  -webkit-touch-callout: none;
}
/* \u76E4\u306E\u4E0A\u306E\u4EEE\u7F6E\u304D\u306E\u99D2\u3060\u3051\u304C\u3064\u304B\u3081\u308B(\u9577\u62BC\u3057) */
.modal-overlay .mini-piece-preview {
  -webkit-touch-callout: none;
}
.mini-cell-target {
  box-shadow: inset 0 0 0 2px var(--gold);
  background: rgba(212, 175, 55, 0.22);
}
.mini-piece-preview {
  opacity: 0.9;
  cursor: grab;
}
.mini-piece-preview::after {
  content: "";
  position: absolute;
  inset: 1px;
  border: 2px dashed var(--gold);
  border-radius: 4px;
  pointer-events: none;
}
.reserve-status {
  margin: 10px 0 4px;
  min-height: 1.6em;
}
.reserve-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
}

/* \u7D75\u672D\u306B\u504F\u3063\u3066\u914D\u308A\u76F4\u3057\u305F\u3068\u304D\u306E\u77E5\u3089\u305B */
.setup-rescue {
  margin: 10px auto;
  max-width: 480px;
  padding: 10px 14px;
  border: 1px solid var(--gold);
  border-radius: 8px;
  background: rgba(198, 163, 90, 0.12);
  color: var(--gold-soft);
  font-size: 13px;
  line-height: 1.6;
  text-align: center;
}

/* \u30B7\u30FC\u30AF\u30EC\u30C3\u30C8\u30DF\u30C3\u30B7\u30E7\u30F3\u306E\u9054\u6210 */
.secret-panel {
  text-align: center;
}
.secret-name {
  font-family: "Shippori Mincho", serif;
  font-size: 24px;
  color: var(--gold);
  margin: 6px 0;
}
/* \u9685\u306E\u8981\u585E\u306E\u6F14\u51FA\u30023\xD73\u304C\u5965\u304B\u3089\u9806\u306B\u706F\u308A\u3001\u738B\u306E\u30DE\u30B9\u304C\u91D1\u306B\u5149\u308B */
.fortress-grid {
  display: grid;
  grid-template-columns: repeat(3, 34px);
  gap: 5px;
  justify-content: center;
  margin: 4px auto 10px;
}
.fortress-cell {
  width: 34px;
  height: 34px;
  border-radius: 7px;
  background: #c1543a;
  border: 1px solid #7a2f1f;
  opacity: 0;
  animation: fortress-in 0.35s ease-out forwards;
  animation-delay: calc(var(--i) * 90ms);
}
.fortress-cell.is-king {
  background: var(--gold);
  border-color: var(--gold);
  box-shadow: 0 0 14px var(--gold);
  animation:
    fortress-in 0.35s ease-out forwards,
    fortress-glow 1.6s ease-in-out 1s infinite;
}
@keyframes fortress-in {
  from {
    opacity: 0;
    transform: translateY(8px) scale(0.8);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes fortress-glow {
  0%,
  100% {
    box-shadow: 0 0 8px var(--gold);
  }
  50% {
    box-shadow: 0 0 20px var(--gold);
  }
}
/* \u53CC\u7FFC\u306E\u9663\u306E\u6F14\u51FA\u3002\u7FFC\u304C\u5DE6\u53F3\u304B\u3089\u7FBD\u3070\u305F\u304F\u3088\u3046\u306B\u3001\u5916\u5074\u306E\u99D2\u304B\u3089\u9806\u306B\u821E\u3044\u964D\u308A\u308B */
.wings-grid {
  display: grid;
  grid-template-columns: repeat(var(--cols, 5), 30px);
  grid-template-rows: repeat(3, 30px);
  gap: 4px;
  justify-content: center;
  margin: 4px auto 10px;
}
.wings-cell {
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 6px;
  background: #3e8e90;
  border: 1px solid #1f5658;
  color: #f4fbfb;
  font-size: 13px;
  font-weight: 700;
  opacity: 0;
  animation: wings-in 0.45s ease-out forwards;
  animation-delay: calc(var(--i) * 80ms);
}
.wings-cell.is-king {
  background: var(--gold);
  border-color: var(--gold);
  color: #3a2a00;
  box-shadow: 0 0 14px var(--gold);
  animation:
    wings-in 0.45s ease-out forwards,
    fortress-glow 1.6s ease-in-out 1s infinite;
}
@keyframes wings-in {
  from {
    opacity: 0;
    transform: translateY(-14px) scale(0.7);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
.secret-chance {
  display: inline-block;
  margin: 8px auto;
  padding: 5px 12px;
  border: 1px solid var(--gold);
  border-radius: 999px;
  color: var(--gold-soft);
  font-size: 13px;
}
.secret-row {
  border: 1px solid var(--gold);
  border-radius: 10px;
  padding: 12px 14px;
  margin-bottom: 10px;
  background: rgba(198, 163, 90, 0.08);
}
.secret-row h4 {
  margin: 0 0 4px;
  font-family: "Shippori Mincho", serif;
  color: var(--gold);
}
.adjudication-result {
  margin: 16px 0;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #102339;
  text-align: center;
}
.adjudication-result p {
  font-size: 13px;
  line-height: 1.7;
}
.adjudication-scores {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.adjudication-scores > div {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 6px;
}
.adjudication-scores span,
.adjudication-scores small {
  display: block;
  overflow-wrap: anywhere;
}
.adjudication-scores strong {
  display: block;
  font-size: 32px;
  color: var(--gold-soft);
}
.adjudication-scores small {
  font-size: 11px;
  color: var(--text-dim);
}
.adjudication-scores .adjudication-winner {
  border-color: var(--gold);
  background: #d5b86915;
}
.adjudication-draw-mark {
  font-size: 34px;
  color: var(--gold-soft);
}
.setup-adoption-total {
  text-align: center;
  font-size: 13px;
  margin: 8px 0;
}
.setup-adoption-total strong {
  color: var(--gold-soft);
}

/* \u6301\u3061\u70B9\u304C\u52D5\u304F\u306E\u306F9\xD79\u3060\u3051\u3001\u3068\u5206\u304B\u308B\u3088\u3046\u306B */
.board-choice-ranked {
  color: var(--gold);
  font-size: 11px;
}
/* \u30EC\u30D9\u30EB\u3067\u9589\u3058\u3066\u3044\u308B\u76E4(9\xD79 \u306F Lv4 \u304B\u3089) */
.board-choice:disabled {
  cursor: default;
  opacity: 0.55;
}
.board-choice:disabled:hover {
  border-color: var(--line);
}
.board-choice-lock {
  color: var(--text);
  font-size: 11px;
}
.card-unlock-hint {
  margin-top: 8px;
}

.profile-sync-notice {
  position: fixed;
  bottom: calc(12px + env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  z-index: 10000;
  display: flex;
  align-items: center;
  gap: 12px;
  max-width: calc(100vw - 24px);
  width: 430px;
  padding: 10px 14px;
  box-sizing: border-box;
  color: #f3dfb3;
  background: #241d19;
  border: 1px solid #ad8140;
  border-radius: 10px;
  font: 12px/1.6 sans-serif;
  box-shadow: 0 4px 20px #0008;
}
.profile-sync-notice button {
  flex-shrink: 0;
  padding: 8px 12px;
  color: #241d19;
  background: #dfbe73;
  border: 0;
  border-radius: 6px;
}

/* ===== \u76E4\u9762\u30A8\u30EA\u30A2(src/game/areas.js / src/ui/areas.jsx) =====
   \u81EA\u9663\u306E\u8272\u306B\u3001\u30A8\u30EA\u30A2\u3054\u3068\u306E\u8584\u3044\u8272\u3092\u91CD\u306D\u308B\u3002\u99D2\u306E\u898B\u3048\u65B9\u3092\u90AA\u9B54\u3057\u306A\u3044\u7A0B\u5EA6 */
.cell.area-earth {
  background-image: radial-gradient(circle at 50% 60%, rgba(139, 94, 50, 0.32), rgba(139, 94, 50, 0.1));
}
.cell.area-sea {
  background-image: radial-gradient(circle at 50% 40%, rgba(46, 126, 196, 0.32), rgba(46, 126, 196, 0.1));
}
.cell.area-forest {
  background-image: radial-gradient(circle at 50% 60%, rgba(52, 140, 78, 0.32), rgba(52, 140, 78, 0.1));
}
.cell.area-ice {
  background-image: radial-gradient(circle at 50% 40%, rgba(160, 220, 255, 0.34), rgba(160, 220, 255, 0.1));
}
.cell.area-sky {
  background-image: radial-gradient(circle at 50% 30%, rgba(150, 130, 230, 0.34), rgba(150, 130, 230, 0.1));
}
.cell.area-palace {
  background-image: radial-gradient(circle at 50% 50%, rgba(212, 175, 55, 0.34), rgba(212, 175, 55, 0.1));
}

/* \u81EA\u5206\u3068\u76F8\u624B\u306E\u30A8\u30EA\u30A2\u306E\u672D\u3002\u81EA\u5206\u306E\u756A\u306A\u3089\u300C\u767A\u52D5\u300D */
.area-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  margin: 0 0 10px;
  font-size: 12px;
}
.area-bar-picking {
  color: var(--gold-soft);
  font-size: 13px;
}
.area-promotion-options {
  display: flex;
  flex: 1 0 100%;
  gap: 8px;
}
.area-promotion-options .btn {
  flex: 1;
  min-height: 44px;
  white-space: normal;
}
.area-promotion-options small { display: block; font-size: 11px; }
.area-pick-instruction { flex: 1; min-width: 150px; }
.area-bar-picking > .btn { min-height: 44px; }
.area-chip {
  display: inline-flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  border: 1px solid var(--btn-edge);
  background: rgba(255, 255, 255, 0.04);
  color: var(--ink);
}
.area-chip b {
  color: var(--gold-soft);
  font-weight: 600;
}
.area-chip small {
  color: var(--text-dim);
  font-size: 11px;
}
.area-chip-earth { border-color: rgba(139, 94, 50, 0.7); }
.area-chip-sea { border-color: rgba(46, 126, 196, 0.7); }
.area-chip-forest { border-color: rgba(52, 140, 78, 0.7); }
.area-chip-ice { border-color: rgba(160, 220, 255, 0.7); }
.area-chip-sky { border-color: rgba(150, 130, 230, 0.7); }
.area-chip-palace { border-color: rgba(212, 175, 55, 0.7); }
/* A\u30D5\u30A9\u30A4\u30EB\u306E\u9B54\u6CD5(\u30E9\u30F3\u30D7\u306E\u30DE\u30B8\u30B7\u30E3\u30F3\u306E\u8272)\u3002\u30A8\u30EA\u30A2\u306E\u5E2F\u3068\u540C\u3058\u4F5C\u308A\u3067\u3001\u76E4\u3068\u306F\u9593\u3092\u7A7A\u3051\u308B */
.area-chip-ace { border-color: rgba(211, 167, 235, 0.75); }
.ace-foil-bar { margin: 0 0 12px; }
.area-why {
  width: 100%;
  text-align: center;
  color: var(--text-dim);
}

/* \u767A\u52D5\u306E\u5E2F\u3002\u76E4\u306E\u4E0A\u306B\u91CD\u306D\u3066 1.8 \u79D2 */
.board-outer {
  position: relative;
}
.area-flash {
  position: absolute;
  left: 50%;
  top: 38%;
  transform: translate(-50%, -50%);
  z-index: 6;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 12px 18px;
  border-radius: 12px;
  border: 1px solid var(--gold);
  background: rgba(8, 17, 32, 0.92);
  color: var(--ink);
  text-align: center;
  pointer-events: none;
  animation: area-flash-in 1.8s ease-out forwards;
}
.area-flash b {
  color: var(--gold-soft);
  font-size: 16px;
}
.area-flash span {
  font-size: 13px;
  color: var(--text-dim);
}
.area-flash-ice { border-color: rgba(160, 220, 255, 0.9); }
.area-flash-sea { border-color: rgba(46, 126, 196, 0.9); }
.area-flash-forest { border-color: rgba(52, 140, 78, 0.9); }
.area-flash-earth { border-color: rgba(139, 94, 50, 0.9); }
.area-flash-sky { border-color: rgba(150, 130, 230, 0.9); }
@keyframes area-flash-in {
  0% { opacity: 0; transform: translate(-50%, -40%) scale(0.92); }
  12% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  80% { opacity: 1; }
  100% { opacity: 0; }
}

/* \u51CD\u3063\u305F\u99D2: \u9752\u767D\u304F\u3001\u4E0A\u306B\u6C37\u306E\u3057\u308B\u3057 */
.piece-frozen .card-face,
.piece-frozen .card-back {
  filter: saturate(0.4) brightness(1.15) hue-rotate(160deg);
}
.frozen-badge {
  position: absolute;
  top: -8px;
  right: -6px;
  font-size: 12px;
  line-height: 1;
  color: #cbefff;
  text-shadow: 0 0 6px rgba(120, 200, 255, 0.9);
}
/* \u898B\u629C\u3044\u305F\u99D2(\u81EA\u5206\u306B\u3060\u3051\u8868\u5411\u304D) */
.known-badge {
  position: absolute;
  bottom: -4px;
  left: 50%;
  transform: translateX(-50%);
  background: #2f6b3a;
  color: #eaffef;
  font-size: 9px;
  font-weight: 700;
  padding: 1px 4px;
  border-radius: 3px;
  white-space: nowrap;
}
/* \u7A7A\u30FB\u5BAE\u6BBF\u3067\u73FE\u308C\u305F\u672D\u306E\u5C02\u7528\u306E\u3057\u308B\u3057 */
.mark-badge {
  position: absolute;
  bottom: -4px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 9px;
  font-weight: 700;
  padding: 1px 5px;
  border-radius: 3px;
  white-space: nowrap;
  border: 1px solid rgba(255, 255, 255, 0.5);
}
.mark-sky {
  background: #5a48b8;
  color: #f1edff;
}
.mark-palace {
  background: var(--gold);
  color: #1b1405;
}

/* \u6D77\u306E\u30A8\u30EA\u30A2: \u5F15\u304D\u5BC4\u305B\u306F\u8DF3\u3070\u305A\u306B\u6ED1\u3089\u305B\u308B(\u901A\u5E38\u306E\u79FB\u52D5\u306F1\u30DE\u30B9\u305A\u3064\u6B62\u307E\u308B) */
.piece-slot.piece-sea {
  animation-timing-function: ease-in-out;
}

/* ===== \u76E4\u9762\u30A8\u30EA\u30A2\u306E\u8AAC\u660E(src/ui/area-guide.jsx) ===== */
.area-guide-details {
  margin-top: 10px;
  border-top: 1px solid #bea57440;
}
.area-guide-details > summary {
  padding: 12px 0;
  min-height: 44px;
  cursor: pointer;
  color: #dbc698;
  font-size: 12px;
}
.area-guide-details > summary:focus-visible {
  outline: 2px solid #dfc27c;
  outline-offset: 2px;
}
.area-guide-common {
  margin-top: 16px;
}
.area-guide {
  text-align: left;
}
.area-guide-lead {
  margin: 0 0 12px;
  line-height: 1.7;
}
.area-guide-lead b,
.area-guide-effect b {
  color: var(--gold-soft);
}
.area-guide-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.area-guide-row {
  border: 1px solid var(--line);
  border-left-width: 4px;
  border-radius: 10px;
  padding: 10px 12px;
  background: rgba(255, 255, 255, 0.03);
}
.area-guide-earth { border-left-color: rgba(139, 94, 50, 0.9); }
.area-guide-sea { border-left-color: rgba(46, 126, 196, 0.9); }
.area-guide-forest { border-left-color: rgba(52, 140, 78, 0.9); }
.area-guide-ice { border-left-color: rgba(160, 220, 255, 0.9); }
.area-guide-sky { border-left-color: rgba(150, 130, 230, 0.9); }
.area-guide-palace { border-left-color: rgba(212, 175, 55, 0.9); }
.area-guide-head {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 4px;
}
.area-guide-ranks {
  font-size: 12px;
  color: var(--gold-soft);
}
.area-guide-when {
  font-size: 12px;
  color: var(--text-dim);
  margin-bottom: 4px;
}
.area-guide-effect {
  font-size: 13px;
  color: var(--ink);
  line-height: 1.6;
}
.area-guide-seen {
  margin-top: 4px;
  font-size: 12px;
  color: var(--text-dim);
  line-height: 1.5;
}
/* \u30A8\u30EA\u30A2\u306E\u672D\u306E\u6A2A\u306E\u300C?\u300D */
.area-help {
  width: 28px;
  height: 28px;
  font-size: 14px;
  font-weight: 700;
}

/* ===== \u76E4\u9762\u30A8\u30EA\u30A2\u306E\u76E4\u306E\u30D7\u30EC\u30D3\u30E5\u30FC(src/ui/area-preview.jsx) =====
   \u5BFE\u5C40\u4E2D\u306E\u76E4\u306E\u7D75(fields/)\u3092\u305D\u306E\u307E\u307E\u5C0F\u3055\u304F\u3002\u5BFE\u5C40\u4E2D\u3068\u540C\u3058\u304F 12% \u306E\u5185\u5074\u306B 9\xD79 \u306E\u76EE */
.area-preview-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin: 8px 0 10px;
}
.area-preview {
  margin: 0;
  flex: 1 1 140px;
  max-width: 220px;
}
.area-preview-board {
  position: relative;
  aspect-ratio: 1;
  border-radius: 8px;
  overflow: hidden;
  background: #101b28 center / 100% 100% no-repeat;
  border: 1px solid rgba(212, 175, 55, 0.35);
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.35);
}
.area-preview-board:not(.is-loaded)::after {
  content: "";
  position: absolute;
  inset: 12%;
  border: 1px dashed rgba(212, 175, 55, 0.3);
  border-radius: 4px;
}
.area-preview-grid {
  position: absolute;
  inset: 12%;
  display: grid;
  grid-template-columns: repeat(9, 1fr);
  grid-template-rows: repeat(9, 1fr);
  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: 3px;
  overflow: hidden;
}
.area-preview-grid span {
  border: 1px solid rgba(255, 255, 255, 0.12);
}
.area-preview-grid .zone-foe {
  background: rgba(45, 105, 165, 0.35);
}
.area-preview-grid .zone-mine {
  background: rgba(160, 45, 38, 0.32);
}
.area-preview figcaption {
  margin-top: 4px;
  font-size: 11px;
