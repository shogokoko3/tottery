.tottery-root {
  /* \u6DF1\u3044\u7D3A\u3068\u91D1\u3092\u57FA\u8ABF\u306B\u3057\u305F\u3001\u91CD\u539A\u306A\u610F\u5320 */
  --bg: #081120;
  --panel: #10203a;
  --panel-2: #16294a;
  --line: rgba(212, 175, 55, 0.22);
  --gold: #d4af37;
  --gold-soft: #f0d98a;
  --gold-deep: #8a6d1f;
  --card-face: #f7f3e8;
  --card-ink: #1a1a1a;
  --card-red: #b0202f;
  --text: #f2ead9;
  --text-dim: #a9b4cc;
  --p0: #c0392b;
  --p1: #2a6f9e;
  /* \u5165\u308C\u66FF\u3048(A)\u5C02\u7528\u306E\u8272\u3002\u53D6\u308C\u308B\u99D2\u306E\u8D64\u3068\u6DF7\u3056\u3089\u306A\u3044\u3088\u3046\u7D2B\u306B\u3057\u3066\u3042\u308B */
  --swap: #8f6fd6;
  --swap-soft: #cbb6ff;
  --btn-face: #1b3050;
  --btn-face-hi: #24406a;
  --btn-edge: rgba(212, 175, 55, 0.45);
  background: radial-gradient(
    120% 90% at 50% 0%,
    #16294a 0%,
    #0c1a30 55%,
    #071120 100%
  );
  color: var(--text);
  min-height: 100%;
  font-family: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  overflow: hidden;
  position: relative;
  min-height: 100vh;
}
.tottery-root * {
  box-sizing: border-box;
}
.title-font {
  font-family: "Shippori Mincho", serif;
  font-weight: 800;
}

.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(
    180deg,
    rgba(8, 17, 32, 0.9),
    rgba(8, 17, 32, 0.4)
  );
}
.brand {
  font-family: "Shippori Mincho", serif;
  font-weight: 700;
  letter-spacing: 0.18em;
  color: var(--gold-soft);
  font-size: 17px;
  text-shadow: 0 0 12px rgba(212, 175, 55, 0.35);
}
.brand::before,
.brand::after {
  content: "\u25C6";
  font-size: 8px;
  color: var(--gold);
  vertical-align: middle;
  margin: 0 10px;
  opacity: 0.8;
}
.icon-btn {
  background: var(--btn-face);
  border: 1px solid var(--btn-edge);
  color: var(--gold-soft);
  border-radius: 8px;
  padding: 6px;
  cursor: pointer;
}
.icon-btn:hover {
  color: var(--gold-soft);
  border-color: var(--gold);
  background: var(--btn-face-hi);
}
.icon-btn:active {
  transform: translateY(1px);
}
.stage {
  padding: 20px;
  min-height: 520px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}

/* \u898B\u51FA\u3057\u306F\u4E2D\u592E\u306B\u98FE\u308A\u7F6B\u3092\u6DFB\u3048\u308B */
h2 {
  font-family: "Shippori Mincho", serif;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--gold-soft);
  text-shadow: 0 0 14px rgba(212, 175, 55, 0.25);
}
h3 {
  font-family: "Shippori Mincho", serif;
  font-weight: 700;
  letter-spacing: 0.06em;
}
.setup-wrap h2,
.center-stage h2 {
  position: relative;
  padding-bottom: 14px;
  margin-bottom: 10px;
}
.setup-wrap h2::after,
.center-stage h2::after {
  content: "\u2756";
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  font-size: 10px;
  color: var(--gold);
  opacity: 0.85;
}

.intro {
  text-align: center;
  max-width: 420px;
}
.intro-emblem {
  font-family: "Shippori Mincho", serif;
  font-size: 34px;
  color: var(--gold);
  border: 2px solid var(--gold);
  border-radius: 50%;
  width: 84px;
  height: 84px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 20px;
  background: radial-gradient(
    circle,
    rgba(212, 175, 55, 0.14),
    transparent 70%
  );
  box-shadow:
    0 0 26px rgba(212, 175, 55, 0.3),
    inset 0 0 20px rgba(212, 175, 55, 0.12);
}
.king-card {
  margin: 6px auto 26px;
  width: min(52vw, 210px);
  position: relative;
}
.king-card img {
  width: 100%;
  display: block;
  border-radius: 8px;
  box-shadow:
    0 0 34px rgba(212, 175, 55, 0.45),
    0 14px 30px rgba(0, 0, 0, 0.6);
}
.king-card::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -16px;
  transform: translateX(-50%);
  width: 70%;
  height: 16px;
  border-radius: 50%;
  background: radial-gradient(
    ellipse,
    rgba(212, 175, 55, 0.35),
    transparent 70%
  );
}
.intro-start {
  width: min(72vw, 300px);
  justify-content: center;
}
.win-card {
  width: min(40vw, 140px);
  margin: 10px auto 4px;
}
.gameover-panel .setup-actions {
  flex-direction: column;
  align-items: stretch;
}
.intro h1 {
  font-size: 42px;
  margin: 0 0 10px;
  letter-spacing: 0.16em;
  font-weight: 800;
  color: var(--gold-soft);
  text-shadow:
    0 0 24px rgba(212, 175, 55, 0.45),
    0 2px 4px rgba(0, 0, 0, 0.6);
}
.subtitle {
  color: var(--gold);
  margin-bottom: 30px;
  font-size: 15px;
  letter-spacing: 0.14em;
}
.intro-choice-label {
  font-size: 12px;
  letter-spacing: 0.12em;
  color: var(--gold-soft);
  text-transform: uppercase;
  margin-bottom: 10px;
}
.intro-boards {
  display: flex;
  gap: 16px;
  justify-content: center;
}
.board-choice {
  background: linear-gradient(170deg, #152b49, #0d1c33);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  color: var(--text);
}
.board-choice.active {
  border-color: var(--gold);
  border-width: 2px;
  box-shadow: 0 0 18px rgba(212, 175, 55, 0.25);
}
.board-choice:hover {
  border-color: var(--gold);
}
.board-choice-grid {
  display: grid;
  gap: 2px;
  width: 70px;
  height: 70px;
}
.board-choice-grid span {
  background: var(--card-face);
  opacity: 0.75;
  border-radius: 0;
  box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.3);
}

.center-stage {
  text-align: center;
}
.dim-icon {
  color: var(--text-dim);
  margin-bottom: 10px;
}
.dice-row {
  display: flex;
  gap: 14px;
  justify-content: center;
  margin: 18px 0;
}
.dice-item {
  border: 1px solid;
  border-radius: 10px;
  padding: 10px 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  background: var(--panel);
}
.dice-item strong {
  font-size: 26px;
  font-family: "Shippori Mincho", serif;
}

.btn {
  font-family: "Shippori Mincho", serif;
  font-weight: 700;
  border-radius: 6px;
  padding: 12px 20px;
  cursor: pointer;
  letter-spacing: 0.06em;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: 1px solid transparent;
  font-size: 15px;
  position: relative;
}
.btn-primary {
  background: linear-gradient(180deg, #f0d98a 0%, #d4af37 45%, #a8842a 100%);
  color: #2a1e05;
  border-color: #f0d98a;
  box-shadow:
    0 3px 0 rgba(0, 0, 0, 0.4),
    inset 0 1px 0 rgba(255, 255, 255, 0.5);
}
.btn-primary:hover {
  filter: brightness(1.07);
}
.btn-primary:active {
  transform: translateY(3px);
  box-shadow: none;
}
.btn-primary:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  box-shadow: none;
  transform: none;
}
.btn-ghost {
  background: linear-gradient(180deg, var(--btn-face-hi), var(--btn-face));
  border: 1px solid var(--btn-edge);
  color: var(--gold-soft);
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.35);
}
.btn-ghost:hover {
  border-color: var(--gold);
  background: var(--btn-face-hi);
}
.btn-ghost:active {
  transform: translateY(3px);
  box-shadow: none;
}
.btn-ghost:disabled {
  opacity: 0.35;
  cursor: not-allowed;
  box-shadow: none;
}
.btn-large {
  padding: 15px 30px;
  font-size: 17px;
}
/* \u5BFE\u6226\u76F8\u624B\u306E\u9078\u629E\u30022\u3064\u3092\u5BFE\u7B49\u306A\u9078\u629E\u80A2\u3068\u3057\u3066\u3001\u8272\u3067\u5F79\u5272\u3092\u5206\u3051\u308B */
.btn-friend {
  background: linear-gradient(180deg, #2e6f8e, #1a4661);
  color: #e8f4fb;
  border-color: rgba(212, 175, 55, 0.35);
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.35);
}
.btn-friend:hover {
  filter: brightness(1.08);
}
.btn-friend:active {
  transform: translateY(3px);
  box-shadow: none;
}
.btn-choice {
  padding: 16px 20px;
  justify-content: flex-start;
  gap: 14px;
  text-align: left;
}
.choice-label {
  display: flex;
  flex-direction: column;
  line-height: 1.4;
}
.choice-label small {
  font-size: 11px;
  font-weight: 500;
  opacity: 0.8;
  margin-top: 3px;
  font-family: "Shippori Mincho", serif;
}
.nav-stack {
  display: flex;
  flex-direction: column;
  gap: 14px;
  align-items: stretch;
  min-width: 250px;
  margin-top: 6px;
}
.spin-icon {
  animation: tottery-spin 1.1s linear infinite;
}
@keyframes tottery-spin {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}
.room-code {
  font-family: "Shippori Mincho", serif;
  font-size: 44px;
  letter-spacing: 0.2em;
  color: var(--gold-soft);
  border: 2px solid var(--gold);
  border-radius: 8px;
  padding: 16px 30px;
  margin: 16px 0;
  background: rgba(212, 175, 55, 0.07);
  text-shadow: 0 0 18px rgba(212, 175, 55, 0.4);
}
.room-join-row {
  display: flex;
  gap: 10px;
}
.room-input {
  flex: 1;
  background: var(--card-face);
  border: 1px solid var(--gold);
  border-radius: 6px;
  color: #1a1a1a;
  padding: 12px;
  font-size: 20px;
  font-family: "Shippori Mincho", serif;
  letter-spacing: 0.25em;
  text-align: center;
  text-transform: uppercase;
  min-width: 0;
  font-weight: 700;
}
.room-input:focus {
  outline: none;
  box-shadow: 0 0 0 2px var(--gold-soft);
}
.diag-line {
  font-size: 12px;
  margin-bottom: 16px;
}
.diag-checking {
  color: var(--text-dim);
}
.diag-ok {
  color: #7fd4a8;
}
.diag-fail {
  color: #e08b7a;
}

.interstitial {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
}
.interstitial-card {
  text-align: center;
  background: linear-gradient(170deg, #132844, #0b1729);
  border: 2px solid var(--gold);
  border-radius: 10px;
  padding: 36px 30px;
  position: relative;
  box-shadow:
    0 0 0 1px rgba(0, 0, 0, 0.6),
    0 10px 34px rgba(0, 0, 0, 0.5);
}
.interstitial-card::before {
  content: "";
  position: absolute;
  inset: 6px;
  border: 1px solid rgba(212, 175, 55, 0.35);
  border-radius: 6px;
  pointer-events: none;
}
.interstitial-eyebrow {
  font-size: 12px;
  letter-spacing: 0.22em;
  color: var(--gold);
  margin-bottom: 14px;
  border: 1px solid var(--line);
  display: inline-block;
  padding: 6px 16px;
  border-radius: 4px;
}
.interstitial-card h2 {
  font-family: "Shippori Mincho", serif;
  margin: 0 0 14px;
  font-size: 30px;
  letter-spacing: 0.1em;
}
.interstitial-card p {
  color: var(--text-dim);
  font-size: 13px;
  margin-bottom: 20px;
  max-width: 300px;
}

.setup-wrap {
  width: 100%;
  max-width: 620px;
  text-align: center;
}
.setup-wrap h2 {
  font-family: "Shippori Mincho", serif;
  margin-bottom: 6px;
}
.hint {
  color: var(--text-dim);
  font-size: 13px;
  margin-bottom: 16px;
}
.hand-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin-bottom: 18px;
}
.hand-split {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 18px;
}
.hand-split .hand-row {
  margin-bottom: 0;
}
/* \u72ED\u3044\u7AEF\u672B\u5411\u3051\u3002\u30AB\u30FC\u30C9\u3092\u8A70\u3081\u3066\u6298\u308A\u8FD4\u3057\u3001\u306F\u307F\u51FA\u3055\u306A\u3044\u3088\u3046\u306B\u3059\u308B */
.hand-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 6px;
  justify-items: center;
  margin-bottom: 18px;
}
@media (max-width: 330px) {
  .hand-grid {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}
.hand-card {
  cursor: pointer;
  border-radius: 8px;
  padding: 2px;
  border: 2px solid transparent;
  transition: transform 0.1s;
  position: relative;
}
.hand-card:hover {
  transform: translateY(-3px);
}
.hand-card-selected {
  border-color: var(--gold);
  transform: translateY(3px);
  opacity: 0.75;
}
.discard-badge {
  position: absolute;
  top: -6px;
  right: -6px;
  background: #d0483a;
  color: #fff;
  border-radius: 50%;
  width: 18px;
  height: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
}
.card-face {
  position: relative;
  border-radius: 4px;
  overflow: hidden;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
}
.card-face img {
  width: 100%;
  height: 100%;
  object-fit: fill;
  display: block;
}
/* \u738B(\u968A\u9577)\u306F\u7E01\u3092\u91D1\u8272\u306B\u5149\u3089\u305B\u308B */
.card-captain {
  box-shadow: 0 0 10px rgba(212, 175, 55, 0.7);
}
/* \u7D75\u67C4\u306F\u5171\u901A\u306A\u306E\u3067\u3001\u8D64\u30B9\u30FC\u30C8\u3060\u3051\u8272\u5473\u3092\u91CD\u306D\u3066\u533A\u5225\u3059\u308B */
.card-tint {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: rgba(176, 32, 47, 0.13);
  mix-blend-mode: multiply;
}
.card-back {
  position: relative;
  border-radius: 4px;
  overflow: hidden;
  box-shadow:
    0 2px 6px rgba(0, 0, 0, 0.5),
    inset 0 0 0 1px var(--pc);
}
.card-back img {
  width: 100%;
  height: 100%;
  object-fit: fill;
  display: block;
}

.arrange-layout {
  display: flex;
  justify-content: center;
  margin-bottom: 14px;
}
.mini-board {
  display: grid;
  gap: 0;
  width: min(78vw, 320px);
  aspect-ratio: 1;
  background: linear-gradient(160deg, #0d1c33, #091426);
  padding: 5px;
  border-radius: 8px;
  border: 2px solid var(--gold);
  grid-auto-rows: minmax(0, 1fr);
}
.mini-cell {
  background: transparent;
  position: relative;
  border: 1px solid rgba(212, 175, 55, 0.28);
}
.mini-cell-zone {
  background: rgba(45, 105, 165, 0.5);
  cursor: pointer;
}
.mini-cell-open {
  background: rgba(80, 200, 140, 0.18);
}
.mini-piece {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.mini-piece-disabled {
  opacity: 0.3;
  filter: grayscale(0.6);
}
.tray {
  margin-bottom: 14px;
}
.tray-label {
  font-size: 12px;
  color: var(--text-dim);
  margin-bottom: 6px;
}
.tray-row {
  display: flex;
  gap: 6px;
  justify-content: center;
  flex-wrap: wrap;
}
.setup-actions {
  display: flex;
  gap: 10px;
  justify-content: center;
}

.play-wrap {
  width: 100%;
  max-width: 560px;
}
.turn-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
  font-size: 13px;
}
.turn-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
}
.turn-log {
  color: var(--text-dim);
  margin-left: auto;
  font-family: "IBM Plex Mono", monospace;
  font-size: 11px;
}
.board-outer {
  display: flex;
  justify-content: center;
}
/* \u76E4\u306E\u5DE6\u3068\u4E0B\u306B\u5EA7\u6A19\u306E\u76EE\u76DB\u308A\u3092\u7F6E\u304F\u3002\u76E4\u3092\u53CD\u8EE2\u3057\u3066\u3082\u6B63\u3057\u3044\u5EA7\u6A19\u304C\u4E26\u3076 */
.board-frame {
  display: grid;
  grid-template-columns: auto 1fr;
  grid-template-rows: 1fr auto;
  gap: 4px;
  width: min(94vw, 500px);
}
.rank-labels {
  display: grid;
  grid-template-rows: repeat(var(--n), 1fr);
  align-items: center;
  font-size: 13px;
  color: var(--gold-soft);
  font-family: "Shippori Mincho", serif;
  padding: 6px 5px;
  text-align: center;
  font-weight: 600;
}
.file-labels {
  display: grid;
  grid-template-columns: repeat(var(--n), 1fr);
  justify-items: center;
  grid-column: 2;
  font-size: 13px;
  color: var(--gold-soft);
  font-family: "Shippori Mincho", serif;
  padding: 4px 6px 0;
  font-weight: 600;
}
.board-frame .board-grid {
  width: 100%;
}
.board-grid {
  display: grid;
  gap: 0;
  width: min(90vw, 480px);
  aspect-ratio: 1;
  background: linear-gradient(160deg, #0d1c33, #091426);
  padding: 5px;
  border-radius: 8px;
  border: 2px solid var(--gold);
  box-shadow:
    0 0 0 1px rgba(0, 0, 0, 0.6),
    0 6px 20px rgba(0, 0, 0, 0.5);
  grid-auto-rows: minmax(0, 1fr);
}
/* \u30BB\u30EB\u5185\u306E\u99D2\u306F\u30DE\u30B9\u76EE\u306B\u53CE\u3081\u308B\u3002\u306F\u307F\u51FA\u3057\u3066\u96A3\u306E\u30DE\u30B9\u306B\u91CD\u306A\u308B\u306E\u3092\u9632\u3050 */
.cell > div {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
}
/* \u30DE\u30B9\u76EE\u304B\u3089\u306F\u307F\u51FA\u3055\u306A\u3044\u3088\u3046\u3001\u30AB\u30FC\u30C9\u306E\u8868\u793A\u30B5\u30A4\u30BA\u3092\u5185\u5074\u306B\u53CE\u3081\u308B */
.cell .card-face,
.cell .card-back {
  max-width: 86%;
  max-height: 86%;
}
.cell .card-face img,
.cell .card-back img {
  width: 100%;
  height: 100%;
}
.cell {
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  position: relative;
  min-width: 0;
  min-height: 0;
  border: 1px solid rgba(212, 175, 55, 0.28);
}
.cell.zone-0 {
  background: rgba(160, 45, 38, 0.42);
}
.cell.zone-1 {
  background: rgba(45, 105, 165, 0.5);
}
.cell-move::after {
  content: "";
  position: absolute;
  width: 26%;
  height: 26%;
  border-radius: 50%;
  background: var(--gold-soft);
  opacity: 0.85;
  box-shadow: 0 0 8px var(--gold);
}
.cell-capture {
  box-shadow:
    inset 0 0 0 3px #d0483a,
    0 0 12px rgba(208, 72, 58, 0.5);
}
/* \u76F4\u524D\u306E\u624B\u3002\u79FB\u52D5\u5143\u306F\u63A7\u3048\u3081\u306B\u3001\u79FB\u52D5\u5148\u306F\u306F\u3063\u304D\u308A\u793A\u3059 */
.cell-from {
  box-shadow: inset 0 0 0 2px var(--lm);
  opacity: 0.95;
}
.cell-from::after {
  content: "";
  position: absolute;
  inset: 22%;
  border-radius: 50%;
  border: 2px dashed var(--lm);
  opacity: 0.55;
}
.cell-to {
  box-shadow: inset 0 0 0 3px var(--lm);
}
.cell-to::before {
  content: "";
  position: absolute;
  inset: 0;
  background: var(--lm);
  opacity: 0.16;
  pointer-events: none;
}
/* \u5165\u308C\u66FF\u3048\u304C\u8D77\u304D\u305F\u30DE\u30B9\u3002\u8D64\u306E\u67A0\u306F\u300C\u53D6\u308C\u308B\u99D2\u300D\u3068\u7D1B\u3089\u308F\u3057\u3044\u306E\u3067\u7D2B\u3067\u793A\u3059 */
.cell-swap {
  box-shadow:
    inset 0 0 0 2px var(--swap),
    0 0 10px rgba(155, 126, 222, 0.35);
}
.cell-swap::after {
  content: "\u21C4";
  position: absolute;
  top: 0;
  right: 2px;
  font-size: 12px;
  font-weight: 700;
  color: var(--swap-soft);
  text-shadow: 0 0 6px rgba(155, 126, 222, 0.9);
}
.piece-wrap {
  position: relative;
}
.piece-selected {
  outline: 2px solid var(--gold-soft);
  border-radius: 4px;
  box-shadow: 0 0 14px rgba(212, 175, 55, 0.6);
}
.piece-pickable {
  filter: drop-shadow(0 0 5px var(--gold-soft));
}
.king-badge {
  position: absolute;
  top: -9px;
  left: 50%;
  transform: translateX(-50%);
  background: radial-gradient(circle, #1a2b4a 60%, transparent 70%);
  border-radius: 50%;
}

.action-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  justify-content: center;
  margin-top: 12px;
  font-size: 13px;
  color: var(--text-dim);
  flex-wrap: wrap;
}
.captured-row {
  display: flex;
  gap: 16px;
  margin-top: 16px;
  justify-content: center;
  flex-wrap: wrap;
}
.captured-col {
  text-align: center;
}
.captured-label {
  font-size: 11px;
  margin-bottom: 6px;
}
.captured-cards {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  max-width: 220px;
  justify-content: center;
}
.captured-card {
  cursor: pointer;
}
.discard-panel {
  margin: 14px 0;
}
.discard-label {
  font-size: 12px;
  margin-bottom: 6px;
}
.discard-row {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  justify-content: center;
}
.discard-card {
  opacity: 0.85;
}
.discard-toggle-wrap {
  margin-top: 14px;
  text-align: center;
}
.resign-row {
  margin-top: 18px;
  text-align: center;
}
.btn-resign {
  font-size: 13px;
  padding: 9px 18px;
  opacity: 0.8;
}
.btn-resign:hover {
  opacity: 1;
  border-color: #e08b7a;
  color: #e8a08f;
}
.discard-both {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-top: 6px;
}
.log-list {
  text-align: left;
  padding-left: 20px;
  font-size: 13px;
  color: var(--text-dim);
  line-height: 1.8;
  margin: 0;
}
.log-list li {
  margin-bottom: 2px;
}

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(8, 10, 22, 0.72);

/* --- \u30B5\u30A4\u30B3\u30ED --- */
.die3d {
  width: 150px;
  height: 150px;
}
.die3d img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
  filter: drop-shadow(0 12px 26px rgba(0, 0, 0, 0.6));
}
.title-hero {
  position: relative;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
}
.title-bg {
  width: 100%;
  max-width: 430px;
  display: block;
  border-radius: 10px;
}
.title-hero .intro-start {
  position: absolute;
  bottom: 6%;
  left: 50%;
  transform: translateX(-50%);
  width: min(66%, 290px);
}
.die-stage {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 150px;
  margin: 10px 0 6px;
  perspective: 700px;
}
.die {
  width: 96px;
  height: 96px;
  border-radius: 18px;
  padding: 12px;
  background: linear-gradient(145deg, #fffdf7 0%, #f2ece0 45%, #ddd3bd 100%);
  box-shadow:
    0 10px 24px rgba(0, 0, 0, 0.55),
    inset 0 -5px 10px rgba(0, 0, 0, 0.16),
    inset 0 3px 5px rgba(255, 255, 255, 0.95);
  border: 1px solid rgba(0, 0, 0, 0.18);
}
.die-grid {
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);
  gap: 3px;
}
.pip {
  border-radius: 50%;
}
.pip-on {
  background: radial-gradient(circle at 35% 30%, #3a3228, #131009 70%);
  box-shadow:
    inset 0 1px 2px rgba(255, 255, 255, 0.3),
    0 1px 1px rgba(255, 255, 255, 0.15);
}
.die-rolling {
  animation: die-tumble 0.5s linear infinite;
}
@keyframes die-tumble {
  0% {
    transform: rotateX(0deg) rotateY(0deg) translateY(0);
  }
  25% {
    transform: rotateX(180deg) rotateY(90deg) translateY(-22px);
  }
  50% {
    transform: rotateX(360deg) rotateY(180deg) translateY(0);
  }
  75% {
    transform: rotateX(180deg) rotateY(270deg) translateY(-14px);
  }
  100% {
    transform: rotateX(0deg) rotateY(360deg) translateY(0);
  }
}
/* --- \u8EE2\u304C\u308B\u7ACB\u4F53\u306E\u30B5\u30A4\u30B3\u30ED --- */
.die-cube-wrap {
  position: relative;
  width: 104px;
  height: 104px;
}
.die-cube {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
  will-change: transform;
}
.is-rolling .die-cube {
  animation: die-roll 0.62s linear infinite;
}
/* \u6B62\u307E\u308B\u3068\u304D\u306E\u56DE\u308A\u65B9\u3002\u901F\u304F\u56DE\u3063\u3066\u3001\u6E1B\u901F\u3057\u306A\u304C\u3089\u51FA\u76EE\u3067\u6B62\u307E\u308B\u3002
   \u884C\u304D\u5148\u306F\u8981\u7D20\u3054\u3068\u306E --to-x / --to-y\u3002\u540C\u3058\u95A2\u6570\u5217(rotateX rotateY)\u3067
   \u88DC\u9593\u3055\u305B\u308B\u3053\u3068\u3067\u3001\u4F59\u5206\u306A2\u56DE\u8EE2\u304C\u305D\u306E\u307E\u307E\u56DE\u308B */
.is-settled .die-cube {
  animation: die-settle 1.15s cubic-bezier(0.12, 0.85, 0.18, 1) both;
}
@keyframes die-settle {
  from {
    transform: rotateX(0deg) rotateY(0deg);
  }
  to {
    transform: rotateX(var(--to-x, 720deg)) rotateY(var(--to-y, 720deg));
  }
}
.die-face {
  position: absolute;
  inset: 0;
  border-radius: 18px;
  padding: 12px;
  background: linear-gradient(145deg, #fffdf7 0%, #f2ece0 45%, #ddd3bd 100%);
  box-shadow:
    inset 0 -5px 10px rgba(0, 0, 0, 0.16),
    inset 0 3px 5px rgba(255, 255, 255, 0.95);
  border: 1px solid rgba(0, 0, 0, 0.18);
  backface-visibility: hidden;
}
.die-face-front {
  transform: rotateY(0deg) translateZ(52px);
}
.die-face-back {
  transform: rotateY(180deg) translateZ(52px);
}
.die-face-right {
  transform: rotateY(90deg) translateZ(52px);
}
.die-face-left {
  transform: rotateY(-90deg) translateZ(52px);
}
.die-face-top {
  transform: rotateX(90deg) translateZ(52px);
}
.die-face-bottom {
  transform: rotateX(-90deg) translateZ(52px);
}
/* \u5730\u9762\u306E\u5F71\u3002\u8DF3\u306D\u308B\u3068\u5C0F\u3055\u304F\u8584\u304F\u3001\u7740\u5730\u3067\u5927\u304D\u304F\u6FC3\u304F */
.die-shadow {
  position: absolute;
  left: 8%;
  right: 8%;
  bottom: -30px;
  height: 18px;
  border-radius: 50%;
  background: radial-gradient(
    ellipse at center,
    rgba(0, 0, 0, 0.6),
    rgba(0, 0, 0, 0) 70%
  );
  transform-origin: center;
  pointer-events: none;
}
.is-rolling .die-shadow {
  animation: die-shadow-roll 0.62s linear infinite;
}
/* \u7740\u5730\u306E\u8DF3\u306D\u8FD4\u308A\u3002\u6B62\u307E\u308A\u306F\u3058\u3081\u306B\u4E00\u5EA6\u3060\u3051 */
.is-settled {
  animation: die-land 1.15s cubic-bezier(0.2, 0.8, 0.3, 1) both;
}
.is-settled .die-shadow {
  animation: die-shadow-land 1.15s cubic-bezier(0.2, 0.8, 0.3, 1) both;
}
@keyframes die-roll {
  0% {
    transform: translateY(0) rotateX(0deg) rotateY(0deg) rotateZ(0deg);
  }
  25% {
    transform: translateY(-36px) rotateX(200deg) rotateY(110deg) rotateZ(18deg);
  }
  50% {
    transform: translateY(0) rotateX(400deg) rotateY(200deg) rotateZ(0deg);
  }
  75% {
    transform: translateY(-22px) rotateX(560deg) rotateY(290deg) rotateZ(-14deg);
  }
  100% {
    transform: translateY(0) rotateX(720deg) rotateY(360deg) rotateZ(0deg);
  }
}
@keyframes die-shadow-roll {
  0%,
  50%,
  100% {
    transform: scale(1);
    opacity: 1;
  }
  25% {
    transform: scale(0.72);
    opacity: 0.55;
  }
  75% {
    transform: scale(0.82);
    opacity: 0.7;
  }
}
@keyframes die-land {
  0% {
    transform: translateY(-30px);
  }
  38% {
    transform: translateY(0);
  }
  58% {
    transform: translateY(-9px);
  }
  76% {
    transform: translateY(0);
  }
  88% {
    transform: translateY(-3px);
  }
  100% {
    transform: translateY(0);
  }
}
@keyframes die-shadow-land {
  0% {
    transform: scale(0.75);
    opacity: 0.55;
  }
  38% {
    transform: scale(1.06);
    opacity: 1;
  }
  58% {
    transform: scale(0.92);
    opacity: 0.85;
  }
  76%,
  100% {
    transform: scale(1);
    opacity: 1;
  }
}
@media (prefers-reduced-motion: reduce) {
  .is-rolling .die-cube,
  .is-rolling .die-shadow,
  .is-settled,
  .is-settled .die-cube,
  .is-settled .die-shadow {
    animation: none;
  }
}

   ========================================================================= */

/* --- \u6B8B\u308A\u6642\u9593\u306E\u5E2F --- */
.setup-timer {
  width: 100%;
  max-width: 420px;
  margin: 0 auto 12px;
}
.setup-timer-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-size: 12px;
  color: var(--dim);
  margin-bottom: 4px;
}
.setup-timer-head strong {
  font-size: 18px;
  font-variant-numeric: tabular-nums;
  color: var(--gold-soft);
}
.setup-timer-track {
  height: 6px;
  border-radius: 3px;
  background: rgba(255, 255, 255, 0.09);
  overflow: hidden;
}
.setup-timer-fill {
  height: 100%;
  background: linear-gradient(90deg, #d4af37, #f0d98a);
  transition: width 0.2s linear;
}
.setup-timer-urgent .setup-timer-head strong {
  color: #ef8a76;
}
.setup-timer-urgent .setup-timer-fill {
  background: linear-gradient(90deg, #a8362a, #ef8a76);
}

/* --- \u5E03\u9663\u306E\u30C9\u30E9\u30C3\u30B0\u914D\u7F6E --- */
.mini-board {
  touch-action: none;
}
.mini-cell-hover {
  box-shadow:
    inset 0 0 0 2px var(--gold-soft),
    0 0 10px rgba(212, 175, 55, 0.45);
}
/* \u9078\u3093\u3060\u30AB\u30FC\u30C9\u304C\u52D5\u3051\u308B\u5148 */
.mini-cell-reach::after {
  content: "";
  position: absolute;
  width: 30%;
  height: 30%;
  border-radius: 50%;
  background: var(--gold-soft);
  opacity: 0.7;
  box-shadow: 0 0 8px var(--gold);
  pointer-events: none;
}
.mini-piece-lifted,
.hand-card-lifted {
  opacity: 0.35;
}
.drag-ghost {
  position: fixed;
  z-index: 60;
  transform: translate(-50%, -60%) scale(1.25);
  pointer-events: none;
  filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.6));
}
.legend-dot {
  display: inline-block;
  width: 9px;
  height: 9px;
  margin: 0 3px;
  border-radius: 50%;
  background: var(--gold-soft);
  box-shadow: 0 0 6px var(--gold);
  vertical-align: middle;
}

/* --- \u6301\u3061\u6642\u9593 --- */
.clock-bar {
  display: flex;
  gap: 8px;
  width: 100%;
  margin-bottom: 6px;
}
.clock-cell {
  flex: 1;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  padding: 5px 10px;
  border-radius: 6px;
  border: 1px solid rgba(212, 175, 55, 0.22);
  background: rgba(255, 255, 255, 0.03);
}
.clock-who {

}
.clock-time {
  font-size: 17px;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.5px;
}
.clock-active {

  box-shadow: 0 0 10px rgba(212, 175, 55, 0.25);
  background: rgba(255, 255, 255, 0.07);
}
.clock-low .clock-time {
  color: #ef8a76;
}
.clock-active.clock-low {
  animation: clock-pulse 1s ease-in-out infinite;
}
@keyframes clock-pulse {
  50% {
    box-shadow: 0 0 14px rgba(208, 72, 58, 0.55);
  }
}

/* --- \u53D6\u308B\u624B\u306E\u78BA\u8A8D --- */
.capture-confirm {
  max-width: 320px;
  text-align: center;
}
.capture-confirm h3 {
  margin: 0 0 8px;
}
.btn-danger {
  background: linear-gradient(180deg, #d9705c 0%, #b5402f 55%, #7d2a1e 100%);
  color: #fff3ef;
  border-color: #e2896f;
  box-shadow:
    0 3px 0 rgba(0, 0, 0, 0.4),
    inset 0 1px 0 rgba(255, 255, 255, 0.25);
}
.btn-danger:hover {
  filter: brightness(1.08);
}
.btn-danger:active {
  transform: translateY(3px);
  box-shadow: none;
}

/* --- \u53D6\u308C\u308B\u99D2\u306F\u300C\u7167\u6E96\u300D\u3001\u5165\u308C\u66FF\u3048\u306F\u300C\u21C4\u300D\u3002\u5F79\u5272\u3067\u5F62\u3092\u5206\u3051\u308B --- */
.cell-capture::after {
  content: "";
  position: absolute;
  inset: 12%;
  border: 2px solid rgba(255, 138, 118, 0.95);
  border-radius: 50%;
  box-shadow: 0 0 8px rgba(208, 72, 58, 0.8);
  pointer-events: none;
  animation: capture-aim 1.1s ease-in-out infinite;
}
@keyframes capture-aim {
  50% {
    transform: scale(0.86);
    opacity: 0.7;
  }
}

/* --- \u6483\u7834\u306E\u6F14\u51FA --- */
.fx-defeat {
  position: absolute;
  inset: -6%;
  border-radius: 50%;
  pointer-events: none;
  z-index: 3;
  animation: fx-burst 1100ms ease-out forwards;
}
.fx-defeat::before {
  content: "";
  position: absolute;
  inset: 26%;
  border-radius: 50%;
  animation: fx-core 1100ms ease-out forwards;
}
/* \u76F8\u624B\u3092\u5012\u3057\u305F */
.fx-defeat-foe {
  background: radial-gradient(
    circle,
    rgba(255, 226, 160, 0.9) 0%,
    rgba(212, 175, 55, 0.45) 45%,
    transparent 70%
  );
}
.fx-defeat-foe::before {
  background: #fff6dc;
  box-shadow: 0 0 22px 8px rgba(240, 217, 138, 0.85);
}
/* \u5473\u65B9\u304C\u5012\u3055\u308C\u305F */
.fx-defeat-mine {
  background: radial-gradient(
    circle,
    rgba(255, 150, 130, 0.85) 0%,
    rgba(176, 40, 47, 0.45) 45%,
    transparent 70%
  );
}
.fx-defeat-mine::before {
  background: #ffd6cd;
  box-shadow: 0 0 22px 8px rgba(208, 72, 58, 0.8);
}
/* A\u306E\u5305\u56F2\u3067\u53D6\u3063\u305F */
.fx-defeat-surround {
  background: radial-gradient(
    circle,
    rgba(203, 182, 255, 0.9) 0%,
    rgba(143, 111, 214, 0.5) 45%,
    transparent 72%
  );
  animation: fx-close 1200ms ease-out forwards;
}
.fx-defeat-surround::before {
  background: #efe6ff;
  box-shadow: 0 0 24px 9px rgba(155, 126, 222, 0.9);
}
/* \u738B\u304C\u5012\u308C\u305F\u3068\u304D\u306F\u9577\u3081\u306B\u3001\u5F37\u304F\u5149\u3089\u305B\u308B */
.fx-defeat-king {
  animation-duration: 1700ms;
}
.fx-defeat-king::before {
  animation-duration: 1700ms;
}
@keyframes fx-burst {
  0% {
    transform: scale(0.35);
    opacity: 0;
  }
  25% {
    transform: scale(1.05);
    opacity: 1;
  }
  100% {
    transform: scale(1.5);
    opacity: 0;
  }
}
@keyframes fx-close {
  0% {
    transform: scale(1.7);
    opacity: 0;
  }
  35% {
    transform: scale(0.9);
    opacity: 1;
  }
  100% {
    transform: scale(0.5);
    opacity: 0;
  }
}
@keyframes fx-core {
  0% {
    transform: scale(0.2);
    opacity: 1;
  }
  60% {
    transform: scale(1);
    opacity: 0.9;
  }
  100% {
    transform: scale(1.4);
    opacity: 0;
  }
}
@media (prefers-reduced-motion: reduce) {
  .fx-defeat,
  .fx-defeat::before,
  .cell-capture::after,
  .clock-active.clock-low {
    animation: none;
  }
}

/* =========================================================================
   \u30B9\u30DE\u30FC\u30C8\u30D5\u30A9\u30F3\u3067\u306E\u64CD\u4F5C\u3092\u524D\u63D0\u306B\u3057\u305F\u8ABF\u6574
   ========================================================================= */

/* \u63B4\u3093\u3060\u6307\u304C\u30DA\u30FC\u30B8\u306E\u30B9\u30AF\u30ED\u30FC\u30EB\u306B\u53D6\u3089\u308C\u306A\u3044\u3088\u3046\u306B\u3059\u308B */
.hand-card,

.drag-ghost {

/* \u5E03\u9663\u306E\u624B\u672D\u306F\u3001\u76E4\u3068\u4E26\u3079\u3066\u30821\u753B\u9762\u306B\u53CE\u307E\u308B\u5927\u304D\u3055\u306B\u3059\u308B */

/* \u30CE\u30C3\u30C1\u3068\u30DB\u30FC\u30E0\u30A4\u30F3\u30B8\u30B1\u30FC\u30BF\u3092\u907F\u3051\u308B */

/* \u8AAC\u660E\u306E\u5E2F\u3002\u76E4\u3092\u96A0\u3055\u306A\u3044\u3088\u3046\u4E0B\u304B\u3089\u51FA\u3059 */
.tutorial-sheet {

@keyframes sheet-rise {

.tutorial-sheet-inner h3 {

}
.tutorial-next {

/* \u8AAC\u660E\u306E\u5E2F\u304C\u51FA\u3066\u3044\u308B\u3042\u3044\u3060\u306F\u3001\u305D\u306E\u5206\u3060\u3051\u4E0B\u306B\u4F59\u767D\u3092\u8DB3\u3057\u3066\u96A0\u308C\u306A\u3044\u3088\u3046\u306B\u3059\u308B */

  padding-bottom: 240px;
}

/* \u30C1\u30E5\u30FC\u30C8\u30EA\u30A2\u30EB\u306E\u5165\u308A\u53E3\u3002\u4ED6\u306E3\u3064\u3068\u4E26\u3079\u3066\u3082\u6D6E\u304B\u306A\u3044\u8272\u306B\u3059\u308B */
.btn-scroll {

  border: 1px solid rgba(203, 182, 255, 0.38);
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.35);

.btn-scroll:hover {

}
.btn-scroll:active {

/* \u30C6\u30B9\u30C8\u30D7\u30EC\u30A4\u4E2D\u3067\u3042\u308B\u3053\u3068\u3092\u3001\u3069\u306E\u753B\u9762\u3067\u3082\u898B\u5931\u308F\u306A\u3044\u3088\u3046\u306B\u3059\u308B */

  transform: translateX(-50%);

  padding: 3px 12px;
  border-radius: 999px;
  border: 1px solid rgba(240, 217, 138, 0.5);

/* =========================================================================
   \u30C1\u30E5\u30FC\u30C8\u30EA\u30A2\u30EB: \u6B21\u306B\u64CD\u4F5C\u3059\u308B\u5834\u6240\u3092\u5149\u3089\u305B\u308B
   ========================================================================= */

.guide-target {
  position: relative;
  outline: 2px solid var(--gold-soft);
  outline-offset: 1px;
  border-radius: 4px;
  animation: guide-pulse 1.4s ease-in-out infinite;
  z-index: 2;
}
/* \u30C1\u30E5\u30FC\u30C8\u30EA\u30A2\u30EB\u4E2D\u306F\u3001\u62BC\u3057\u3066\u307B\u3057\u3044\u30DC\u30BF\u30F3\u3092\u5FC5\u305A\u5149\u3089\u305B\u308B */
.focus-button .btn-primary:not(.tutorial-next):not(:disabled),

  outline: 2px solid var(--gold-soft);

}
@keyframes guide-pulse {
  0%,

@media (prefers-reduced-motion: reduce) {
