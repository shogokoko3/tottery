}
/* \u7A7A\u30FB\u5BAE\u6BBF\u3067\u73FE\u308C\u305F\u672D\u306E\u5C02\u7528\u306E\u3057\u308B\u3057 */
.mark-badge {
  position: absolute;
  bottom: -4px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 9px;
  font-weight: 700;
  padding: 1px 5px;
  border-radius: 3px;
  white-space: nowrap;
  border: 1px solid rgba(255, 255, 255, 0.5);
}
.mark-sky {
  background: #5a48b8;
  color: #f1edff;
}
.mark-palace {
  background: var(--gold);
  color: #1b1405;
}

/* \u6D77\u306E\u30A8\u30EA\u30A2: \u5F15\u304D\u5BC4\u305B\u306F\u8DF3\u3070\u305A\u306B\u6ED1\u3089\u305B\u308B(\u901A\u5E38\u306E\u79FB\u52D5\u306F1\u30DE\u30B9\u305A\u3064\u6B62\u307E\u308B) */
.piece-slot.piece-sea {
  animation-timing-function: ease-in-out;
}

/* ===== \u76E4\u9762\u30A8\u30EA\u30A2\u306E\u8AAC\u660E(src/ui/area-guide.jsx) ===== */
.area-guide-details {
  margin-top: 10px;
  border-top: 1px solid #bea57440;
}
.area-guide-details > summary {
  padding: 12px 0;
  min-height: 44px;
  cursor: pointer;
  color: #dbc698;
  font-size: 12px;
}
.area-guide-details > summary:focus-visible {
  outline: 2px solid #dfc27c;
  outline-offset: 2px;
}
.area-guide-common {
  margin-top: 16px;
}
.area-guide {
  text-align: left;
}
.area-guide-lead {
  margin: 0 0 12px;
  line-height: 1.7;
}
.area-guide-lead b,
.area-guide-effect b {
  color: var(--gold-soft);
}
.area-guide-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.area-guide-row {
  border: 1px solid var(--line);
  border-left-width: 4px;
  border-radius: 10px;
  padding: 10px 12px;
  background: rgba(255, 255, 255, 0.03);
}
.area-guide-earth { border-left-color: rgba(139, 94, 50, 0.9); }
.area-guide-sea { border-left-color: rgba(46, 126, 196, 0.9); }
.area-guide-forest { border-left-color: rgba(52, 140, 78, 0.9); }
.area-guide-ice { border-left-color: rgba(160, 220, 255, 0.9); }
.area-guide-sky { border-left-color: rgba(150, 130, 230, 0.9); }
.area-guide-palace { border-left-color: rgba(212, 175, 55, 0.9); }
.area-guide-head {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 4px;
}
.area-guide-ranks {
  font-size: 12px;
  color: var(--gold-soft);
}
.area-guide-when {
  font-size: 12px;
  color: var(--text-dim);
  margin-bottom: 4px;
}
.area-guide-effect {
  font-size: 13px;
  color: var(--ink);
  line-height: 1.6;
}
.area-guide-seen {
  margin-top: 4px;
  font-size: 12px;
  color: var(--text-dim);
  line-height: 1.5;
}
/* \u30A8\u30EA\u30A2\u306E\u672D\u306E\u6A2A\u306E\u300C?\u300D */
.area-help {
  width: 28px;
  height: 28px;
  font-size: 14px;
  font-weight: 700;
}

/* ===== \u76E4\u9762\u30A8\u30EA\u30A2\u306E\u76E4\u306E\u30D7\u30EC\u30D3\u30E5\u30FC(src/ui/area-preview.jsx) =====
   \u5BFE\u5C40\u4E2D\u306E\u76E4\u306E\u7D75(fields/)\u3092\u305D\u306E\u307E\u307E\u5C0F\u3055\u304F\u3002\u5BFE\u5C40\u4E2D\u3068\u540C\u3058\u304F 12% \u306E\u5185\u5074\u306B 9\xD79 \u306E\u76EE */
.area-preview-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin: 8px 0 10px;
}
.area-preview {
  margin: 0;
  flex: 1 1 140px;
  max-width: 220px;
}
.area-preview-board {
  position: relative;
  aspect-ratio: 1;
  border-radius: 8px;
  overflow: hidden;
  background: #101b28 center / 100% 100% no-repeat;
  border: 1px solid rgba(212, 175, 55, 0.35);
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.35);
}
.area-preview-board:not(.is-loaded)::after {
  content: "";
  position: absolute;
  inset: 12%;
  border: 1px dashed rgba(212, 175, 55, 0.3);
  border-radius: 4px;
}
.area-preview-grid {
  position: absolute;
  inset: 12%;
  display: grid;
  grid-template-columns: repeat(9, 1fr);
  grid-template-rows: repeat(9, 1fr);
  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: 3px;
  overflow: hidden;
}
.area-preview-grid span {
  border: 1px solid rgba(255, 255, 255, 0.12);
}
.area-preview-grid .zone-foe {
  background: rgba(45, 105, 165, 0.35);
}
.area-preview-grid .zone-mine {
  background: rgba(160, 45, 38, 0.32);
}
.area-preview figcaption {
  margin-top: 4px;
  font-size: 11px;
  color: var(--text-dim);
  text-align: center;
}
.area-guide-preview .area-preview {
  max-width: 160px;
}
.skins-area-preview .area-preview {
  max-width: 200px;
}

/* Formation awards: the approved artwork, with a reachable exit on phones. */
.formation-honor-overlay{position:fixed;inset:0;z-index:10050;background:#02070df5;display:flex;align-items:center;justify-content:center;padding:max(8px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom))}
.formation-honor-frame{position:relative;width:min(100%,510px,calc((100dvh - 24px)*.75));height:min(calc(100dvh - 24px),680px);background:#07121d;border:1px solid #b79a6155;border-radius:12px;overflow:hidden}
.formation-honor-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;transition:opacity .2s}
.formation-honor-close{position:absolute;top:10px;right:10px;z-index:2;min-height:44px;padding:8px 14px;border:1px solid #bba26b88;border-radius:6px;background:#08131de8;color:#ead8b1;font:inherit;font-size:12px;cursor:pointer}
.formation-honor-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#e0c896;padding:32px}
.player-icon .player-emblem{display:block;width:100%;height:100%;object-fit:contain;padding:2px;filter:drop-shadow(0 1px 2px #0008)}
.icon-picker-panel{display:flex;flex-direction:column;max-height:calc(100dvh - 32px);overflow:hidden}
.icon-picker-panel .icon-grid{min-height:0;overflow-y:auto;overscroll-behavior:contain}
.icon-picker-panel .setup-actions,.icon-picker-panel .modal-head{flex-shrink:0}

/* --- \u8AB2\u91D1(\u30C1\u30B1\u30C3\u30C8\u306E\u5E97\u30FB\u30D0\u30C8\u30EB\u30D1\u30B9\u306E\u8CFC\u5165) --- */
/* \u5E83\u544A(\u5DE6)\u3068\u30B8\u30A7\u30E0\u3092\u8CB7\u3046(\u53F3)\u3092\u96A3\u308A\u5408\u308F\u305B\u306B\u30021\u3064\u3060\u3051\u306E\u3068\u304D\u306F\u5168\u5E45 */
.skins-shop-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  align-items: stretch;
  max-width: 560px;
  margin: 10px auto 0;
}
.skins-shop-row .skin-btn:only-child {
  grid-column: 1 / -1;
}
.skins-shop-row .skins-ad-btn {
  line-height: 1.5;
  padding: 10px 12px;
}
.skins-shop-row .skins-ad-btn span {
  display: block;
  margin-top: 4px;
  font-size: 12px;
  color: #c4b79e;
  white-space: nowrap;
}
.skins-shop-row .skins-gem-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  font-size: 14px;
  white-space: nowrap;
  padding-inline: 8px;
}
.shop-list {
  display: grid;
  gap: 10px;
  margin: 14px 0;
}
.shop-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
}
.shop-item span {
  font-weight: 700;
  color: var(--gold);
}
.pass-purchase {
  display: grid;
  gap: 10px;
  justify-items: center;
  margin: 8px 0;
}
.skins-balances {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
  align-items: center;
}
/* \u30C1\u30B1\u30C3\u30C8\u3068\u30B8\u30A7\u30E0\u306F1\u884C\u306B\u4E26\u3079\u308B\u3002\u30B8\u30A7\u30E0\u306E\u6841\u304C\u5897\u3048\u3066\u3082\u3001
   \u6B04\u306E\u4E2D\u3067\u6587\u304C\u9014\u4E2D\u304B\u3089\u6298\u308A\u8FD4\u3055\u306A\u3044\u3088\u3046\u306B\u3059\u308B(2026-09-19 \u672C\u4EBA\u306E\u6307\u793A) */
.skins-balances .skins-free {
  white-space: nowrap;
}
.skins-balances .skins-free span {
  margin-right: 6px;
}
/* \u3068\u3066\u3082\u72ED\u3044\u7AEF\u672B(320px)\u3067\u306F\u3001\u82F1\u5B57\u306E\u98FE\u308A\u672D\u3092\u843D\u3068\u3057\u30661\u884C\u306B\u53CE\u3081\u308B\u3002
   \u30B8\u30A7\u30E0\u5074\u306E span(.gem-amount)\u306F\u6D88\u3055\u306A\u3044 */
@media (max-width: 360px) {
  .skins-balances .skins-free > span:first-child:not(.gem-amount) {
    display: none;
  }
}

/* \u6DF1\u7D05\u306E\u30B8\u30A7\u30E0\u3002\u627F\u8A8D\u6E08\u307F\u306E\u7D75\u67C4\u3092\u5927\u5C0F\u5171\u901A\u3067\u4F7F\u3046\u3002 */
.gem-icon { display: inline-block; flex: none; vertical-align: middle; overflow: visible; }
.tottery-root .gem-amount { display: inline-flex; align-items: center; justify-content: center; gap: 5px; white-space: nowrap; vertical-align: middle; font-size: inherit; font-weight: 600; letter-spacing: normal; color: var(--text); }
.gem-amount b { font-variant-numeric: tabular-nums; }
.tottery-root .gem-amount .gem-unit { font-size: .8em; color: var(--text-dim); font-weight: 400; letter-spacing: normal; }
.gem-shop-balance { display: flex; justify-content: center; align-items: center; gap: 20px; padding: 18px 12px; margin: 12px 0; border: 1px solid var(--line); border-radius: 12px; background: radial-gradient(ellipse at 25% 50%, #54233366, transparent 70%), var(--bg); }
.gem-shop-balance > div { display: grid; gap: 8px; }
.gem-shop-balance small { color: var(--gold-soft); }
.gem-shop-balance .gem-amount { justify-content: flex-start; font-size: 23px; }
.gem-shop-balance p { margin: 0; font-size: 12px; color: var(--text-dim); }
.shop-item .gem-pack-name { display: flex; align-items: center; gap: 10px; text-align: left; min-width: 0; color: var(--text); }
/* \u30D1\u30C3\u30AF\u306E\u7D75\u3002\u91D1\u984D\u304C\u5927\u304D\u3044\u307B\u3069\u5B9D\u77F3\u304C\u5897\u3048\u308B\u7D75\u67C4(1\u7C92\u21923\u7C92\u2192\u5C71\u2192\u888B\u2192\u5B9D\u7BB1\u2192\u5927\u304D\u306A\u5B9D\u7BB1) */
.shop-item .gem-pack-art { width: 68px; height: 68px; flex: none; border-radius: 10px; object-fit: cover; border: 1px solid var(--line); background: #0a1421; }
.shop-item .gem-pack-price { flex: none; white-space: nowrap; margin-left: 10px; }
@media (max-width: 420px) { .gem-shop-balance { gap: 14px; } .shop-item .gem-pack-name { font-size: 13px; gap: 8px; } .shop-item .gem-pack-art { width: 58px; height: 58px; } }

.tottery-root .skins-free .gem-amount, .tottery-root .skins-free .gem-unit { border: 0; padding: 0; margin: 0; background: none; font-family: inherit; }

/* \u5F37\u5236\u30A2\u30C3\u30D7\u30C7\u30FC\u30C8\u306E\u8986\u3044(iOS \u3067\u6700\u4F4E\u30D3\u30EB\u30C9\u672A\u6E80\u306E\u3068\u304D\u3001\u30A2\u30D7\u30EA\u5168\u4F53\u3092\u8986\u3046) */
.update-gate { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 24px; background: rgba(6, 12, 26, 0.95); }
.update-gate-box { max-width: 360px; width: 100%; text-align: center; background: #0e1730; border: 1px solid #2a3a5e; border-radius: 16px; padding: 28px 22px; box-shadow: 0 12px 40px rgba(0,0,0,0.5); }
.update-gate-box h2 { color: #e7c877; margin: 0 0 10px; }
.update-gate-box .hint { margin: 0 0 18px; }

/* \u30B8\u30A7\u30E0\u306E\u5E97: \u5546\u54C1\u304C\u4E26\u3070\u306A\u3044\u3068\u304D\u306E\u5207\u308A\u5206\u3051(\u5C0F\u3055\u304F\u3001\u8584\u304F) */
.gem-shop-diag {
  font-size: 11px;
  opacity: 0.7;
  margin-top: 6px;
}
p.hint > span.gem-shop-diag {
  display: block;
}

/* 4\u30FB5 \u306E\u738B\u306E\u56F3: \u738B\u81EA\u8EAB(2\u30DE\u30B9\u306E\u307E\u307E)\u3068\u4EF2\u9593(\u4F38\u3073\u308B)\u3092\u540D\u672D\u3064\u304D\u3067\u4E26\u3079\u308B(2026-09-16 \u672C\u4EBA\u306E\u6307\u6458) */
.md-pair {
  display: flex;
  gap: 6px;
  align-items: flex-start;
}
.md-pair figure {
  margin: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}
.md-pair figcaption {
  font-size: 9px;
  line-height: 1.2;
  color: var(--gold-soft);
  opacity: 0.85;
  white-space: nowrap;
}
.md-pair .move-diagram {
  width: 56px;
}
.rule-diagram:has(.md-pair) {
  width: 124px;
}
.move-hint-row.is-king {
  grid-template-columns: auto 1fr auto;
}
.move-guide .move-hint-row.is-king {
  grid-template-columns: auto 1fr;
}
.move-hint-row .md-pair .move-diagram {
  width: 44px;
}

/* \u30AC\u30C1\u30E3\u3067\u30D5\u30A9\u30A4\u30EB\u3092\u5F15\u3044\u305F\u76F4\u5F8C\u306E\u300C\u307B\u304B\u306E\u30D5\u30A9\u30A4\u30EB\u3082\u300D(foil-offer.jsx) */
/* \u30D5\u30A9\u30A4\u30EB\u306E\u4E00\u89A7\u3067\u300C\u30B8\u30A7\u30E0\u3092\u8CB7\u3046\u300D\u3078(2026-09-17 \u672C\u4EBA\u306E\u6307\u793A\u3002\u5F15\u3044\u305F\u76F4\u5F8C\u306F\u6709\u511F\u30B8\u30A7\u30E0\u304C\u7121\u3044\u3053\u3068\u304C\u591A\u3044) */
.foil-offer-buy {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.04);
}
.foil-offer-buy .skins-note {
  margin: 0;
  text-align: center;
}
.foil-offer-buy .btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 44px;
  padding-inline: 18px;
}

.foil-offer-list {
  display: grid;
  gap: 10px;
}
.foil-offer {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.03);
  color: var(--text);
  text-align: left;
  cursor: pointer;
  font-family: inherit;
}
.foil-offer:disabled {
  opacity: 0.6;
}
.foil-offer-arts {
  display: flex;
  gap: 4px;
  flex-shrink: 0;
}
.foil-offer-art {
  width: 38px;
  height: 51px;
  border-radius: 4px;
  overflow: hidden;
}
.foil-offer-art img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.foil-offer-name {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
  font-size: 13px;
}
.foil-offer-name small {
  color: var(--text-dim);
  font-size: 11px;
}
.foil-offer-price {
  margin-left: auto;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  color: var(--gold-soft);
  font-weight: 700;
  font-size: 15px;
  white-space: nowrap;
}
.foil-offer-price small {
  color: var(--text-dim);
  font-weight: 400;
  font-size: 10px;
}
.foil-offer-balance b {
  color: var(--gold-soft);
}
.foil-offer-confirm {
  display: grid;
  gap: 12px;
  justify-items: center;
  text-align: center;
}
.foil-offer-confirm .foil-offer-arts {
  justify-content: center;
  gap: 12px;
}
.foil-offer-confirm .foil-offer-art {
  width: clamp(78px, 27vw, 132px);
  height: auto;
  aspect-ratio: 3 / 4;
  border: 1px solid rgba(216, 184, 102, 0.65);
  box-shadow: 0 8px 24px #0007;
}
.foil-offer-confirm .setup-actions {
  width: min(100%, 300px);
}
.foil-offer-confirm .setup-actions .btn {
  min-width: 90px;
  white-space: nowrap;
}

/* =========================================================================
   \u5BFE\u5C40\u753B\u9762\u306E\u76E4\u306E\u4E0A\u3092\u30B3\u30F3\u30D1\u30AF\u30C8\u306B(2026-09-17 \u672C\u4EBA\u306E\u6307\u6458: \u76E4\u9762\u4EE5\u5916\u306E\u8981\u7D20\u304C\u5897\u3048\u3066\u78BA\u8A8D\u3057\u3065\u3089\u3044)
   \u6642\u8A08 \u2192 \u624B\u756A \u2192 \u30A8\u30EA\u30A2(? \u3082\u540C\u3058\u884C) \u2192 A\u30D5\u30A9\u30A4\u30EB \u306E4\u6BB5\u306B\u53CE\u3081\u3001\u76E4\u3092\u4E0A\u3078
   ========================================================================= */
.area-bar > .area-chip {
  flex: 1 1 0;
  min-width: 0;
  justify-content: center;
  text-align: center;
}
.area-bar > .area-help {
  flex: 0 0 auto;
}
.area-bar .area-why {
  flex: 1 0 100%;
  text-align: center;
}
@media (max-width: 480px) {
  .clock-panel .clock-cell {
    padding: 6px 8px;
  }
  .clock-time {
    font-size: 20px;
  }
  /* \u300C\u8FFD\u52A0 \u3042\u3068 N\u56DE\u300D\u306E\u6587\u5B57\u3067\u8DB3\u308A\u308B\u306E\u3067\u3001\u70B9\u306E\u5217\u306F\u51FA\u3055\u306A\u3044 */
  .clock-extension-pips {
    display: none !important;
  }
  .clock-extension-count {
    font-size: 11px;
  }
  /* \u6C7A\u307E\u308A\u306E\u6587(30\u79D2\u4EE5\u4E0B\u306A\u3089+10\u79D2)\u306F\u6642\u8A08\u306E\u8AAC\u660E\u3067\u8AAD\u3081\u308B\u3002\u76E4\u306E\u4E0A\u306B\u306F\u51FA\u3055\u306A\u3044 */
  .clock-rule-hint {
    display: none;
  }
  .turn-bar {
    font-size: 12px;
    margin: 6px 0;
  }
  .area-bar {
    gap: 6px;
    margin: 0 0 8px;
  }
  .area-chip {
    padding: 3px 8px;
    font-size: 11px;
    gap: 4px;
  }
  .area-chip small {
    font-size: 10px;
  }
  .area-help {
    width: 28px;
    height: 28px;
    min-width: 28px;
    min-height: 28px;
    padding: 0;
  }
  .ace-foil-bar {
    margin: 0 0 8px;
  }
}

/* =========================================================================
   \u30DF\u30C3\u30B7\u30E7\u30F3\u30FB\u30D0\u30C8\u30EB\u30D1\u30B9(\u30BF\u30D6\u753B\u9762 src/ui/quests.jsx\u30012026-09-22 \u672C\u4EBA\u306E\u6307\u793A)
   ========================================================================= */
.quests-screen {
  width: 100%;
  max-width: 620px;
  text-align: center;
}
/* \u30DF\u30C3\u30B7\u30E7\u30F3\u306E\u30BF\u30D6\u306F\u3001\u30DF\u30C3\u30B7\u30E7\u30F3\u753B\u9762\u3068\u540C\u3058\u304F\u9AD8\u3055\u3092\u56FA\u5B9A\u3057\u3066\u4E2D\u3060\u3051\u3092\u9001\u308B */
.quests-screen.is-missions {
  flex: 1;
  min-height: 0;
  height: 100%;
  display: flex;
  flex-direction: column;
}
.quests-screen.is-missions > .missions-screen {
  flex: 1;
  min-height: 0;
}
.quests-switch {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
  flex-shrink: 0;
  margin: 0 0 10px;
}
.quests-switch button {
  position: relative;
  min-height: 46px;
  padding: 8px 6px;
  border: 1px solid var(--btn-edge);
  background: #0d1c30;
  color: var(--text-dim);
  font-family: "Shippori Mincho", serif;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.08em;
  cursor: pointer;
}
.quests-switch button:first-child {
  border-radius: 10px 0 0 10px;
}
.quests-switch button:last-child {
  border-radius: 0 10px 10px 0;
  border-left: 0;
}
.quests-switch button[aria-selected="true"] {
  background: linear-gradient(180deg, #f1da98, #c2a25f);
  color: #211b13;
  text-shadow: none;
}
.quests-switch button:focus-visible {
  outline: 2px solid var(--gold-soft);
  outline-offset: -4px;
}
.quests-switch .missions-tab-count {
  top: 6px;
  right: 10px;
}
/* \u30D0\u30C8\u30EB\u30D1\u30B9\u5074\u306F\u5143\u306E\u753B\u9762\u306E\u307E\u307E\u3002\u898B\u51FA\u3057\u3092\u5916\u3057\u305F\u3076\u3093\u4E0A\u3092\u8A70\u3081\u308B */
.quests-screen.is-pass > .setup-wrap > .hint:first-child,
.quests-screen.is-pass > .setup-wrap > .pass-reward:first-child {
  margin-top: 0;
}

/* =========================================================================
   \u30AB\u30FC\u30C9(\u672D\u3054\u3068\u306E\u719F\u7DF4\u5EA6 src/ui/card-mastery.jsx\u30012026-09-22 \u672C\u4EBA\u306E\u6307\u793A)
   ========================================================================= */
.card-mastery-summary {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px 14px;
  margin: 0 0 12px;
  font-size: 12px;
  color: var(--text-dim);
}
.card-mastery-summary b {
  font-size: 14px;
  color: var(--gold-soft);
}
.card-mastery-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
  text-align: left;
}
.card-mastery-row {
  border: 1px solid var(--line);
  border-radius: 12px;
  background: rgba(9, 20, 38, 0.55);
  overflow: hidden;
}
.card-mastery-row.is-reached {
  border-color: rgba(212, 175, 55, 0.35);
}
.card-mastery-row.is-done {
  border-color: rgba(255, 228, 161, 0.6);
  background: linear-gradient(180deg, rgba(212, 175, 55, 0.14), rgba(9, 20, 38, 0.6));
}
.card-mastery-main {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 10px 12px;
  border: 0;
  background: none;
  color: var(--text);
  font-family: inherit;
  text-align: left;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.card-mastery-main:active {
  background: rgba(255, 255, 255, 0.04);
}
.card-mastery-body {
  display: flex;
  flex-direction: column;
  gap: 5px;
  min-width: 0;
}
.card-mastery-head {
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.card-mastery-rank {
  font-family: "Shippori Mincho", serif;
  font-size: 18px;
  color: var(--text);
}
.card-mastery-row.is-reached .card-mastery-rank {
  color: var(--gold-soft);
}
.card-mastery-row.is-done .card-mastery-rank {
  color: var(--gold);
}
.card-mastery-step {
  font-size: 11px;
  padding: 1px 8px;
  border-radius: 999px;
  border: 1px solid var(--line);
  color: var(--text-dim);
}
.card-mastery-row.is-reached .card-mastery-step {
  border-color: rgba(212, 175, 55, 0.4);
  color: var(--gold-soft);
}
.card-mastery-count {
  margin-left: auto;
  font-size: 12px;
  color: var(--text-dim);
  white-space: nowrap;
}
.card-mastery-main .mastery-track {
  display: block;
}
.card-mastery-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-width: 0;
  font-size: 10px;
  color: var(--text-dim);
}
.card-mastery-foot small {
  font-size: 10px;
}
.card-mastery-left {
  margin-left: auto;
  white-space: nowrap;
}
.card-mastery-title {
  min-width: 0;
}
/* \u984D\u7E01\u306E\u51A0\u98FE\u308A\u306F\u67A0\u306E\u4E0A\u3078\u306F\u307F\u51FA\u3059(title-frame.css \u306E crest/regalia \u304C top:-3\u301C-5px)\u3002
   \u305D\u306E\u307E\u307E\u3060\u3068\u4E0A\u306E\u30E1\u30FC\u30BF\u30FC\u306E\u7DDA\u306B\u88AB\u308B\u306E\u3067\u3001\u984D\u7E01\u306E\u3042\u308B\u884C\u3060\u3051\u9593\u3092\u7A7A\u3051\u308B(2026-09-22 \u672C\u4EBA\u306E\u5831\u544A) */
.card-mastery-foot:has(.title-frame) {
  margin-top: 8px;
  align-items: flex-end;
}
.card-mastery-detail {
  padding: 0 12px 10px;
  border-top: 1px solid rgba(255, 255, 255, 0.06);
  font-size: 12px;
  line-height: 1.7;
  color: var(--text-dim);
}
.card-mastery-detail p {
  margin: 8px 0 0;
}
.card-mastery-detail b {
  margin-right: 4px;
  color: var(--gold-soft);
}
.card-mastery-all {
  margin-top: 16px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: rgba(9, 20, 38, 0.55);
}
.card-mastery-all h3 {
  margin: 0 0 8px;
  font-size: 13px;
  color: var(--gold-soft);
}
.card-mastery-all-row {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 8px 0;
}
.card-mastery-all-row + .card-mastery-all-row {
  border-top: 1px solid rgba(255, 255, 255, 0.05);
}
.card-mastery-all-name {
  font-family: "Shippori Mincho", serif;
  font-size: 14px;
  color: var(--text-dim);
}
.card-mastery-all-row small {
  font-size: 10px;
  color: var(--text-dim);
}

/* =========================================================================
   \u5BFE\u5C40\u753B\u9762\u306E\u4E0A\u90E8\u3092\u52D5\u304B\u3055\u306A\u3044(2026-09-23 \u672C\u4EBA\u306E\u6307\u793A)
   \u624B\u756A\u306E\u5E2F\u30FB\u30A8\u30EA\u30A2\u306E\u5E2F\u30FB\u6848\u5185\u30FB\u30A8\u30EA\u30A2\u306E\u77E5\u3089\u305B\u306F\u3001\u4E2D\u8EAB\u306E\u6709\u7121\u3067\u9AD8\u3055\u3092\u5909\u3048\u306A\u3044
   ========================================================================= */
.turn-bar {
  display: block;
  margin-bottom: 8px;
}
.turn-bar-head {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 28px;
}
.turn-who {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}
.turn-log-btn {
  margin-left: auto;
  flex: none;
  min-height: 28px;
  padding: 2px 10px;
  border: 1px solid var(--btn-edge);
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.04);
  color: var(--gold-soft);
  font-family: inherit;
  font-size: 12px;
  cursor: pointer;
}
.turn-bar .turn-log {
  display: block;
  margin: 2px 0 0;
  /* 2\u884C\u3076\u3093\u306B\u56FA\u5B9A\u3002\u9577\u3044\u8A18\u9332\u306F3\u884C\u76EE\u4EE5\u964D\u3092\u5207\u308B(\u5168\u6587\u306F\u300C\u8A18\u9332\u300D\u3067\u8AAD\u3081\u308B) */
  height: 2.8em;
  line-height: 1.4;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  text-align: left;
}
/* \u6848\u5185\u306E\u884C\u30021\u884C\u3076\u3093\u306E\u9AD8\u3055\u3092\u5E38\u306B\u53D6\u308B */
.play-status {
  min-height: 1.6em;
  margin: 0 0 8px;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.play-status-alert {
  color: #e2896f;
}
/* \u30A8\u30EA\u30A2\u306E\u77E5\u3089\u305B\u306F\u76E4\u306E\u4E0A\u306B\u91CD\u306D\u308B(\u6D41\u308C\u306E\u4E2D\u306B\u7F6E\u304B\u306A\u3044)\u3002\u76E4\u306E\u9AD8\u3055\u306F\u5909\u308F\u3089\u306A\u3044 */
.board-outer {
  position: relative;
}
.area-notice-slot {
  position: absolute;
  left: 0;
  right: 0;
  top: 6px;
  z-index: 8;
  pointer-events: none;
}
.area-notice-slot .area-effect-notice {
  margin: 0 auto;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.55);
}
/* \u30A8\u30EA\u30A2\u306E\u5E2F\u3002\u91E6\u3068\u4F46\u3057\u66F8\u304D\u306E\u67A0\u3092\u5E38\u306B\u53D6\u308B */
.area-bar {
  min-height: 74px;
  align-content: flex-start;
}
.area-bar .area-why {
  min-height: 1.4em;
  font-size: 11px;
}
/* \u5BFE\u5C40\u4E2D\u306E\u8A18\u9332\u306E\u5E55 */
.live-log-panel {
  display: flex;
  flex-direction: column;
  max-height: calc(100dvh - 40px - var(--top-bar-h, 0px) - var(--tutorial-band, 0px));
  overflow: hidden;
}
.live-log-scroll {
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  text-align: left;
}
.live-log-panel .log-list {
  padding-left: 18px;
}
/* \u76F8\u624B\u306E\u76F4\u524D\u306E\u624B\u306E\u77E2\u5370\u3002\u30DE\u30B9\u306E\u4E0A\u30FB\u99D2\u306E\u4E0B\u306B\u6577\u304B\u306A\u3044(\u99D2\u306B\u96A0\u308C\u308B\u3068\u610F\u5473\u304C\u7121\u3044)\u306E\u3067\u99D2\u306E\u4E0A\u306B\u7F6E\u304F */
.last-move-arrow {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 6;
  overflow: visible;
}
.last-move-arrow-line {
  stroke: var(--lm-arrow, #f0d98a);
  stroke-width: 0.09;
  stroke-linecap: round;
  filter: drop-shadow(0 0 0.04px #000);
  opacity: 0.92;
}
.last-move-arrow-head {
  fill: var(--lm-arrow, #f0d98a);
  opacity: 0.95;
}
.last-move-arrow-start {
  fill: none;
  stroke: var(--lm-arrow, #f0d98a);
  stroke-width: 0.06;
  opacity: 0.9;
}

/* =========================================================================
   \u30DE\u30C3\u30C1\u30F3\u30B0\u5F8C\u306E\u300C\u5BFE\u6226\u76F8\u624B\u300D\u306E\u753B\u9762\u3068\u3001\u52DD\u5229\u30C1\u30E3\u30F3\u30B9(2026-09-23 \u672C\u4EBA\u306E\u6307\u793A)
   ========================================================================= */
.match-intro {
  gap: 14px;
}
.match-intro-seats {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 8px;
  width: 100%;
  max-width: 420px;
  margin: 6px auto 0;
}
.match-intro-seat {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  min-width: 0;
  padding: 12px 8px 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: rgba(9, 20, 38, 0.55);
}
.match-intro-me {
  border-color: rgba(212, 175, 55, 0.45);
}
.match-intro-label {
  font-size: 10px;
  letter-spacing: 0.14em;
  color: var(--text-dim);
}
/* \u984D\u7E01\u306F\u4E00\u5F8B\u306E\u5E45\u3002\u7121\u3044\u4EBA\u3082\u540C\u3058\u9AD8\u3055\u306E\u67A0\u3092\u53D6\u3063\u3066\u3001\u5DE6\u53F3\u306E\u9AD8\u3055\u3092\u305D\u308D\u3048\u308B */
.match-intro-seat .match-intro-title {
  width: 140px;
  max-width: 100%;
}
.match-intro-title-none {
  display: block;
  height: 44px;
}
.match-intro-name {
  font-size: 15px;
  max-width: 100%;
  overflow-wrap: anywhere;
  text-align: center;
}
.match-intro-rating {
  font-size: 12px;
  color: var(--text-dim);
}
.match-intro-rating b {
  font-size: 15px;
  color: var(--gold-soft);
  font-variant-numeric: tabular-nums;
}
.match-intro-vs {
  font-family: "Shippori Mincho", serif;
  font-size: 18px;
  font-weight: 700;
  color: var(--gold-soft);
  letter-spacing: 0.1em;
}
.match-intro-chance,
.chance-notice {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  width: 100%;
  max-width: 420px;
  margin: 0 auto;
  padding: 10px 14px;
  border: 1px solid rgba(240, 217, 165, 0.55);
  border-radius: 10px;
  background: linear-gradient(180deg, rgba(212, 175, 55, 0.18), rgba(212, 175, 55, 0.06));
  color: var(--gold-soft);
  font-size: 13px;
  text-align: center;
}
.match-intro-chance b,
.chance-notice b {
  font-size: 15px;
  color: var(--gold);
}
.chance-notice {
  margin: 10px auto 4px;
}
.chance-notice-won {
  border-color: var(--gold);
  box-shadow: 0 0 18px rgba(212, 175, 55, 0.3);
}

/* =========================================================================
   \u724818: \u30B5\u30A4\u30B3\u30ED\u3068\u5F15\u304D\u76F4\u3057\u3092\u4E21\u8005\u540C\u6642\u306B(2026-09-23 \u672C\u4EBA\u306E\u6307\u793A)
   ========================================================================= */
.dice-duo {
  gap: 12px;
}
.dice-duo .setup-timer {
  width: 100%;
  max-width: 420px;
}
.dice-duo-sides {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: start;
  gap: 8px;
  width: 100%;
  max-width: 420px;
}
.dice-duo-side {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 10px 6px 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: rgba(9, 20, 38, 0.55);
  min-width: 0;
}
.dice-duo-me {
  border-color: rgba(212, 175, 55, 0.45);
}
.dice-duo-side.dice-winner {
  box-shadow: 0 0 18px rgba(212, 175, 55, 0.35);
  border-color: var(--gold);
}
.dice-duo-status {
  font-size: 11px;
  text-align: center;
  min-height: 2.6em;
  line-height: 1.3;
}
/* \u4E8C\u3064\u4E26\u3079\u308B\u306E\u3067\u30011\u4EBA\u7528\u3088\u308A\u5C0F\u3055\u304F */
.die-stage-small {
  transform: scale(0.72);
  margin: -14px 0;
}
/* \u5E03\u9663\u4E2D\u306E\u5148\u653B\u30FB\u5F8C\u653B */
.setup-order {
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 8px;
  margin: 0 0 8px;
  font-size: 12px;
  color: var(--text-dim);
}
.setup-order b {
  font-size: 14px;
  padding: 1px 10px;
  border-radius: 999px;
  border: 1px solid rgba(212, 175, 55, 0.45);
  color: var(--gold-soft);
}
.setup-order-second b {
  border-color: rgba(143, 188, 232, 0.5);
  color: #8fbce8;
}
/* \u6301\u3061\u70B9\u3092\u30B5\u30FC\u30D0\u30FC\u306E\u8A18\u9332\u306B\u5408\u308F\u305B\u305F\u3068\u304D\u306E\u6DFB\u3048\u66F8\u304D(2026-09-23) */
.rating-adjusted {
  display: block;
  margin-top: 4px;
  font-size: 10px;
  color: var(--text-dim);
}

/* =========================================================================
   \u76E4\u3092\u4E3B\u5F79\u306B\u3059\u308B(2026-09-23 \u672C\u4EBA\u306E\u6307\u793A)\u3002\u76E4\u306E\u4E0A\u3092\u5727\u7E2E\u3057\u3001\u8A18\u9332\u306F\u76E4\u306E\u4E0B\u3078
   ========================================================================= */
/* \u6642\u8A08\u6B04: \u540D\u524D\u30FB\u6642\u9593\u30921\u884C\u3001\u79F0\u53F7\u30921\u884C\u3002\u8FFD\u52A0\u56DE\u6570\u306F\u6642\u9593\u306E\u8107\u306E\u70B9 */
.clock-bar {
  margin-bottom: 4px;
}
.clock-cell {
  padding: 4px 8px;
}
.clock-cell.clock-cell-titled {
  gap: 0 5px;
}
.clock-time {
  font-size: 16px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.clock-pips-inline {
  display: inline-flex;
  gap: 2px;
  vertical-align: middle;
}
.clock-pips-inline i {
  width: 4px;
  height: 7px;
  border-radius: 2px;
  border: 1px solid rgba(212, 175, 55, 0.3);
}
.clock-pips-inline i.available {
  background: var(--gold-soft);
  border-color: var(--gold-soft);
}
.clock-pips-inline.is-warning i.available {
  background: #ffb547;
  border-color: #ffb547;
}
.clock-pips-inline.is-empty i {
  border-color: rgba(239, 138, 118, 0.6);
}
.clock-cell-titled .title-frame--compact {
  transform: scale(0.86);
  transform-origin: center top;
  margin-bottom: -6px;
}
.clock-rule-hint {
  display: none;
}
/* \u624B\u756A\u306E\u884C: 1\u884C\u3002\u624B\u756A\uFF0B\u6700\u5F8C\u306E\u8A18\u9332 */
.turn-bar {
  margin-bottom: 4px;
}
.turn-bar-head {
  min-height: 24px;
}
.turn-bar .turn-log {
  display: block;
  flex: 1;
  min-width: 0;
  height: auto;
  margin: 0 0 0 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  -webkit-line-clamp: unset;
  -webkit-box-orient: unset;
  line-height: 1.4;
  text-align: left;
}
/* \u30A8\u30EA\u30A2\u306E\u5E2F: \u7D30\u304F */
.area-bar {
  min-height: 0;
  margin: 0 0 4px;
  gap: 6px;
  font-size: 11px;
}
.area-chip {
  padding: 3px 10px;
  gap: 4px;
  line-height: 1.4;
  border-radius: 10px;
}
.area-chip small {
  font-size: 10px;
}
.area-bar .btn-small {
  min-height: 32px;
  padding: 4px 12px;
}
.area-help {
  width: 24px;
  height: 24px;
  font-size: 12px;
}
.area-bar .area-why {
  min-height: 1.2em;
  font-size: 10px;
  line-height: 1.2;
}
/* A \u30D5\u30A9\u30A4\u30EB\u306E\u5E2F: 1\u884C */
.ace-foil-bar {
  margin: 0 0 4px;
  flex-wrap: nowrap;
}
.ace-foil-bar .area-chip {
  flex: 1;
  justify-content: center;
}
.play-status {
  margin: 0 0 4px;
  font-size: 12px;
}
/* \u76E4\u306E\u4E0B: \u8A18\u9332\u306E\u91E6\u3068\u63A8\u7406\u30E1\u30E2\u306E\u6848\u5185 */
.board-foot {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin: 6px 0 2px;
}
.board-foot .private-note-hint {
  margin: 0;
  font-size: 11px;
}
.board-log-btn {
  min-height: 34px;
  padding: 4px 16px;
}
/* \u8A18\u9332\u306E\u5E55: \u4E0B\u304B\u3089\u51FA\u308B\u3002\u300C\u76E4\u9762\u3092\u898B\u308B\u300D\u3067\u982D\u3060\u3051\u6B8B\u3057\u3066\u305F\u305F\u3080 */
.live-log-sheet {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 55;
  display: flex;
  flex-direction: column;
  max-height: 56dvh;
  margin: 0 auto;
  max-width: 560px;
  padding: 8px 12px calc(10px + env(safe-area-inset-bottom));
  border: 1px solid var(--gold);
  border-bottom: 0;
  border-radius: 14px 14px 0 0;
  background: linear-gradient(170deg, #132844, #0b1729);
  box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.55);
}
.live-log-sheet.is-peek {
  max-height: none;
  padding-bottom: calc(8px + env(safe-area-inset-bottom));
}
.live-log-head {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--line);
}
.live-log-head h3 {
  margin: 0;
  flex: 1;
  font-size: 15px;
}
.is-peek .live-log-head {
  border-bottom: 0;
  padding-bottom: 0;
}
.live-log-scroll {
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  text-align: left;
  padding-top: 6px;
}
/* \u30E9\u30F3\u30AD\u30F3\u30B0: \u540D\u524D\u306E\u4E00\u89A7\u3060\u3051\u3092\u9001\u308B(2026-09-23 \u672C\u4EBA\u306E\u6307\u793A) */
.rank-list {
  max-height: max(220px, calc(100dvh - 500px));
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
}
/* \u6642\u8A08\u6B04\u306E\u540D\u524D\u306F1\u884C\u306B(\u70B9\u3068\u6642\u9593\u3067\u5E45\u304C\u6E1B\u308A\u300C\u304B\u304F\u306B\uFF0F\u3093\u300D\u3068\u6298\u308C\u3066\u3044\u305F) */
.clock-cell .clock-name,
.clock-cell-titled .clock-name {
  display: block;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 10px;
  max-width: 100%;
}
.clock-cell .clock-who {
  min-width: 0;
  flex: 1;
}
/* \u4E00\u89A7\u306E\u4E0A\u9650\u306F\u753B\u9762\u306E\u7A7A\u304D\u306B\u5408\u308F\u305B\u308B(\u898B\u51FA\u3057\u30FB\u30BF\u30D6\u30FB\u66F4\u65B0\u306E\u884C\u3067\u7D04 420px \u4F7F\u3046) */
.rank-list {
  max-height: max(220px, calc(100dvh - 430px));
}

/* ===== \u5E03\u9663\u30FB\u738B\u9078\u3073\u30921\u753B\u9762\u306B\u53CE\u3081\u308B(2026-09-23 \u672C\u4EBA\u306E\u6307\u793A) =====
   \u898B\u51FA\u3057\u30FB\u5148\u653B\u5F8C\u653B\u30FB\u6B8B\u308A\u6642\u9593\u306F1\u3064\u306E\u5E2F\u306B\u307E\u3068\u3081\u3066\u4E0A\u306B\u8CBC\u308A\u4ED8\u3051\u308B\u3002
   \u914D\u7F6E\u3057\u306A\u304C\u3089\u6B8B\u308A\u6642\u9593\u3092\u898B\u3089\u308C\u3001\u76E4\u3068\u624B\u672D\u306F\u30B9\u30AF\u30ED\u30FC\u30EB\u306A\u3057\u3067\u5C4A\u304F */
/* \u6839(.tottery-root)\u306F overflow:hidden \u3067\u3001\u6587\u66F8\u3054\u3068\u9001\u3089\u308C\u308B\u306E\u3067 sticky \u304C\u52B9\u304B\u306A\u3044\u3002
   \u305D\u3053\u3067\u5E03\u9663\u306E\u67A0\u305D\u306E\u3082\u306E\u3092\u9001\u308B\u7BB1\u306B\u3057\u3001\u5E2F\u306F\u305D\u306E\u4E2D\u3067\u8CBC\u308A\u4ED8\u304F\u3002
   \u3075\u3064\u3046\u306E\u7AEF\u672B\u3067\u306F\u4E2D\u8EAB\u304C\u53CE\u307E\u3063\u3066\u9001\u308B\u5FC5\u8981\u304C\u306A\u304F\u3001\u80CC\u306E\u4F4E\u3044\u7AEF\u672B(375\xD7667)\u3060\u3051\u76E4\u306E\u4E0B\u304C\u9001\u3089\u308C\u308B */
.setup-wrap-compact {
  max-height: calc(100dvh - var(--top-bar-h, 56px) - 24px);
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  margin: -8px 0;
}
.setup-wrap-compact .setup-head {
  position: sticky;
  top: 0;
  z-index: 5;
  margin: 0 0 6px;
  padding: 4px 4px 6px;
  background: rgba(9, 18, 34, 0.94);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid rgba(212, 175, 55, 0.18);
}
.setup-wrap-compact .setup-head h2 {
  font-size: 16px;
  padding-bottom: 0;
  margin: 0 0 4px;
}
.setup-wrap-compact .setup-head h2::after {
  content: none;
}
.setup-wrap-compact .setup-head .setup-order {
  margin: 0 0 4px;
  font-size: 11px;
}
.setup-wrap-compact .setup-head .setup-timer {
  margin: 0 auto;
}
.setup-wrap-compact .setup-head .setup-timer-head {
  margin-bottom: 2px;
}
.setup-wrap-compact .setup-head .setup-timer-track {
  height: 4px;
}
/* \u6848\u5185\u306F1\u884C\u3002\u914D\u7F6E\u306E\u6570\u3068\u63A1\u7528\u5408\u8A08\u3092\u540C\u3058\u884C\u306B\u4E26\u3079\u308B */
.setup-wrap-compact .setup-hint-line {
  margin: 0 0 6px;
  /* \u5E45 375px \u306E\u7AEF\u672B(\u5185\u5074 335px)\u3067\u30821\u884C\u306B\u53CE\u307E\u308B\u5927\u304D\u3055 */
  font-size: 11.5px;
  line-height: 1.5;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: baseline;
  column-gap: 8px;
}
.setup-wrap-compact .setup-hint-line .hint-count {
  margin-left: 0;
}
.setup-wrap-compact .setup-adoption-total {
  margin: 0;
  font-size: 12px;
  color: var(--text-dim);
}
.setup-wrap-compact .setup-adoption-total strong {
  color: var(--gold-soft);
  font-variant-numeric: tabular-nums;
}
/* \u80CC\u306E\u4F4E\u3044\u753B\u9762\u3067\u306F\u76E4\u3092\u5C11\u3057\u8A70\u3081\u3066\u3001\u624B\u672D\u3068\u91E6\u307E\u3067\u5C4A\u304B\u305B\u308B */
.setup-wrap-compact .mini-board {
  /* 375\xD7667 \u3067\u306F 247px(\u5E2F 98 + \u6848\u5185 20 + \u624B\u672D 2\u6BB5 140 + \u91E6 46 + \u4F59\u767D \u3092\u5F15\u3044\u305F\u6B8B\u308A) */
  width: min(78vw, 320px, calc(100dvh - 420px));
  min-width: 220px;
}
.setup-wrap-compact .arrange-layout {
  margin-bottom: 8px;
}
.setup-wrap-compact .tray {
  margin-bottom: 8px;
}
.setup-wrap-compact .tray-label {
  margin-bottom: 4px;
}
.setup-wrap-compact .hand-card {
  /* 40px \u306E\u672D + \u7E01 2px = 44px\u30027\u679A + \u9699\u9593 4px\xD76 = 332px \u3067\u3001\u5E45 375px \u306E\u7AEF\u672B(\u5185\u5074 335px)\u306B\u3082\u53CE\u307E\u308B */
  padding: 0;
}

/* ===== \u7D42\u5C40\u306E\u753B\u9762\u306F\u91E6\u3092\u4E0B\u306B\u7559\u3081\u308B(2026-09-23 \u672C\u4EBA\u306E\u6307\u793A\u300C\u5168\u3066\u306E\u30DC\u30BF\u30F3\u304C1\u753B\u9762\u306B\u300D) =====
   \u4E2D\u8EAB(\u738B\u306E\u672D\u30FB\u6301\u3061\u70B9\u30FB\u719F\u7DF4\u5EA6)\u306F\u771F\u3093\u4E2D\u3060\u3051\u3092\u9001\u308A\u30012\xD72 \u306E\u91E6\u306F\u3044\u3064\u3082\u898B\u3048\u308B */
.gameover-panel {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  padding-bottom: 14px;
}
.gameover-panel > .gameover-body {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  margin: 0 -6px;
  /* \u738B\u306E\u672D\u306E\u8DB3\u5143\u306E\u5F71(::after \u304C 16px \u306F\u307F\u51FA\u3059)\u306E\u3076\u3093\u3092\u7A7A\u3051\u3001\u9001\u308B\u5FC5\u8981\u3092\u7121\u304F\u3059 */
  padding: 0 6px 18px;
}
.gameover-panel > .gameover-grid {
  flex: none;
  margin-top: 10px;
  padding-top: 10px;
}
/* \u738B\u306E\u672D\u306F\u52DD\u3061\u540D\u4E57\u308A\u306E\u98FE\u308A\u3002\u5C0F\u3055\u304F\u3057\u3066\u3082\u610F\u5473\u306F\u5909\u308F\u3089\u306A\u3044\u306E\u3067\u3001\u91E6\u306E\u3076\u3093\u3092\u8B72\u308B
   (\u8CA0\u3051\u306E\u672D\u306F 210px \u5E45\u3067 370px \u306E\u9AD8\u3055\u304C\u3042\u308A\u3001\u305D\u308C\u3060\u3051\u3067\u753B\u9762\u306E\u534A\u5206\u3092\u53D6\u3063\u3066\u3044\u305F) */
.gameover-panel .king-card {
  width: min(36vw, 140px);
  margin: 6px auto 12px;
}
.gameover-panel .win-card {
  width: min(28vw, 110px);
  margin: 6px auto 2px;
}
.gameover-panel .rating-change {
  margin: 8px 0 2px;
}
.gameover-panel .mastery-gains {
  margin: 8px 0 2px;
  padding: 8px 10px;
}
.gameover-panel .season-match-notice {
  margin-top: 6px;
}
.gameover-panel h2 {
  margin: 6px 0 4px;
}

/* ===== \u30D5\u30EC\u30F3\u30C9\u3068\u30D7\u30ED\u30D5\u30A3\u30FC\u30EB(2026-09-23 \u672C\u4EBA\u306E\u6307\u793A) ===== */
.home-wrap .home-account-row.has-friends {
  grid-template-columns: minmax(0, 1fr) 68px 68px;
}
@media (max-width: 390px) {
  .home-wrap .home-account-row.has-friends {
    grid-template-columns: minmax(0, 1fr) 60px 60px;
    gap: 6px;
  }
}
.home-friends svg {
  color: var(--gold-soft);
}
.friends-screen,
.profile-screen {
  max-width: 480px;
}
.friends-me {
  margin: 0 0 12px;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: rgba(9, 20, 38, 0.6);
  text-align: left;
}
.friends-me > small {
  display: block;
  font-size: 11px;
  letter-spacing: 0.12em;
  color: var(--gold);
}
.friends-code-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 4px 0 10px;
}
.friends-code {
  flex: 1;
  font: 700 22px/1.2 "SF Mono", Menlo, Consolas, monospace;
  letter-spacing: 0.12em;
  color: var(--gold-soft);
  font-variant-numeric: tabular-nums;
}
.friends-add-row {
  display: flex;
  gap: 8px;
}
.friends-add-input {
  flex: 1;
  min-width: 0;
  min-height: 40px;
  padding: 6px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: rgba(0, 0, 0, 0.25);
  color: var(--text);
  font: inherit;
  font-size: 15px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.friends-add-input::placeholder {
  text-transform: none;
  letter-spacing: 0;
  color: var(--text-dim);
}
.friends-notice {
  color: var(--gold-soft);
}
.friends-error {
  color: #e2896f;
}
.friends-box {
  margin: 0 0 12px;
  padding: 12px 14px;
  border: 1px solid rgba(240, 217, 165, 0.55);
  border-radius: 12px;
  background: linear-gradient(180deg, rgba(212, 175, 55, 0.18), rgba(212, 175, 55, 0.06));
  text-align: left;
}
.friends-box-invite {
  border-color: rgba(143, 188, 232, 0.6);
  background: linear-gradient(180deg, rgba(143, 188, 232, 0.16), rgba(143, 188, 232, 0.05));
}
.friends-box-head {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--gold-soft);
  font-size: 14px;
}
.friends-box-invite .friends-box-head {
  color: #cfe3f7;
}
.friends-box-head span {
  margin-left: auto;
  font-size: 12px;
  color: var(--text-dim);
}
.friends-box-from {
  margin: 4px 0 10px;
  font-size: 12px;
  color: var(--text-dim);
}
.friends-box .btn-wide {
  width: 100%;
}
.friends-list {
  margin: 0 0 14px;
  text-align: left;
}
.friends-list-head {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 0 0 6px;
  font-size: 12px;
  letter-spacing: 0.08em;
  color: var(--gold);
}
.friends-list-head b {
  color: var(--gold-soft);
}
.friend-row {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 10px 10px 10px 8px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: rgba(9, 20, 38, 0.6);
}
.friend-row + .friend-row {
  margin-top: 8px;
}
.friend-tag {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 0;
  border: 0;
  background: none;
  color: var(--text);
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.friend-tag:disabled {
  cursor: default;
}
.friend-tag-body {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  min-width: 0;
}
.friend-tag-body .title-frame {
  max-width: 100%;
}
.friend-tag-notitle {
  font-size: 11px;
  color: var(--text-dim);
}
.friend-tag-name {
  font-size: 15px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 100%;
}
.friend-tag-body small {
  font-size: 11px;
  color: var(--text-dim);
}
.friend-row-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.friend-row-actions .btn-small {
  min-height: 34px;
  padding: 6px 10px;
  font-size: 12px;
}
.friend-more {
  margin-left: auto;
  width: 34px;
  height: 34px;
  font-size: 18px;
  line-height: 1;
}
.friend-remove-confirm {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-left: auto;
}
.friend-remove-yes {
  color: #e2896f;
  border-color: rgba(226, 137, 111, 0.5);
}
/* ---- \u30D7\u30ED\u30D5\u30A3\u30FC\u30EB ---- */
.profile-card {
  position: relative;
  overflow: hidden;
  margin: 0 0 12px;
  padding: 16px 14px 12px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: linear-gradient(170deg, #132844, #0b1729);
  text-align: left;
}
.profile-card.has-bg {
  border-color: rgba(212, 175, 55, 0.4);
  background: linear-gradient(rgba(6, 11, 19, 0.55), rgba(4, 9, 16, 0.82)), var(--profile-bg) center / cover no-repeat;
}
.profile-head {
  display: flex;
  align-items: center;
  gap: 12px;
}
.profile-id {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 3px;
  min-width: 0;
}
.profile-name {
  font-family: "Shippori Mincho", serif;
  font-size: 20px;
  color: var(--gold-soft);
}
.profile-sub {
  font-size: 12px;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
}
.profile-pinned {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  margin: 14px 0 4px;
}
.profile-pinned small {
  font-size: 10px;
  letter-spacing: 0.14em;
  color: var(--gold);
}
.profile-showcase {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin: 12px 0 4px;
}
.profile-showcase-item {
  padding: 8px 6px;
  border: 1px solid rgba(212, 175, 55, 0.35);
  border-radius: 10px;
  background: rgba(212, 175, 55, 0.1);
  text-align: center;
}
.profile-showcase-item b {
  display: block;
  font-size: 18px;
  color: var(--gold-soft);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.profile-showcase-item span {
  display: block;
  margin-top: 2px;
  font-size: 10px;
  color: var(--text-dim);
  line-height: 1.3;
}
.profile-stats {
  margin-top: 12px;
}
.profile-seen {
  margin: 8px 0 0;
  font-size: 11px;
  color: var(--text-dim);
  text-align: right;
}
.profile-actions {
  margin: 0 0 12px;
}
.profile-actions .btn {
  width: 100%;
}
/* \u7DE8\u96C6 */
.profile-edit-panel {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  padding-bottom: 12px;
}
.profile-edit-scroll {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  margin: 0 -6px;
  padding: 0 6px 8px;
}
.profile-edit-head {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin: 14px 0 6px;
  font-size: 12px;
  letter-spacing: 0.12em;
  color: var(--gold);
  text-align: left;
}
.profile-edit-head small {
  color: var(--text-dim);
  letter-spacing: 0;
}
.profile-bg-list {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}
.profile-bg-choice {
  position: relative;
  min-height: 52px;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: linear-gradient(rgba(6, 11, 19, 0.5), rgba(4, 9, 16, 0.8)), var(--profile-bg, linear-gradient(170deg, #132844, #0b1729)) center / cover;
  color: var(--text);
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.profile-bg-choice b {
  display: block;
  font-size: 13px;
}
.profile-bg-choice small {
  display: block;
  margin-top: 2px;
  font-size: 10px;
  color: var(--text-dim);
  line-height: 1.3;
}
.profile-bg-choice.is-on {
  border-color: var(--gold);
  box-shadow: 0 0 0 1px var(--gold) inset, 0 0 12px rgba(212, 175, 55, 0.3);
}
.profile-bg-choice.is-locked {
  opacity: 0.6;
  cursor: not-allowed;
}
.profile-showcase-list {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.profile-showcase-choice {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-height: 32px;
  padding: 4px 10px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(9, 20, 38, 0.6);
  color: var(--text);
  font: inherit;
  font-size: 12px;
  cursor: pointer;
}
.profile-showcase-choice.is-on {
  border-color: var(--gold);
  background: rgba(212, 175, 55, 0.16);
  color: var(--gold-soft);
}
.profile-showcase-choice:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
.profile-pinned-pick {
  margin-top: 2px;
}
.profile-edit-panel > .setup-actions {
  margin-top: 10px;
}

/* ===== \u5BFE\u5C40\u753B\u9762(2026-09-24 \u672C\u4EBA\u306E\u6307\u793A) =====
   \u624B\u756A\u306E\u5E2F\u306F\u51FA\u3055\u306A\u3044\u3002A \u306E\u5165\u308C\u66FF\u3048\u306E\u78BA\u8A8D\u306F\u753B\u9762\u306E\u4E0B\u306B\u8CBC\u308A\u4ED8\u3051\u3001\u9001\u3089\u305A\u306B\u62BC\u305B\u308B\u3088\u3046\u306B\u3059\u308B */
.ace-shuffle-bar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 55;
  max-width: 560px;
  margin: 0 auto;
  padding: 8px 14px calc(8px + env(safe-area-inset-bottom));
  border: 1px solid var(--gold);
  border-bottom: 0;
  border-radius: 14px 14px 0 0;
  background: linear-gradient(170deg, #132844, #0b1729);
  box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.55);
  color: var(--text);
  gap: 6px 10px;
}
.ace-shuffle-bar > span {
  flex: 1 1 100%;
  text-align: center;
  font-size: 12px;
  line-height: 1.4;
  color: var(--text);
}
.ace-shuffle-bar > span > small {
  display: block;
  font-size: 10.5px;
  color: var(--text-dim);
}
/* \u5E2F\u304C\u753B\u9762\u306E\u4E0B\u3092\u8986\u3046\u3076\u3093\u3001\u76E4\u306E\u4E0B(\u8A18\u9332\u30FB\u5931\u3063\u305F\u99D2\u30FB\u91E6)\u306B\u4F59\u767D\u3092\u8DB3\u3057\u3066\u9001\u308C\u3070\u898B\u3048\u308B\u3088\u3046\u306B\u3059\u308B(2026-09-24 \u672C\u4EBA\u306E\u6307\u6458) */
.play-wrap.has-shuffle-bar {
  padding-bottom: calc(112px + env(safe-area-inset-bottom));
}
.ace-shuffle-bar .btn {
  flex: 1 1 auto;
  white-space: nowrap;
  padding: 8px 12px;
}
/* \u30A8\u30E9\u30FC\u306E\u6848\u5185\u306F\u76E4\u306E\u4E0A\u306B\u91CD\u306D\u308B(\u67A0\u306F\u53D6\u3089\u306A\u3044) */
.area-notice-slot .play-status {
  margin: 4px auto 0;
  max-width: 92%;
  padding: 4px 10px;
  border-radius: 8px;
  background: rgba(8, 10, 22, 0.86);
  white-space: normal;
  pointer-events: none;
}

/* \u30DB\u30FC\u30E0\u306E\u300C\u304A\u77E5\u3089\u305B\u30FB\u30D5\u30EC\u30F3\u30C9\u300D(2026-09-24 \u672C\u4EBA\u306E\u6307\u793A\u3067\u6587\u8A00\u3092\u5909\u3048\u305F)\u30022\u884C\u3067\u91E6\u306B\u53CE\u3081\u308B */
.home-wrap .home-news > span {
  text-align: center;
  line-height: 1.25;
  letter-spacing: 0;
}
/* \u30D5\u30EC\u30F3\u30C9\u306E\u8AAC\u660E\u306F\u6587\u3054\u3068\u306B\u884C\u3092\u5206\u3051\u3001\u6570\u5B57\u306F\u9014\u4E2D\u3067\u5207\u3089\u306A\u3044(2026-09-24 \u672C\u4EBA\u306E\u6307\u6458) */
.friends-lead {
  display: flex;
  flex-direction: column;
  gap: 2px;
  text-wrap: pretty;
}
.friends-lead .nowrap {
  white-space: nowrap;
}
/* \u719F\u7DF4\u5EA6\u306E\u70B9\u306E\u5185\u8A33(\u7D42\u5C40\u306E\u30E1\u30FC\u30BF\u30FC\u30022026-09-24) */
.mastery-breakdown {
  grid-column: 1 / -1;
  font-size: 10px;
  color: var(--text-dim);
  line-height: 1.4;
}
/* \u30D5\u30EC\u30F3\u30C9\u7533\u8ACB\u306E\u53D7\u4ED8(\u5165\u53E3\u3054\u3068\u306E\u5207\u308A\u66FF\u3048\u30022026-09-24) */
.friends-accept-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: rgba(9, 20, 38, 0.6);
  cursor: pointer;
}
.friends-accept-row + .friends-accept-row {
  margin-top: 6px;
}
.friends-accept-row > span {
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.friends-accept-row b {
  font-size: 13px;
}
.friends-accept-row small {
  font-size: 11px;
  color: var(--text-dim);
}
.friends-accept-row input {
  width: 22px;
  height: 22px;
  flex: none;
  accent-color: var(--gold);
}
/* \u30E9\u30F3\u30AD\u30F3\u30B0\u306E\u540D\u524D\u306F\u62BC\u305B\u308B(\u540C\u3058\u5E55\u304C\u958B\u304F) */
.rank-name-btn {
  border: 0;
  background: none;
  color: inherit;
  font: inherit;
  text-align: left;
  padding: 0 0 0 4px;
  cursor: pointer;
  text-decoration: underline dotted rgba(240, 217, 165, 0.5);
  text-underline-offset: 3px;
}
/* \u7D42\u5C40\u306E\u300C\u76F8\u624B\u306B\u30D5\u30EC\u30F3\u30C9\u7533\u8ACB\u300D */
.foe-friend {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  margin: 8px 0 2px;
}
.foe-friend-msg {
  font-size: 11px;
  color: var(--gold-soft);
}
/* \u30DB\u30FC\u30E0\u306E\u5C4A\u304D\u7269\u306E\u77E5\u3089\u305B(\u904B\u55B6\u306E\u304A\u77E5\u3089\u305B\u3068\u30D5\u30EC\u30F3\u30C9\u306F\u5225\u306E\u884C\u30022026-09-24) */
.home-alerts {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin: 8px 0 0;
}
.home-alert {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  min-height: 38px;
  padding: 7px 12px;
  border-radius: 10px;
  border: 1px solid rgba(240, 217, 165, 0.5);
  background: linear-gradient(180deg, rgba(212, 175, 55, 0.18), rgba(212, 175, 55, 0.06));
  color: var(--gold-soft);
  font-family: inherit;
  font-size: 12.5px;
  text-align: left;
  cursor: pointer;
}
.home-alert > span {
  flex: 1;
  min-width: 0;
}
.home-alert > svg:last-child {
  opacity: 0.6;
}
.home-alert-news {
  border-color: rgba(143, 188, 232, 0.55);
  background: linear-gradient(180deg, rgba(143, 188, 232, 0.16), rgba(143, 188, 232, 0.05));
  color: #cfe3f7;
}
.home-alert-news > svg:first-child {
  color: #8fbce8;
}
.home-alert-friend > svg:first-child {
  color: var(--gold);
}
/* \u7D42\u5C40\u30E1\u30FC\u30BF\u30FC\u306E\u30B9\u30AD\u30F3\u540D(2026-09-24 \u30B9\u30AD\u30F3\u5236) */
.mastery-skin-name {
  grid-column: 1 / -1;
  font-size: 10px;
  color: var(--gold-soft);
}
/* \u30AB\u30FC\u30C9\u719F\u7DF4\u5EA6: \u30ED\u30C3\u30AF(\u672A\u6240\u6301\u30B9\u30AD\u30F3)\u30022026-09-24 \u30B9\u30AD\u30F3\u5236 */
.card-mastery-locked-all {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 10px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: rgba(9, 20, 38, 0.6);
  color: var(--text-dim);
  font-size: 12px;
}
.card-mastery-row.is-locked {
  opacity: 0.72;
}
.card-mastery-locked {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 10px 12px;
  text-align: left;
}
.card-mastery-lockart {
  position: relative;
  flex: none;
  filter: grayscale(0.85) brightness(0.7);
}
.card-mastery-chain {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--gold-soft);
  background: rgba(8, 10, 22, 0.5);
  border-radius: 6px;
}
.card-mastery-lockname {
  font-size: 12px;
  color: var(--text-dim);
}
/* \u30DB\u30FC\u30E0\u306E\u300C\u30AB\u30FC\u30C9\u300D\u30BF\u30A4\u30EB\u306E\u30ED\u30C3\u30AF(\u30B9\u30AD\u30F3\u672A\u6240\u6301\u30022026-09-24) */
.home-tile.is-locked {
  opacity: 0.82;
}
.home-tile-lock {
  position: absolute;
  top: 8px;
  right: 8px;
  color: var(--gold-soft);
  opacity: 0.8;
}

.admin-login .admin-input {

     \u4E2D\u306E\u5E83\u3044\u8868\u304C\u753B\u9762\u306E\u5916\u3078\u306F\u307F\u51FA\u3059 */

.admin-card h2 {

  font-size: 16px;

.admin-head {

.admin-tools {

.admin-input {

}
.admin-error {

  border-radius: 8px;

/* --- \u540D\u524D\u306E\u4E00\u89A7\u3002\u62BC\u3059\u3068\u8A73\u7D30\u304C\u51FA\u308B --- */
.admin-rows {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 10px;
}
.admin-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  width: 100%;
  min-height: 56px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: rgba(4, 10, 20, 0.45);
  color: var(--text);
  text-align: left;
  cursor: pointer;
}
.admin-row:hover {
  border-color: var(--gold-deep);
}
.admin-row.is-dim {
  opacity: 0.55;
}
.admin-row-main {
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.admin-row-main b {
  font-size: 15px;
  overflow-wrap: anywhere;
}
.admin-row-main small {
  font-size: 11px;
  color: var(--text-dim);
}
.admin-row-side {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: none;
  color: var(--text-dim);
}
.admin-row-side em {
  font-style: normal;
  font-size: 11px;
  color: var(--card-red);
  border: 1px solid var(--card-red);
  border-radius: 999px;
  padding: 2px 8px;
}

/* --- \u8A73\u7D30\u3002\u30B9\u30DE\u30DB\u3067\u306F\u4E0B\u304B\u3089\u3001\u5E83\u3044\u753B\u9762\u3067\u306F\u771F\u3093\u4E2D\u306B --- */
.admin-sheet {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  background: rgba(4, 10, 20, 0.72);
  padding: 0;
}
.admin-panel {
  width: 100%;
  max-width: 520px;
  max-height: 86dvh;
  overflow-y: auto;
  padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
  border-radius: 14px 14px 0 0;
  border: 1px solid var(--line);
  background: linear-gradient(180deg, #16294a 0%, #0e1c33 100%);
}
.admin-panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 10px;
  position: sticky;
  top: -16px;
  background: #16294a;
  padding: 10px 0;
  z-index: 1;
}
.admin-panel-head b {
  font-family: "Shippori Mincho", serif;
  font-size: 19px;
  overflow-wrap: anywhere;
}
.admin-line {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 0;
  border-bottom: 1px solid rgba(212, 175, 55, 0.14);
  font-size: 13px;
}
.admin-line > span {
  flex: none;
  color: var(--text-dim);
  font-size: 12px;
}
.admin-line > b {
  text-align: right;
  overflow-wrap: anywhere;
}
.admin-panel-actions {
  display: flex;
  gap: 8px;
  margin-top: 14px;
}
.admin-panel-actions .btn {
  flex: 1;
  min-height: 44px;
}
@media (min-width: 640px) {
  .admin-sheet {
    align-items: center;
    padding: 20px;
  }
  .admin-panel {
    border-radius: 14px;
  }
}

/* --- \u624B\u7D19\u3092\u66F8\u304F\u6B04 --- */
.letter-form {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin: 12px 0 16px;
}
.letter-field {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.letter-field > span {
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--text-dim);
}
.letter-field textarea.admin-input {
  resize: vertical;
  font-family: inherit;
  line-height: 1.7;
}
.letter-gifts-edit {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.letter-gift-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.letter-gift-row .admin-input {
  flex: 1;
  min-width: 110px;
}
.letter-sent {
  cursor: default;
}
.letter-sent:hover {
  border-color: var(--line);
}

/* \u904B\u55B6\u3068\u3057\u3066\u306E uid\u3002\u30EB\u30FC\u30EB\u306B\u8CBC\u308B\u306E\u3067\u3001\u9078\u3073\u3084\u3059\u304F\u7B49\u5E45\u3067\u51FA\u3059 */
