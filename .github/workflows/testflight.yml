name: TestFlight

# main に push されたら、GitHub の Mac が自動でビルド→TestFlight へ送る(2026-09-21 本人の指示)。
# 手元で npm run ios:deploy を打たなくてよくなる。
# アプリに関係ないコミット(メモ・ドキュメントだけ等)では走らないよう paths で絞り、
# コミット文に [skip tf] を入れれば個別に飛ばせる。手動実行も可(Actions タブ)。
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "ios/**"
      - "plugins/**"
      - "audio/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "build.mjs"
      - "index.template.html"
      - "tools/ios-release.sh"
      - "tools/strip-public.mjs"
      - "tools/patch-plugins.mjs"
      - ".github/workflows/testflight.yml"
  workflow_dispatch: {}

# 送信が重ならないよう直列化。走行中を止めると中途半端になるので cancel はしない。
concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  deploy:
    # コミット文に [skip tf] があれば送らない
    if: ${{ !contains(github.event.head_commit.message, '[skip tf]') }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: K66H4J3S87
      ASC_KEY_ID: U94V7XX3LN
      ASC_ISSUER_ID: d709d4c7-c92d-411e-8eef-14639582b814
    steps:
      - uses: actions/checkout@v4

      # プロジェクトは新しい Xcode / iOS SDK 前提。runner の Xcode を最新の安定版に。
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # 配布用の証明書(.p12)を、この実行だけの一時キーチェーンに入れて codesign から使えるようにする
      - name: Set up signing keychain
        env:
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          set -eu
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KCPASS="$(openssl rand -base64 24)"
          security create-keychain -p "$KCPASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KCPASS" "$KEYCHAIN"
          echo "$DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPASS" "$KEYCHAIN" >/dev/null
          # 既存の検索リストを残したまま、一時キーチェーンを先頭に足す
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/["[:space:]]//g')
          rm -f "$RUNNER_TEMP/cert.p12"

      # App Store Connect の API キー(.p8)を置く。archive のクラウド署名と upload に使う
      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -eu
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_KEY_P8" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Build & upload to TestFlight
        run: |
          set -eu
          export ASC_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          export BUILD_NUMBER="$(date +%Y%m%d%H%M)"
          npm run ios:testflight
